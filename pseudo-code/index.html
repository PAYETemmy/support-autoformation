<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e0e10">
<meta name="apple-mobile-web-app-title" content="Pseudo-code">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="color-scheme" content="dark">
<title>Molécules — Pseudo-code</title>
<style>
:root{--bg:#0e0e10;--fg:#e8e8ea;--m:#7c7c84;--l:#26262c;--up:#8ab4ff;--ok:#7ee0a1;--no:#ff7b72}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
.w{max-width:980px;margin:0 auto;padding:22px 20px 60px;
  /* iPhone : rester sous la Dynamic Island et hors des bords arrondis */
  padding-top:max(22px,calc(env(safe-area-inset-top) + 10px));padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right));padding-bottom:max(60px,calc(env(safe-area-inset-bottom) + 30px))}
.sj{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--m)}
h1{font-size:26px;font-weight:600;margin:4px 0 2px}
.sub{color:var(--m);font-size:13px;margin:0 0 16px}
.nv{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 10px;font-size:13.5px}
.nv span{padding:3px 0;color:#4a4a52;border-bottom:2px solid transparent}
.nv span.on{color:var(--fg);border-bottom-color:var(--up)}
.nv span.dn{color:#a9a9b2}
.nv span.dn:after{content:" ✓";color:var(--ok)}
.st{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--m);margin:4px 0 6px}
.st b{color:var(--fg);font-weight:600}
.st .sp{margin:0 10px}
#lab{position:relative;width:100%;height:620px;border-top:1px solid var(--l);border-bottom:1px solid var(--l);overflow:hidden;
  background:radial-gradient(ellipse at center,#15151a 0%,var(--bg) 70%);touch-action:none;user-select:none;-webkit-user-select:none}
svg{position:absolute;inset:0;width:100%;height:100%}
/* pas de ligatures : "<-" doit rester écrit comme on le tape */
body,svg text,code{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
/* la phrase de l'étape en cours */
.cap{margin:12px 0 0;min-height:44px;text-align:center;font-size:14px;color:#a9a9b2;transition:opacity .35s,color .35s}
.cap.lk{color:#93a9d0}
.cap.ok{color:var(--ok)}
.cap.out{opacity:0}
.cap.fin{color:var(--fg)}
/* atomes */
.atom{transition:opacity .5s}
.atom.far{opacity:.4}
.atom .in{animation:none}
.atom.pop .in{animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.atom circle.core{fill:#1b1b21;stroke:#4a4a52;stroke-width:1.5;transition:stroke .2s,fill .2s}
.atom.center circle.core{fill:#1a2233;stroke:var(--up);stroke-width:2}
.atom.bound circle.core{stroke:#8a8a94}
.atom.center.bound circle.core{stroke:var(--up)}
.atom.next circle.core{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{stroke:#fff;stroke-width:2.6}}
.atom.hot circle.core{stroke:var(--fg);stroke-width:2.6}
.atom text{fill:#d6d6dc;font-size:14.5px;text-anchor:middle;pointer-events:none}
.atom.center text{fill:#fff;font-weight:600;font-size:16px}
.atom .orb{fill:none;stroke:#2c2c34;stroke-width:1}
.atom .el{fill:#5a5a62}
.atom.center .el{fill:var(--up)}
.atom.glow circle.core{animation:glow .8s ease-in-out 2 alternate}
@keyframes glow{to{filter:drop-shadow(0 0 7px rgba(138,180,255,.7))}}
/* liaisons */
.bond{stroke:#8a8a94;stroke-width:2;fill:none;transition:opacity .5s}
.bond.lk{stroke:var(--up);stroke-dasharray:6 5}
.bond.new{animation:grow .6s ease-out}
@keyframes grow{from{stroke-dashoffset:var(--len);stroke-dasharray:var(--len)}to{stroke-dashoffset:0}}
.bl{transition:opacity .5s}
.bl text{font-size:12.5px;fill:#a9a9b2;text-anchor:middle;pointer-events:none}
.bl.lk text{fill:#b9cff7}
.bl rect{fill:var(--bg);opacity:.85}
.far{opacity:.4}
/* le trait à tracer */
.gd{stroke:#26262c;stroke-width:2;stroke-dasharray:2 8;stroke-linecap:round;fill:none;animation:march 1s linear infinite}
.gd.lk{stroke:#23314c}
@keyframes march{to{stroke-dashoffset:-20}}
.gl{opacity:0;transition:opacity .15s;pointer-events:none}
.gl.on{opacity:1}
.gl text{font-size:17px;font-weight:600;fill:#f0f0f3;text-anchor:middle;pointer-events:none}
.gl.lk text{fill:#cfe0ff}
.gl rect{fill:#18181e}
.gl.lk rect{fill:#141b29}
.dr{stroke:var(--fg);stroke-width:2;fill:none;pointer-events:none}
.ring{fill:none;stroke-width:2;pointer-events:none;animation:ring .7s ease-out forwards}
@keyframes ring{from{opacity:.9}to{opacity:0;r:70}}
.spark{pointer-events:none;animation:spk .8s ease-out forwards}
@keyframes spk{to{opacity:0;transform:translate(var(--dx),var(--dy))}}
/* texte sous la carte */
.ax{margin:18px 0 0}
#ol{margin:6px 0 0}
#ol[hidden]{display:none}
.ax h3{font-size:13px;font-weight:600;color:#a9a9b2;margin:12px 0 4px}
.ax ol{margin:0;padding:0 0 0 20px;color:#c4c4cc;font-size:14px}
.ax li{margin:3px 0;animation:fin .5s ease-out}
.ax li.lk{color:#b9cff7}
@keyframes fin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
code{font:12.5px ui-monospace,Menlo,Consolas,monospace;background:#1c1c21;padding:1px 4px;border-radius:4px}
.cap code{font-size:12.5px}
/* au doigt (iPhone) : tout tient dans l'écran, sans faire défiler */
@media (pointer:coarse){
  .w{padding-bottom:max(14px,calc(env(safe-area-inset-bottom) + 6px))}
  .ax{margin-top:10px}
  .nx{height:112px}
}
/* notes ouvertes sur ordinateur : tout tient dans l'écran */
@media (pointer:fine){.w{padding-bottom:16px}}
/* notes ouvertes : les boutons passent sur une ligne, sous le champ, qui prend la place libérée */
/* boutons toujours sur une ligne, sous la phrase (ou sous les notes) ; html.btcol = mesure temporaire en colonne */
html:not(.btcol) .bt{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-top:10px}
html:not(.btcol) .bt .ax,html:not(.btcol) .bt .help{display:contents}
html:not(.btcol) .ax .rz{margin:0}
html:not(.btcol) #ol{order:9;flex-basis:100%}
@media (pointer:coarse){html:not(.btcol) .bt{justify-content:space-between;gap:6px 8px}html:not(.btcol) .bt .rz{white-space:nowrap}}
/* bouton "Indenter" : seulement avec les notes ouvertes ; jamais compté dans la mesure de la carte */
#ib[hidden],html.btcol #ib{display:none}
#ib .ia{font-size:1.1em;line-height:1}
/* iPhone : pas de "Réinitialiser" (gardé seulement pour la mesure de la carte), "⇥ Indenter" en entier */
@media (pointer:coarse){html:not(.btcol) #rz{display:none}}
/* page verrouillée : elle ne glisse plus (liste des axiomes fermée) */
html.lock,html.lock body{overflow:hidden;overscroll-behavior:none}
/* iPhone, clavier ouvert : la page est un bloc fixe, calé sur la zone visible au-dessus du clavier (iOS ne peut plus la faire glisser) */
html.kb .w{position:fixed;left:0;right:0;top:0;overflow:hidden;box-sizing:border-box;will-change:transform}
@media (pointer:coarse){html.kb .nx{height:96px}}
.help{color:var(--m);font-size:12.5px;margin:10px 0 0}
.rz{background:none;border:0;color:var(--m);font:inherit;font-size:12.5px;cursor:pointer;padding:0}
.rz.sure{color:var(--no)}
.rz:disabled{opacity:.35;cursor:default}
.ax .rz{display:block;line-height:1.5;margin:0 0 8px}
.ax + .help{margin-top:6px}
/* notes globales : champ encadré, tout en bas */
.nw{position:relative;margin:6px 0 0;background:var(--bg)}
.nw[hidden]{display:none}
/* ouverture / fermeture des notes : la carte et le champ glissent ensemble */
html.anim #lab{transition:height .42s cubic-bezier(.4,0,.2,1)}
html.anim .nw{transition:height .42s cubic-bezier(.4,0,.2,1),margin-top .42s cubic-bezier(.4,0,.2,1),opacity .32s ease}
html.anim .nw .nx{transition:transform .42s cubic-bezier(.4,0,.2,1)}
.nx{position:relative;z-index:1;display:block;width:100%;height:140px;margin:0;resize:none;overflow-y:auto;overscroll-behavior:contain;font:inherit;font-size:14px;line-height:1.45;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--fg);
  background:transparent;border:1px solid var(--l);border-radius:0;padding:8px;-webkit-appearance:none;appearance:none}
.nx:focus{outline:none;border-color:var(--up)}
/* repères d'indentation : une barre verticale par niveau de 5 espaces, dessinée derrière le texte des notes */
.nx,.ng{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0;tab-size:5}
.ng{position:absolute;top:1px;left:1px;z-index:0;overflow:hidden;pointer-events:none;box-sizing:border-box;padding:8px;
  font:inherit;font-size:14px;line-height:1.45;color:var(--fg);white-space:pre-wrap;overflow-wrap:break-word;word-break:normal}
.ng .ngl{position:relative}
.ng .ngl b{position:absolute;top:0;bottom:0;width:1px;opacity:.4}
.nx::placeholder{color:#5a5a62;-webkit-text-fill-color:#5a5a62}
.nx::selection{background:rgba(138,180,255,.28)}
/* couleurs des notes : une couleur par niveau, de la moins claire (nom de la notion, sans retrait) au plus clair (niveau le plus en retrait) */
.ng .c0{color:#ed76ad}.ng .c1{color:#4085ff}.ng .c2{color:#8f4ceb}.ng .c3{color:#ecd490}.ng .c4{color:#7ed699}.ng .c5{color:#4dc1ce}.ng .c6{color:#eaeaeb}.ng .c7{color:#c5e86c}.ng .c8{color:#ff9e8a}.ng .c9{color:#c9b6ff}.ng .c10{color:#9ef0e0}.ng .c11{color:#ffd1e8}
.ng b.c1{background:#4085ff}.ng b.c2{background:#8f4ceb}.ng b.c3{background:#ecd490}.ng b.c4{background:#7ed699}.ng b.c5{background:#4dc1ce}.ng b.c6{background:#eaeaeb}.ng b.c7{background:#c5e86c}.ng b.c8{background:#ff9e8a}.ng b.c9{background:#c9b6ff}.ng b.c10{background:#9ef0e0}.ng b.c11{background:#ffd1e8}
.ng .q{color:#f2a46a}
.ng .ngl>span{position:relative;z-index:1}
/* rappel tout petit, en bas à droite du cadre des notes */
.nw .lvm{position:absolute;right:7px;bottom:4px;z-index:2;font-size:9.5px;line-height:1;color:#4a4a52;pointer-events:none;letter-spacing:.02em}
.nx[hidden]{display:none}
</style>
</head>
<body>
<div class="w">
  <h1 id="ti"></h1>
  <div class="st"><span></span><span id="cnt"></span></div>
  <div id="lab"><svg id="svg"></svg></div>
  <div class="cap" id="cap"></div>
  <div class="nw" id="gw" hidden><div class="ng" id="ng" aria-hidden="true"></div><textarea class="nx" id="gn" aria-label="Mes notes globales" hidden></textarea><span class="lvm" aria-hidden="true">9 levels max</span></div>
  <div class="bt"><div class="ax"><button class="rz bk" id="bk">← Retour</button><button class="rz bk" id="nb">Afficher mes notes</button><button class="rz" id="ib" title="Ajouter 5 espaces" aria-label="Indenter : ajouter 5 espaces" hidden><span class="ia">⇥</span><span class="il"> Indenter</span></button><button class="rz" id="axb">Axiomes formés</button><div id="ol" hidden></div></div>
  <p class="help"><button class="rz" id="rz">Réinitialiser</button></p></div>
</div>
<script>
/* ---------- les molécules : atomes (idées) et liaisons (axiomes) ----------
   b = [atome, atome, ce qui les relie, axiome complet, liaison entre notions ?] */
var MOL=[
 {id:"alg",t:"Algorithme",c:"alg",
  a:{alg:"Algorithme",ins:"Instructions",ordre:"De haut en bas",pc:"Pseudo-code",lang:"Python, C++",nom:"Nom de l’algorithme",sec:"Section Variables",df:"Début et Fin",com:"Commentaire"},
  b:[["alg","ins","est une suite d’","Un algorithme est une suite d’instructions qui résout un problème."],
     ["ins","ordre","s’exécutent","Les instructions s’exécutent une par une, de haut en bas."],
     ["alg","pc","s’écrit en","Le pseudo-code écrit un algorithme en français, avec quelques mots-clés fixes."],
     ["pc","lang","se traduit ensuite en","Le pseudo-code se traduit ensuite dans un vrai langage : Python, C++…"],
     ["alg","nom","commence par le","La première ligne donne le nom de l’algorithme : `Algorithme Moyenne`."],
     ["alg","sec","annonce ses données dans la","Sous le nom, la section `Variables` annonce les données utilisées."],
     ["ins","df","s’écrivent entre","Les instructions s’écrivent entre `Début` et `Fin`."],
     ["alg","com","s’explique par un","Un commentaire commence par `//` : il explique, il ne s’exécute pas."]]},
 {id:"var",t:"Variable",c:"var",
  a:{var:"Variable",sec:"Section Variables",val:"Valeur",exe:"Exécution",nom:"Nom",esp:"Sans espace",decl:"Déclaration",ens:"Plusieurs noms"},ext:["sec"],
  b:[["sec","var","déclare chaque","La section `Variables` déclare chaque variable avant qu’elle serve.",1],
     ["var","val","garde une","Une variable est une boîte qui garde une valeur."],
     ["val","exe","peut changer pendant l’","La valeur d’une variable peut changer pendant l’exécution."],
     ["var","nom","se désigne par son","Chaque variable a un nom, qui sert à la désigner."],
     ["nom","esp","s’écrit","Un nom s’écrit sans espace et dit ce que la variable contient : `somme`, `nbNotes`."],
     ["var","decl","se crée par une","Une déclaration crée une variable : son nom, deux-points, son type : `age : entier`."],
     ["decl","ens","peut regrouper","Plusieurs variables du même type se déclarent ensemble : `a, b : entier`."]]},
 {id:"typ",t:"Type",c:"typ",
  a:{typ:"Type",var:"Variable",sorte:"Sorte de valeur",ent:"entier",reel:"réel",txt:"texte",bool:"booléen"},ext:["var"],
  b:[["var","typ","a un","Chaque variable a un type, fixé à sa déclaration.",1],
     ["typ","sorte","fixe la","Le type fixe la sorte de valeur que la variable peut garder."],
     ["typ","ent","pour compter :","`entier` sert à compter : un nombre sans virgule, comme `12` ou `-3`."],
     ["typ","reel","pour mesurer :","`réel` sert à mesurer : un nombre à virgule, écrit avec un point, comme `3.5`."],
     ["typ","txt","pour écrire :","`texte` garde des caractères, entre guillemets droits : `\"Bonjour\"`."],
     ["typ","bool","pour dire oui ou non :","`booléen` n’a que deux valeurs : `vrai` ou `faux`."]]},
 {id:"aff",t:"Affectation",c:"aff",
  a:{aff:"Affectation",var:"Variable",fl:"<-",dg:"De droite à gauche",anc:"Ancienne valeur",calc:"Calcul",self:"La variable elle-même",dep:"Valeur de départ"},ext:["var"],
  b:[["aff","var","range une valeur dans une","L’affectation range une valeur dans une variable.",1],
     ["aff","fl","s’écrit avec","L’affectation s’écrit avec `<-` : `age <- 18`."],
     ["fl","dg","se lit","`<-` se lit de droite à gauche : la valeur de droite va dans la variable de gauche."],
     ["aff","anc","efface l’","L’affectation efface l’ancienne valeur de la variable."],
     ["aff","calc","peut ranger le résultat d’un","À droite de `<-`, on peut mettre un calcul : `total <- prix * 2`."],
     ["calc","self","peut utiliser","Une variable peut servir à son propre calcul : `compteur <- compteur + 1`."],
     ["aff","dep","donne d’abord une","Avant d’utiliser une variable, on lui donne une valeur de départ : `somme <- 0`."]]},
 {id:"es",t:"Lire et Écrire",c:"es",
  a:{es:"Lire et Écrire",alg:"Algorithme",lire:"Lire",clav:"Clavier",quest:"Question",ecr:"Écrire",ecran:"Écran",msg:"Message",plus:"Plusieurs éléments"},ext:["alg"],
  b:[["alg","es","dialogue avec l’utilisateur par","Un algorithme dialogue avec l’utilisateur par `Lire` et `Écrire`.",1],
     ["es","lire","fait entrer une valeur avec","`Lire` fait entrer une valeur dans l’algorithme."],
     ["lire","clav","attend le","`Lire age` attend que l’utilisateur tape une valeur au clavier, puis la range dans `age`."],
     ["es","ecr","fait sortir une valeur avec","`Écrire` fait sortir une valeur de l’algorithme."],
     ["ecr","ecran","affiche à l’","`Écrire age` affiche à l’écran la valeur de `age`."],
     ["ecr","msg","affiche tel quel un","`Écrire \"Bonjour\"` affiche tel quel le texte entre guillemets."],
     ["ecr","plus","sépare par des virgules","`Écrire` affiche plusieurs éléments séparés par des virgules : `Écrire \"Total : \", total`."],
     ["lire","quest","vient après une","Avant un `Lire`, un `Écrire` pose la question : `Écrire \"Ton âge ?\"`."]]},
 {id:"op",t:"Opérateurs",c:"op",
  a:{op:"Opérateur",calc:"Calcul",ar:"+ - * /",prio:"Priorité",dm:"div et mod",cmp:"Comparaison",vf:"vrai ou faux",eg:"= et <-",log:"et, ou, non"},ext:["calc"],
  b:[["calc","op","se fait avec des","Un calcul se fait avec des opérateurs.",1],
     ["op","ar","calcule avec","Les opérateurs de calcul sont `+`, `-`, `*` et `/`."],
     ["ar","prio","suivent une","`*` et `/` passent avant `+` et `-` ; les parenthèses changent cet ordre."],
     ["op","dm","divise en entiers avec","`div` donne le quotient entier et `mod` le reste : `7 div 2` vaut `3`, `7 mod 2` vaut `1`."],
     ["op","cmp","sert aussi à la","Les opérateurs de comparaison sont `=`, `<>` (différent), `<`, `>`, `<=` et `>=`."],
     ["cmp","vf","donne","Une comparaison donne `vrai` ou `faux` : `age >= 18` est un booléen."],
     ["cmp","eg","ne confond pas","`=` compare deux valeurs ; `<-` range une valeur : ce sont deux choses différentes."],
     ["op","log","combine des conditions avec","`et`, `ou` et `non` combinent des conditions : `age >= 18 et age < 65`."]]},
 {id:"si",t:"Si",c:"si",
  a:{si:"Si",cmp:"Comparaison",alors:"Alors",ind:"Indentation",sinon:"Sinon",fac:"Facultatif",finsi:"FinSi",imb:"Si imbriqué"},ext:["cmp"],
  b:[["si","cmp","teste une condition, souvent une","`Si` teste une condition, le plus souvent une comparaison : `Si age >= 18 Alors`.",1],
     ["si","alors","exécute, si c’est vrai, le bloc","Si la condition est vraie, les instructions après `Alors` s’exécutent."],
     ["alors","ind","décale son bloc par l’","Les instructions d’un bloc sont décalées vers la droite : c’est l’indentation."],
     ["si","sinon","exécute, si c’est faux, le bloc","Si la condition est fausse, ce sont les instructions après `Sinon` qui s’exécutent."],
     ["sinon","fac","est","`Sinon` est facultatif : sans lui, quand la condition est fausse, rien ne se passe."],
     ["si","finsi","se ferme par","Un `Si` se ferme toujours par `FinSi`."],
     ["si","imb","peut contenir un","Un `Si` peut contenir un autre `Si` : ils sont imbriqués."]]},
 {id:"sel",t:"Selon",c:"sel",
  a:{sel:"Selon",si:"Si",vr:"Une seule variable",cas:"Cas",un:"Un seul à la fois",aut:"Autrement",fin:"FinSelon"},ext:["si"],
  b:[["si","sel","en série se remplace par","Une série de `Si` sur la même variable se remplace par un `Selon`.",1],
     ["sel","vr","regarde la valeur d’","`Selon jour Faire` regarde la valeur d’une seule variable."],
     ["sel","cas","propose chaque valeur dans un","Chaque `Cas` donne une valeur possible et ses instructions : `Cas 1 : Écrire \"Lundi\"`."],
     ["cas","un","s’exécute","Un seul `Cas` s’exécute : celui qui correspond à la valeur."],
     ["sel","aut","prévoit le reste avec","`Autrement :` s’exécute quand aucun `Cas` ne correspond."],
     ["sel","fin","se ferme par","Un `Selon` se ferme par `FinSelon`."]]},
 {id:"pour",t:"Pour",c:"pour",
  a:{pour:"Pour",ins:"Instructions",bcl:"Boucle",cpt:"Compteur",tour:"Tour",bloc:"Bloc",pas:"pas",fin:"FinPour"},ext:["ins"],
  b:[["pour","ins","répète des","`Pour` répète des instructions un nombre de fois connu d’avance.",1],
     ["pour","bcl","est une","`Pour` est une boucle : une structure qui répète un bloc d’instructions."],
     ["pour","cpt","avance avec un","`Pour i de 1 à 5 Faire` : le compteur `i` vaut 1, puis 2, 3, 4 et 5."],
     ["cpt","tour","augmente de 1 à chaque","Le compteur augmente de 1 tout seul à chaque tour de boucle."],
     ["cpt","bloc","s’utilise dans le","Le compteur s’utilise dans le bloc répété : `Écrire i`."],
     ["pour","pas","change son avance avec","`pas` change l’avance du compteur : `Pour i de 10 à 1 pas -1 Faire` compte à l’envers."],
     ["pour","fin","se ferme par","Un `Pour` se ferme par `FinPour`."]]},
 {id:"tq",t:"TantQue",c:"tq",
  a:{tq:"TantQue",bcl:"Boucle",cond:"Condition",avant:"Avant chaque tour",zero:"Zéro tour",inf:"Boucle infinie",fin:"FinTantQue"},ext:["bcl"],
  b:[["tq","bcl","est une autre","`TantQue` est une autre boucle, pour un nombre de tours inconnu d’avance.",1],
     ["tq","cond","répète tant qu’est vraie sa","`TantQue reste > 0 Faire` répète le bloc tant que la condition est vraie."],
     ["cond","avant","se teste","La condition se teste avant chaque tour."],
     ["tq","zero","peut faire","Si la condition est fausse dès le départ, le bloc ne s’exécute pas du tout."],
     ["tq","inf","risque la","Si rien dans le bloc ne change la condition, la boucle ne s’arrête jamais : c’est une boucle infinie."],

/* repères d'indentation : la copie du texte, invisible, derrière le champ ; chaque groupe de 5 espaces en début de ligne porte une barre */
var NG=document.getElementById("ng"),GW=document.getElementById("gw"),IB=document.getElementById("ib"),IND=5,
    IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function guides(){var L=GN.value.split("\n"),lv=L.map(function(l){return l.trim()?Math.floor(l.match(/^ */)[0].length/IND):-1});
  /* une ligne vide garde les barres qui l'entourent */
  lv=lv.map(function(v,i){if(v>=0)return v;var p=0,n=0,j;for(j=i-1;j>=0;j--)if(lv[j]>=0){p=lv[j];break}for(j=i+1;j<lv.length;j++)if(lv[j]>=0){n=lv[j];break}return Math.min(p,n)});
  /* largeur de 5 espaces dans la police des notes */
  NG.innerHTML='<span style="white-space:pre">'+" ".repeat(IND)+'</span>';var w=NG.firstChild.getBoundingClientRect().width;
  /* une ligne = un bloc ; ses barres descendent sur toute sa hauteur, même quand elle passe à la ligne */
  /* couleur d'un niveau : 12 couleurs différentes (niveaux 1 à 12) ; au-delà, les 5 dernières tournent */
  function col(n){return "c"+(n<12?n:7+((n-7)%5))}
  NG.innerHTML=L.map(function(l,i){var s="",n=l.trim()?Math.floor(l.match(/^ */)[0].length/IND):lv[i];
    /* la barre k accompagne les lignes du niveau k+1 : même couleur qu'elles */
    for(var k=0;k<lv[i];k++)s+='<b class="'+col(k+1)+'" style="left:'+(k*w+1).toFixed(2)+'px"></b>';
    /* ce qui est entre guillemets droits ressort, comme du texte dans un programme */
    var t=esc(l).replace(/"[^"]*"?/g,function(q){return '<span class="q">'+q+'</span>'});
    return '<div class="ngl"><span class="'+col(n)+'">'+(t||" ")+"</span>"+s+"</div>"}).join("");
  NG.style.width=GN.clientWidth+"px";NG.style.height=GN.clientHeight+"px";NG.scrollTop=GN.scrollTop}

  var m=CAP.cloneNode(false);m.removeAttribute("id");m.style.cssText="position:absolute;visibility:hidden;min-height:0;width:"+CAP.clientWidth+"px";CAP.parentNode.appendChild(m);
