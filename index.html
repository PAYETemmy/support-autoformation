<style>

body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;border-radius:0;cursor:pointer;padding:0;text-align:left}
.w{max-width:680px;margin:0 auto;padding:0 calc(12px + env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
.top{padding:calc(14px + env(safe-area-inset-top)) 0 12px}
.sj{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--m)}

  background-image:linear-gradient(45deg,transparent 50%,var(--m) 50%),linear-gradient(135deg,var(--m) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}

.bh{display:flex;align-items:flex-start;gap:8px;width:100%}
.bt{flex:1;min-width:0}

.nt{display:block;font-size:17px;font-weight:600;line-height:1.25;margin-top:2px}
.ck{flex:none;width:22px;height:22px;border:1px solid var(--l);font-size:13px;line-height:20px;text-align:center;color:transparent}
.acq .ck{border-color:#2f5a41;color:var(--c)}
.bd{margin-top:6px}
.axr{display:flex;align-items:stretch;gap:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;
  margin:4px 0 0;padding:2px 0 8px;scrollbar-width:none}
.axr::-webkit-scrollbar{display:none}
.ax{position:relative;flex:0 0 43%;scroll-snap-align:start;border:1px solid var(--f);background:var(--bg);
  padding:8px 9px 9px;font-size:13.5px;line-height:1.4;color:#c4c4cc}

.row.n2 .ax,.row.n3 .ax{flex-basis:84%}
.vl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#6a6a72;margin:6px 0 2px}
.ct{font-size:14px;line-height:1.45;color:#c4c4cc;margin:2px 0}

.ct.li{padding-left:14px;position:relative}.ct.li:before{content:"–";position:absolute;left:0;color:var(--m)}

.row.n2 .nt{font-size:15px}.row.n2 .ax,.row.n2 .ct{font-size:12.5px}.row.n2 code{white-space:normal;word-break:break-word}
/* en image */
.im{display:block;width:100%;margin-top:4px}
.im svg{display:block;width:100%;height:auto}
.lg{font-size:13.5px;line-height:1.45;color:#c4c4cc;margin:5px 0 0}
.lg b{color:var(--fg);font-weight:500}
.zh{display:none;font-size:11.5px;color:var(--m);margin-top:4px}
.row.n2 .zh,.row.n3 .zh{display:block}.row.n2 .lg,.row.n3 .lg{font-size:12.5px}
#zo{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch;
  padding:calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}

.of{display:flex;justify-content:center;margin-top:34px}
.of button{font-size:12px;color:var(--m);padding:6px 0}

.lgd{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--m);margin-top:8px}

.map{position:relative;--gw:40px}
.map>svg.rl{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.ln{position:relative;margin-left:var(--gw)}
.lh{display:flex;align-items:baseline;gap:8px;width:100%;padding:4px 0 0}
.lh b{font-size:16.5px;font-weight:600;line-height:1.25}
.lh .ok{color:var(--c);font-size:13px}
.tk{display:flex;flex-wrap:wrap;row-gap:6px;padding-bottom:2px}
.tk::-webkit-scrollbar{display:none}
.st{position:relative;flex:0 0 33.333%;min-width:0;padding:24px 10px 4px 0;font-size:12.5px;line-height:1.35;color:#c4c4cc}
.st:before{content:"";position:absolute;left:0;right:0;top:11px;border-top:2px solid #4a4a52}

.ln.acq .st:before{border-top-color:#2f6a48}
.st .dt{position:absolute;left:1px;top:6px;width:13px;height:13px}
.st code{white-space:nowrap;font-size:11.5px;padding:1px 3px}
.st code.w{white-space:normal;overflow-wrap:anywhere}
.jn code{white-space:normal;overflow-wrap:anywhere}
.jn{position:relative;margin-left:var(--gw);padding:12px 0 16px;font-size:13px;line-height:1.4;color:#c4c4cc}
.jn q{quotes:"« " " »";color:var(--fg)}
.jn small{display:block;font-size:11px;color:var(--m);margin-top:2px}
.jn.no{color:#6a6a72;font-style:italic}
/* fiche d'une notion (plein écran) */
#sh{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch;
  padding:calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
#sh[hidden]{display:none}
#zo{z-index:30}
/* dans la fiche : les axiomes en liste, comme dans la boîte d'origine */
#sh .axr{display:block;overflow:visible;margin:0;padding:0}
#sh .ax{flex:none;border:0;background:none;font-size:14px;line-height:1.45;padding:6px 0;border-top:1px solid #1a1a1e}
#sh .ax:first-child{border-top:0}
#sh .ax:before{display:none}
/* notes */
.nb{margin-top:8px;border-top:1px solid var(--f);padding-top:6px}
.na{font-size:12.5px;color:var(--m);padding:6px 0}
.nl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#6a6a72;margin:2px 0 4px}
.nx{display:block;width:100%;min-height:64px;resize:none;overflow:hidden;font:inherit;font-size:16px;line-height:1.45;color:var(--fg);
  background:var(--bg);border:1px solid var(--l);border-radius:0;padding:8px;-webkit-appearance:none;appearance:none}
.nx:focus{outline:none;border-color:var(--up)}
.mn{margin-top:40px;border-top:1px solid var(--l);padding-top:16px}
.mn h2{font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--m);margin:0 0 6px}
.mn p{font-size:12.5px;color:var(--m);margin:0 0 10px;line-height:1.4}
.mb{display:flex;gap:8px;flex-wrap:wrap}
.mb button{font-size:13px;padding:7px 12px;border:1px solid var(--l)}
.tg{font-size:13px;padding:7px 12px;border:1px solid var(--l);margin-top:9px}
/* notes affichées sur le plan, sous leur notion */
.lnn{margin:2px 0 4px;padding:6px 0 0 10px;border-left:2px solid var(--up);font-size:13px;line-height:1.45;color:#c4c4cc;white-space:pre-wrap}
.mf{font-size:12.5px;color:var(--c);margin-top:8px;min-height:18px}
.mi{margin-top:10px}
.mi .nx{min-height:120px}
.mi button{margin-top:8px}
</style>

  <div class="top"><div class="sj" id="sj"></div>
    <div class="lgd"><span><i class="dt"></i>principe</span><span><i class="dt pr"></i>pratique</span><span><i class="dt jx"></i>correspondance</span></div></div>

  <section class="mn">

    <button class="tg" id="tgn"></button>
  </section>
</div>

<div id="sh" hidden><div class="zw"><div class="zt"><b></b><button id="scl">Fermer</button></div><div id="sb"></div></div></div>
<div id="zo" hidden><div class="zw"><div class="zt"><b id="zn"></b><button id="zc">Fermer</button></div><div id="zb"></div></div></div>

<script>
/* ==========================================================================
   DONNÉES DU SUJET — c'est le seul bloc à changer pour un autre sujet.

   SUJET    : nom du sujet, projet fil rouge.

              Une ligne par compétence : id["Compétence"]
              Une ligne par lien       : parent --> enfant
              Seules ces deux formes sont lues par la page.

   IMG      : « En image », IMG[idNotion] = {svg, leg:[[partie, explication],…]}.
              Un dessin par notion, choisi dans le menu juste après les axiomes.

var SUJET={"nom": "Mermaid", "projet": "Enregistreur vocal de notes"};
var PLAN=`flowchart TD

  voir --> fabriquer
  fabriquer --> suite
  fabriquer --> designer
  suite --> lecture
  suite --> action
  designer --> action
  suite --> lisible
  designer --> lisible
  action --> ordre
  fabriquer --> com
  ordre --> fin
  action --> don

  ordre --> sg

  sg --> str
  choix --> str
  fin --> str`;
var COMP={"voir": {"notion": "dia"}, "fabriquer": {"notion": "mer"}, "suite": {"notion": "flu"}, "designer": {"notion": "ide"}, "lecture": {"notion": "sens"}, "action": {"notion": "eta"}, "lisible": {"notion": "ind"}, "ordre": {"notion": "lia"}, "choix": {"notion": "dec"}, "com": {"notion": "com"}, "fin": {"notion": "fin"}, "don": {"notion": "don"}, "sto": {"notion": "sto"}, "bou": {"notion": "bou"}, "sg": {"notion": "sg"}, "sp": {"notion": "sp"}, "sty": {"notion": "sty"}, "str": {"notion": "str"}};
var NOTIONS={"dia": {"t": "Diagramme", "ax": ["Un diagramme est une représentation visuelle.", "Les parties qu’un diagramme relie s’appellent ses éléments.", "Un diagramme montre les relations entre ces éléments."], "pratique": []}, "mer": {"t": "Mermaid", "ax": ["Mermaid est un langage.", "Il s’écrit en texte.", "Il décrit un diagramme.", "Sa première ligne nomme le type de diagramme.", "Il s’écrit dans un bloc de code, dont le langage est Mermaid.", "Pour ajouter un bloc de code, je tape `/code`."], "pratique": [4, 5, 6]}, "flu": {"t": "Diagramme de flux", "ax": ["Un diagramme de flux représente un processus : une suite d’actions.", "Chaque point du processus est une boîte (une action ou une question).", "Des traits orientés indiquent l’ordre des actions.", "Son mot-clé, sur la première ligne, est `flowchart` (ou `graph`)."], "pratique": [4]}, "ide": {"t": "Identifiant", "ax": ["Un identifiant est un nom écrit dans le code Mermaid.", "Il désigne un seul élément du diagramme.", "Dans le diagramme, il est unique.", "Il n’a pas d’espace.", "Il est distinct du texte affiché.", "Sans texte, c’est lui qui s’affiche.", "Un identifiant court pour « Enregistrer la voix » peut être `enreg`."], "pratique": [4, 7]}, "sens": {"t": "Sens du diagramme", "ax": ["Le sens est la direction de lecture.", "Il vaut pour tout le diagramme.", "Il s’écrit sur la première ligne, après `flowchart`.", "Sans sens écrit, le diagramme se lit de haut en bas.", "De gauche à droite, j’écris flowchart `LR`.", "De droite à gauche, j’écris flowchart `RL`.", "De haut en bas, j’écris flowchart `TD` (ou `TB`).", "De bas en haut, j’écris flowchart `BT`."], "pratique": [3, 5, 6, 7, 8]}, "eta": {"t": "Étape (nœud)", "ax": ["Dans un diagramme de flux, une étape est une boîte.", "Elle porte un texte affiché.", "Elle représente une seule action, un seul état ou une seule question.", "Son terme technique est nœud.", "Elle s’écrit avec un identifiant suivi du texte entre crochets.", "Un texte à caractères spéciaux se met entre guillemets.", "L’étape « Enregistrer » d’identifiant A s’écrit `A[Enregistrer]`.", "Pour des angles arrondis, j’écris `C(Arrondi)`.", "Pour un cercle, j’écris `D((Rond))`.", "Pour un losange, j’écris `E{Question ?}`."], "pratique": [5, 6, 7, 8, 9, 10]}, "ind": {"t": "Indentation", "ax": ["Au début d’une ligne, une indentation est un décalage.", "Elle est faite d’espaces (ou d’une tabulation).", "Dans un diagramme de flux, elle ne change pas le dessin.", "Dans un diagramme de flux, elle est facultative.", "Elle se place avant l’identifiant, sous la première ligne.", "Je mets deux espaces au début de chaque ligne sous la première."], "pratique": [5, 6]}, "lia": {"t": "Liaison", "ax": ["Entre deux étapes, une liaison est un trait.", "Elle a une étape de départ et une étape d’arrivée.", "Elle s’écrit, pour les deux étapes, avec leurs identifiants.", "Une liaison avec une pointe s’appelle une flèche : elle indique l’ordre.", "Une flèche de A vers B s’écrit `A --> B`.", "Une ligne sans pointe entre B et C s’écrit `B --- C`.", "Une flèche pointillée de A vers B s’écrit `A -.-> B`.", "Une flèche épaisse de A vers B s’écrit `A ==> B`.", "Le texte « oui » sur la flèche de A vers B s’écrit `A -->|oui| B`.", "A vers B et C en une ligne s’écrit `A --> B & C`.", "A, B, C à la suite s’écrit `A --> B --> C`.", "A et B vers C s’écrit `A & B --> C`."], "pratique": [3, 5, 6, 7, 8, 9, 10, 11, 12]}, "com": {"t": "Commentaire", "ax": ["Un commentaire est une ligne écrite dans le code Mermaid.", "Le dessin l’ignore.", "Il s’adresse à celui qui lit le code, pas au schéma.", "Une ligne de commentaire commence par `%%`.", "Désactiver la ligne A --> C sans l’effacer s’écrit `%% A --> C`."], "pratique": [4, 5]}, "fin": {"t": "Début et fin", "ax": ["Le début et la fin sont des étapes.", "Ils marquent l’entrée ou la sortie du processus.", "Ils se placent aux extrémités du diagramme.", "Aucune liaison n’arrive au début.", "Aucune liaison ne part de la fin.", "En général, ils ont la forme d’un stade.", "Le début « Appui » s’écrit `D([Appui])`.", "La fin « Note rangée » s’écrit `F([Note rangée])`."], "pratique": [7, 8]}, "don": {"t": "Donnée", "ax": ["Une donnée est une étape qui représente une information.", "Une donnée n’est pas une action.", "Une action la produit ou l’utilise.", "Elle se place entre l’action qui l’utilise et celle qui la produit.", "Sa forme habituelle est le parallélogramme.", "Le son « Audio » s’écrit `B[/Audio/]`."], "pratique": [6]}, "sto": {"t": "Stockage", "ax": ["Un stockage est une étape qui représente un lieu où l’information est conservée.", "L’information y reste après la fin du processus.", "Sa forme habituelle est le cylindre.", "L’app Notes comme stockage s’écrit `C[(Notes)]`.", "Écrire dedans depuis B s’écrit `B --> C`.", "Lire dedans pour aller vers B s’écrit `C --> B`."], "pratique": [4, 5, 6]}, "dec": {"t": "Décision (embranchement)", "ax": ["D’une décision partent au moins deux flèches.", "Chaque flèche correspond à un résultat possible d’une condition.", "Un seul est suivi à la fois : le chemin.", "Elle se dessine en général en losange.", "La question « Dossier existant ? » s’écrit `A{Dossier existant ?}`.", "Ses sorties « oui » vers B et « non » vers C s’écrivent `A -->|oui| B` et `A -->|non| C`."], "pratique": [5, 6]}, "bou": {"t": "Boucle", "ax": ["Une boucle est une suite de liaisons.", "Elle revient vers une étape déjà passée.", "Elle part d’une décision, qui permet d’en sortir.", "Revenir de B (Code correct ?) à A (Saisir le code) si c’est non s’écrit `B -->|non| A`.", "Sortir de B vers C (Ouvrir) si c’est oui s’écrit `B -->|oui| C`."], "pratique": [4, 5]}, "sg": {"t": "Sous-groupe", "ax": ["Un sous-groupe est un cadre avec un titre.", "Il contient une ou plusieurs étapes.", "Des liaisons peuvent traverser ses bords.", "Son titre s’affiche en haut du cadre.", "Il s’écrit entre subgraph et `end`.", "Son titre se met entre guillemets, pour éviter les erreurs dues aux apostrophes et aux accents.", "Un groupe « Entrée » autour de A s’écrit `subgraph entree [\"Entrée\"]`, puis `A`, puis `end`.", "Pour un groupe dans un autre, j’écris le subgraph intérieur dans le groupe extérieur, entre son `subgraph` et son `end`.", "Relier deux groupes s’écrit `appel --> entree`."], "pratique": [5, 6, 7, 8, 9]}, "sp": {"t": "Sous-processus", "ax": ["Un sous-processus est une étape qui représente un processus entier.", "Son détail est dessiné dans un autre diagramme.", "Contrairement à un sous-groupe, on ne voit pas son contenu.", "Sa forme habituelle est le double rectangle.", "« Classer » comme sous-processus s’écrit `B[[Classer]]`."], "pratique": [5]}, "sty": {"t": "Style (classe)", "ax": ["Un style est un ensemble de réglages visuels (couleur, bordure).", "Il porte un nom.", "Il s’applique à une ou plusieurs étapes.", "Il ne change pas, dans le diagramme, la logique.", "Une classe important jaune se définit `classDef important fill:#fff3cd,stroke:#e0a800`.", "L’appliquer à B s’écrit `B:::important`.", "Appliquer la classe à A et B d’un coup s’écrit `class A,B important`.", "Colorer le sous-groupe appel, titre lisible, s’écrit `style appel fill:#e8f1ff,stroke:#3b82f6,color:#000`.", "Sans color:#000, le titre peut être invisible en mode sombre.", "Colorer une seule étape, sans classe, s’écrit `style A fill:#couleur`."], "pratique": [5, 6, 7, 8, 9, 10]}, "str": {"t": "Structure générale du système", "ax": ["La structure générale est un diagramme de flux.", "Elle montre le système entier.", "Une grande phase y est un sous-groupe ou une seule boîte.", "Elle ne montre pas comment chaque phase est réalisée.", "Les décisions gardées sont celles qui changent le chemin du système entier.", "Une phase « Emballer », sans détail, s’écrit `A[[Emballer]]`.", "Le début « Colis prêt » s’écrit `D([Colis prêt])`.", "La fin « Colis reçu » s’écrit `F([Colis reçu])`."], "pratique": [6, 7, 8]}};

, "ses frontières et limites"]]}, {"k": "H", "t": "Contextuelles", "d": "Étudient les conditions dans lesquelles la construction prend sens", "i": [[63, "Contextuelle", "son environnement de signification"], [64, "Situationnelle", "les circonstances particulières"], [65, "Historique", "son évolution dans le temps"], [66, "Culturelle", "son inscription culturelle"], [67, "Disciplinaire", "son domaine de connaissance"], [68, "Sociale", "son inscription dans les rapports sociaux"], [69, "Spatiotemporelle", "son inscription dans un espace et un temps"]]}, {"k": "I", "t": "Fonctionnelles et pragmatiques", "d": "Étudient son utilité et ses effets", "i": [[70, "Fonctionnelle", "son rôle"], [71, "Instrumentale", "les moyens qu’elle fournit"], [72, "Opératoire", "les opérations qu’elle permet"], [73, "Pragmatique", "ses effets dans l’action"], [74, "Finalitaire", "les objectifs auxquels elle contribue"], [75, "Utilitaire", "son utilité"], [76, "Performative", "ce que son énonciation accomplit"], [77, "Procédurale", "la manière de s’en servir, étape par étape"]]}, {"k": "J", "t": "Dynamiques et évolutives", "d": "Étudient ses transformations", "i": [[78, "Dynamique", "les changements qui l’affectent"], [79, "Évolutive", "son évolution"], [80, "Transformationnelle", "ses transformations"], [81, "Génétique", "son processus de formation"], [82, "Processuelle", "les processus qui la caractérisent"], [83, "Adaptative", "ses capacités d’adaptation"], [84, "Temporelle", "son évolution et ses états successifs"]]}, {"k": "K", "t": "Évaluatives", "d": "Étudient sa qualité et sa valeur", "i": [[85, "Évaluative", "son appréciation globale"], [86, "Normative", "sa conformité à des normes"], [87, "Axiologique", "sa valeur et les valeurs qu’elle engage"], [88, "Critérielle", "les critères d’appréciation"], [89, "Qualitative", "son degré de qualité"], [90, "Pertinentielle", "sa pertinence relativement à un objectif"], [91, "Optimisationnelle", "ses possibilités d’amélioration"]]}];
var C={"dia": {"1": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle.\nAxiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "Un diagramme se compose d’éléments et des relations entre eux, le tout dans une représentation visuelle."]], "2": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle.\nAxiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "Ses éléments fondamentaux sont ceux que posent les axiomes : une représentation visuelle, des éléments, et les relations entre ces éléments."]], "3": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle.\nAxiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "On relie des éléments, on montre les relations entre eux, et le tout prend une forme visuelle."]], "4": [["Axiome", "Axiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments.\nNon couvert : les axiomes ne disent rien d’une décomposition plus fine d’un élément."], ["Phrase", "Il se décompose en éléments d’un côté et en relations de l’autre."]], "5": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Aucun nombre n’est fixé : un diagramme peut compter peu ou beaucoup de boîtes."]], "6": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle.\nAxiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "Les éléments sont les parties reliées, les relations sont ce qui les relie, et le tout est de nature visuelle."]], "7": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle.\nAxiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "Un diagramme, c’est une représentation visuelle qui relie des éléments et montre les relations entre eux."]], "8": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle.\nAxiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "Un diagramme est une représentation visuelle qui relie des éléments et montre les relations entre ces éléments."]], "9": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle.\nAxiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "Être visuel, relier des éléments, montrer leurs relations : ces trois propriétés le constituent."]], "10": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le mot s’applique aux organigrammes, aux diagrammes de flux, aux cartes mentales, aux schémas de réseau, aux arbres généalogiques…"]], "11": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle.\nAxiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase · hors axiomes", "Les axiomes emploient représentation visuelle, élément et relation ; on dit aussi « schéma », et « nœud » et « lien » sont des synonymes courants d’élément et de relation."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le mot vient du grec diagramma, « dessin, figure », formé sur graphein, « écrire, dessiner »."]], "13": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un même diagramme se lit différemment selon les conventions du lecteur : sens de lecture, sens des flèches, signification des formes."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Diagramme » désigne aussi un graphique de données, en barres ou circulaire ; ici, il désigne un schéma de boîtes reliées."]], "15": [["Axiome", "Axiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments.\nNon couvert : les axiomes ne disent pas comment disposer les éléments."], ["Phrase", "Sa structure : des éléments, organisés par les relations entre eux."]], "16": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Certains diagrammes sont hiérarchiques (organigramme, arbre), d’autres non (réseau) : tout dépend des traits dessinés."]], "17": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle.\nAxiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "Vu de loin, un diagramme est un réseau d’éléments et de relations, présenté de façon visuelle."]], "18": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les boîtes suivent souvent un sens de lecture, de haut en bas ou de gauche à droite."]], "19": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle."], ["Phrase", "Il se range parmi les représentations visuelles."]], "20": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Types courants : diagramme de flux, de séquence, de classes, organigramme, carte mentale. Dans la carte, c’est le diagramme de flux qu’on étudie."]], "21": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un grand diagramme peut se découper en groupes ou en sous-diagrammes qu’on lit séparément."]], "22": [["Axiome", "Axiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "Un diagramme relie ses éléments et montre les relations entre eux."]], "23": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle.\nAxiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "Les axiomes s’enchaînent : il faut des éléments pour qu’il y ait des relations, et le tout prend une forme visuelle."]], "24": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un diagramme ne cause rien : il peut seulement représenter des causes."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Placer deux boîtes côte à côte suggère qu’elles vont ensemble, même sans lien de cause."]], "26": [["Axiome", "Axiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "Les éléments sont ce qu’il relie ; les relations, ce qu’il montre entre eux."]], "27": [["Axiome", "Axiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "Les relations dépendent des éléments : l’axiome 3 parle des relations entre « ces éléments », ceux de l’axiome 2."]], "28": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle.\nAxiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "Un diagramme s’oppose à ce qui n’est pas visuel ; à l’intérieur, l’élément s’oppose à la relation."]], "29": [["Axiome", "Axiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "Éléments et relations se complètent : le diagramme relie les éléments et montre les relations entre eux."]], "30": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle.\nAxiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "Il y a diagramme quand des éléments et leurs relations sont montrés de façon visuelle."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Comme un dessin, il se regarde ; comme un texte, il se lit."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Supprimer une boîte fait aussi disparaître les traits qui la touchent."]], "33": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un diagramme peut montrer un ordre dans le temps, comme le diagramme de flux, ou une organisation sans temps, comme un organigramme."]], "34": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La position porte du sens : ce qui est proche paraît lié, ce qui est en haut paraît premier."]], "35": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle.\nAxiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "Trois propositions : c’est une représentation visuelle ; ses parties reliées s’appellent ses éléments ; il montre les relations entre ces éléments."]], "36": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle.\nAxiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "On dit d’un diagramme qu’il est visuel, qu’il relie des éléments et qu’il montre leurs relations."]], "37": [["Axiome", "Axiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "Là où un diagramme montre une relation, il y a des éléments entre lesquels elle se trouve."]], "38": [["Axiome", "Axiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "Conséquence nécessaire : les relations qu’il montre sont toujours entre des éléments."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En observant beaucoup de schémas faits de boîtes reliées par des traits, on généralise la notion."]], "40": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Devant une image faite de boîtes reliées par des traits, la meilleure explication est qu’il s’agit d’un diagramme."]], "41": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Argument habituel : un diagramme fait voir d’un coup ce qu’un texte devrait décrire ligne à ligne."]], "42": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les axiomes ne se démontrent pas : on les admet. On montre qu’une image est un diagramme en vérifiant qu’elle respecte les trois."]], "43": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle.\nAxiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "Trois principes fondent la notion : la représentation visuelle, les éléments, et les relations entre eux."]], "44": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle.\nAxiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "Exclus : un diagramme sans forme visuelle, sans éléments, ou qui ne montre aucune relation."]], "45": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle.\nAxiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "Les axiomes s’accordent : le premier dit sa forme (visuelle), le deuxième ses parties (les éléments), le troisième ce qu’il montre (les relations entre eux)."]], "46": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans la carte, Diagramme est la première notion, dans les Fondations : il ne suppose rien d’autre."]], "47": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On justifie la notion par le besoin : faire voir ce qu’un texte rend difficile à suivre."]], "48": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La preuve qu’une image est un diagramme : on peut y désigner des boîtes et les traits qui les relient."]], "49": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle.\nAxiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "« X est un diagramme » est vrai si X est visuel, relie des éléments et montre leurs relations."]], "50": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle.\nAxiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "Pour vérifier : est-ce visuel ? y a-t-il des éléments ? les relations entre eux sont-elles montrées ?"]], "51": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle.\nAxiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "Une photo est visuelle mais ne montre pas de relations entre des éléments : ce n’est pas un diagramme."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La notion est sûre : ses axiomes sont posés comme des définitions."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On fait des hypothèses en lisant un diagramme inconnu : on suppose ce que signifient ses formes et ses flèches."]], "54": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle."], ["Phrase", "On le reconnaît en le regardant : il est visuel."]], "55": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En mathématiques, ce modèle s’appelle un graphe : des sommets reliés par des arêtes."]], "56": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle.\nAxiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "Un diagramme n’est pas la réalité : c’est une représentation visuelle des éléments et de leurs relations."]], "57": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle.\nAxiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "Il existe dès que des éléments et leurs relations sont montrés de façon visuelle."]], "58": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle.\nAxiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "Ce qui en fait un diagramme, c’est la réunion des trois : être visuel, relier des éléments, montrer leurs relations."]], "59": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle."], ["Phrase", "Il appartient à la catégorie des représentations visuelles."]], "60": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle.\nAxiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "Nécessaire : une représentation visuelle, des éléments, leurs relations. Accessoire : les couleurs, les formes, le nombre de boîtes."]], "61": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle.\nAxiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "Sa substance : des éléments reliés et les relations entre eux, rendus visibles."]], "62": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle.\nAxiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "Il s’arrête là où manque l’un des trois : la forme visuelle, les éléments ou les relations montrées."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans ce projet, le diagramme sert à dessiner la structure de l’enregistreur vocal : c’est un outil de conception."]], "64": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On fait un diagramme quand il faut expliquer, concevoir ou vérifier un système aux parties nombreuses."]], "65": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les schémas reliés sont anciens (arbres généalogiques, cartes) ; les diagrammes de flux se répandent au XXᵉ siècle avec l’informatique."]], "66": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le sens de lecture suit souvent celui de l’écriture : de gauche à droite et de haut en bas en Occident."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’utilise en informatique, en gestion, en ingénierie et en enseignement ; ici, pour concevoir un raccourci."]], "68": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un diagramme sert à partager une idée : il donne à plusieurs personnes la même image d’un système."]], "69": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un diagramme est figé : il montre un état ou une suite d’étapes, pas le mouvement lui-même."]], "70": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle.\nAxiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "Son rôle : montrer, de façon visuelle, les relations entre des éléments."]], "71": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle."], ["Phrase · hors axiomes", "C’est un moyen visuel pour penser, expliquer et vérifier ; dans la carte, Mermaid est l’instrument qui permet de l’écrire."]], "72": [["Axiome", "Axiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase", "Il permet de poser des éléments et de montrer les relations entre eux."]], "73": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En pratique, il révèle les oublis : une boîte isolée ou un trait qui ne mène nulle part se voit tout de suite."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ici, le but final est de dessiner la structure générale de l’enregistreur en un seul diagramme."]], "75": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il devient utile quand un texte serait trop long pour suivre tous les liens."]], "76": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dessiner un diagramme oblige à nommer chaque boîte et chaque trait : le faire clarifie déjà la pensée."]], "77": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle.\nAxiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments.\nNon couvert : les axiomes ne disent ni avec quel outil, ni comment disposer l’ensemble."], ["Phrase · hors axiomes", "- Lister les éléments, un par idée ou par action.\n- Tracer les relations entre eux.\n- Disposer l’ensemble de façon visuelle, dans un sens de lecture.\n- Vérifier qu’aucun élément n’est isolé."]], "78": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un diagramme change quand on ajoute, retire ou déplace des boîtes et des traits."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un diagramme évolue avec ce qu’il représente : il se complète au fil de la conception."]], "80": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un diagramme peut changer de forme, d’un croquis à du code Mermaid, sans perdre ce qu’il montre."]], "81": [["Axiome", "Axiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase · hors axiomes", "Il se forme en posant des éléments, puis en montrant les relations entre eux."]], "82": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Démarche courante : lister les boîtes, tracer les traits, puis réorganiser pour rendre l’ensemble lisible."]], "83": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un diagramme s’adapte à son lecteur : on le simplifie ou on le détaille selon ce qu’il faut montrer."]], "84": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un même diagramme passe par des versions successives, du brouillon à la version finale."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un diagramme se juge à sa clarté : on doit le comprendre sans explication."]], "86": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle.\nAxiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase · hors axiomes", "La norme minimale est celle des axiomes : visuel, des éléments, leurs relations. Il existe aussi des normes de dessin (UML, BPMN) propres à certains genres de diagrammes."]], "87": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Sa valeur tient à la clarté et à l’honnêteté : un diagramme ne doit ni cacher ni inventer de liens."]], "88": [["Axiome", "Axiome 1 — Un diagramme est une représentation visuelle.\nAxiome 2 — Les parties qu’un diagramme relie s’appellent ses éléments.\nAxiome 3 — Un diagramme montre les relations entre ces éléments."], ["Phrase · hors axiomes", "Critères tirés des axiomes : est-ce visuel ? les éléments sont-ils identifiables ? les relations sont-elles montrées ? Critères habituels en plus : lisibilité, peu de croisements, sens de lecture constant."]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un diagramme de qualité se comprend vite, sans légende superflue."]], "90": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il est peu pertinent pour une idée seule ou une liste sans liens : un texte suffit alors."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’améliore en retirant ce qui ne sert pas, en regroupant les boîtes proches et en évitant les traits qui se croisent."]]}, "mer": {"1": [["Axiome", "Axiome 1 — Mermaid est un langage.\nAxiome 2 — Il s’écrit en texte.\nAxiome 3 — Il décrit un diagramme.\nAxiome 4 — Sa première ligne nomme le type de diagramme.\nAxiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid."], ["Phrase", "Mermaid est un langage qui se compose de texte, écrit dans un bloc de code : une première ligne qui nomme le type, puis des lignes qui décrivent le diagramme."]], "2": [["Axiome", "Axiome 1 — Mermaid est un langage.\nAxiome 2 — Il s’écrit en texte.\nAxiome 3 — Il décrit un diagramme.\nAxiome 4 — Sa première ligne nomme le type de diagramme.\nAxiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid."], ["Phrase", "Ses éléments fondamentaux sont ceux que posent les axiomes : un langage, du texte, un diagramme décrit, une première ligne qui nomme le type, et un bloc de code."]], "3": [["Axiome", "Axiome 3 — Il décrit un diagramme.\nAxiome 4 — Sa première ligne nomme le type de diagramme.\nAxiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid."], ["Phrase", "On ouvre un bloc de code, on nomme le type sur la première ligne, puis on ajoute les lignes qui décrivent le diagramme."]], "4": [["Axiome", "Axiome 3 — Il décrit un diagramme.\nAxiome 4 — Sa première ligne nomme le type de diagramme.\nAxiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid."], ["Phrase", "On le découpe en trois : le bloc, la première ligne qui nomme le type, et les lignes qui décrivent le diagramme."]], "5": [["Axiome", "Axiome 3 — Il décrit un diagramme.\nAxiome 4 — Sa première ligne nomme le type de diagramme.\nAxiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid.\nNon couvert : les axiomes ne fixent pas le nombre des autres lignes."], ["Phrase", "Un bloc, une première ligne, donc un seul type, et un diagramme décrit."]], "6": [["Axiome", "Axiome 1 — Mermaid est un langage.\nAxiome 2 — Il s’écrit en texte."], ["Phrase", "Sa nature : un langage, fait de texte."]], "7": [["Axiome", "Axiome 1 — Mermaid est un langage.\nAxiome 2 — Il s’écrit en texte.\nAxiome 3 — Il décrit un diagramme."], ["Phrase", "Mermaid, c’est un langage qui décrit un diagramme avec du texte."]], "8": [["Axiome", "Axiome 1 — Mermaid est un langage.\nAxiome 2 — Il s’écrit en texte.\nAxiome 3 — Il décrit un diagramme.\nAxiome 4 — Sa première ligne nomme le type de diagramme.\nAxiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid."], ["Phrase", "Mermaid est un langage, écrit en texte dans un bloc de code, qui décrit un diagramme dont la première ligne nomme le type."]], "9": [["Axiome", "Axiome 1 — Mermaid est un langage.\nAxiome 2 — Il s’écrit en texte.\nAxiome 3 — Il décrit un diagramme.\nAxiome 4 — Sa première ligne nomme le type de diagramme."], ["Phrase", "Être un langage, s’écrire en texte, décrire un diagramme, nommer le type sur la première ligne : ces propriétés le constituent."]], "10": [["Axiome", "Axiome 4 — Sa première ligne nomme le type de diagramme."], ["Phrase · hors axiomes", "Il couvre plusieurs types de diagramme : de flux (`flowchart`), de séquence (`sequenceDiagram`), de classes (`classDiagram`), de Gantt (`gantt`), cartes mentales (`mindmap`)."]], "11": [["Axiome", "Axiome 1 — Mermaid est un langage.\nAxiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid."], ["Phrase · hors axiomes", "Les axiomes l’appellent langage ; on parle aussi de syntaxe Mermaid ou de bloc Mermaid ; en anglais, mermaid veut dire « sirène »."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Son vocabulaire est fait de mots-clés anglais (`flowchart`, `subgraph`, `end`) et de symboles (`-->`, `%%`)."]], "13": [["Axiome", "Axiome 3 — Il décrit un diagramme."], ["Phrase · hors axiomes", "Un programme lit le code et en tire le diagramme qu’il décrit ; si une ligne est mal écrite, le dessin ne s’affiche pas."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Mermaid » désigne à la fois la façon d’écrire et l’outil qui la transforme en dessin."]], "15": [["Axiome", "Axiome 3 — Il décrit un diagramme.\nAxiome 4 — Sa première ligne nomme le type de diagramme.\nAxiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid."], ["Phrase", "Il s’organise de haut en bas : le bloc, la première ligne qui nomme le type, puis les lignes qui décrivent le diagramme."]], "16": [["Axiome", "Axiome 4 — Sa première ligne nomme le type de diagramme."], ["Phrase", "La première ligne a un rang à part : elle nomme le type de tout le diagramme."]], "17": [["Axiome", "Axiome 3 — Il décrit un diagramme.\nAxiome 4 — Sa première ligne nomme le type de diagramme.\nAxiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid."], ["Phrase", "Vu de loin : un bloc, une première ligne qui nomme le type, et un corps qui décrit le diagramme."]], "18": [["Axiome", "Axiome 4 — Sa première ligne nomme le type de diagramme.\nNon couvert : les axiomes ne disent pas comment disposer les autres lignes."], ["Phrase · hors axiomes", "La première ligne est fixée ; ensuite, on écrit en général une instruction par ligne, décalée de deux espaces."]], "19": [["Axiome", "Axiome 1 — Mermaid est un langage."], ["Phrase", "Il se range parmi les langages."]], "20": [["Axiome", "Axiome 4 — Sa première ligne nomme le type de diagramme."], ["Phrase · hors axiomes", "Chaque type a son mot-clé ; dans la carte, celui qu’on étudie est le diagramme de flux, `flowchart`."]], "21": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un code Mermaid peut se découper en sous-groupes (`subgraph` … `end`) qu’on relit séparément."]], "22": [["Axiome", "Axiome 2 — Il s’écrit en texte.\nAxiome 3 — Il décrit un diagramme."], ["Phrase", "Il relie un texte à un diagramme : le premier décrit le second."]], "23": [["Axiome", "Axiome 1 — Mermaid est un langage.\nAxiome 2 — Il s’écrit en texte.\nAxiome 3 — Il décrit un diagramme.\nAxiome 4 — Sa première ligne nomme le type de diagramme.\nAxiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid.\nAxiome 6 — Pour ajouter un bloc de code, je tape `/code`."], ["Phrase", "Les axiomes s’enchaînent : un langage, écrit en texte, qui décrit un diagramme ; la première ligne nomme le type ; le tout dans un bloc de code, qu’on ajoute avec `/code`."]], "24": [["Axiome", "Axiome 4 — Sa première ligne nomme le type de diagramme."], ["Phrase", "C’est la première ligne qui nomme le type : changer ce nom, c’est changer de type."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Plus le code est long, plus le dessin est chargé : les deux grandissent ensemble."]], "26": [["Axiome", "Axiome 3 — Il décrit un diagramme.\nAxiome 4 — Sa première ligne nomme le type de diagramme.\nAxiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid."], ["Phrase", "Le bloc contient, la première ligne nomme le type, les autres lignes décrivent le diagramme."]], "27": [["Axiome", "Axiome 3 — Il décrit un diagramme."], ["Phrase · hors axiomes", "Mermaid dépend de la notion de diagramme : il en décrit un. Dans la carte, il dépend de Diagramme ; Diagramme de flux et Identifiant dépendent de lui."]], "28": [["Axiome", "Axiome 2 — Il s’écrit en texte."], ["Phrase", "Écrit en texte, il s’oppose à un diagramme dessiné à la main."]], "29": [["Axiome", "Axiome 2 — Il s’écrit en texte.\nAxiome 3 — Il décrit un diagramme."], ["Phrase", "Le texte et le diagramme qu’il décrit se complètent."]], "30": [["Axiome", "Axiome 4 — Sa première ligne nomme le type de diagramme.\nAxiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid."], ["Phrase", "Pour qu’un code soit lu comme du Mermaid, il faut un bloc réglé sur Mermaid et une première ligne qui nomme le type."]], "31": [["Axiome", "Axiome 1 — Mermaid est un langage."], ["Phrase · hors axiomes", "Comme le Markdown, c’est un langage simple qui devient une mise en forme ; mais ce qu’il produit est un dessin, pas une page."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le code et le dessin se répondent : on corrige l’écriture en regardant le dessin, et le dessin suit chaque correction."]], "33": [["Axiome", "Axiome 4 — Sa première ligne nomme le type de diagramme."], ["Phrase", "La première ligne vient avant les autres."]], "34": [["Axiome", "Axiome 4 — Sa première ligne nomme le type de diagramme.\nAxiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid."], ["Phrase", "Le type tout en haut, sur la première ligne, le reste en dessous, le tout dans le bloc."]], "35": [["Axiome", "Axiome 1 — Mermaid est un langage.\nAxiome 2 — Il s’écrit en texte.\nAxiome 3 — Il décrit un diagramme.\nAxiome 4 — Sa première ligne nomme le type de diagramme.\nAxiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid.\nAxiome 6 — Pour ajouter un bloc de code, je tape `/code`."], ["Phrase", "Six propositions : c’est un langage ; il s’écrit en texte ; il décrit un diagramme ; sa première ligne nomme le type ; il s’écrit dans un bloc de code ; on ajoute ce bloc avec `/code`."]], "36": [["Axiome", "Axiome 1 — Mermaid est un langage.\nAxiome 2 — Il s’écrit en texte.\nAxiome 3 — Il décrit un diagramme.\nAxiome 4 — Sa première ligne nomme le type de diagramme.\nAxiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid."], ["Phrase", "On dit de Mermaid qu’il est un langage, écrit en texte, qui décrit un diagramme, dont la première ligne nomme le type, et qui s’écrit dans un bloc de code."]], "37": [["Axiome", "Axiome 4 — Sa première ligne nomme le type de diagramme."], ["Phrase", "En lisant la première ligne, on sait quel type de diagramme on va obtenir."]], "38": [["Axiome", "Axiome 4 — Sa première ligne nomme le type de diagramme."], ["Phrase", "Conséquence nécessaire : un code sans type sur la première ligne est incomplet."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "À force d’en écrire, on retrouve les mêmes motifs : un mot-clé, des étapes, des liaisons."]], "40": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Si le dessin ne s’affiche pas, l’explication la plus probable est une erreur de frappe : un mot-clé mal écrit ou un caractère spécial."]], "41": [["Axiome", "Axiome 2 — Il s’écrit en texte."], ["Phrase · hors axiomes", "Argument habituel : un diagramme écrit en texte se modifie, se copie et se conserve plus facilement qu’un dessin."]], "42": [["Axiome", "Axiome 4 — Sa première ligne nomme le type de diagramme.\nAxiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid."], ["Phrase", "Le type est nommé sur la première ligne ; un bloc n’a qu’une première ligne ; donc un bloc Mermaid nomme un seul type."]], "43": [["Axiome", "Axiome 1 — Mermaid est un langage.\nAxiome 2 — Il s’écrit en texte.\nAxiome 3 — Il décrit un diagramme.\nAxiome 4 — Sa première ligne nomme le type de diagramme.\nAxiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid.\nAxiome 6 — Pour ajouter un bloc de code, je tape `/code`."], ["Phrase", "Six principes fondent la notion : langage, texte, diagramme décrit, type sur la première ligne, bloc de code, `/code`."]], "44": [["Axiome", "Axiome 2 — Il s’écrit en texte.\nAxiome 4 — Sa première ligne nomme le type de diagramme.\nAxiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid."], ["Phrase", "Exclus : un Mermaid dessiné au lieu d’être écrit en texte, un code sans type sur la première ligne, ou hors d’un bloc de code."]], "45": [["Axiome", "Axiome 1 — Mermaid est un langage.\nAxiome 2 — Il s’écrit en texte.\nAxiome 3 — Il décrit un diagramme.\nAxiome 4 — Sa première ligne nomme le type de diagramme.\nAxiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid.\nAxiome 6 — Pour ajouter un bloc de code, je tape `/code`."], ["Phrase", "Les axiomes s’accordent : les trois premiers disent ce qu’il est (un langage, du texte, un diagramme décrit), les deux suivants comment il s’écrit (première ligne, bloc de code), le dernier comment commencer (`/code`)."]], "46": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans la carte, Mermaid fait partie des Fondations et suppose de connaître Diagramme."]], "47": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On le justifie par le besoin du projet : écrire la structure de l’enregistreur sous une forme facile à modifier."]], "48": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La preuve qu’un code est juste : le dessin s’affiche et montre ce qu’on voulait."]], "49": [["Axiome", "Axiome 2 — Il s’écrit en texte.\nAxiome 4 — Sa première ligne nomme le type de diagramme.\nAxiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid."], ["Phrase", "« X est du Mermaid » est vrai si X est du texte, dans un bloc de code réglé sur Mermaid, avec le type sur la première ligne."]], "50": [["Axiome", "Axiome 4 — Sa première ligne nomme le type de diagramme.\nAxiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid."], ["Phrase", "Pour vérifier : regarder le bloc, puis la première ligne."]], "51": [["Axiome", "Axiome 4 — Sa première ligne nomme le type de diagramme.\nAxiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid."], ["Phrase", "Un code sans type sur la première ligne, ou hors d’un bloc réglé sur Mermaid, n’est pas du Mermaid valide."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La notion est sûre : ses axiomes sont posés comme des définitions."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On fait des hypothèses en corrigeant : on suppose quelle ligne pose problème, puis on la teste."]], "54": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On apprend en essayant : on écrit, on regarde le dessin, on corrige."]], "55": [["Axiome", "Axiome 1 — Mermaid est un langage."], ["Phrase · hors axiomes", "Derrière, c’est le principe des langages informatiques : une syntaxe précise qu’un programme sait lire."]], "56": [["Axiome", "Axiome 1 — Mermaid est un langage.\nAxiome 2 — Il s’écrit en texte.\nAxiome 3 — Il décrit un diagramme."], ["Phrase", "Mermaid n’est pas le diagramme : c’est un langage, fait de texte, qui le décrit."]], "57": [["Axiome", "Axiome 4 — Sa première ligne nomme le type de diagramme.\nAxiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid."], ["Phrase", "Un code Mermaid existe dès qu’un bloc réglé sur Mermaid contient une première ligne qui nomme le type."]], "58": [["Axiome", "Axiome 1 — Mermaid est un langage.\nAxiome 2 — Il s’écrit en texte.\nAxiome 3 — Il décrit un diagramme.\nAxiome 4 — Sa première ligne nomme le type de diagramme.\nAxiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid."], ["Phrase", "Ce qui en fait du Mermaid, c’est la réunion des axiomes : un langage, du texte, un diagramme décrit, le type sur la première ligne, un bloc de code."]], "59": [["Axiome", "Axiome 1 — Mermaid est un langage."], ["Phrase", "Il appartient à la catégorie des langages."]], "60": [["Axiome", "Axiome 2 — Il s’écrit en texte.\nAxiome 4 — Sa première ligne nomme le type de diagramme.\nAxiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid."], ["Phrase", "Nécessaire : du texte, le type sur la première ligne, un bloc de code. Au choix : le reste du contenu et sa longueur."]], "61": [["Axiome", "Axiome 2 — Il s’écrit en texte."], ["Phrase", "Sa substance : du texte."]], "62": [["Axiome", "Axiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid."], ["Phrase", "Il commence et s’arrête aux bords du bloc."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans ce projet, Mermaid sert à écrire la structure de l’enregistreur vocal."]], "64": [["Axiome", "Axiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid.\nAxiome 6 — Pour ajouter un bloc de code, je tape `/code`."], ["Phrase", "On s’en sert après avoir ajouté un bloc de code avec `/code`."]], "65": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Mermaid a été créé en 2014 par Knut Sveidqvist, sous la forme d’une bibliothèque JavaScript libre."]], "66": [["Axiome", "Axiome 2 — Il s’écrit en texte."], ["Phrase · hors axiomes", "Il vient de la culture des développeurs, habitués à tout écrire en texte, comme la documentation en Markdown."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il relève de l’informatique et de la documentation technique."]], "68": [["Axiome", "Axiome 2 — Il s’écrit en texte."], ["Phrase · hors axiomes", "Comme c’est du texte, il se partage et se corrige à plusieurs aussi facilement qu’un message."]], "69": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il s’affiche dans les outils qui savent le lire, comme GitHub ou Notion."]], "70": [["Axiome", "Axiome 3 — Il décrit un diagramme."], ["Phrase", "Son rôle : décrire un diagramme."]], "71": [["Axiome", "Axiome 2 — Il s’écrit en texte.\nAxiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid.\nAxiome 6 — Pour ajouter un bloc de code, je tape `/code`."], ["Phrase", "Il fournit un moyen d’obtenir un diagramme avec du texte ; `/code` ouvre le bloc."]], "72": [["Axiome", "Axiome 3 — Il décrit un diagramme.\nAxiome 4 — Sa première ligne nomme le type de diagramme.\nAxiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid.\nAxiome 6 — Pour ajouter un bloc de code, je tape `/code`."], ["Phrase", "Il permet d’ajouter un bloc avec `/code`, de nommer le type sur la première ligne, puis de décrire le diagramme."]], "73": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En pratique, on modifie un dessin en changeant une ligne, sans tout redessiner."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ici, le but est d’écrire la structure générale de l’enregistreur en un seul code Mermaid."]], "75": [["Axiome", "Axiome 2 — Il s’écrit en texte.\nAxiome 3 — Il décrit un diagramme."], ["Phrase · hors axiomes", "Il devient vraiment utile quand un diagramme décrit en texte doit être retouché souvent."]], "76": [["Axiome", "Axiome 4 — Sa première ligne nomme le type de diagramme."], ["Phrase", "Écrire le type sur la première ligne, c’est déjà choisir le genre de diagramme."]], "77": [["Axiome", "Axiome 4 — Sa première ligne nomme le type de diagramme.\nAxiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid.\nAxiome 6 — Pour ajouter un bloc de code, je tape `/code`."], ["Phrase · hors axiomes", "- Taper `/code`, puis choisir Mermaid pour le bloc.\n- Écrire `flowchart TD` sur la première ligne.\n- Ajouter une ligne par liaison, par exemple `A[Enregistrer] --> B[Classer]`.\n- Regarder le dessin, corriger, recommencer."]], "78": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un code Mermaid change à chaque ligne ajoutée, retirée ou corrigée."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "L’outil lui-même évolue : de nouveaux mots-clés s’ajoutent au fil des versions."]], "80": [["Axiome", "Axiome 2 — Il s’écrit en texte.\nAxiome 3 — Il décrit un diagramme.\nAxiome 4 — Sa première ligne nomme le type de diagramme."], ["Phrase · hors axiomes", "Le texte décrit un diagramme ; changer le type sur la première ligne transforme tout le diagramme."]], "81": [["Axiome", "Axiome 3 — Il décrit un diagramme.\nAxiome 4 — Sa première ligne nomme le type de diagramme.\nAxiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid.\nAxiome 6 — Pour ajouter un bloc de code, je tape `/code`."], ["Phrase", "Un code naît dans l’ordre : `/code` pour le bloc, le type sur la première ligne, puis les lignes qui décrivent le diagramme."]], "82": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Démarche courante : écrire quelques lignes, regarder le dessin, corriger, recommencer."]], "83": [["Axiome", "Axiome 4 — Sa première ligne nomme le type de diagramme."], ["Phrase · hors axiomes", "Il s’adapte à plusieurs types de diagramme : la première ligne dit lequel."]], "84": [["Axiome", "Axiome 2 — Il s’écrit en texte."], ["Phrase · hors axiomes", "Comme c’est du texte, on peut garder et comparer chaque version."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un bon code Mermaid s’affiche sans erreur et se relit facilement."]], "86": [["Axiome", "Axiome 4 — Sa première ligne nomme le type de diagramme.\nAxiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid."], ["Phrase · hors axiomes", "Norme minimale : un bloc et le type sur la première ligne ; la norme complète est la syntaxe officielle de chaque type."]], "87": [["Axiome", "Axiome 2 — Il s’écrit en texte."], ["Phrase · hors axiomes", "Sa valeur tient à la simplicité : du texte lisible par tous, dans un outil libre et gratuit."]], "88": [["Axiome", "Axiome 4 — Sa première ligne nomme le type de diagramme.\nAxiome 5 — Il s’écrit dans un bloc de code, dont le langage est Mermaid."], ["Phrase · hors axiomes", "Critères tirés des axiomes : un bloc réglé sur Mermaid, le type sur la première ligne. Critères habituels : le dessin s’affiche, les identifiants sont courts, le retrait est régulier."]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un code de qualité se comprend en le lisant, avant même de voir le dessin."]], "90": [["Axiome", "Axiome 3 — Il décrit un diagramme."], ["Phrase · hors axiomes", "Il est pertinent quand on a un diagramme à décrire ; pour un dessin libre, un logiciel de dessin convient mieux."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’améliore en regroupant les étapes, en ajoutant des commentaires `%%` et en gardant des identifiants courts."]]}, "flu": {"1": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions.\nAxiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions.\nAxiome 4 — Son mot-clé, sur la première ligne, est `flowchart` (ou `graph`)."], ["Phrase", "Un diagramme de flux se compose d’un processus mis en boîtes, de traits orientés qui en donnent l’ordre, et d’un mot-clé, `flowchart` ou `graph`, sur la première ligne."]], "2": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions.\nAxiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions.\nAxiome 4 — Son mot-clé, sur la première ligne, est `flowchart` (ou `graph`)."], ["Phrase", "Ses éléments fondamentaux sont ceux que posent les quatre axiomes : le processus, les boîtes, les traits orientés et le mot-clé."]], "3": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions.\nAxiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions.\nAxiome 4 — Son mot-clé, sur la première ligne, est `flowchart` (ou `graph`)."], ["Phrase", "Le mot-clé ouvre le code ; chaque point du processus devient une boîte, et des traits orientés relient les boîtes dans l’ordre."]], "4": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions.\nAxiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions.\nAxiome 4 — Son mot-clé, sur la première ligne, est `flowchart` (ou `graph`).\nNon couvert : les axiomes ne disent rien d’une décomposition plus fine d’une boîte."], ["Phrase", "Il se décompose en un processus, des boîtes, des traits orientés et un mot-clé de première ligne."]], "5": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Aucun nombre n’est fixé : un diagramme de flux peut avoir peu ou beaucoup d’étapes."]], "6": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions.\nAxiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions.\nAxiome 4 — Son mot-clé, sur la première ligne, est `flowchart` (ou `graph`)."], ["Phrase", "Le processus est une suite d’actions, les boîtes sont des actions ou des questions, les traits sont orientés, et le mot-clé est `flowchart` ou `graph`."]], "7": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions.\nAxiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions."], ["Phrase", "Un diagramme de flux, c’est la représentation d’un processus : des boîtes, et des traits orientés qui en donnent l’ordre."]], "8": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions.\nAxiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions.\nAxiome 4 — Son mot-clé, sur la première ligne, est `flowchart` (ou `graph`)."], ["Phrase", "Un diagramme de flux représente un processus : chaque point est une boîte, et des traits orientés donnent l’ordre. En Mermaid, il commence par `flowchart` ou `graph`."]], "9": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions.\nAxiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions.\nAxiome 4 — Son mot-clé, sur la première ligne, est `flowchart` (ou `graph`)."], ["Phrase", "Représenter un processus, avoir des boîtes, avoir des traits orientés, commencer par `flowchart` ou `graph` : ces quatre propriétés le constituent."]], "10": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions."], ["Phrase · hors axiomes", "Il s’applique à tout processus : enregistrer une note, saisir un code, préparer un colis…"]], "11": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions.\nAxiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions.\nAxiome 4 — Son mot-clé, sur la première ligne, est `flowchart` (ou `graph`)."], ["Phrase · hors axiomes", "Les axiomes emploient processus, boîte, traits orientés et `flowchart`. En français, on dit aussi logigramme ou ordinogramme."]], "12": [["Axiome", "Axiome 4 — Son mot-clé, sur la première ligne, est `flowchart` (ou `graph`)."], ["Phrase · hors axiomes", "« Flux » vient du latin fluxus, « écoulement » : le dessin suit l’écoulement des actions. En anglais, flowchart, qui est aussi son mot-clé."]], "13": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On lit chaque étape selon sa forme, et chaque flèche comme le passage à l’étape suivante."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Flux » désigne aussi un débit (flux d’eau, flux de données) ; ici, il désigne l’enchaînement des actions."]], "15": [["Axiome", "Axiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions.\nAxiome 4 — Son mot-clé, sur la première ligne, est `flowchart` (ou `graph`).\nNon couvert : les axiomes ne disent pas comment disposer les boîtes."], ["Phrase", "Il commence par son mot-clé en première ligne ; ses boîtes sont reliées par des traits orientés."]], "16": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les étapes n’ont pas de rang : les flèches donnent une suite, pas une hiérarchie."]], "17": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions.\nAxiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions."], ["Phrase", "Vu de loin, c’est un processus : des boîtes reliées par des traits orientés, dans l’ordre des actions."]], "18": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les étapes se disposent dans un sens de lecture, de gauche à droite ou de haut en bas, pour que les flèches se suivent."]], "19": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions."], ["Phrase", "Il se range parmi les diagrammes qui représentent un processus."]], "20": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Variantes courantes : logigramme de programme, schéma de procédure, diagramme BPMN."]], "21": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un grand diagramme de flux se découpe en sous-groupes et en sous-processus qu’on lit séparément."]], "22": [["Axiome", "Axiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions."], ["Phrase", "Ses liens sont les traits orientés : ils relient les boîtes et donnent l’ordre des actions."]], "23": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions.\nAxiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions.\nAxiome 4 — Son mot-clé, sur la première ligne, est `flowchart` (ou `graph`)."], ["Phrase", "Les axiomes s’enchaînent : le processus est découpé en boîtes, les boîtes sont ordonnées par les traits, et le tout s’écrit avec un mot-clé."]], "24": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une flèche montre une suite, pas une cause : B vient après A, ce qui ne veut pas dire que A provoque B."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Deux étapes reliées se suivent ; cela ne dit pas qu’elles varient ensemble."]], "26": [["Axiome", "Axiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions."], ["Phrase", "Les boîtes portent les actions ou les questions ; les traits orientés en donnent l’ordre."]], "27": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions.\nAxiome 3 — Des traits orientés indiquent l’ordre des actions."], ["Phrase", "L’ordre dépend des actions : les traits orientés n’indiquent que l’ordre des actions du processus."]], "28": [["Axiome", "Axiome 2 — Chaque point du processus est une boîte (une action ou une question)."], ["Phrase", "Une boîte est soit une action, soit une question : ce sont les deux sortes qui s’opposent."]], "29": [["Axiome", "Axiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions."], ["Phrase", "Boîtes et traits orientés se complètent : les boîtes portent les actions, les traits en donnent l’ordre."]], "30": [["Axiome", "Axiome 2 — Chaque point du processus est une boîte (une action ou une question)."], ["Phrase · hors axiomes", "Une boîte peut être une question : c’est elle qui permet d’exprimer une condition (si… alors…)."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Comme tout diagramme, il relie des éléments ; il s’en distingue parce que ces éléments sont des actions et que les liens donnent une suite."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les actions s’influencent par leur enchaînement : changer l’une peut changer celles qui suivent."]], "33": [["Axiome", "Axiome 3 — Des traits orientés indiquent l’ordre des actions.\nNon couvert : les axiomes ne parlent pas d’actions simultanées."], ["Phrase", "Il montre des actions qui se succèdent : les traits orientés en donnent l’ordre."]], "34": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La place des étapes suit le sens de lecture : de gauche à droite ou de haut en bas."]], "35": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions.\nAxiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions.\nAxiome 4 — Son mot-clé, sur la première ligne, est `flowchart` (ou `graph`)."], ["Phrase", "Quatre propositions suffisent : il représente un processus, ses points sont des boîtes, des traits orientés donnent l’ordre, son mot-clé est `flowchart` ou `graph`."]], "36": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions.\nAxiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions.\nAxiome 4 — Son mot-clé, sur la première ligne, est `flowchart` (ou `graph`)."], ["Phrase", "On dit d’un diagramme de flux qu’il représente un processus, qu’il a des boîtes et des traits orientés, et qu’il commence par `flowchart` ou `graph`."]], "37": [["Axiome", "Axiome 4 — Son mot-clé, sur la première ligne, est `flowchart` (ou `graph`)."], ["Phrase", "En lisant `flowchart` ou `graph` en première ligne, on sait que le code décrit un diagramme de flux."]], "38": [["Axiome", "Axiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions."], ["Phrase", "Conséquence nécessaire : les traits orientés vont d’une boîte à une autre, puisque les actions sont dans des boîtes."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En voyant beaucoup de dessins faits d’étapes reliées par des flèches, on généralise : un diagramme de flux est un enchaînement d’étapes."]], "40": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Devant un dessin d’étapes reliées par des flèches, la meilleure explication est qu’il montre un déroulement."]], "41": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Argument habituel : un enchaînement d’actions dessiné se suit plus vite que décrit en texte."]], "42": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les axiomes ne se démontrent pas : on les admet. On montre qu’un dessin est un diagramme de flux en vérifiant qu’il respecte les quatre."]], "43": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions.\nAxiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions.\nAxiome 4 — Son mot-clé, sur la première ligne, est `flowchart` (ou `graph`)."], ["Phrase", "Quatre principes fondent la notion : le processus, les boîtes, les traits orientés et le mot-clé."]], "44": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions.\nAxiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions.\nAxiome 4 — Son mot-clé, sur la première ligne, est `flowchart` (ou `graph`)."], ["Phrase", "Exclus : un diagramme de flux sans processus, sans boîtes, sans traits orientés, ou dont le code ne commence pas par `flowchart` ou `graph`."]], "45": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions.\nAxiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions.\nAxiome 4 — Son mot-clé, sur la première ligne, est `flowchart` (ou `graph`)."], ["Phrase", "Les quatre axiomes ne se contredisent pas : le premier dit ce qu’il représente (un processus), les deux suivants de quoi il est fait (boîtes, traits orientés), le dernier comment l’écrire (`flowchart`)."]], "46": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans la carte, Diagramme de flux fait partie des Fondations et suppose de connaître Mermaid."]], "47": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On le justifie par le besoin du projet : décrire le déroulement de l’enregistreur, de l’appui à la note rangée."]], "48": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La preuve qu’un dessin est un diagramme de flux : on peut y désigner des actions et l’enchaînement qui les relie."]], "49": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions.\nAxiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions.\nAxiome 4 — Son mot-clé, sur la première ligne, est `flowchart` (ou `graph`)."], ["Phrase", "« X est un diagramme de flux » est vrai si X représente un processus avec des boîtes et des traits orientés, et commence par `flowchart` ou `graph`."]], "50": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions.\nAxiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions.\nAxiome 4 — Son mot-clé, sur la première ligne, est `flowchart` (ou `graph`)."], ["Phrase", "Pour vérifier : y a-t-il un processus, des boîtes, des traits orientés, et `flowchart` ou `graph` en première ligne ?"]], "51": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions.\nAxiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions.\nAxiome 4 — Son mot-clé, sur la première ligne, est `flowchart` (ou `graph`)."], ["Phrase", "Un dessin sans processus, sans boîtes ou sans traits orientés, ou un code qui ne commence pas par `flowchart` ou `graph`, n’est pas un diagramme de flux."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La notion est sûre : ses axiomes sont posés comme des définitions."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On fait des hypothèses en lisant un diagramme inconnu : on suppose ce que signifient ses formes et ses flèches."]], "54": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On le reconnaît en le regardant : des étapes reliées par des flèches."]], "55": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Derrière, le modèle mathématique est celui du graphe : des sommets reliés par des arcs, chacun dans un sens."]], "56": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions."], ["Phrase", "Un diagramme de flux n’est pas le processus : il le représente."]], "57": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions.\nAxiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions.\nAxiome 4 — Son mot-clé, sur la première ligne, est `flowchart` (ou `graph`)."], ["Phrase", "Il existe dès qu’un processus est mis en boîtes reliées par des traits orientés, sous le mot-clé `flowchart` ou `graph`."]], "58": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions.\n
