upe est un cadre avec un titre.\nAxiome 2 — Il contient une ou plusieurs étapes."], ["Phrase", "Le cadre délimite, le titre nomme, les étapes remplissent."]], "27": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans la carte, Sous-groupe dépend de Liaison ; Sous-processus et Style en dépendent."]], "28": [["Axiome", "Axiome 8 — Pour un groupe dans un autre, j’écris le subgraph intérieur dans le groupe extérieur, entre son `subgraph` et son `end`."], ["Phrase", "Le groupe intérieur s’oppose au groupe extérieur : l’un est dans l’autre."]], "29": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre."], ["Phrase", "Le cadre et le titre se complètent : l’un délimite, l’autre nomme."]], "30": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre.\nAxiome 6 — Son titre se met entre guillemets, pour éviter les erreurs dues aux apostrophes et aux accents."], ["Phrase", "Si le titre contient des apostrophes ou des accents, on le met entre guillemets."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Comme un chapitre dans un livre, il réunit ce qui traite d’un même sujet."]], "32": [["Axiome", "Axiome 3 — Des liaisons peuvent traverser ses bords."], ["Phrase", "Des liaisons peuvent traverser ses bords : un groupe ne coupe pas le processus."]], "33": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un groupe réunit souvent une phase du processus : ce qui se passe au même moment."]], "34": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre.\nAxiome 4 — Son titre s’affiche en haut du cadre."], ["Phrase", "Dans le dessin, c’est un cadre, avec son titre en haut."]], "35": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre.\nAxiome 2 — Il contient une ou plusieurs étapes.\nAxiome 3 — Des liaisons peuvent traverser ses bords.\nAxiome 4 — Son titre s’affiche en haut du cadre.\nAxiome 5 — Il s’écrit entre subgraph et `end`.\nAxiome 6 — Son titre se met entre guillemets, pour éviter les erreurs dues aux apostrophes et aux accents.\nAxiome 7 — Un groupe « Entrée » autour de A s’écrit `subgraph entree [\"Entrée\"]`, puis `A`, puis `end`.\nAxiome 8 — Pour un groupe dans un autre, j’écris le subgraph intérieur dans le groupe extérieur, entre son `subgraph` et son `end`.\nAxiome 9 — Relier deux groupes s’écrit `appel --> entree`."], ["Phrase", "Neuf propositions : c’est un cadre avec un titre ; il contient une ou plusieurs étapes ; des liaisons peuvent traverser ses bords ; son titre s’affiche en haut du cadre ; il s’écrit entre subgraph et end ; son titre se met entre guillemets ; « Entrée » s’écrit `subgraph entree [\"Entrée\"]`, puis `A`, puis `end` ; un groupe peut en contenir un autre, intérieur ; deux groupes se relient avec `appel --> entree`."]], "36": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre.\nAxiome 2 — Il contient une ou plusieurs étapes.\nAxiome 3 — Des liaisons peuvent traverser ses bords.\nAxiome 4 — Son titre s’affiche en haut du cadre."], ["Phrase", "On dit d’un sous-groupe qu’il est un cadre avec un titre en haut, qu’il contient une ou plusieurs étapes, et que des liaisons peuvent traverser ses bords."]], "37": [["Axiome", "Axiome 5 — Il s’écrit entre subgraph et `end`."], ["Phrase", "En lisant subgraph, on sait qu’un groupe commence ; en lisant end, qu’il se termine."]], "38": [["Axiome", "Axiome 5 — Il s’écrit entre subgraph et `end`."], ["Phrase", "Conséquence nécessaire : chaque subgraph demande son end."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "À force d’en dessiner, on remarque qu’un regroupement par phase rend le schéma plus lisible."]], "40": [["Axiome", "Axiome 5 — Il s’écrit entre subgraph et `end`."], ["Phrase · hors axiomes", "Si le dessin ne s’affiche pas, l’explication la plus probable est un end oublié."]], "41": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Argument habituel : regrouper rend un grand diagramme plus facile à lire."]], "42": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les axiomes ne se démontrent pas : on les admet. On montre qu’un regroupement est un sous-groupe en vérifiant qu’il respecte chacun d’eux."]], "43": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre.\nAxiome 2 — Il contient une ou plusieurs étapes.\nAxiome 3 — Des liaisons peuvent traverser ses bords.\nAxiome 4 — Son titre s’affiche en haut du cadre.\nAxiome 5 — Il s’écrit entre subgraph et `end`.\nAxiome 6 — Son titre se met entre guillemets, pour éviter les erreurs dues aux apostrophes et aux accents.\nAxiome 7 — Un groupe « Entrée » autour de A s’écrit `subgraph entree [\"Entrée\"]`, puis `A`, puis `end`.\nAxiome 8 — Pour un groupe dans un autre, j’écris le subgraph intérieur dans le groupe extérieur, entre son `subgraph` et son `end`.\nAxiome 9 — Relier deux groupes s’écrit `appel --> entree`."], ["Phrase", "Neuf principes fondent la notion : le cadre avec un titre, les étapes, les bords que des liaisons peuvent traverser, le titre en haut, subgraph et end, les guillemets, l’exemple « Entrée », le groupe intérieur, et `appel --> entree`."]], "44": [["Axiome", "Axiome 2 — Il contient une ou plusieurs étapes.\nAxiome 5 — Il s’écrit entre subgraph et `end`."], ["Phrase", "Exclus : un groupe sans étape, ou un subgraph sans end."]], "45": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre.\nAxiome 2 — Il contient une ou plusieurs étapes.\nAxiome 3 — Des liaisons peuvent traverser ses bords.\nAxiome 4 — Son titre s’affiche en haut du cadre.\nAxiome 5 — Il s’écrit entre subgraph et `end`.\nAxiome 6 — Son titre se met entre guillemets, pour éviter les erreurs dues aux apostrophes et aux accents.\nAxiome 7 — Un groupe « Entrée » autour de A s’écrit `subgraph entree [\"Entrée\"]`, puis `A`, puis `end`.\nAxiome 8 — Pour un groupe dans un autre, j’écris le subgraph intérieur dans le groupe extérieur, entre son `subgraph` et son `end`.\nAxiome 9 — Relier deux groupes s’écrit `appel --> entree`."], ["Phrase", "Les axiomes s’accordent : les quatre premiers disent ce qu’il est (un cadre avec un titre en haut, des étapes, des bords que des liaisons peuvent traverser), les trois suivants comment l’écrire (subgraph et end, guillemets, l’exemple « Entrée »), et les deux derniers comment le combiner (groupe intérieur, `appel --> entree`)."]], "46": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans la carte, Sous-groupe fait partie de la famille « Organisation » et suppose de connaître Liaison."]], "47": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On le justifie par la taille du diagramme : au-delà d’une dizaine de points, regrouper aide à lire."]], "48": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La preuve qu’il est utile : on comprend le diagramme en lisant seulement les noms des groupes."]], "49": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre.\nAxiome 2 — Il contient une ou plusieurs étapes.\nAxiome 5 — Il s’écrit entre subgraph et `end`."], ["Phrase", "« X est un sous-groupe » est vrai si X est un cadre avec un titre, qui contient une ou plusieurs étapes, écrit entre subgraph et end."]], "50": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre.\nAxiome 5 — Il s’écrit entre subgraph et `end`.\nAxiome 6 — Son titre se met entre guillemets, pour éviter les erreurs dues aux apostrophes et aux accents."], ["Phrase", "Pour vérifier : chaque subgraph a son end, et le titre est entre guillemets."]], "51": [["Axiome", "Axiome 2 — Il contient une ou plusieurs étapes.\nAxiome 5 — Il s’écrit entre subgraph et `end`."], ["Phrase", "Un subgraph sans end, ou sans aucune étape, n’est pas un sous-groupe valide."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La notion est sûre : ses axiomes sont posés comme des définitions."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On fait une hypothèse en regroupant : on suppose que ces points vont vraiment ensemble."]], "54": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre."], ["Phrase", "On le reconnaît dans le dessin à son cadre."]], "55": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Derrière, c’est l’idée de regroupement en théorie des graphes : on parle de cluster."]], "56": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre."], ["Phrase", "Un sous-groupe n’est pas un point du processus : c’est un cadre."]], "57": [["Axiome", "Axiome 2 — Il contient une ou plusieurs étapes."], ["Phrase", "Il existe dès qu’il contient une étape."]], "58": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre.\nAxiome 2 — Il contient une ou plusieurs étapes.\nAxiome 3 — Des liaisons peuvent traverser ses bords.\nAxiome 4 — Son titre s’affiche en haut du cadre.\nAxiome 5 — Il s’écrit entre subgraph et `end`.\nAxiome 6 — Son titre se met entre guillemets, pour éviter les erreurs dues aux apostrophes et aux accents.\nAxiome 8 — Pour un groupe dans un autre, j’écris le subgraph intérieur dans le groupe extérieur, entre son `subgraph` et son `end`."], ["Phrase", "Ce qui en fait un sous-groupe, c’est la réunion des axiomes : un cadre avec un titre en haut, entre guillemets, qui contient une ou plusieurs étapes, voire un groupe intérieur, dont des liaisons peuvent traverser les bords, écrit entre subgraph et end."]], "59": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre."], ["Phrase", "Il appartient à la catégorie des cadres."]], "60": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre.\nAxiome 2 — Il contient une ou plusieurs étapes.\nAxiome 3 — Des liaisons peuvent traverser ses bords.\nAxiome 5 — Il s’écrit entre subgraph et `end`.\nAxiome 8 — Pour un groupe dans un autre, j’écris le subgraph intérieur dans le groupe extérieur, entre son `subgraph` et son `end`."], ["Phrase", "Nécessaire : un cadre avec un titre, au moins une étape, subgraph et end. Au choix : un groupe intérieur, des liaisons qui traversent ses bords."]], "61": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre."], ["Phrase", "Sa substance : un cadre."]], "62": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre.\nAxiome 3 — Des liaisons peuvent traverser ses bords."], ["Phrase", "Ses limites sont les bords de son cadre, que des liaisons peuvent traverser."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans ce projet, chaque grande phase de l’enregistreur aura son groupe : entrée, traitement, rangement."]], "64": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On en crée un dès qu’un diagramme dépasse une dizaine de points."]], "65": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "L’idée vient de Graphviz, où l’on parle de cluster."]], "66": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On nomme souvent les groupes par des noms de phase : entrée, traitement, sortie."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il relève de la mise en page des diagrammes."]], "68": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Des groupes bien nommés permettent à d’autres de comprendre l’organisation d’un coup d’œil."]], "69": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un groupe réunit souvent une phase : un moment du processus."]], "70": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre.\nAxiome 2 — Il contient une ou plusieurs étapes."], ["Phrase", "Son rôle : réunir une ou plusieurs étapes dans un cadre avec un titre."]], "71": [["Axiome", "Axiome 5 — Il s’écrit entre subgraph et `end`.\nAxiome 8 — Pour un groupe dans un autre, j’écris le subgraph intérieur dans le groupe extérieur, entre son `subgraph` et son `end`.\nAxiome 9 — Relier deux groupes s’écrit `appel --> entree`."], ["Phrase", "Il fournit des moyens d’organiser : subgraph et end, des groupes intérieurs, et des liens entre groupes, `appel --> entree`."]], "72": [["Axiome", "Axiome 9 — Relier deux groupes s’écrit `appel --> entree`."], ["Phrase", "Il permet de relier deux groupes d’un coup : `appel --> entree`."]], "73": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En pratique, il évite qu’un grand diagramme devienne illisible."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ici, il sert à découper la structure de l’enregistreur en grandes phases."]], "75": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il devient utile dès que le diagramme dépasse une dizaine de points."]], "76": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Créer un groupe, c’est affirmer que des points forment un tout."]], "77": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre.\nAxiome 2 — Il contient une ou plusieurs étapes.\nAxiome 5 — Il s’écrit entre subgraph et `end`.\nAxiome 6 — Son titre se met entre guillemets, pour éviter les erreurs dues aux apostrophes et aux accents.\nAxiome 7 — Un groupe « Entrée » autour de A s’écrit `subgraph entree [\"Entrée\"]`, puis `A`, puis `end`."], ["Phrase", "- Écrire `subgraph entree [\"Entrée\"]`, avec le titre entre guillemets.\n- Lister les étapes du groupe, par exemple `A`.\n- Fermer avec `end`."]], "78": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il change quand on déplace des points d’un groupe à l’autre."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Au fil du projet, de nouveaux groupes apparaissent quand le diagramme grandit."]], "80": [["Axiome", "Axiome 8 — Pour un groupe dans un autre, j’écris le subgraph intérieur dans le groupe extérieur, entre son `subgraph` et son `end`."], ["Phrase", "On peut transformer un groupe en groupe intérieur, en le plaçant dans un groupe extérieur."]], "81": [["Axiome", "Axiome 5 — Il s’écrit entre subgraph et `end`."], ["Phrase", "Il naît avec subgraph et se ferme avec end."]], "82": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre."], ["Phrase · hors axiomes", "Le programme dessine d’abord les points, puis trace le cadre autour d’eux."]], "83": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’adapte en le découpant ou en le fusionnant avec un autre."]], "84": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "D’une version à l’autre, les groupes se réorganisent avec le processus."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un bon groupe se juge à sa cohérence : tout ce qu’il contient va ensemble."]], "86": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre.\nAxiome 5 — Il s’écrit entre subgraph et `end`.\nAxiome 6 — Son titre se met entre guillemets, pour éviter les erreurs dues aux apostrophes et aux accents."], ["Phrase", "Norme d’écriture : subgraph et end, et le titre entre guillemets."]], "87": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Sa valeur tient à la clarté qu’il apporte à un grand diagramme."]], "88": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre."], ["Phrase · hors axiomes", "Critères : un titre court, des points qui vont ensemble, peu de liens qui sortent du groupe."]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un groupe de qualité se comprend par son seul nom."]], "90": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il est pertinent pour un grand diagramme ; pour cinq points, il alourdit."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’améliore en lui donnant un nom clair et en n’y laissant que ce qui va ensemble."]]}, "sp": {"1": [["Axiome", "Axiome 1 — Un sous-processus est une étape qui représente un processus entier.\nAxiome 2 — Son détail est dessiné dans un autre diagramme.\nAxiome 3 — Contrairement à un sous-groupe, on ne voit pas son contenu.\nAxiome 4 — Sa forme habituelle est le double rectangle."], ["Phrase", "Un sous-processus se compose d’une étape qui représente un processus entier, dont le détail est dessiné dans un autre diagramme ; contrairement à un sous-groupe, on ne voit pas son contenu ; sa forme habituelle est le double rectangle."]], "2": [["Axiome", "Axiome 1 — Un sous-processus est une étape qui représente un processus entier.\nAxiome 2 — Son détail est dessiné dans un autre diagramme.\nAxiome 3 — Contrairement à un sous-groupe, on ne voit pas son contenu.\nAxiome 4 — Sa forme habituelle est le double rectangle."], ["Phrase", "Ses éléments fondamentaux sont ceux que posent les axiomes : une étape, le processus entier qu’elle représente, un détail dessiné dans un autre diagramme, un contenu qu’on ne voit pas, et la forme d’un double rectangle."]], "3": [["Axiome", "Axiome 4 — Sa forme habituelle est le double rectangle.\nAxiome 5 — « Classer » comme sous-processus s’écrit `B[[Classer]]`."], ["Phrase", "On écrit l’identifiant, puis le texte entre doubles crochets, ce qui donne un double rectangle : `B[[Classer]]`."]], "4": [["Axiome", "Axiome 2 — Son détail est dessiné dans un autre diagramme."], ["Phrase", "Il se décompose ailleurs : son détail est dessiné dans un autre diagramme."]], "5": [["Axiome", "Axiome 1 — Un sous-processus est une étape qui représente un processus entier.\nNon couvert : les axiomes ne fixent pas le nombre d’étapes de l’autre diagramme."], ["Phrase", "Une seule étape pour un processus entier."]], "6": [["Axiome", "Axiome 1 — Un sous-processus est une étape qui représente un processus entier."], ["Phrase", "Sa nature : une étape qui représente un processus entier."]], "7": [["Axiome", "Axiome 1 — Un sous-processus est une étape qui représente un processus entier."], ["Phrase", "Un sous-processus, c’est une étape qui représente un processus entier."]], "8": [["Axiome", "Axiome 1 — Un sous-processus est une étape qui représente un processus entier.\nAxiome 2 — Son détail est dessiné dans un autre diagramme.\nAxiome 3 — Contrairement à un sous-groupe, on ne voit pas son contenu.\nAxiome 4 — Sa forme habituelle est le double rectangle."], ["Phrase", "Un sous-processus est une étape qui représente un processus entier ; son détail est dessiné dans un autre diagramme, et on ne voit pas son contenu ; sa forme habituelle est le double rectangle."]], "9": [["Axiome", "Axiome 1 — Un sous-processus est une étape qui représente un processus entier.\nAxiome 2 — Son détail est dessiné dans un autre diagramme.\nAxiome 3 — Contrairement à un sous-groupe, on ne voit pas son contenu."], ["Phrase", "Représenter un processus entier dans une étape, renvoyer son détail à un autre diagramme, ne pas montrer son contenu : ces propriétés le constituent."]], "10": [["Axiome", "Axiome 5 — « Classer » comme sous-processus s’écrit `B[[Classer]]`."], ["Phrase · hors axiomes", "Exemple des axiomes : « Classer », `B[[Classer]]` ; dans l’enregistreur, la transcription pourrait en être un autre."]], "11": [["Axiome", "Axiome 1 — Un sous-processus est une étape qui représente un processus entier."], ["Phrase · hors axiomes", "Les axiomes l’appellent sous-processus, une étape qui représente un processus entier ; en anglais, on parle de predefined process."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Processus » vient du latin processus, « progression » ; « sous- » marque qu’il fait partie d’un ensemble plus grand."]], "13": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le lecteur comprend qu’il y a plus à voir ailleurs, sans avoir à tout lire ici."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En informatique, « sous-programme » ou « fonction » désignent une idée proche ; ici, c’est une boîte du diagramme."]], "15": [["Axiome", "Axiome 1 — Un sous-processus est une étape qui représente un processus entier.\nAxiome 2 — Son détail est dessiné dans un autre diagramme."], ["Phrase", "Une étape ici, et son détail dans un autre diagramme."]], "16": [["Axiome", "Axiome 1 — Un sous-processus est une étape qui représente un processus entier.\nAxiome 2 — Son détail est dessiné dans un autre diagramme."], ["Phrase", "Il crée deux niveaux : l’étape qui représente le processus entier, et son détail dans un autre diagramme."]], "17": [["Axiome", "Axiome 2 — Son détail est dessiné dans un autre diagramme."], ["Phrase", "Dans l’ensemble, il découpe le système en plusieurs dessins : chaque détail est dessiné dans un autre diagramme."]], "18": [["Axiome", "Axiome 1 — Un sous-processus est une étape qui représente un processus entier."], ["Phrase", "Il se place dans le diagramme comme n’importe quelle étape."]], "19": [["Axiome", "Axiome 1 — Un sous-processus est une étape qui représente un processus entier."], ["Phrase", "Il se range parmi les étapes."]], "20": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On distingue ceux qui sont propres au projet et ceux qu’on réutilise d’un projet à l’autre."]], "21": [["Axiome", "Axiome 1 — Un sous-processus est une étape qui représente un processus entier.\nAxiome 2 — Son détail est dessiné dans un autre diagramme."], ["Phrase · hors axiomes", "Il en fait une unité autonome : une étape ici, son détail dans un autre diagramme."]], "22": [["Axiome", "Axiome 2 — Son détail est dessiné dans un autre diagramme."], ["Phrase", "Il renvoie à un autre diagramme, où son détail est dessiné."]], "23": [["Axiome", "Axiome 2 — Son détail est dessiné dans un autre diagramme.\nAxiome 3 — Contrairement à un sous-groupe, on ne voit pas son contenu."], ["Phrase", "Puisque son détail est dessiné dans un autre diagramme, on ne voit pas son contenu ici."]], "24": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Changer l’intérieur ne change pas le dessin principal, tant que l’entrée et la sortie restent les mêmes."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Plus un système est grand, plus on a besoin de le découper ainsi."]], "26": [["Axiome", "Axiome 1 — Un sous-processus est une étape qui représente un processus entier.\nAxiome 2 — Son détail est dessiné dans un autre diagramme."], ["Phrase", "L’étape résume ; l’autre diagramme montre le détail."]], "27": [["Axiome", "Axiome 3 — Contrairement à un sous-groupe, on ne voit pas son contenu."], ["Phrase · hors axiomes", "Dans la carte, Sous-processus dépend de Sous-groupe, et Structure générale du système dépend de lui."]], "28": [["Axiome", "Axiome 3 — Contrairement à un sous-groupe, on ne voit pas son contenu."], ["Phrase", "Il s’oppose au sous-groupe : on ne voit pas son contenu, alors qu’on voit celui d’un sous-groupe."]], "29": [["Axiome", "Axiome 1 — Un sous-processus est une étape qui représente un processus entier.\nAxiome 2 — Son détail est dessiné dans un autre diagramme."], ["Phrase · hors axiomes", "L’étape et le diagramme de détail se complètent : l’un dans le dessin principal, l’autre dans un autre diagramme."]], "30": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On en fait un si une partie devient trop longue pour tenir dans le dessin principal."]], "31": [["Axiome", "Axiome 3 — Contrairement à un sous-groupe, on ne voit pas son contenu."], ["Phrase · hors axiomes", "Comme un sous-groupe, il réunit plusieurs actions ; à sa différence, on ne voit pas son contenu."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Si l’entrée ou la sortie de l’intérieur change, le dessin principal doit suivre."]], "33": [["Axiome", "Axiome 1 — Un sous-processus est une étape qui représente un processus entier."], ["Phrase · hors axiomes", "Il dure autant que le processus entier qu’il représente."]], "34": [["Axiome", "Axiome 1 — Un sous-processus est une étape qui représente un processus entier."], ["Phrase", "Dans le dessin, il prend la place d’une seule étape."]], "35": [["Axiome", "Axiome 1 — Un sous-processus est une étape qui représente un processus entier.\nAxiome 2 — Son détail est dessiné dans un autre diagramme.\nAxiome 3 — Contrairement à un sous-groupe, on ne voit pas son contenu.\nAxiome 4 — Sa forme habituelle est le double rectangle.\nAxiome 5 — « Classer » comme sous-processus s’écrit `B[[Classer]]`."], ["Phrase", "Cinq propositions : c’est une étape qui représente un processus entier ; son détail est dessiné dans un autre diagramme ; contrairement à un sous-groupe, on ne voit pas son contenu ; sa forme habituelle est le double rectangle ; « Classer » s’écrit `B[[Classer]]`."]], "36": [["Axiome", "Axiome 1 — Un sous-processus est une étape qui représente un processus entier.\nAxiome 2 — Son détail est dessiné dans un autre diagramme.\nAxiome 3 — Contrairement à un sous-groupe, on ne voit pas son contenu.\nAxiome 4 — Sa forme habituelle est le double rectangle."], ["Phrase", "On dit d’un sous-processus qu’il est une étape qui représente un processus entier, que son détail est dessiné dans un autre diagramme, qu’on ne voit pas son contenu et qu’il a en général la forme d’un double rectangle."]], "37": [["Axiome", "Axiome 2 — Son détail est dessiné dans un autre diagramme.\nAxiome 4 — Sa forme habituelle est le double rectangle."], ["Phrase", "En voyant un double rectangle, on sait en général qu’un détail existe dans un autre diagramme."]], "38": [["Axiome", "Axiome 2 — Son détail est dessiné dans un autre diagramme.\nAxiome 3 — Contrairement à un sous-groupe, on ne voit pas son contenu."], ["Phrase", "Conséquence nécessaire : pour connaître son contenu, il faut ouvrir l’autre diagramme."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "À force d’en dessiner, on remarque que les mêmes morceaux reviennent d’un projet à l’autre."]], "40": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Si une boîte semble trop vague, l’explication la plus probable est qu’elle regroupe plusieurs actions qui mériteraient leur propre dessin."]], "41": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Argument habituel : découper un grand système le rend plus facile à comprendre."]], "42": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les axiomes ne se démontrent pas : on les admet. On montre qu’une boîte est un sous-processus en vérifiant qu’elle respecte chacun d’eux."]], "43": [["Axiome", "Axiome 1 — Un sous-processus est une étape qui représente un processus entier.\nAxiome 2 — Son détail est dessiné dans un autre diagramme.\nAxiome 3 — Contrairement à un sous-groupe, on ne voit pas son contenu.\nAxiome 4 — Sa forme habituelle est le double rectangle.\nAxiome 5 — « Classer » comme sous-processus s’écrit `B[[Classer]]`."], ["Phrase", "Cinq principes fondent la notion : l’étape qui représente un processus entier, le détail dans un autre diagramme, le contenu qu’on ne voit pas, le double rectangle, et l’exemple `B[[Classer]]`."]], "44": [["Axiome", "Axiome 2 — Son détail est dessiné dans un autre diagramme.\nAxiome 3 — Contrairement à un sous-groupe, on ne voit pas son contenu."], ["Phrase", "Exclus : un sous-processus dont on verrait le contenu ici ; son détail est dessiné dans un autre diagramme."]], "45": [["Axiome", "Axiome 1 — Un sous-processus est une étape qui représente un processus entier.\nAxiome 2 — Son détail est dessiné dans un autre diagramme.\nAxiome 3 — Contrairement à un sous-groupe, on ne voit pas son contenu.\nAxiome 4 — Sa forme habituelle est le double rectangle.\nAxiome 5 — « Classer » comme sous-processus s’écrit `B[[Classer]]`."], ["Phrase", "Les axiomes s’accordent : les trois premiers disent ce qu’il est (une étape qui représente un processus entier, avec un détail dans un autre diagramme et un contenu qu’on ne voit pas), le quatrième sa forme (le double rectangle), le dernier un exemple (`B[[Classer]]`)."]], "46": [["Axiome", "Axiome 3 — Contrairement à un sous-groupe, on ne voit pas son contenu."], ["Phrase · hors axiomes", "Dans la carte, Sous-processus fait partie de la famille « Organisation » et suppose de connaître Sous-groupe."]], "47": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On le justifie par la taille du système : tout dessiner sur une seule page deviendrait illisible."]], "48": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La preuve qu’il est bien choisi : le dessin principal se comprend sans ouvrir le reste."]], "49": [["Axiome", "Axiome 1 — Un sous-processus est une étape qui représente un processus entier.\nAxiome 2 — Son détail est dessiné dans un autre diagramme."], ["Phrase", "« X est un sous-processus » est vrai si X est une étape qui représente un processus entier, dont le détail est dessiné dans un autre diagramme."]], "50": [["Axiome", "Axiome 2 — Son détail est dessiné dans un autre diagramme."], ["Phrase", "Pour vérifier : son détail existe-t-il bien dans un autre diagramme ?"]], "51": [["Axiome", "Axiome 2 — Son détail est dessiné dans un autre diagramme."], ["Phrase · hors axiomes", "Un sous-processus sans autre diagramme pour son détail n’est qu’une boîte ordinaire."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La notion est sûre : ses axiomes sont posés comme des définitions."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On fait une hypothèse en découpant : on suppose que la partie mise à part peut se comprendre seule."]], "54": [["Axiome", "Axiome 4 — Sa forme habituelle est le double rectangle."], ["Phrase", "On le reconnaît dans le dessin à sa forme de double rectangle."]], "55": [["Axiome", "Axiome 2 — Son détail est dessiné dans un autre diagramme."], ["Phrase · hors axiomes", "Derrière, c’est le principe de l’abstraction : mettre le détail de côté pour voir l’ensemble."]], "56": [["Axiome", "Axiome 1 — Un sous-processus est une étape qui représente un processus entier."], ["Phrase", "Un sous-processus n’est pas un processus à part dans le dessin : c’est une étape qui représente un processus entier."]], "57": [["Axiome", "Axiome 2 — Son détail est dessiné dans un autre diagramme."], ["Phrase", "Il existe pleinement quand son détail est dessiné dans un autre diagramme."]], "58": [["Axiome", "Axiome 1 — Un sous-processus est une étape qui représente un processus entier.\nAxiome 2 — Son détail est dessiné dans un autre diagramme.\nAxiome 3 — Contrairement à un sous-groupe, on ne voit pas son contenu.\nAxiome 4 — Sa forme habituelle est le double rectangle."], ["Phrase", "Ce qui en fait un sous-processus, c’est la réunion des axiomes : une étape qui représente un processus entier, avec un détail dans un autre diagramme, un contenu qu’on ne voit pas, et en général la forme d’un double rectangle."]], "59": [["Axiome", "Axiome 1 — Un sous-processus est une étape qui représente un processus entier."], ["Phrase", "Il appartient à la catégorie des étapes."]], "60": [["Axiome", "Axiome 1 — Un sous-processus est une étape qui représente un processus entier.\nAxiome 2 — Son détail est dessiné dans un autre diagramme.\nAxiome 3 — Contrairement à un sous-groupe, on ne voit pas son contenu.\nAxiome 4 — Sa forme habituelle est le double rectangle."], ["Phrase", "Nécessaire : une étape qui représente un processus entier, avec un détail dans un autre diagramme et un contenu qu’on ne voit pas. Habituel, mais pas obligatoire : le double rectangle."]], "61": [["Axiome", "Axiome 1 — Un sous-processus est une étape qui représente un processus entier."], ["Phrase", "Sa substance : un processus entier, résumé en une étape."]], "62": [["Axiome", "Axiome 3 — Contrairement à un sous-groupe, on ne voit pas son contenu."], ["Phrase", "Il s’arrête au bord de la boîte : on ne voit pas son contenu."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans ce projet, « Classer » pourrait en être un : sa logique serait dessinée à part."]], "64": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On en crée un dès qu’une partie du système mérite son propre dessin."]], "65": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "L’idée vient des sous-programmes des premiers langages informatiques."]], "66": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En programmation, on parle de fonction ou de procédure."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il relève de l’informatique et de la conception de systèmes."]], "68": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il permet de répartir le travail : chacun peut dessiner une partie."]], "69": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il condense dans le dessin principal ce qui prend du temps ailleurs."]], "70": [["Axiome", "Axiome 1 — Un sous-processus est une étape qui représente un processus entier."], ["Phrase", "Son rôle : représenter un processus entier dans une seule étape."]], "71": [["Axiome", "Axiome 4 — Sa forme habituelle est le double rectangle.\nAxiome 5 — « Classer » comme sous-processus s’écrit `B[[Classer]]`."], ["Phrase", "Il fournit une forme reconnaissable, le double rectangle : `B[[Classer]]`."]], "72": [["Axiome", "Axiome 2 — Son détail est dessiné dans un autre diagramme."], ["Phrase", "Il permet de renvoyer le détail à un autre diagramme."]], "73": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En pratique, il garde le dessin principal court et lisible."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ici, il sert à garder la structure générale de l’enregistreur sur une seule page."]], "75": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il devient utile dès qu’une partie compte plus de quelques actions."]], "76": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Créer un sous-processus, c’est décider qu’une partie mérite son propre dessin."]], "77": [["Axiome", "Axiome 1 — Un sous-processus est une étape qui représente un processus entier.\nAxiome 2 — Son détail est dessiné dans un autre diagramme.\nAxiome 4 — Sa forme habituelle est le double rectangle.\nAxiome 5 — « Classer » comme sous-processus s’écrit `B[[Classer]]`."], ["Phrase", "- Écrire l’étape en double rectangle : `B[[Classer]]`.\n- Dessiner son détail dans un autre diagramme."]], "78": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il change quand on modifie ce qu’il représente."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Au fil du projet, une partie qui grandit trop finit souvent par en devenir un."]], "80": [["Axiome", "Axiome 3 — Contrairement à un sous-groupe, on ne voit pas son contenu."], ["Phrase · hors axiomes", "Un sous-groupe peut devenir un sous-processus quand on décide de ne plus montrer son contenu."]], "81": [["Axiome", "Axiome 2 — Son détail est dessiné dans un autre diagramme."], ["Phrase", "Il naît quand on dessine son détail dans un autre diagramme."]], "82": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le processus principal passe la main, puis reprend à la sortie."]], "83": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’adapte au besoin : plus ou moins de choses mises à part."]], "84": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "D’une version à l’autre, son intérieur peut changer sans toucher au dessin principal."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un bon sous-processus se juge à son nom : il dit tout ce qu’il fait en peu de mots."]], "86": [["Axiome", "Axiome 4 — Sa forme habituelle est le double rectangle."], ["Phrase · hors axiomes", "Norme habituelle : le double rectangle, comme dans la norme ISO 5807."]], "87": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Sa valeur tient à la simplicité qu’il apporte au dessin principal."]], "88": [["Axiome", "Axiome 2 — Son détail est dessiné dans un autre diagramme.\nAxiome 4 — Sa forme habituelle est le double rectangle."], ["Phrase · hors axiomes", "Critères : un détail dans un autre diagramme, la forme d’un double rectangle ; en plus, un nom qui résume bien."]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un sous-processus de qualité se comprend sans l’ouvrir."]], "90": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il est pertinent pour une partie longue ou réutilisée ; pour deux actions, il alourdit."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’améliore en lui donnant un nom précis et en gardant son intérieur cohérent."]]}, "com": {"1": [["Axiome", "Axiome 1 — Un commentaire est une ligne écrite dans le code Mermaid.\nAxiome 2 — Le dessin l’ignore.\nAxiome 3 — Il s’adresse à celui qui lit le code, pas au schéma.\nAxiome 4 — Une ligne de commentaire commence par `%%`."], ["Phrase", "Un commentaire se compose d’une ligne écrite dans le code Mermaid, qui commence par `%%` ; le dessin l’ignore ; il s’adresse à celui qui lit le code, pas au schéma."]], "2": [["Axiome", "Axiome 1 — Un commentaire est une ligne écrite dans le code Mermaid.\nAxiome 2 — Le dessin l’ignore.\nAxiome 3 — Il s’adresse à celui qui lit le code, pas au schéma.\nAxiome 4 — Une ligne de commentaire commence par `%%`."], ["Phrase", "Ses éléments fondamentaux sont ceux que posent les axiomes : une ligne écrite dans le code Mermaid, le signe `%%` au début, un dessin qui l’ignore, et un destinataire : celui qui lit le code."]], "3": [["Axiome", "Axiome 4 — Une ligne de commentaire commence par `%%`."], ["Phrase", "On écrit `%%`, puis le texte du commentaire."]], "4": [["Axiome", "Axiome 4 — Une ligne de commentaire commence par `%%`."], ["Phrase", "Il se décompose en deux parties : le signe `%%`, puis le texte."]], "5": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le nombre de commentaires n’est pas fixé ; un par partie importante suffit souvent."]], "6": [["Axiome", "Axiome 1 — Un commentaire est une ligne écrite dans le code Mermaid."], ["Phrase", "Sa nature : une ligne écrite dans le code Mermaid."]], "7": [["Axiome", "Axiome 1 — Un commentaire est une ligne écrite dans le code Mermaid.\nAxiome 3 — Il s’adresse à celui qui lit le code, pas au schéma."], ["Phrase", "Un commentaire, c’est une ligne écrite dans le code Mermaid, pour celui qui lit le code."]], "8": [["Axiome", "Axiome 1 — Un commentaire est une ligne écrite dans le code Mermaid.\nAxiome 2 — Le dessin l’ignore.\nAxiome 3 — Il s’adresse à celui qui lit le code, pas au schéma.\nAxiome 4 — Une ligne de commentaire commence par `%%`."], ["Phrase", "Un commentaire est une ligne écrite dans le code Mermaid, qui commence par `%%` ; le dessin l’ignore ; il s’adresse à celui qui lit le code, pas au schéma."]], "9": [["Axiome", "Axiome 1 — Un commentaire est une ligne écrite dans le code Mermaid.\nAxiome 2 — Le dessin l’ignore.\nAxiome 3 — Il s’adresse à celui qui lit le code, pas au schéma."], ["Phrase", "Être une ligne écrite dans le code Mermaid, être ignoré par le dessin, s’adresser à celui qui lit le code : ces propriétés le constituent."]], "10": [["Axiome", "Axiome 4 — Une ligne de commentaire commence par `%%`.\nAxiome 5 — Désactiver la ligne A --> C sans l’effacer s’écrit `%% A --> C`."], ["Phrase · hors axiomes", "Il sert pour une note comme pour désactiver une ligne : `%% A --> C`."]], "11": [["Axiome", "Axiome 1 — Un commentaire est une ligne écrite dans le code Mermaid.\nAxiome 4 — Une ligne de commentaire commence par `%%`."], ["Phrase · hors axiomes", "Les axiomes l’appellent commentaire : une ligne écrite dans le code Mermaid, qui commence par `%%` ; en anglais, comment."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le mot vient du latin commentarius, « notes, mémoire »."]], "13": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le lecteur y trouve l’intention de l’auteur : pourquoi telle partie est écrite ainsi."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Commentaire » veut aussi dire un avis donné sur quelque chose ; ici, c’est une note laissée pour plus tard."]], "15": [["Axiome", "Axiome 4 — Une ligne de commentaire commence par `%%`."], ["Phrase", "Une ligne qui commence par `%%`, suivie du texte."]], "16": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il n’a pas de rang dans le diagramme : il est à côté, pas dedans."]], "17": [["Axiome", "Axiome 1 — Un commentaire est une ligne écrite dans le code Mermaid.\nAxiome 2 — Le dessin l’ignore."], ["Phrase", "Il forme une couche à part : écrit dans le code, ignoré par le dessin."]], "18": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On le place souvent juste au-dessus de la partie qu’il explique."]], "19": [["Axiome", "Axiome 1 — Un commentaire est une ligne écrite dans le code Mermaid."], ["Phrase", "Il se range parmi les lignes écrites dans le code Mermaid."]], "20": [["Axiome", "Axiome 3 — Il s’adresse à celui qui lit le code, pas au schéma.\nAxiome 4 — Une ligne de commentaire commence par `%%`.\nAxiome 5 — Désactiver la ligne A --> C sans l’effacer s’écrit `%% A --> C`."], ["Phrase", "Deux usages : une note pour celui qui lit le code, ou une ligne désactivée, comme `%% A --> C`."]], "21": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Des notes en tête de chaque partie aident à découper un long texte en sections."]], "22": [["Axiome", "Axiome 3 — Il s’adresse à celui qui lit le code, pas au schéma."], ["Phrase", "Il relie le texte à celui qui le lit, pas au schéma."]], "23": [["Axiome", "Axiome 2 — Le dessin l’ignore.\nAxiome 3 — Il s’adresse à celui qui lit le code, pas au schéma."], ["Phrase", "Puisque le dessin l’ignore, il ne s’adresse qu’à celui qui lit le code."]], "24": [["Axiome", "Axiome 2 — Le dessin l’ignore."], ["Phrase", "Ajouter un commentaire ne change rien au dessin : le dessin l’ignore."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Plus un diagramme est long, plus les notes aident à s’y retrouver."]], "26": [["Axiome", "Axiome 3 — Il s’adresse à celui qui lit le code, pas au schéma."], ["Phrase", "Son rôle dans le texte : s’adresser à celui qui lit le code."]], "27": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans la carte, Commentaire dépend de Liaison, et aucune notion ne dépend de lui."]], "28": [["Axiome", "Axiome 3 — Il s’adresse à celui qui lit le code, pas au schéma."], ["Phrase", "Il se distingue du reste du texte : il s’adresse à celui qui lit le code, pas au schéma."]], "29": [["Axiome", "Axiome 2 — Le dessin l’ignore."], ["Phrase", "Le reste du texte fait le dessin ; le commentaire, ignoré par le dessin, l’explique."]], "30": [["Axiome", "Axiome 4 — Une ligne de commentaire commence par `%%`."], ["Phrase", "Si une ligne commence par `%%`, c’est un commentaire."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Comme une note au crayon dans la marge d’un livre, il explique sans faire partie du texte."]], "32": [["Axiome", "Axiome 2 — Le dessin l’ignore."], ["Phrase", "Il n’agit sur rien : le dessin l’ignore."]], "33": [["Axiome", "Axiome 4 — Une ligne de commentaire commence par `%%`.\nAxiome 5 — Désactiver la ligne A --> C sans l’effacer s’écrit `%% A --> C`."], ["Phrase · hors axiomes", "On peut mettre une ligne de côté un moment, puis la remettre en service : `%% A --> C`."]], "34": [["Axiome", "Axiome 2 — Le dessin l’ignore."], ["Phrase", "Il n’occupe aucune place dans le schéma : le dessin l’ignore."]], "35": [["Axiome", "Axiome 1 — Un commentaire est une ligne écrite dans le code Mermaid.\nAxiome 2 — Le dessin l’ignore.\nAxiome 3 — Il s’adresse à celui qui lit le code, pas au schéma.\nAxiome 4 — Une ligne de commentaire commence par `%%`.\nAxiome 5 — Désactiver la ligne A --> C sans l’effacer s’écrit `%% A --> C`."], ["Phrase", "Cinq propositions : c’est une ligne écrite dans le code Mermaid ; le dessin l’ignore ; il s’adresse à celui qui lit le code, pas au schéma ; il commence par `%%` ; désactiver une ligne s’écrit `%% A --> C`."]], "36": [["Axiome", "Axiome 1 — Un commentaire est une ligne écrite dans le code Mermaid.\nAxiome 2 — Le dessin l’ignore.\nAxiome 3 — Il s’adresse à celui qui lit le code, pas au schéma.\nAxiome 4 — Une ligne de commentaire commence par `%%`."], ["Phrase", "On dit d’un commentaire qu’il est une ligne écrite dans le code Mermaid, qui commence par `%%`, que le dessin l’ignore et qu’il s’adresse à celui qui lit le code."]], "37": [["Axiome", "Axiome 2 — Le dessin l’ignore.\nAxiome 4 — Une ligne de commentaire commence par `%%`."], ["Phrase", "En voyant `%%` en début de ligne, on sait que le dessin ignore cette ligne."]], "38": [["Axiome", "Axiome 2 — Le dessin l’ignore.\nAxiome 4 — Une ligne de commentaire commence par `%%`.\nAxiome 5 — Désactiver la ligne A --> C sans l’effacer s’écrit `%% A --> C`."], ["Phrase", "Conséquence nécessaire : `%% A --> C` ne dessine pas la flèche, puisque le dessin ignore le commentaire."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "À force d’en écrire, on remarque que les notes courtes sont les plus relues."]], "40": [["Axiome", "Axiome 4 — Une ligne de commentaire commence par `%%`."], ["Phrase · hors axiomes", "Si une flèche a disparu du dessin, l’explication la plus probable est une ligne qui commence par `%%` par erreur."]], "41": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Argument habituel : quelques notes font gagner beaucoup de temps à la relecture."]], "42": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les axiomes ne se démontrent pas : on les admet. On montre qu’une ligne est un commentaire en vérifiant qu’elle respecte chacun d’eux."]], "43": [["Axiome", "Axiome 1 — Un commentaire est une ligne écrite dans le code Mermaid.\nAxiome 2 — Le dessin l’ignore.\nAxiome 3 — Il s’adresse à celui qui lit le code, pas au schéma.\nAxiome 4 — Une ligne de commentaire commence par `%%`.\nAxiome 5 — Désactiver la ligne A --> C sans l’effacer s’écrit `%% A --> C`."], ["Phrase", "Cinq principes fondent la notion : la ligne écrite dans le code Mermaid, le dessin qui l’ignore, le destinataire (il s’adresse à celui qui lit le code), le signe `%%`, et `%% A --> C` pour désactiver une ligne."]], "44": [["Axiome", "Axiome 2 — Le dessin l’ignore."], ["Phrase", "Exclus : un commentaire qui changerait le dessin, puisque le dessin l’ignore."]], "45": [["Axiome", "Axiome 1 — Un commentaire est une ligne écrite dans le code Mermaid.\nAxiome 2 — Le dessin l’ignore.\nAxiome 3 — Il s’adresse à celui qui lit le code, pas au schéma.\nAxiome 4 — Une ligne de commentaire commence par `%%`.\nAxiome 5 — Désactiver la ligne A --> C sans l’effacer s’écrit `%% A --> C`."], ["Phrase", "Les axiomes s’accordent : les trois premiers disent ce qu’il est (une ligne écrite dans le code Mermaid, ignorée par le dessin, qui s’adresse à celui qui lit le code), les deux derniers comment l’écrire (`%%`, et `%% A --> C` pour désactiver une ligne)."]], "46": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans la carte, Commentaire fait partie de la famille « Présentation » et suppose de connaître Liaison."]], "47": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On le justifie par la relecture : on oublie vite pourquoi on a écrit une ligne."]], "48": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La preuve qu’il est utile : on comprend une partie du texte sans demander à son auteur."]], "49": [["Axiome", "Axiome 2 — Le dessin l’ignore.\nAxiome 4 — Une ligne de commentaire commence par `%%`."], ["Phrase", "Une ligne est un commentaire si elle commence par `%%` : le dessin l’ignore alors."]], "50": [["Axiome", "Axiome 2 — Le dessin l’ignore."], ["Phrase", "Pour vérifier : le dessin ne change pas quand on l’ajoute, puisque le dessin l’ignore."]], "51": [["Axiome", "Axiome 2 — Le dessin l’ignore."], ["Phrase", "Si une ligne changeait le dessin, ce ne serait pas un commentaire, puisque le dessin l’ignore."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La notion est sûre : ses axiomes sont posés comme des définitions."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On fait une hypothèse en écrivant une note : on suppose qu’elle aidera plus tard."]], "54": [["Axiome", "Axiome 2 — Le dessin l’ignore."], ["Phrase", "On l’observe directement : le dessin l’ignore, rien n’apparaît."]], "55": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Derrière, c’est une règle de presque tous les langages : séparer les notes pour les humains des instructions pour la machine."]], "56": [["Axiome", "Axiome 1 — Un commentaire est une ligne écrite dans le code Mermaid."], ["Phrase", "Un commentaire n’est pas une partie du diagramme : c’est une ligne écrite dans le code Mermaid."]], "57": [["Axiome", "Axiome 4 — Une ligne de commentaire commence par `%%`."], ["Phrase", "Il existe dès qu’on écrit une ligne qui commence par `%%`."]], "58": [["Axiome", "Axiome 1 — Un commentaire est une ligne écrite dans le code Mermaid.\nAxiome 2 — Le dessin l’ignore.\nAxiome 3 — Il s’adresse à celui qui lit le code, pas au schéma.\nAxiome 4 — Une ligne de commentaire commence par `%%`."], ["Phrase", "Ce qui en fait un commentaire, c’est la réunion des axiomes : une ligne écrite dans le code Mermaid, qui commence par `%%`, que le dessin ignore, et qui s’adresse à celui qui lit le code."]], "59": [["Axiome", "Axiome 1 — Un commentaire est une ligne écrite dans le code Mermaid."], ["Phrase", "Il appartient à la catégorie des lignes écrites dans le code Mermaid."]], "60": [["Axiome", "Axiome 1 — Un commentaire est une ligne écrite dans le code Mermaid.\nAxiome 2 — Le dessin l’ignore.\nAxiome 3 — Il s’adresse à celui qui lit le code, pas au schéma.\nAxiome 4 — Une ligne de commentaire commence par `%%`."], ["Phrase", "Nécessaire : une ligne écrite dans le code Mermaid, qui commence par `%%`, ignorée par le dessin, pour celui qui lit le code. Au choix : son texte et sa longueur."]], "61": [["Axiome", "Axiome 1 — Un commentaire est une ligne écrite dans le code Mermaid."], ["Phrase", "Sa substance : une ligne écrite dans le code Mermaid."]], "62": [["Axiome", "Axiome 2 — Le dessin l’ignore."], ["Phrase", "Il s’arrête au texte : le dessin l’ignore."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans ce projet, il peut expliquer chaque partie de la structure de l’enregistreur."]], "64": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On en écrit un quand une partie n’est pas évidente à relire."]], "65": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les notes dans les programmes existent depuis les premiers langages."]], "66": [["Axiome", "Axiome 4 — Une ligne de commentaire commence par `%%`."], ["Phrase · hors axiomes", "Chaque langage a son signe : # en Python, // en JavaScript, %% en Mermaid."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il relève des bonnes pratiques de programmation."]], "68": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il permet de transmettre ses intentions à ceux qui reprendront le travail."]], "69": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une note garde la trace d’une décision prise à un moment donné."]], "70": [["Axiome", "Axiome 3 — Il s’adresse à celui qui lit le code, pas au schéma."], ["Phrase", "Son rôle : s’adresser à celui qui lit le code."]], "71": [["Axiome", "Axiome 4 — Une ligne de commentaire commence par `%%`.\nAxiome 5 — Désactiver la ligne A --> C sans l’effacer s’écrit `%% A --> C`."], ["Phrase", "Il fournit un moyen de mettre une ligne de côté sans l’effacer : `%% A --> C`."]], "72": [["Axiome", "Axiome 3 — Il s’adresse à celui qui lit le code, pas au schéma.\nAxiome 4 — Une ligne de commentaire commence par `%%`.\nAxiome 5 — Désactiver la ligne A --> C sans l’effacer s’écrit `%% A --> C`."], ["Phrase", "Il permet d’expliquer à celui qui lit le code, et de désactiver une ligne : `%% A --> C`."]], "73": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En pratique, il évite de perdre le fil en relisant un long texte."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ici, il sert à noter pourquoi chaque partie de l’enregistreur est dessinée ainsi."]], "75": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il devient utile dès que le texte dépasse quelques lignes."]], "76": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Écrire une note, c’est laisser un message à son futur lecteur."]], "77": [["Axiome", "Axiome 4 — Une ligne de commentaire commence par `%%`.\nAxiome 5 — Désactiver la ligne A --> C sans l’effacer s’écrit `%% A --> C`."], ["Phrase", "- Commencer la ligne par `%%`.\n- Écrire la note à la suite.\n- Pour désactiver une ligne sans l’effacer, ajouter `%%` devant : `%% A --> C`."]], "78": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il change quand la partie qu’il explique change."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Au fil du projet, une note périmée peut induire en erreur : il faut la tenir à jour."]], "80": [["Axiome", "Axiome 4 — Une ligne de commentaire commence par `%%`.\nAxiome 5 — Désactiver la ligne A --> C sans l’effacer s’écrit `%% A --> C`."], ["Phrase", "On peut désactiver une ligne en ajoutant `%%` devant, et la remettre en service en le retirant."]], "81": [["Axiome", "Axiome 4 — Une ligne de commentaire commence par `%%`."], ["Phrase", "Il naît avec le signe `%%` en début de ligne."]], "82": [["Axiome", "Axiome 2 — Le dessin l’ignore."], ["Phrase", "Le programme lit chaque ligne et passe celles-là : le dessin les ignore."]], "83": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’adapte à son lecteur : plus de détail pour un débutant, moins pour soi."]], "84": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "D’une version à l’autre, les notes gardent la trace des changements."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un bon commentaire se juge à son utilité : il dit pourquoi, pas ce que le texte dit déjà."]], "86": [["Axiome", "Axiome 4 — Une ligne de commentaire commence par `%%`."], ["Phrase", "Norme : la ligne commence par `%%`."]], "87": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Sa valeur tient à la mémoire qu’il garde : les raisons d’un choix."]], "88": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Critères : court, juste, à jour, placé près de ce qu’il explique."]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un commentaire de qualité se lit en une seconde."]], "90": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il est pertinent si la ligne n’est pas évidente ; sinon, il encombre."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’améliore en le raccourcissant et en retirant ceux qui ne servent plus."]]}, "sty": {"1": [["Axiome", "Axiome 1 — Un style est un ensemble de réglages visuels (couleur, bordure).\nAxiome 2 — Il porte un nom.\nAxiome 3 — Il s’applique à une ou plusieurs étapes.\nAxiome 4 — Il ne change pas, dans le diagramme, la logique."], ["Phrase", "Un style se compose de réglages visuels, comme la couleur et la bordure, réunis sous un nom ; il s’applique à une ou plusieurs étapes, sans changer la logique du diagramme."]], "2": [["Axiome", "Axiome 1 — Un style est un ensemble de réglages visuels (couleur, bordure).\nAxiome 2 — Il porte un nom.\nAxiome 3 — Il s’applique à une ou plusieurs étapes.\nAxiome 4 — Il ne change pas, dans le diagramme, la logique."], ["Phrase", "Ses éléments fondamentaux sont ceux que posent les axiomes : des réglages visuels (couleur, bordure), un nom, une ou plusieurs étapes auxquelles il s’applique, et une logique qu’il ne change pas."]], "3": [["Axiome", "Axiome 2 — Il porte un nom.\nAxiome 5 — Une classe important jaune se définit `classDef important fill:#fff3cd,stroke:#e0a800`."], ["Phrase", "On définit la classe avec classDef, son nom, puis ses réglages : `classDef important fill:#fff3cd,stroke:#e0a800`."]], "4": [["Axiome", "Axiome 1 — Un style est un ensemble de réglages visuels (couleur, bordure)."], ["Phrase", "Il se décompose en réglages visuels : une couleur de fond, une couleur de bordure."]], "5": [["Axiome", "Axiome 3 — Il s’applique à une ou plusieurs étapes.\nNon couvert : les axiomes ne fixent pas le nombre de réglages d’un style."], ["Phrase", "Il s’applique à une ou plusieurs étapes."]], "6": [["Axiome", "Axiome 1 — Un style est un ensemble de réglages visuels (couleur, bordure).\nAxiome 4 — Il ne change pas, dans le diagramme, la logique."], ["Phrase", "Sa nature : des réglages visuels, qui ne changent pas la logique."]], "7": [["Axiome", "Axiome 1 — Un style est un ensemble de réglages visuels (couleur, bordure).\nAxiome 2 — Il porte un nom."], ["Phrase", "Un style, c’est un ensemble de réglages visuels qui porte un nom."]], "8": [["Axiome", "Axiome 1 — Un style est un ensemble de réglages visuels (couleur, bordure).\nAxiome 2 — Il porte un nom.\nAxiome 3 — Il s’applique à une ou plusieurs étapes.\nAxiome 4 — Il ne change pas, dans le diagramme, la logique."], ["Phrase", "Un style est un ensemble de réglages visuels (couleur, bordure) qui porte un nom ; il s’applique à une ou plusieurs étapes et ne change pas la logique du diagramme."]], "9": [["Axiome", "Axiome 1 — Un style est un ensemble de réglages visuels (couleur, bordure).\nAxiome 2 — Il porte un nom.\nAxiome 3 — Il s’applique à une ou plusieurs étapes.\nAxiome 4 — Il ne change pas, dans le diagramme, la logique."], ["Phrase", "Être des réglages visuels, porter un nom, s’appliquer à une ou plusieurs étapes, ne pas changer la logique : ces propriétés le constituent."]], "10": [["Axiome", "Axiome 3 — Il s’applique à une ou plusieurs étapes.\nAxiome 5 — Une classe important jaune se définit `classDef important fill:#fff3cd,stroke:#e0a800`.\nAxiome 8 — Colorer le sous-groupe appel, titre lisible, s’écrit `style appel fill:#e8f1ff,stroke:#3b82f6,color:#000`.\nAxiome 10 — Colorer une seule étape, sans classe, s’écrit `style A fill:#couleur`."], ["Phrase", "Il s’applique aux étapes par une classe (`classDef important …`), et aussi directement à un sous-groupe (`style appel …`) ou à une seule étape (`style A fill:#couleur`)."]], "11": [["Axiome", "Axiome 2 — Il porte un nom.\nAxiome 5 — Une classe important jaune se définit `classDef important fill:#fff3cd,stroke:#e0a800`."], ["Phrase · hors axiomes", "Les axiomes l’appellent style ; dans le code, une classe se définit avec classDef et porte un nom ; en CSS, on parle aussi de classe."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le mot vient du latin stilus, le poinçon pour écrire, puis la manière d’écrire."]], "13": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le lecteur comprend qu’une même apparence marque une même catégorie."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Classe » veut aussi dire un groupe d’élèves ; ici, c’est une apparence réutilisable."]], "15": [["Axiome", "Axiome 2 — Il porte un nom.\nAxiome 5 — Une classe important jaune se définit `classDef important fill:#fff3cd,stroke:#e0a800`."], ["Phrase", "Une définition : classDef, un nom, puis les réglages."]], "16": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les styles n’ont pas de rang entre eux ; chacun habille ce qu’on lui confie."]], "17": [["Axiome", "Axiome 4 — Il ne change pas, dans le diagramme, la logique."], ["Phrase", "Il forme une couche à part, visuelle, qui ne change pas la logique du diagramme."]], "18": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On regroupe souvent les définitions en bas du texte, pour ne pas mêler apparence et contenu."]], "19": [["Axiome", "Axiome 1 — Un style est un ensemble de réglages visuels (couleur, bordure)."], ["Phrase", "Il se range parmi les réglages visuels."]], "20": [["Axiome", "Axiome 3 — Il s’applique à une ou plusieurs étapes.\nAxiome 5 — Une classe important jaune se définit `classDef important fill:#fff3cd,stroke:#e0a800`.\nAxiome 8 — Colorer le sous-groupe appel, titre lisible, s’écrit `style appel fill:#e8f1ff,stroke:#3b82f6,color:#000`.\nAxiome 10 — Colorer une seule étape, sans classe, s’écrit `style A fill:#couleur`."], ["Phrase", "Trois façons de faire : une classe (`classDef`), un style de sous-groupe (`style appel …`), un style direct sur une étape (`style A fill:#couleur`)."]], "21": [["Axiome", "Axiome 2 — Il porte un nom.\nAxiome 5 — Une classe important jaune se définit `classDef important fill:#fff3cd,stroke:#e0a800`."], ["Phrase · hors axiomes", "Une classe nommée se réutilise partout : on la définit une fois avec classDef."]], "22": [["Axiome", "Axiome 3 — Il s’applique à une ou plusieurs étapes."], ["Phrase", "Il relie une apparence à une ou plusieurs étapes."]], "23": [["Axiome", "Axiome 4 — Il ne change pas, dans le diagramme, la logique."], ["Phrase", "Puisqu’il ne change pas la logique, on peut l’ajouter ou le retirer sans risque pour le déroulement."]], "24": [["Axiome", "Axiome 4 — Il ne change pas, dans le diagramme, la logique."], ["Phrase", "Changer un style change l’apparence, jamais la logique."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Plus un diagramme a de catégories, plus des apparences distinctes aident à les repérer."]], "26": [["Axiome", "Axiome 2 — Il porte un nom.\nAxiome 3 — Il s’applique à une ou plusieurs étapes."], ["Phrase", "Le nom sert à l’appeler ; les étapes reçoivent ce style."]], "27": [["Axiome", "Axiome 3 — Il s’applique à une ou plusieurs étapes.\nAxiome 8 — Colorer le sous-groupe appel, titre lisible, s’écrit `style appel fill:#e8f1ff,stroke:#3b82f6,color:#000`."], ["Phrase · hors axiomes", "Il dépend des étapes et des sous-groupes qu’il habille. Dans la carte, il dépend d’Étape et de Sous-groupe ; aucune notion ne dépend de lui."]], "28": [["Axiome", "Axiome 4 — Il ne change pas, dans le diagramme, la logique."], ["Phrase", "Il s’oppose à la logique : il change l’apparence, pas la logique."]], "29": [["Axiome", "Axiome 4 — Il ne change pas, dans le diagramme, la logique."], ["Phrase", "Apparence et logique se complètent : le style ne change pas la logique, il la rend plus lisible."]], "30": [["Axiome", "Axiome 9 — Sans color:#000, le titre peut être invisible en mode sombre."], ["Phrase", "Sans color:#000, le titre peut être invisible en mode sombre."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Comme le surligneur sur une page, il attire l’œil sans changer le texte."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Deux styles appliqués au même point peuvent se gêner."]], "33": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’ajoute souvent à la fin, une fois le diagramme juste."]], "34": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il agit sur l’apparence des boîtes et des cadres, pas sur leur place."]], "35": [["Axiome", "Axiome 1 — Un style est un ensemble de réglages visuels (couleur, bordure).\nAxiome 2 — Il porte un nom.\nAxiome 3 — Il s’applique à une ou plusieurs étapes.\nAxiome 4 — Il ne change pas, dans le diagramme, la logique.\nAxiome 5 — Une classe important jaune se définit `classDef important fill:#fff3cd,stroke:#e0a800`.\nAxiome 6 — L’appliquer à B s’écrit `B:::important`.\nAxiome 7 — Appliquer la classe à A et B d’un coup s’écrit `class A,B important`.\nAxiome 8 — Colorer le sous-groupe appel, titre lisible, s’écrit `style appel fill:#e8f1ff,stroke:#3b82f6,color:#000`.\nAxiome 9 — Sans color:#000, le titre peut être invisible en mode sombre.\nAxiome 10 — Colorer une seule étape, sans classe, s’écrit `style A fill:#couleur`."], ["Phrase", "Dix propositions : des réglages visuels (couleur, bordure) ; un nom ; une ou plusieurs étapes ; la logique inchangée ; `classDef important fill:#fff3cd,stroke:#e0a800` ; `B:::important` ; `class A,B important` ; `style appel fill:#e8f1ff,stroke:#3b82f6,color:#000` pour un sous-groupe ; sans color:#000, un titre invisible en mode sombre ; `style A fill:#couleur` pour une seule étape."]], "36": [["Axiome", "Axiome 1 — Un style est un ensemble de réglages visuels (couleur, bordure).\nAxiome 2 — Il porte un nom.\nAxiome 3 — Il s’applique à une ou plusieurs étapes.\nAxiome 4 — Il ne change pas, dans le diagramme, la logique."], ["Phrase", "On dit d’un style qu’il est un ensemble de réglages visuels, qu’il porte un nom, qu’il s’applique à une ou plusieurs étapes et qu’il ne change pas la logique."]], "37": [["Axiome", "Axiome 6 — L’appliquer à B s’écrit `B:::important`."], ["Phrase", "En voyant `B:::important`, on sait que B reçoit la classe important."]], "38": [["Axiome", "Axiome 4 — Il ne change pas, dans le diagramme, la logique."], ["Phrase", "Conséquence nécessaire : retirer tous les styles laisse un diagramme à la logique intacte."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "À force d’en utiliser, on remarque que deux ou trois apparences suffisent."]], "40": [["Axiome", "Axiome 9 — Sans color:#000, le titre peut être invisible en mode sombre."], ["Phrase · hors axiomes", "Si le titre d’un cadre disparaît en mode sombre, l’explication la plus probable est un color:#000 oublié."]], "41": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Argument habituel : une apparence cohérente rend un diagramme plus rapide à lire."]], "42": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les axiomes ne se démontrent pas : on les admet. On montre qu’un réglage est un style en vérifiant qu’il respecte chacun d’eux."]], "43": [["Axiome", "Axiome 1 — Un style est un ensemble de réglages visuels (couleur, bordure).\nAxiome 2 — Il porte un nom.\nAxiome 3 — Il s’applique à une ou plusieurs étapes.\nAxiome 4 — Il ne change pas, dans le diagramme, la logique.\nAxiome 5 — Une classe important jaune se définit `classDef important fill:#fff3cd,stroke:#e0a800`.\nAxiome 6 — L’appliquer à B s’écrit `B:::important`.\nAxiome 7 — Appliquer la classe à A et B d’un coup s’écrit `class A,B important`.\nAxiome 8 — Colorer le sous-groupe appel, titre lisible, s’écrit `style appel fill:#e8f1ff,stroke:#3b82f6,color:#000`.\nAxiome 9 — Sans color:#000, le titre peut être invisible en mode sombre.\nAxiome 10 — Colorer une seule étape, sans classe, s’écrit `style A fill:#couleur`."], ["Phrase", "Dix principes fondent la notion : les réglages visuels, le nom, les étapes, la logique inchangée, `classDef`, `:::`, `class A,B important`, `style appel …` pour un sous-groupe, le risque d’un titre invisible en mode sombre, et `style A fill:#couleur`."]], "44": [["Axiome", "Axiome 4 — Il ne change pas, dans le diagramme, la logique."], ["Phrase", "Exclus : un style qui changerait la logique du diagramme."]], "45": [["Axiome", "Axiome 1 — Un style est un ensemble de réglages visuels (couleur, bordure).\nAxiome 2 — Il porte un nom.\nAxiome 3 — Il s’applique à une ou plusieurs étapes.\nAxiome 4 — Il ne change pas, dans le diagramme, la logique.\nAxiome 5 — Une classe important jaune se définit `classDef important fill:#fff3cd,stroke:#e0a800`.\nAxiome 6 — L’appliquer à B s’écrit `B:::important`.\nAxiome 7 — Appliquer la classe à A et B d’un coup s’écrit `class A,B important`.\nAxiome 8 — Colorer le sous-groupe appel, titre lisible, s’écrit `style appel fill:#e8f1ff,stroke:#3b82f6,color:#000`.\nAxiome 9 — Sans color:#000, le titre peut être invisible en mode sombre.\nAxiome 10 — Colorer une seule étape, sans classe, s’écrit `style A fill:#couleur`."], ["Phrase", "Les axiomes s’accordent : les quatre premiers disent ce qu’il est (des réglages visuels, un nom, des étapes, la logique inchangée), les trois suivants comment l’écrire avec une classe (`classDef`, `B:::important`, `class A,B important`), et les trois derniers comment colorer sans classe (`style appel …` pour un sous-groupe, attention au titre invisible en mode sombre, `style A fill:#couleur`)."]], "46": [["Axiome", "Axiome 3 — Il s’applique à une ou plusieurs étapes.\nAxiome 8 — Colorer le sous-groupe appel, titre lisible, s’écrit `style appel fill:#e8f1ff,stroke:#3b82f6,color:#000`."], ["Phrase · hors axiomes", "Dans la carte, Style fait partie de la famille « Présentation » et suppose de connaître Étape et Sous-groupe."]], "47": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On le justifie par la lisibilité : faire ressortir ce qui compte."]], "48": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La preuve qu’il est utile : on repère d’un coup d’œil ce qui est important."]], "49": [["Axiome", "Axiome 1 — Un style est un ensemble de réglages visuels (couleur, bordure).\nAxiome 2 — Il porte un nom."], ["Phrase", "Une définition est un style si elle réunit des réglages visuels sous un nom."]], "50": [["Axiome", "Axiome 4 — Il ne change pas, dans le diagramme, la logique."], ["Phrase", "Pour vérifier : retirer le style ne doit rien changer à la logique."]], "51": [["Axiome", "Axiome 4 — Il ne change pas, dans le diagramme, la logique."], ["Phrase", "Un réglage qui changerait la logique ne serait pas un style."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La notion est sûre : ses axiomes sont posés comme des définitions."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On fait une hypothèse en choisissant une apparence : on suppose qu’elle sera comprise de tous."]], "54": [["Axiome", "Axiome 1 — Un style est un ensemble de réglages visuels (couleur, bordure)."], ["Phrase", "On l’observe directement : la couleur ou la bordure change dans le dessin."]], "55": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Derrière, c’est le principe des feuilles de style du web : séparer l’apparence du contenu."]], "56": [["Axiome", "Axiome 1 — Un style est un ensemble de réglages visuels (couleur, bordure)."], ["Phrase", "Un style n’est pas une partie du processus : c’est un ensemble de réglages visuels."]], "57": [["Axiome", "Axiome 5 — Une classe important jaune se définit `classDef important fill:#fff3cd,stroke:#e0a800`."], ["Phrase", "Une classe existe dès qu’on la définit avec classDef."]], "58": [["Axiome", "Axiome 1 — Un style est un ensemble de réglages visuels (couleur, bordure).\nAxiome 2 — Il porte un nom.\nAxiome 3 — Il s’applique à une ou plusieurs étapes.\nAxiome 4 — Il ne change pas, dans le diagramme, la logique."], ["Phrase", "Ce qui en fait un style, c’est la réunion des axiomes : des réglages visuels, un nom, une ou plusieurs étapes, et une logique inchangée."]], "59": [["Axiome", "Axiome 1 — Un style est un ensemble de réglages visuels (couleur, bordure)."], ["Phrase", "Il appartient à la catégorie des réglages visuels."]], "60": [["Axiome", "Axiome 1 — Un style est un ensemble de réglages visuels (couleur, bordure).\nAxiome 4 — Il ne change pas, dans le diagramme, la logique."], ["Phrase", "Nécessaire : des réglages visuels qui ne changent pas la logique. Au choix : les couleurs, la bordure, la façon de l’appliquer."]], "61": [["Axiome", "Axiome 1 — Un style est un ensemble de réglages visuels (couleur, bordure)."], ["Phrase", "Sa substance : des réglages visuels."]], "62": [["Axiome", "Axiome 4 — Il ne change pas, dans le diagramme, la logique."], ["Phrase", "Il s’arrête à l’apparence : il ne change pas la logique."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans ce projet, il peut faire ressortir les points clés de l’enregistreur."]], "64": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On s’en sert quand certains points doivent ressortir."]], "65": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "L’idée vient du web, où les classes CSS habillent les pages depuis les années 1990."]], "66": [["Axiome", "Axiome 9 — Sans color:#000, le titre peut être invisible en mode sombre."], ["Phrase · hors axiomes", "Le mode sombre des téléphones oblige à penser aux contrastes : c’est la raison de color:#000."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il relève de la mise en forme et du design."]], "68": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une légende commune aide les autres à lire les apparences de la même façon."]], "69": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il habille un état du diagramme ; il peut changer à chaque version."]], "70": [["Axiome", "Axiome 1 — Un style est un ensemble de réglages visuels (couleur, bordure).\nAxiome 3 — Il s’applique à une ou plusieurs étapes."], ["Phrase", "Son rôle : appliquer des réglages visuels à une ou plusieurs étapes."]], "71": [["Axiome", "Axiome 5 — Une classe important jaune se définit `classDef important fill:#fff3cd,stroke:#e0a800`.\nAxiome 6 — L’appliquer à B s’écrit `B:::important`.\nAxiome 7 — Appliquer la classe à A et B d’un coup s’écrit `class A,B important`.\nAxiome 8 — Colorer le sous-groupe appel, titre lisible, s’écrit `style appel fill:#e8f1ff,stroke:#3b82f6,color:#000`.\nAxiome 10 — Colorer une seule étape, sans classe, s’écrit `style A fill:#couleur`."], ["Phrase", "Il fournit plusieurs écritures : `classDef`, `B:::important`, `class A,B important`, `style appel …`, `style A fill:#couleur`."]], "72": [["Axiome", "Axiome 3 — Il s’applique à une ou plusieurs étapes.\nAxiome 7 — Appliquer la classe à A et B d’un coup s’écrit `class A,B important`."], ["Phrase", "Il permet d’habiller plusieurs étapes d’un coup : `class A,B important`."]], "73": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En pratique, il guide l’œil vers ce qui compte."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ici, il peut distinguer les points automatiques de ceux qui demandent une action de l’utilisateur."]], "75": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il devient utile dès que certains points doivent se distinguer."]], "76": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Choisir une apparence, c’est dire ce qui est important."]], "77": [["Axiome", "Axiome 2 — Il porte un nom.\nAxiome 3 — Il s’applique à une ou plusieurs étapes.\nAxiome 5 — Une classe important jaune se définit `classDef important fill:#fff3cd,stroke:#e0a800`.\nAxiome 6 — L’appliquer à B s’écrit `B:::important`."], ["Phrase", "- Définir la classe et son nom : `classDef important fill:#fff3cd,stroke:#e0a800`.\n- L’appliquer à une étape : `B:::important`."]], "78": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il change quand on modifie ses réglages."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Au fil du projet, de nouvelles classes apparaissent pour de nouveaux cas."]], "80": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On peut transformer un réglage ponctuel en classe pour le réutiliser."]], "81": [["Axiome", "Axiome 5 — Une classe important jaune se définit `classDef important fill:#fff3cd,stroke:#e0a800`."], ["Phrase", "Il naît avec classDef."]], "82": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le programme dessine d’abord, puis applique l’apparence demandée."]], "83": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’adapte au thème de l’écran, clair ou foncé."]], "84": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "D’une version à l’autre, les apparences s’harmonisent."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un bon style se juge à sa sobriété : peu d’apparences, chacune avec un sens."]], "86": [["Axiome", "Axiome 2 — Il porte un nom.\nAxiome 5 — Une classe important jaune se définit `classDef important fill:#fff3cd,stroke:#e0a800`."], ["Phrase", "Norme d’écriture : classDef, le nom, puis les réglages."]], "87": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Sa valeur tient à la clarté qu’il apporte, pas à la décoration."]], "88": [["Axiome", "Axiome 1 — Un style est un ensemble de réglages visuels (couleur, bordure).\nAxiome 9 — Sans color:#000, le titre peut être invisible en mode sombre."], ["Phrase · hors axiomes", "Critères : lisible en mode sombre, peu de couleurs, contraste suffisant."]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un style de qualité se comprend sans légende."]], "90": [["Axiome", "Axiome 4 — Il ne change pas, dans le diagramme, la logique."], ["Phrase · hors axiomes", "Il est pertinent s’il aide à lire ; comme il ne change pas la logique, on peut s’en passer."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’améliore en réduisant le nombre d’apparences et en vérifiant les contrastes."]]}, "str": {"1": [["Axiome", "Axiome 1 — La structure générale est un diagramme de flux.\nAxiome 2 — Elle montre le système entier.\nAxiome 3 — Une grande phase y est un sous-groupe ou une seule boîte.\nAxiome 4 — Elle ne montre pas comment chaque phase est réalisée.\nAxiome 5 — Les décisions gardées sont celles qui changent le chemin du système entier."], ["Phrase", "La structure générale se compose d’un diagramme de flux qui montre le système entier ; chaque grande phase y est un sous-groupe ou une seule boîte, sans montrer comment chaque phase est réalisée ; seules restent les décisions qui changent le chemin du système entier."]], "2": [["Axiome", "Axiome 1 — La structure générale est un diagramme de flux.\nAxiome 2 — Elle montre le système entier.\nAxiome 3 — Une grande phase y est un sous-groupe ou une seule boîte.\nAxiome 4 — Elle ne montre pas comment chaque phase est réalisée.\nAxiome 5 — Les décisions gardées sont celles qui changent le chemin du système entier."], ["Phrase", "Ses éléments fondamentaux sont ceux que posent les axiomes : un diagramme de flux, le système entier, des grandes phases en sous-groupe ou en une seule boîte, l’absence de détail sur comment chaque phase est réalisée, et les seules décisions qui changent le chemin du système entier."]], "3": [["Axiome", "Axiome 1 — La structure générale est un diagramme de flux.\nAxiome 6 — Une phase « Emballer », sans détail, s’écrit `A[[Emballer]]`.\nAxiome 7 — Le début « Colis prêt » s’écrit `D([Colis prêt])`.\nAxiome 8 — La fin « Colis reçu » s’écrit `F([Colis reçu])`."], ["Phrase", "On écrit un diagramme de flux : le début `D([Colis prêt])`, les phases comme `A[[Emballer]]`, puis la fin `F([Colis reçu])`."]], "4": [["Axiome", "Axiome 3 — Une grande phase y est un sous-groupe ou une seule boîte."], ["Phrase", "Elle se décompose en grandes phases, chacune un sous-groupe ou une seule boîte."]], "5": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le nombre de phases n’est pas fixé ; ent
