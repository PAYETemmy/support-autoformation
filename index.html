forme."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Au fil du projet, une étape trop chargée se découpe en plusieurs."]], "80": [["Axiome", "Axiome 8 — Pour des angles arrondis, j’écris `C(Arrondi)`.\nAxiome 9 — Pour un cercle, j’écris `D((Rond))`.\nAxiome 10 — Pour un losange, j’écris `E{Question ?}`."], ["Phrase", "On peut transformer sa forme sans changer son texte : arrondie, en cercle ou en losange."]], "81": [["Axiome", "Axiome 5 — Elle s’écrit avec un identifiant suivi du texte entre crochets."], ["Phrase", "Elle naît quand on écrit son identifiant suivi du texte entre crochets."]], "82": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le programme lit chaque ligne, crée l’étape, puis la place selon le sens et les liaisons."]], "83": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’adapte au besoin : plus de détail dans le texte, ou une forme qui signale son rôle."]], "84": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "D’une version à l’autre, une étape peut être renommée, déplacée ou découpée."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une bonne étape se juge à sa clarté : on comprend l’action d’un coup d’œil."]], "86": [["Axiome", "Axiome 5 — Elle s’écrit avec un identifiant suivi du texte entre crochets.\nAxiome 6 — Un texte à caractères spéciaux se met entre guillemets."], ["Phrase", "Norme d’écriture : un identifiant suivi du texte entre crochets, et des guillemets si le texte a des caractères spéciaux."]], "87": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Sa valeur tient à la précision : un texte court et juste vaut mieux qu’une longue phrase."]], "88": [["Axiome", "Axiome 3 — Elle représente une seule action, un seul état ou une seule question."], ["Phrase · hors axiomes", "Critère tiré des axiomes : une seule action, un seul état ou une seule question. Critères habituels en plus : un verbe, un texte court, une forme cohérente."]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une étape de qualité se comprend sans lire les autres."]], "90": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle est pertinente si elle fait avancer le processus ; sinon, on la supprime."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’améliore en raccourcissant son texte, en commençant par un verbe, et en découpant ce qui contient deux actions."]]}, "ind": {"1": [["Axiome", "Axiome 1 — Au début d’une ligne, une indentation est un décalage.\nAxiome 2 — Elle est faite d’espaces (ou d’une tabulation).\nAxiome 3 — Dans un diagramme de flux, elle ne change pas le dessin.\nAxiome 4 — Dans un diagramme de flux, elle est facultative.\nAxiome 5 — Elle se place avant l’identifiant, sous la première ligne."], ["Phrase", "Une indentation se compose d’un décalage au début d’une ligne, fait d’espaces ou d’une tabulation, placé avant l’identifiant, sous la première ligne ; dans un diagramme de flux, elle est facultative et ne change pas le dessin."]], "2": [["Axiome", "Axiome 1 — Au début d’une ligne, une indentation est un décalage.\nAxiome 2 — Elle est faite d’espaces (ou d’une tabulation).\nAxiome 3 — Dans un diagramme de flux, elle ne change pas le dessin.\nAxiome 4 — Dans un diagramme de flux, elle est facultative.\nAxiome 5 — Elle se place avant l’identifiant, sous la première ligne."], ["Phrase", "Ses éléments fondamentaux sont ceux que posent les axiomes : un décalage, des espaces ou une tabulation, une place avant l’identifiant sous la première ligne, et deux propriétés : elle est facultative et ne change pas le dessin."]], "3": [["Axiome", "Axiome 2 — Elle est faite d’espaces (ou d’une tabulation).\nAxiome 5 — Elle se place avant l’identifiant, sous la première ligne.\nAxiome 6 — Je mets deux espaces au début de chaque ligne sous la première."], ["Phrase", "On met des espaces avant l’identifiant, sur chaque ligne sous la première : deux espaces, en pratique."]], "4": [["Axiome", "Axiome 2 — Elle est faite d’espaces (ou d’une tabulation)."], ["Phrase", "Elle se décompose en espaces, ou en une tabulation."]], "5": [["Axiome", "Axiome 6 — Je mets deux espaces au début de chaque ligne sous la première.\nNon couvert : les axiomes ne fixent aucun nombre obligatoire."], ["Phrase", "En pratique, deux espaces par ligne."]], "6": [["Axiome", "Axiome 1 — Au début d’une ligne, une indentation est un décalage.\nAxiome 2 — Elle est faite d’espaces (ou d’une tabulation)."], ["Phrase", "Sa nature : un décalage, fait d’espaces ou d’une tabulation."]], "7": [["Axiome", "Axiome 1 — Au début d’une ligne, une indentation est un décalage."], ["Phrase", "Une indentation, c’est un décalage au début d’une ligne."]], "8": [["Axiome", "Axiome 1 — Au début d’une ligne, une indentation est un décalage.\nAxiome 2 — Elle est faite d’espaces (ou d’une tabulation).\nAxiome 3 — Dans un diagramme de flux, elle ne change pas le dessin.\nAxiome 4 — Dans un diagramme de flux, elle est facultative.\nAxiome 5 — Elle se place avant l’identifiant, sous la première ligne."], ["Phrase", "Une indentation est un décalage au début d’une ligne, fait d’espaces ou d’une tabulation, placé avant l’identifiant, sous la première ligne ; dans un diagramme de flux, elle est facultative et ne change pas le dessin."]], "9": [["Axiome", "Axiome 1 — Au début d’une ligne, une indentation est un décalage.\nAxiome 2 — Elle est faite d’espaces (ou d’une tabulation).\nAxiome 3 — Dans un diagramme de flux, elle ne change pas le dessin.\nAxiome 4 — Dans un diagramme de flux, elle est facultative.\nAxiome 5 — Elle se place avant l’identifiant, sous la première ligne."], ["Phrase", "Être un décalage, fait d’espaces ou d’une tabulation, placé avant l’identifiant sous la première ligne, facultatif, et qui ne change pas le dessin : ces propriétés la constituent."]], "10": [["Axiome", "Axiome 5 — Elle se place avant l’identifiant, sous la première ligne."], ["Phrase · hors axiomes", "Elle s’applique à toutes les lignes sous la première ligne : étapes, liaisons, sous-groupes."]], "11": [["Axiome", "Axiome 1 — Au début d’une ligne, une indentation est un décalage."], ["Phrase · hors axiomes", "Les axiomes l’appellent indentation, ou décalage ; on dit aussi retrait."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le mot vient du latin dens, « dent » : à l’origine, une entaille dans un bord."]], "13": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le lecteur y voit l’organisation du code : ce qui est en retrait dépend de ce qui est au-dessus."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En typographie, l’alinéa est le retrait de la première ligne d’un paragraphe ; ici, il s’agit de lignes de code."]], "15": [["Axiome", "Axiome 5 — Elle se place avant l’identifiant, sous la première ligne."], ["Phrase", "Elle se place en tête de ligne, avant l’identifiant."]], "16": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Plus de retrait montre un niveau plus profond, comme le contenu d’un sous-groupe."]], "17": [["Axiome", "Axiome 1 — Au début d’une ligne, une indentation est un décalage.\nAxiome 5 — Elle se place avant l’identifiant, sous la première ligne."], ["Phrase", "Elle distingue la première ligne du reste : seules les lignes sous la première ligne sont décalées."]], "18": [["Axiome", "Axiome 5 — Elle se place avant l’identifiant, sous la première ligne.\nAxiome 6 — Je mets deux espaces au début de chaque ligne sous la première."], ["Phrase", "Chaque ligne sous la première ligne commence par deux espaces, puis l’identifiant."]], "19": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle se range parmi les règles de mise en forme du code, comme les sauts de ligne."]], "20": [["Axiome", "Axiome 2 — Elle est faite d’espaces (ou d’une tabulation)."], ["Phrase", "Deux types : en espaces ou en tabulation."]], "21": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle aide à voir les blocs du code : un sous-groupe et son contenu forment un bloc en retrait."]], "22": [["Axiome", "Axiome 5 — Elle se place avant l’identifiant, sous la première ligne."], ["Phrase", "Elle est liée à l’identifiant : elle se place juste avant l’identifiant."]], "23": [["Axiome", "Axiome 3 — Dans un diagramme de flux, elle ne change pas le dessin.\nAxiome 4 — Dans un diagramme de flux, elle est facultative."], ["Phrase", "Puisqu’elle ne change pas le dessin, elle est facultative."]], "24": [["Axiome", "Axiome 2 — Elle est faite d’espaces (ou d’une tabulation).\nAxiome 3 — Dans un diagramme de flux, elle ne change pas le dessin."], ["Phrase", "Ajouter ou retirer des espaces n’a aucun effet : elle ne change pas le dessin."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Plus un code est long, plus un retrait régulier aide à s’y retrouver."]], "26": [["Axiome", "Axiome 3 — Dans un diagramme de flux, elle ne change pas le dessin."], ["Phrase · hors axiomes", "Elle ne change pas le dessin : elle ne sert qu’à celui qui lit le code."]], "27": [["Axiome", "Axiome 5 — Elle se place avant l’identifiant, sous la première ligne."], ["Phrase · hors axiomes", "Elle dépend de la première ligne : elle se place sous la première ligne. Dans la carte, elle dépend d’Étape, et Liaison dépend d’elle."]], "28": [["Axiome", "Axiome 1 — Au début d’une ligne, une indentation est un décalage.\nAxiome 5 — Elle se place avant l’identifiant, sous la première ligne."], ["Phrase", "Elle s’oppose à la première ligne, qui n’est pas décalée : elle se place sous la première ligne."]], "29": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Retrait et sauts de ligne se complètent : les sauts séparent les instructions, le retrait montre leur niveau."]], "30": [["Axiome", "Axiome 4 — Dans un diagramme de flux, elle est facultative."], ["Phrase", "Elle est facultative : qu’on la mette ou non, le diagramme s’affiche."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Comme l’alinéa d’un texte, elle aide l’œil à repérer les blocs."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle n’interagit avec aucune autre notion : elle ne touche que la mise en page du code."]], "33": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On peut l’ajouter à tout moment, avant ou après avoir écrit le code."]], "34": [["Axiome", "Axiome 1 — Au début d’une ligne, une indentation est un décalage."], ["Phrase · hors axiomes", "Elle occupe le début de la ligne : un décalage vers la droite."]], "35": [["Axiome", "Axiome 1 — Au début d’une ligne, une indentation est un décalage.\nAxiome 2 — Elle est faite d’espaces (ou d’une tabulation).\nAxiome 3 — Dans un diagramme de flux, elle ne change pas le dessin.\nAxiome 4 — Dans un diagramme de flux, elle est facultative.\nAxiome 5 — Elle se place avant l’identifiant, sous la première ligne.\nAxiome 6 — Je mets deux espaces au début de chaque ligne sous la première."], ["Phrase", "Six propositions : c’est un décalage au début d’une ligne ; elle est faite d’espaces ou d’une tabulation ; elle ne change pas le dessin ; elle est facultative ; elle se place avant l’identifiant, sous la première ligne ; en pratique, deux espaces."]], "36": [["Axiome", "Axiome 1 — Au début d’une ligne, une indentation est un décalage.\nAxiome 2 — Elle est faite d’espaces (ou d’une tabulation).\nAxiome 3 — Dans un diagramme de flux, elle ne change pas le dessin.\nAxiome 4 — Dans un diagramme de flux, elle est facultative."], ["Phrase", "On dit d’une indentation qu’elle est un décalage, faite d’espaces ou d’une tabulation, facultative, et qu’elle ne change pas le dessin."]], "37": [["Axiome", "Axiome 3 — Dans un diagramme de flux, elle ne change pas le dessin."], ["Phrase", "Si deux codes ne diffèrent que par leur retrait, ils donnent le même dessin."]], "38": [["Axiome", "Axiome 3 — Dans un diagramme de flux, elle ne change pas le dessin.\nAxiome 4 — Dans un diagramme de flux, elle est facultative."], ["Phrase", "Conséquence nécessaire : un code sans retrait donne le même dessin, puisqu’elle est facultative."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "À force de relire du code, on constate qu’un retrait régulier fait gagner du temps."]], "40": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Si un code est difficile à relire, l’explication la plus probable est un retrait irrégulier."]], "41": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Argument habituel : un retrait régulier rend le code plus facile à relire et à corriger."]], "42": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les axiomes ne se démontrent pas : on les admet. On montre qu’un retrait est correct en vérifiant qu’il respecte chacun d’eux."]], "43": [["Axiome", "Axiome 1 — Au début d’une ligne, une indentation est un décalage.\nAxiome 2 — Elle est faite d’espaces (ou d’une tabulation).\nAxiome 3 — Dans un diagramme de flux, elle ne change pas le dessin.\nAxiome 4 — Dans un diagramme de flux, elle est facultative.\nAxiome 5 — Elle se place avant l’identifiant, sous la première ligne.\nAxiome 6 — Je mets deux espaces au début de chaque ligne sous la première."], ["Phrase", "Six principes fondent la notion : le décalage, les espaces ou la tabulation, le fait qu’elle ne change pas le dessin, son caractère facultatif, sa place avant l’identifiant, et la pratique des deux espaces."]], "44": [["Axiome", "Axiome 3 — Dans un diagramme de flux, elle ne change pas le dessin.\nAxiome 4 — Dans un diagramme de flux, elle est facultative."], ["Phrase", "Exclus : une indentation obligatoire, ou qui changerait le dessin ; elle est facultative et ne change pas le dessin."]], "45": [["Axiome", "Axiome 1 — Au début d’une ligne, une indentation est un décalage.\nAxiome 2 — Elle est faite d’espaces (ou d’une tabulation).\nAxiome 3 — Dans un diagramme de flux, elle ne change pas le dessin.\nAxiome 4 — Dans un diagramme de flux, elle est facultative.\nAxiome 5 — Elle se place avant l’identifiant, sous la première ligne.\nAxiome 6 — Je mets deux espaces au début de chaque ligne sous la première."], ["Phrase", "Les axiomes s’accordent : les deux premiers disent ce qu’elle est (un décalage, des espaces ou une tabulation), les deux suivants son effet (elle ne change pas le dessin, elle est facultative), le cinquième sa place (avant l’identifiant), le dernier l’usage (deux espaces)."]], "46": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans la carte, Indentation fait partie des Éléments de base et suppose de connaître Étape."]], "47": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On la justifie par la relecture : un code aligné se parcourt plus vite."]], "48": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La preuve qu’elle est utile : on retrouve plus vite une ligne dans un code en retrait."]], "49": [["Axiome", "Axiome 1 — Au début d’une ligne, une indentation est un décalage.\nAxiome 5 — Elle se place avant l’identifiant, sous la première ligne."], ["Phrase", "Une ligne est indentée si elle commence par un décalage avant l’identifiant."]], "50": [["Axiome", "Axiome 3 — Dans un diagramme de flux, elle ne change pas le dessin."], ["Phrase", "Pour vérifier qu’elle ne change pas le dessin : retirer le retrait et comparer ; c’est le même dessin."]], "51": [["Axiome", "Axiome 3 — Dans un diagramme de flux, elle ne change pas le dessin."], ["Phrase", "Si retirer le retrait changeait le dessin, ce ne serait plus une simple indentation, puisqu’elle ne change pas le dessin."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La notion est sûre : ses axiomes sont posés comme des définitions."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On fait une hypothèse en l’adoptant : on suppose qu’elle rendra le code plus lisible."]], "54": [["Axiome", "Axiome 3 — Dans un diagramme de flux, elle ne change pas le dessin."], ["Phrase", "On l’observe directement : avec ou sans retrait, c’est le même dessin."]], "55": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Derrière, c’est un principe de lisibilité du code, partagé par la plupart des langages."]], "56": [["Axiome", "Axiome 1 — Au début d’une ligne, une indentation est un décalage."], ["Phrase", "Elle n’est ni une étape ni une liaison : c’est un décalage."]], "57": [["Axiome", "Axiome 4 — Dans un diagramme de flux, elle est facultative."], ["Phrase", "Elle peut exister ou non : elle est facultative."]], "58": [["Axiome", "Axiome 1 — Au début d’une ligne, une indentation est un décalage.\nAxiome 2 — Elle est faite d’espaces (ou d’une tabulation).\nAxiome 3 — Dans un diagramme de flux, elle ne change pas le dessin.\nAxiome 4 — Dans un diagramme de flux, elle est facultative.\nAxiome 5 — Elle se place avant l’identifiant, sous la première ligne."], ["Phrase", "Ce qui en fait une indentation, c’est la réunion des axiomes : un décalage fait d’espaces ou d’une tabulation, placé avant l’identifiant sous la première ligne, facultatif, et qui ne change pas le dessin."]], "59": [["Axiome", "Axiome 1 — Au début d’une ligne, une indentation est un décalage."], ["Phrase", "Elle appartient à la catégorie des décalages."]], "60": [["Axiome", "Axiome 1 — Au début d’une ligne, une indentation est un décalage.\nAxiome 2 — Elle est faite d’espaces (ou d’une tabulation).\nAxiome 4 — Dans un diagramme de flux, elle est facultative."], ["Phrase", "Facultative : elle n’est jamais nécessaire. Quand on la met, c’est un décalage, fait d’espaces ou d’une tabulation."]], "61": [["Axiome", "Axiome 2 — Elle est faite d’espaces (ou d’une tabulation)."], ["Phrase", "Sa substance : des espaces, ou une tabulation."]], "62": [["Axiome", "Axiome 5 — Elle se place avant l’identifiant, sous la première ligne."], ["Phrase", "Elle s’arrête à l’identifiant : elle se place avant l’identifiant, jamais après."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans ce projet, elle rend lisible le code de la structure de l’enregistreur, qui sera long."]], "64": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’ajoute dès que le code dépasse quelques lignes, ou qu’il contient des sous-groupes."]], "65": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "L’habitude vient de la programmation, où l’on aligne les blocs depuis les premiers langages."]], "66": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La largeur du retrait est une affaire d’habitude : certains le veulent étroit, d’autres large."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle relève de la mise en forme du code, en informatique."]], "68": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un retrait commun permet à plusieurs personnes de relire le même code sans se perdre."]], "69": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle n’existe que dans le texte du code."]], "70": [["Axiome", "Axiome 3 — Dans un diagramme de flux, elle ne change pas le dessin."], ["Phrase · hors axiomes", "Son rôle n’est pas le dessin, puisqu’elle ne change pas le dessin : elle sert à rendre le code lisible."]], "71": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle fournit un repère visuel pour suivre les blocs du code."]], "72": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle permet de voir d’un coup d’œil ce qui appartient à quoi."]], "73": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En pratique, elle évite de se perdre dans un long code."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ici, elle sert à relire facilement le bloc Mermaid de l’enregistreur."]], "75": [["Axiome", "Axiome 4 — Dans un diagramme de flux, elle est facultative."], ["Phrase · hors axiomes", "Facultative, elle devient utile dès que le code dépasse quelques lignes."]], "76": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Mettre un retrait, c’est montrer au lecteur comment on a pensé l’organisation du code."]], "77": [["Axiome", "Axiome 5 — Elle se place avant l’identifiant, sous la première ligne.\nAxiome 6 — Je mets deux espaces au début de chaque ligne sous la première."], ["Phrase · hors axiomes", "- Sous la première ligne, au début de chaque ligne, mettre deux espaces.\n- Les placer avant l’identifiant.\n- Garder le même retrait partout."]], "78": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle change quand on ajoute un niveau, par exemple en ouvrant un sous-groupe."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle se garde d’une version à l’autre, tant que le style ne change pas."]], "80": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On peut uniformiser tout le retrait d’un coup avec un éditeur de texte."]], "81": [["Axiome", "Axiome 6 — Je mets deux espaces au début de chaque ligne sous la première."], ["Phrase", "Elle naît quand on tape deux espaces au début d’une ligne."]], "82": [["Axiome", "Axiome 3 — Dans un diagramme de flux, elle ne change pas le dessin."], ["Phrase · hors axiomes", "Le programme lit les mots ; le retrait ne change pas le dessin."]], "83": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’adapte au code : plus de niveaux, plus de retraits."]], "84": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "D’une version à l’autre, un retrait régulier facilite la comparaison."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une bonne indentation se juge à sa régularité."]], "86": [["Axiome", "Axiome 4 — Dans un diagramme de flux, elle est facultative.\nAxiome 6 — Je mets deux espaces au début de chaque ligne sous la première."], ["Phrase", "La pratique retenue : deux espaces ; elle reste facultative."]], "87": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Sa valeur tient au confort de relecture."]], "88": [["Axiome", "Axiome 6 — Je mets deux espaces au début de chaque ligne sous la première."], ["Phrase · hors axiomes", "Critères : deux espaces, toujours le même retrait, un niveau de plus dans chaque sous-groupe."]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une indentation de qualité ne se remarque pas : le code paraît simplement clair."]], "90": [["Axiome", "Axiome 4 — Dans un diagramme de flux, elle est facultative."], ["Phrase · hors axiomes", "Elle est facultative : pour un code de trois lignes, elle n’apporte presque rien."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’améliore en la rendant régulière : même largeur partout."]]}, "lia": {"1": [["Axiome", "Axiome 1 — Entre deux étapes, une liaison est un trait.\nAxiome 2 — Elle a une étape de départ et une étape d’arrivée.\nAxiome 3 — Elle s’écrit, pour les deux étapes, avec leurs identifiants.\nAxiome 4 — Une liaison avec une pointe s’appelle une flèche : elle indique l’ordre.\nAxiome 6 — Une ligne sans pointe entre B et C s’écrit `B --- C`.\nAxiome 7 — Une flèche pointillée de A vers B s’écrit `A -.-> B`.\nAxiome 8 — Une flèche épaisse de A vers B s’écrit `A ==> B`.\nAxiome 9 — Le texte « oui » sur la flèche de A vers B s’écrit `A -->|oui| B`."], ["Phrase", "Une liaison se compose d’un trait entre deux étapes, avec une étape de départ et une étape d’arrivée, écrites avec leurs identifiants ; avec une pointe, c’est une flèche, qui indique l’ordre ; elle peut aussi être sans pointe, pointillée ou épaisse, et porter un texte comme « oui »."]], "2": [["Axiome", "Axiome 1 — Entre deux étapes, une liaison est un trait.\nAxiome 2 — Elle a une étape de départ et une étape d’arrivée.\nAxiome 3 — Elle s’écrit, pour les deux étapes, avec leurs identifiants.\nAxiome 4 — Une liaison avec une pointe s’appelle une flèche : elle indique l’ordre.\nAxiome 6 — Une ligne sans pointe entre B et C s’écrit `B --- C`.\nAxiome 7 — Une flèche pointillée de A vers B s’écrit `A -.-> B`.\nAxiome 8 — Une flèche épaisse de A vers B s’écrit `A ==> B`.\nAxiome 9 — Le texte « oui » sur la flèche de A vers B s’écrit `A -->|oui| B`."], ["Phrase", "Ses éléments fondamentaux sont ceux que posent les axiomes : un trait, une étape de départ et une étape d’arrivée, leurs identifiants, une pointe qui en fait une flèche et indique l’ordre ; elle peut aussi être sans pointe, pointillée ou épaisse, et porter un texte comme « oui »."]], "3": [["Axiome", "Axiome 1 — Entre deux étapes, une liaison est un trait.\nAxiome 2 — Elle a une étape de départ et une étape d’arrivée.\nAxiome 3 — Elle s’écrit, pour les deux étapes, avec leurs identifiants.\nAxiome 5 — Une flèche de A vers B s’écrit `A --> B`."], ["Phrase", "On écrit l’identifiant de l’étape de départ, le signe du trait, puis l’identifiant de l’étape d’arrivée : `A --> B`."]], "4": [["Axiome", "Axiome 1 — Entre deux étapes, une liaison est un trait.\nAxiome 2 — Elle a une étape de départ et une étape d’arrivée."], ["Phrase", "Elle se décompose en trois parties : une étape de départ, un trait, une étape d’arrivée."]], "5": [["Axiome", "Axiome 1 — Entre deux étapes, une liaison est un trait.\nAxiome 2 — Elle a une étape de départ et une étape d’arrivée.\nNon couvert : les axiomes ne fixent pas le nombre de liaisons d’un diagramme."], ["Phrase", "Un trait relie deux étapes : une étape de départ et une étape d’arrivée."]], "6": [["Axiome", "Axiome 1 — Entre deux étapes, une liaison est un trait.\nAxiome 4 — Une liaison avec une pointe s’appelle une flèche : elle indique l’ordre."], ["Phrase", "Sa nature : un trait et, avec une pointe, une flèche qui indique l’ordre."]], "7": [["Axiome", "Axiome 1 — Entre deux étapes, une liaison est un trait.\nAxiome 2 — Elle a une étape de départ et une étape d’arrivée."], ["Phrase", "Une liaison, c’est un trait qui va d’une étape de départ à une étape d’arrivée."]], "8": [["Axiome", "Axiome 1 — Entre deux étapes, une liaison est un trait.\nAxiome 2 — Elle a une étape de départ et une étape d’arrivée.\nAxiome 3 — Elle s’écrit, pour les deux étapes, avec leurs identifiants.\nAxiome 4 — Une liaison avec une pointe s’appelle une flèche : elle indique l’ordre."], ["Phrase", "Une liaison est un trait entre deux étapes, avec une étape de départ et une étape d’arrivée, écrit avec leurs identifiants ; avec une pointe, c’est une flèche, qui indique l’ordre."]], "9": [["Axiome", "Axiome 1 — Entre deux étapes, une liaison est un trait.\nAxiome 2 — Elle a une étape de départ et une étape d’arrivée.\nAxiome 3 — Elle s’écrit, pour les deux étapes, avec leurs identifiants.\nAxiome 4 — Une liaison avec une pointe s’appelle une flèche : elle indique l’ordre."], ["Phrase", "Être un trait entre deux étapes, avoir un départ et une arrivée, s’écrire avec leurs identifiants et, avec une pointe, indiquer l’ordre : ces propriétés la constituent."]], "10": [["Axiome", "Axiome 4 — Une liaison avec une pointe s’appelle une flèche : elle indique l’ordre.\nAxiome 6 — Une ligne sans pointe entre B et C s’écrit `B --- C`.\nAxiome 7 — Une flèche pointillée de A vers B s’écrit `A -.-> B`.\nAxiome 8 — Une flèche épaisse de A vers B s’écrit `A ==> B`."], ["Phrase", "Elle prend plusieurs formes : flèche simple, ligne sans pointe, flèche pointillée, flèche épaisse."]], "11": [["Axiome", "Axiome 1 — Entre deux étapes, une liaison est un trait.\nAxiome 4 — Une liaison avec une pointe s’appelle une flèche : elle indique l’ordre."], ["Phrase · hors axiomes", "Les axiomes l’appellent liaison, ou trait, et flèche quand elle a une pointe ; en anglais, on dit link ou edge."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le mot vient du latin ligare, « lier »."]], "13": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le lecteur suit les liens d’une étape à l’autre pour comprendre le déroulement."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Liaison » désigne aussi l’enchaînement de deux mots à l’oral ; ici, il s’agit d’un lien entre deux étapes."]], "15": [["Axiome", "Axiome 2 — Elle a une étape de départ et une étape d’arrivée.\nAxiome 3 — Elle s’écrit, pour les deux étapes, avec leurs identifiants."], ["Phrase", "Sa structure : l’identifiant de l’étape de départ, un signe, puis l’identifiant de l’étape d’arrivée."]], "16": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les liens ne créent pas de rang : ils donnent une suite, pas une hiérarchie."]], "17": [["Axiome", "Axiome 1 — Entre deux étapes, une liaison est un trait."], ["Phrase", "Ensemble, les traits forment le réseau du diagramme : ce sont eux qui relient les étapes."]], "18": [["Axiome", "Axiome 2 — Elle a une étape de départ et une étape d’arrivée."], ["Phrase", "Elle dispose les étapes l’une après l’autre, du départ vers l’arrivée."]], "19": [["Axiome", "Axiome 1 — Entre deux étapes, une liaison est un trait."], ["Phrase", "Elle se range parmi les traits du dessin."]], "20": [["Axiome", "Axiome 4 — Une liaison avec une pointe s’appelle une flèche : elle indique l’ordre.\nAxiome 6 — Une ligne sans pointe entre B et C s’écrit `B --- C`.\nAxiome 7 — Une flèche pointillée de A vers B s’écrit `A -.-> B`.\nAxiome 8 — Une flèche épaisse de A vers B s’écrit `A ==> B`."], ["Phrase", "Quatre types : la flèche, la ligne sans pointe, la flèche pointillée, la flèche épaisse."]], "21": [["Axiome", "Axiome 10 — A vers B et C en une ligne s’écrit `A --> B & C`.\nAxiome 11 — A, B, C à la suite s’écrit `A --> B --> C`.\nAxiome 12 — A et B vers C s’écrit `A & B --> C`."], ["Phrase", "Plusieurs liaisons peuvent s’écrire en une ligne : `A --> B & C`, `A --> B --> C`, `A & B --> C`."]], "22": [["Axiome", "Axiome 1 — Entre deux étapes, une liaison est un trait.\nAxiome 2 — Elle a une étape de départ et une étape d’arrivée."], ["Phrase", "Elle relie deux étapes : un trait, de l’étape de départ à l’étape d’arrivée."]], "23": [["Axiome", "Axiome 2 — Elle a une étape de départ et une étape d’arrivée.\nAxiome 4 — Une liaison avec une pointe s’appelle une flèche : elle indique l’ordre."], ["Phrase", "Puisqu’elle a un départ et une arrivée, une flèche indique l’ordre : l’arrivée vient après le départ."]], "24": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un lien montre une suite, pas une cause : B vient après A, sans que A provoque B."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Plus un processus a d’étapes, plus il a de liens."]], "26": [["Axiome", "Axiome 2 — Elle a une étape de départ et une étape d’arrivée.\nAxiome 3 — Elle s’écrit, pour les deux étapes, avec leurs identifiants."], ["Phrase", "Les identifiants désignent les deux étapes : l’une est le départ, l’autre l’arrivée."]], "27": [["Axiome", "Axiome 3 — Elle s’écrit, pour les deux étapes, avec leurs identifiants."], ["Phrase · hors axiomes", "Elle dépend des identifiants des étapes : sans eux, on ne peut pas l’écrire. Dans la carte, elle dépend d’Étape et d’Indentation ; Début et fin, Donnée, Décision, Sous-groupe et Commentaire dépendent d’elle."]], "28": [["Axiome", "Axiome 4 — Une liaison avec une pointe s’appelle une flèche : elle indique l’ordre.\nAxiome 6 — Une ligne sans pointe entre B et C s’écrit `B --- C`."], ["Phrase", "La flèche, avec une pointe, s’oppose à la ligne sans pointe."]], "29": [["Axiome", "Axiome 2 — Elle a une étape de départ et une étape d’arrivée."], ["Phrase", "Le départ et l’arrivée se complètent : l’un sans l’autre ne fait pas une liaison."]], "30": [["Axiome", "Axiome 4 — Une liaison avec une pointe s’appelle une flèche : elle indique l’ordre.\nAxiome 9 — Le texte « oui » sur la flèche de A vers B s’écrit `A -->|oui| B`."], ["Phrase · hors axiomes", "Un texte sur la flèche, comme « oui », sert souvent à marquer une condition."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Comme une route entre deux villes, elle relie deux points."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Supprimer une étape oblige à supprimer les liens qui la touchent."]], "33": [["Axiome", "Axiome 2 — Elle a une étape de départ et une étape d’arrivée.\nAxiome 4 — Une liaison avec une pointe s’appelle une flèche : elle indique l’ordre."], ["Phrase", "Une flèche indique l’ordre : l’étape d’arrivée vient après l’étape de départ."]], "34": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le programme trace les liens selon le sens du diagramme ; leur tracé exact est automatique."]], "35": [["Axiome", "Axiome 1 — Entre deux étapes, une liaison est un trait.\nAxiome 2 — Elle a une étape de départ et une étape d’arrivée.\nAxiome 3 — Elle s’écrit, pour les deux étapes, avec leurs identifiants.\nAxiome 4 — Une liaison avec une pointe s’appelle une flèche : elle indique l’ordre.\nAxiome 5 — Une flèche de A vers B s’écrit `A --> B`.\nAxiome 6 — Une ligne sans pointe entre B et C s’écrit `B --- C`.\nAxiome 7 — Une flèche pointillée de A vers B s’écrit `A -.-> B`.\nAxiome 8 — Une flèche épaisse de A vers B s’écrit `A ==> B`.\nAxiome 9 — Le texte « oui » sur la flèche de A vers B s’écrit `A -->|oui| B`.\nAxiome 10 — A vers B et C en une ligne s’écrit `A --> B & C`.\nAxiome 11 — A, B, C à la suite s’écrit `A --> B --> C`.\nAxiome 12 — A et B vers C s’écrit `A & B --> C`."], ["Phrase", "Douze propositions : c’est un trait entre deux étapes ; elle a une étape de départ et une étape d’arrivée ; elle s’écrit avec leurs identifiants ; avec une pointe, c’est une flèche qui indique l’ordre ; puis huit écritures : `A --> B`, `B --- C`, `A -.-> B`, `A ==> B`, `A -->|oui| B`, `A --> B & C`, `A --> B --> C`, `A & B --> C`."]], "36": [["Axiome", "Axiome 1 — Entre deux étapes, une liaison est un trait.\nAxiome 2 — Elle a une étape de départ et une étape d’arrivée.\nAxiome 3 — Elle s’écrit, pour les deux étapes, avec leurs identifiants.\nAxiome 4 — Une liaison avec une pointe s’appelle une flèche : elle indique l’ordre."], ["Phrase", "On dit d’une liaison qu’elle est un trait, qu’elle a une étape de départ et une étape d’arrivée, qu’elle s’écrit avec leurs identifiants et qu’avec une pointe elle indique l’ordre."]], "37": [["Axiome", "Axiome 2 — Elle a une étape de départ et une étape d’arrivée.\nAxiome 5 — Une flèche de A vers B s’écrit `A --> B`."], ["Phrase", "En lisant `A --> B`, on sait que A est l’étape de départ et B l’étape d’arrivée."]], "38": [["Axiome", "Axiome 2 — Elle a une étape de départ et une étape d’arrivée."], ["Phrase", "Conséquence nécessaire : une liaison ne peut pas exister sans étape de départ ni étape d’arrivée."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "À force d’en écrire, on remarque que les diagrammes clairs ont peu de liens qui se croisent."]], "40": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Si une étape inattendue apparaît dans le dessin, l’explication la plus probable est une faute de frappe dans un lien."]], "41": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Argument habituel : écrire plusieurs liens sur une ligne raccourcit le code, mais le rend parfois moins lisible."]], "42": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les axiomes ne se démontrent pas : on les admet. On montre qu’une liaison est bien écrite en vérifiant qu’elle respecte chacun d’eux."]], "43": [["Axiome", "Axiome 1 — Entre deux étapes, une liaison est un trait.\nAxiome 2 — Elle a une étape de départ et une étape d’arrivée.\nAxiome 3 — Elle s’écrit, pour les deux étapes, avec leurs identifiants.\nAxiome 4 — Une liaison avec une pointe s’appelle une flèche : elle indique l’ordre.\nAxiome 5 — Une flèche de A vers B s’écrit `A --> B`.\nAxiome 6 — Une ligne sans pointe entre B et C s’écrit `B --- C`.\nAxiome 7 — Une flèche pointillée de A vers B s’écrit `A -.-> B`.\nAxiome 8 — Une flèche épaisse de A vers B s’écrit `A ==> B`.\nAxiome 9 — Le texte « oui » sur la flèche de A vers B s’écrit `A -->|oui| B`.\nAxiome 10 — A vers B et C en une ligne s’écrit `A --> B & C`.\nAxiome 11 — A, B, C à la suite s’écrit `A --> B --> C`.\nAxiome 12 — A et B vers C s’écrit `A & B --> C`."], ["Phrase", "Douze principes fondent la notion : le trait, le départ et l’arrivée, les identifiants, la flèche qui indique l’ordre, et huit écritures : `A --> B`, `B --- C`, `A -.-> B`, `A ==> B`, `A -->|oui| B`, `A --> B & C`, `A --> B --> C`, `A & B --> C`."]], "44": [["Axiome", "Axiome 2 — Elle a une étape de départ et une étape d’arrivée."], ["Phrase", "Exclus : une liaison sans étape de départ ou sans étape d’arrivée."]], "45": [["Axiome", "Axiome 1 — Entre deux étapes, une liaison est un trait.\nAxiome 2 — Elle a une étape de départ et une étape d’arrivée.\nAxiome 3 — Elle s’écrit, pour les deux étapes, avec leurs identifiants.\nAxiome 4 — Une liaison avec une pointe s’appelle une flèche : elle indique l’ordre.\nAxiome 5 — Une flèche de A vers B s’écrit `A --> B`.\nAxiome 6 — Une ligne sans pointe entre B et C s’écrit `B --- C`.\nAxiome 7 — Une flèche pointillée de A vers B s’écrit `A -.-> B`.\nAxiome 8 — Une flèche épaisse de A vers B s’écrit `A ==> B`.\nAxiome 9 — Le texte « oui » sur la flèche de A vers B s’écrit `A -->|oui| B`.\nAxiome 10 — A vers B et C en une ligne s’écrit `A --> B & C`.\nAxiome 11 — A, B, C à la suite s’écrit `A --> B --> C`.\nAxiome 12 — A et B vers C s’écrit `A & B --> C`."], ["Phrase", "Les axiomes s’accordent : les quatre premiers disent ce qu’elle est (un trait, un départ et une arrivée, des identifiants, une flèche qui indique l’ordre), les quatre suivants ses formes (`A --> B`, `B --- C`, `A -.-> B`, `A ==> B`), le neuvième le texte (`A -->|oui| B`), et les trois derniers les raccourcis (`A --> B & C`, `A --> B --> C`, `A & B --> C`)."]], "46": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans la carte, Liaison fait partie des Éléments de base et suppose de connaître Étape et Indentation."]], "47": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On la justifie par le besoin de montrer comment on passe d’une étape à l’autre."]], "48": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La preuve qu’un lien est juste : il relie les bonnes étapes dans le dessin."]], "49": [["Axiome", "Axiome 2 — Elle a une étape de départ et une étape d’arrivée.\nAxiome 3 — Elle s’écrit, pour les deux étapes, avec leurs identifiants."], ["Phrase", "Une liaison est bien écrite si ses identifiants désignent l’étape de départ et l’étape d’arrivée voulues."]], "50": [["Axiome", "Axiome 3 — Elle s’écrit, pour les deux étapes, avec leurs identifiants."], ["Phrase", "Pour vérifier : relire les deux identifiants de chaque ligne."]], "51": [["Axiome", "Axiome 3 — Elle s’écrit, pour les deux étapes, avec leurs identifiants."], ["Phrase · hors axiomes", "Un identifiant mal tapé crée une nouvelle étape au lieu de la liaison voulue."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La notion est sûre : ses axiomes sont posés comme des définitions."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On fait une hypothèse en reliant deux étapes : on suppose que l’une suit vraiment l’autre."]], "54": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’observe directement : chaque lien écrit apparaît dans le dessin."]], "55": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Derrière, c’est la théorie des graphes : chaque lien y est une arête, ou un arc s’il a un sens."]], "56": [["Axiome", "Axiome 1 — Entre deux étapes, une liaison est un trait."], ["Phrase", "Une liaison n’est pas une étape : c’est un trait entre deux étapes."]], "57": [["Axiome", "Axiome 1 — Entre deux étapes, une liaison est un trait.\nAxiome 2 — Elle a une étape de départ et une étape d’arrivée."], ["Phrase", "Elle existe dès qu’un trait relie une étape de départ à une étape d’arrivée."]], "58": [["Axiome", "Axiome 1 — Entre deux étapes, une liaison est un trait.\nAxiome 2 — Elle a une étape de départ et une étape d’arrivée.\nAxiome 3 — Elle s’écrit, pour les deux étapes, avec leurs identifiants.\nAxiome 4 — Une liaison avec une pointe s’appelle une flèche : elle indique l’ordre.\nAxiome 6 — Une ligne sans pointe entre B et C s’écrit `B --- C`.\nAxiome 7 — Une flèche pointillée de A vers B s’écrit `A -.-> B`.\nAxiome 8 — Une flèche épaisse de A vers B s’écrit `A ==> B`.\nAxiome 9 — Le texte « oui » sur la flèche de A vers B s’écrit `A -->|oui| B`."], ["Phrase", "Ce qui en fait une liaison, c’est la réunion des axiomes : un trait entre deux étapes, avec un départ et une arrivée, écrit avec leurs identifiants ; une flèche quand elle a une pointe, qui indique l’ordre ; elle peut aussi être sans pointe, pointillée ou épaisse, et porter un texte comme « oui »."]], "59": [["Axiome", "Axiome 1 — Entre deux étapes, une liaison est un trait."], ["Phrase", "Elle appartient à la catégorie des traits."]], "60": [["Axiome", "Axiome 1 — Entre deux étapes, une liaison est un trait.\nAxiome 2 — Elle a une étape de départ et une étape d’arrivée.\nAxiome 3 — Elle s’écrit, pour les deux étapes, avec leurs identifiants.\nAxiome 4 — Une liaison avec une pointe s’appelle une flèche : elle indique l’ordre.\nAxiome 6 — Une ligne sans pointe entre B et C s’écrit `B --- C`.\nAxiome 7 — Une flèche pointillée de A vers B s’écrit `A -.-> B`.\nAxiome 8 — Une flèche épaisse de A vers B s’écrit `A ==> B`.\nAxiome 9 — Le texte « oui » sur la flèche de A vers B s’écrit `A -->|oui| B`."], ["Phrase", "Nécessaire : un trait, un départ et une arrivée, écrits avec leurs identifiants. Au choix : une flèche, ou une ligne sans pointe, pointillée ou épaisse, avec ou sans texte comme « oui »."]], "61": [["Axiome", "Axiome 1 — Entre deux étapes, une liaison est un trait."], ["Phrase", "Sa substance : un trait."]], "62": [["Axiome", "Axiome 2 — Elle a une étape de départ et une étape d’arrivée."], ["Phrase", "Elle commence à l’étape de départ et s’arrête à l’étape d’arrivée."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans ce projet, les liens montrent comment on passe de l’appui à l’enregistrement, puis à la note rangée."]], "64": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On en écrit un chaque fois qu’une étape mène à une autre."]], "65": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les liens orientés viennent des premiers organigrammes de programmation, au milieu du XXᵉ siècle."]], "66": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les signes de liaison imitent, au clavier, la forme qu’ils auront dans le dessin."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle relève de l’informatique et de la théorie des graphes."]], "68": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Des liens clairs permettent à d’autres de suivre le processus sans explication."]], "69": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un lien montre une suite, pas une durée."]], "70": [["Axiome", "Axiome 1 — Entre deux étapes, une liaison est un trait.\nAxiome 2 — Elle a une étape de départ et une étape d’arrivée.\nAxiome 4 — Une liaison avec une pointe s’appelle une flèche : elle indique l’ordre."], ["Phrase", "Son rôle : relier, par un trait, une étape de départ à une étape d’arrivée et, avec une pointe, indiquer l’ordre."]], "71": [["Axiome", "Axiome 4 — Une liaison avec une pointe s’appelle une flèche : elle indique l’ordre.\nAxiome 6 — Une ligne sans pointe entre B et C s’écrit `B --- C`.\nAxiome 7 — Une flèche pointillée de A vers B s’écrit `A -.-> B`.\nAxiome 8 — Une flèche épaisse de A vers B s’écrit `A ==> B`.\nAxiome 9 — Le texte « oui » sur la flèche de A vers B s’écrit `A -->|oui| B`."], ["Phrase", "Elle fournit plusieurs moyens : ligne sans pointe, flèche pointillée, flèche épaisse, texte sur la flèche."]], "72": [["Axiome", "Axiome 10 — A vers B et C en une ligne s’écrit `A --> B & C`.\nAxiome 11 — A, B, C à la suite s’écrit `A --> B --> C`.\nAxiome 12 — A et B vers C s’écrit `A & B --> C`."], ["Phrase", "Elle permet d’écrire plusieurs liaisons en une ligne : `A --> B & C`, `A --> B --> C`, `A & B --> C`."]], "73": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En pratique, elle rend visible ce qui suit quoi."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ici, elle sert à enchaîner les étapes de l’enregistreur, de l’appui à la note rangée."]], "75": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle devient utile dès qu’il y a deux étapes."]], "76": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Écrire un lien, c’est affirmer qu’une étape mène à une autre."]], "77": [["Axiome", "Axiome 2 — Elle a une étape de départ et une étape d’arrivée.\nAxiome 3 — Elle s’écrit, pour les deux étapes, avec leurs identifiants.\nAxiome 4 — Une liaison avec une pointe s’appelle une flèche : elle indique l’ordre.\nAxiome 5 — Une flèche de A vers B s’écrit `A --> B`.\nAxiome 6 — Une ligne sans pointe entre B et C s’écrit `B --- C`.\nAxiome 7 — Une flèche pointillée de A vers B s’écrit `A -.-> B`.\nAxiome 8 — Une flèche épaisse de A vers B s’écrit `A ==> B`.\nAxiome 9 — Le texte « oui » sur la flèche de A vers B s’écrit `A -->|oui| B`."], ["Phrase", "- Repérer l’étape de départ et l’étape d’arrivée.\n- Écrire leurs identifiants, reliés par le signe voulu : `A --> B`.\n- Changer le signe pour une autre forme : sans pointe, pointillée ou épaisse.\n- Ajouter un texte sur la flèche si besoin : `A -->|oui| B`."]], "78": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle change quand on modifie l’une des deux étapes qu’elle relie, ou sa forme."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Au fil du projet, des liens s’ajoutent quand on découvre de nouveaux chemins."]], "80": [["Axiome", "Axiome 4 — Une liaison avec une pointe s’appelle une flèche : elle indique l’ordre.\nAxiome 5 — Une flèche de A vers B s’écrit `A --> B`.\nAxiome 7 — Une flèche pointillée de A vers B s’écrit `A -.-> B`.\nAxiome 8 — Une flèche épaisse de A vers B s’écrit `A ==> B`."], ["Phrase", "On peut transformer `A --> B` en flèche pointillée ou épaisse sans changer les étapes."]], "81": [["Axiome", "Axiome 3 — Elle s’écrit, pour les deux étapes, avec leurs identifiants."], ["Phrase", "Elle naît quand on écrit deux identifiants reliés par un signe."]], "82": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le programme lit chaque ligne, retrouve les deux étapes, puis trace le lien entre elles."]], "83": [["Axiome", "Axiome 7 — Une flèche pointillée de A vers B s’écrit `A -.-> B`.\nAxiome 8 — Une flèche épaisse de A vers B s’écrit `A ==> B`."], ["Phrase · hors axiomes", "On l’adapte au besoin : pointillée pour un cas rare, épaisse pour le chemin principal."]], "84": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "D’une version à l’autre, des liens s’ajoutent, se retirent ou changent de forme."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un bon lien se juge à sa clarté : on voit tout de suite d’où il part et où il va."]], "86": [["Axiome", "Axiome 3 — Elle s’écrit, pour les deux étapes, avec leurs identifiants."], ["Phrase", "Norme : un identifiant de chaque côté du signe."]], "87": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Sa valeur tient à sa justesse : il ne doit relier que ce qui se suit vraiment."]], "88": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Critères : peu de croisements, un seul sens de lecture, des textes courts sur les liens qui en portent."]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un lien de qualité se suit d’un coup d’œil."]], "90": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle est pertinente si elle montre un vrai passage d’une étape à une autre ; sinon, on la retire."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’améliore en évitant les croisements et en groupant les liens qui partent d’une même étape."]]}, "fin": {"1": [["Axiome", "Axiome 1 — Le début et la fin sont des étapes.\nAxiome 2 — Ils marquent l’entrée ou la sortie du processus.\nAxiome 3 — Ils se placent aux extrémités du diagramme.\nAxiome 4 — Aucune liaison n’arrive au début.\nAxiome 5 — Aucune liaison ne part de la fin.\nAxiome 6 — En général, ils ont la forme d’un stade."], ["Phrase", "Le début et la fin se composent de deux étapes qui marquent l’entrée et la sortie du processus, placées aux extrémités du diagramme : aucune liaison n’arrive au début, aucune ne part de la fin ; en général, ils ont la forme d’un stade."]], "2": [["Axiome", "Axiome 1 — Le début et la fin sont des étapes.\nAxiome 2 — Ils marquent l’entrée ou la sortie du processus.\nAxiome 3 — Ils se placent aux extrémités du diagramme.\nAxiome 4 — Aucune liaison n’arrive au début.\nAxiome 5 — Aucune liaison ne part de la fin.\nAxiome 6 — En général, ils ont la forme d’un stade."], ["Phrase", "Leurs éléments fondamentaux sont ceux que posent les axiomes : des étapes, l’entrée et la sortie, les extrémités du diagramme, aucune liaison qui arrive au début, aucune qui part de la fin, et la forme d’un stade."]], "3": [["Axiome", "Axiome 6 — En général, ils ont la forme d’un stade.\nAxiome 7 — Le début « Appui » s’écrit `D([Appui])`.\nAxiome 8 — La fin « Note rangée » s’écrit `F([Note rangée])`."], ["Phrase", "On écrit l’identifiant, puis le texte entre parenthèses et crochets, ce qui donne un stade : `D([Appui])` pour le début, `F([Note rangée])` pour la fin."]], "4": [["Axiome", "Axiome 2 — Ils marquent l’entrée ou la sortie du processus."], ["Phrase", "Deux parties : le début, qui marque l’entrée, et la fin, qui marque la sortie du processus."]], "5": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En général, un début et une fin ; un processus peut pourtant avoir plusieurs fins, par exemple une fin normale et une fin d’erreur."]], "6": [["Axiome", "Axiome 1 — Le début et la fin sont des étapes.\nAxiome 6 — En général, ils ont la forme d’un stade."], ["Phrase", "Leur nature : des étapes, en général en forme de stade."]], "7": [["Axiome", "Axiome 1 — Le début et la fin sont des étapes.\nAxiome 2 — Ils marquent l’entrée ou la sortie du processus."], ["Phrase", "Le début et la fin, ce sont les étapes qui marquent l’entrée et la sortie du processus."]], "8": [["Axiome", "Axiome 1 — Le début et la fin sont des étapes.\nAxiome 2 — Ils marquent l’entrée ou la sortie du processus.\nAxiome 3 — Ils se placent aux extrémités du diagramme.\nAxiome 4 — Aucune liaison n’arrive au début.\nAxiome 5 — Aucune liaison ne part de la fin.\nAxiome 6 — En général, ils ont la forme d’un stade."], ["Phrase", "Le début et la fin sont des étapes qui marquent l’entrée ou la sortie du processus ; ils se placent aux extrémités du diagramme ; aucune liaison n’arrive au début, aucune ne part de la fin ; en général, ils ont la forme d’un stade."]], "9": [["Axiome", "Axiome 1 — Le début et la fin sont des étapes.\nAxiome 2 — Ils marquent l’entrée ou la sortie du processus.\nAxiome 3 — Ils se placent aux extrémités du diagramme.\nAxiome 4 — Aucune liaison n’arrive au début.\nAxiome 5 — Aucune liaison ne part de la fin."], ["Phrase", "Être des étapes, marquer l’entrée ou la sortie, se placer aux extrémités, n’avoir aucune liaison qui arrive au début ni qui part de la fin : ces propriétés les constituent."]], "10": [["Axiome", "Axiome 7 — Le début « Appui » s’écrit `D([Appui])`.\nAxiome 8 — La fin « Note rangée » s’écrit `F([Note rangée])`."], ["Phrase", "Exemples des axiomes : le début « Appui », `D([Appui])`, et la fin « Note rangée », `F([Note rangée])`."]], "11": [["Axiome", "Axiome 2 — Ils marquent l’entrée ou la sortie du processus."], ["Phrase · hors axiomes", "Les axiomes les appellent début et fin, ou entrée et sortie ; en anglais, start et end, et on parle souvent de terminaux."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Début » vient de « débuter », jouer le premier coup ; « fin » vient du latin finis, « limite »."]], "13": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le lecteur cherche d’abord le point de départ, puis suit le chemin jusqu’au dernier point."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Fin » veut aussi dire but, comme dans « la fin justifie les moyens » ; ici, c’est le dernier point du processus."]], "15": [["Axiome", "Axiome 3 — Ils se placent aux extrémités du diagramme."], ["Phrase", "Ils encadrent le diagramme : ils se placent à ses extrémités."]], "16": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ils n’ont pas de rang au-dessus des autres points ; seule leur place change."]], "17": [["Axiome", "Axiome 2 — Ils marquent l’entrée ou la sortie du processus.\nAxiome 3 — Ils se placent aux extrémités du diagramme."], ["Phrase", "Ils forment le cadre du processus : l’entrée à une extrémité, la sortie à l’autre."]], "18": [["Axiome", "Axiome 3 — Ils se placent aux extrémités du diagramme."], ["Phrase", "Le début se place à une extrémité, la fin à l’autre."]], "19": [["Axiome", "Axiome 1 — Le début et la fin sont des étapes."], ["Phrase", "Ils se rangent parmi les étapes, comme des étapes particulières."]], "20": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On distingue parfois plusieurs fins : une fin normale, une fin en erreur, une fin annulée."]], "21": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un sous-processus a souvent son propre premier et son propre dernier point."]], "22": [["Axiome", "Axiome 4 — Aucune liaison n’arrive au début.\nAxiome 5 — Aucune liaison ne part de la fin."], ["Phrase", "Aucune liaison n’arrive au début : il n’a que des liaisons qui en sortent ; aucune ne part de la fin : elle n’a que des liaisons qui y mènent."]], "23": [["Axiome", "Axiome 4 — Aucune liaison n’arrive au début.\nAxiome 5 — Aucune liaison ne part de la fin."], ["Phrase", "Puisqu’aucune liaison n’arrive au début, rien ne le précède ; puisqu’aucune ne part de la fin, rien ne la suit."]], "24": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le premier point déclenche le processus : sans lui, rien ne se passe."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Plus un processus a de chemins possibles, plus il risque d’avoir plusieurs points finaux."]], "26": [["Axiome", "Axiome 2 — Ils marquent l’entrée ou la sortie du processus."], ["Phrase", "Le début marque l’entrée, la fin marque la sortie."]], "27": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans la carte, Début et fin dépend de Liaison ; Structure générale du système dépend de lui."]], "28": [["Axiome", "Axiome 2 — Ils marquent l’entrée ou la sortie du processus.\nAxiome 4 — Aucune liaison n’arrive au début.\nAxiome 5 — Aucune liaison ne part de la fin."], ["Phrase", "Le début s’oppose à la fin : l’entrée contre la sortie ; aucune liaison n’arrive au début, aucune ne part de la fin."]], "29": [["Axiome", "Axiome 2 — Ils marquent l’entrée ou la sortie du processus."], ["Phrase", "Ils se complètent : l’un marque l’entrée, l’autre la sortie."]], "30": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une décision peut mener à des fins différentes selon la réponse."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Comme la première et la dernière page d’un livre, ils encadrent le reste."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ajouter un point avant le premier oblige à revoir le début du processus."]], "33": [["Axiome", "Axiome 4 — Aucune liaison n’arrive au début.\nAxiome 5 — Aucune liaison ne part de la fin."], ["Phrase", "Rien n’arrive au début, rien ne part de la fin : le début vient avant tout, la fin après tout."]], "34": [["Axiome", "Axiome 3 — Ils se placent aux extrémités du diagramme."], ["Phrase", "Ils se placent aux extrémités du diagramme : le début à un bout, la fin à l’autre."]], "35": [["Axiome", "Axiome 1 — Le début et la fin sont des étapes.\nAxiome 2 — Ils marquent l’entrée ou la sortie du processus.\nAxiome 3 — Ils se placent aux extrémités du diagramme.\nAxiome 4 — Aucune liaison n’arrive au début.\nAxiome 5 — Aucune liaison ne part de la fin.\nAxiome 6 — En général, ils ont la forme d’un stade.\nAxiome 7 — Le début « Appui » s’écrit `D([Appui])`.\nAxiome 8 — La fin « Note rangée » s’écrit `F([Note rangée])`."], ["Phrase", "Huit propositions : ce sont des étapes ; ils marquent l’entrée ou la sortie ; ils se placent aux extrémités ; aucune liaison n’arrive au début ; aucune ne part de la fin ; en général, ils ont la forme d’un stade ; `D([Appui])` et `F([Note rangée])` en sont des exemples."]], "36": [["Axiome", "Axiome 1 — Le début et la fin sont des étapes.\nAxiome 2 — Ils marquent l’entrée ou la sortie du processus.\nAxiome 3 — Ils se placent aux extrémités du diagramme.\nAxiome 6 — En général, ils ont la forme d’un stade."], ["Phrase", "On dit d’eux qu’ils sont des étapes, qu’ils marquent l’entrée ou la sortie, qu’ils se placent aux extrémités et qu’ils ont en général la forme d’un stade."]], "37": [["Axiome", "Axiome 4 — Aucune liaison n’arrive au début."], ["Phrase", "Puisqu’aucune liaison n’arrive au début, une boîte où arrive une liaison n’est pas le début."]], "38": [["Axiome", "Axiome 4 — Aucune liaison n’arrive au début."], ["Phrase", "Conséquence nécessaire : le début n’a que des liaisons qui en sortent, puisqu’aucune liaison n’arrive au début."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "À force d’en dessiner, on remarque que les processus clairs ont un seul point de départ."]], "40": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Si un point n’a aucune suite alors qu’il n’est pas prévu comme dernier, l’explication la plus probable est un lien oublié."]], "41": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Argument habituel : marquer clairement le premier et le dernier point montre où le processus commence et où il s’arrête."]], "42": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les axiomes ne se démontrent pas : on les admet. On montre qu’un début ou une fin est bien placé en vérifiant qu’il respecte chacun d’eux."]], "43": [["Axiome", "Axiome 1 — Le début et la fin sont des étapes.\nAxiome 2 — Ils marquent l’entrée ou la sortie du processus.\nAxiome 3 — Ils se placent aux extrémités du diagramme.\nAxiome 4 — Aucune liaison n’arrive au début.\nAxiome 5 — Aucune liaison ne part de la fin.\nAxiome 6 — En général, ils ont la forme d’un stade.\nAxiome 7 — Le début « Appui » s’écrit `D([Appui])`.\nAxiome 8 — La fin « Note rangée » s’écrit `F([Note rangée])`."], ["Phrase", "Huit principes fondent la notion : ce sont des étapes, l’entrée ou la sortie, les extrémités, rien n’arrive au début, rien ne part de la fin, le stade, et les exemples `D([Appui])` et `F([Note rangée])`."]], "44": [["Axiome", "Axiome 4 — Aucune liaison n’arrive au début.\nAxiome 5 — Aucune liaison ne part de la fin."], ["Phrase", "Exclus : une liaison qui arrive au début, ou une liaison qui part de la fin."]], "45": [["Axiome", "Axiome 1 — Le début et la fin sont des étapes.\nAxiome 2 — Ils marquent l’entrée ou la sortie du processus.\nAxiome 3 — Ils se placent aux extrémités du diagramme.\nAxiome 4 — Aucune liaison n’arrive au début.\nAxiome 5 — Aucune liaison ne part de la fin.\nAxiome 6 — En général, ils ont la forme d’un stade.\nAxiome 7 — Le début « Appui » s’écrit `D([Appui])`.\nAxiome 8 — La fin « Note rangée » s’écrit `F([Note rangée])`."], ["Phrase", "Les axiomes s’accordent : les deux premiers disent ce qu’ils sont (des étapes qui marquent l’entrée ou la sortie), le troisième leur place (les extrémités), les deux suivants leurs liaisons (rien n’arrive au début, rien ne part de la fin), le sixième leur forme (un stade), et les deux derniers des exemples (`D([Appui])` et `F([Note rangée])`)."]], "46": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans la carte, Début et fin fait partie de la famille « Début, fin et données » et suppose de connaître Liaison."]], "47": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On les justifie par le besoin de savoir où le processus commence et où il s’arrête."]], "48": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La preuve qu’ils sont bien placés : on peut suivre le chemin du premier au dernier point sans se perdre."]], "49": [["Axiome", "Axiome 1 — Le début et la fin sont des étapes.\nAxiome 4 — Aucune liaison n’arrive au début.\nAxiome 5 — Aucune liaison ne part de la fin."], ["Phrase", "Une étape est le début si aucune liaison n’y arrive, la fin si aucune n’en part."]], "50": [["Axiome", "Axiome 4 — Aucune liaison n’arrive au début.\nAxiome 5 — Aucune liaison ne part de la fin."], ["Phrase", "Pour vérifier : aucune liaison n’arrive au début, aucune ne part de la fin."]], "51": [["Axiome", "Axiome 4 — Aucune liaison n’arrive au début.\nAxiome 5 — Aucune liaison ne part de la fin."], ["Phrase", "Une liaison qui arrive au début ou qui part de la fin montre une erreur."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La notion est sûre : ses axiomes sont posés comme des définitions."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On fait une hypothèse en fixant le premier point : on suppose que rien ne se passe avant."]], "54": [["Axiome", "Axiome 6 — En général, ils ont la forme d’un stade."], ["Phrase", "On les reconnaît dans le dessin à leur forme de stade."]], "55": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Derrière, c’est la théorie des graphes : un sommet sans arc entrant est une source, un sommet sans arc sortant est un puits."]], "56": [["Axiome", "Axiome 1 — Le début et la fin sont des étapes."], ["Phrase", "Le début et la fin ne sont pas hors du diagramme : ce sont des étapes."]], "57": [["Axiome", "Axiome 1 — Le début et la fin sont des étapes."], ["Phrase · hors axiomes", "Ils existent comme toutes les étapes, dès qu’on les écrit."]], "58": [["Axiome", "Axiome 1 — Le début et la fin sont des étapes.\nAxiome 2 — Ils marquent l’entrée ou la sortie du processus.\nAxiome 3 — Ils se placent aux extrémités du diagramme.\nAxiome 4 — Aucune liaison n’arrive au début.\nAxiome 5 — Aucune liaison ne part de la fin.\nAxiome 6 — En général, ils ont la forme d’un stade."], ["Phrase", "Ce qui en fait le début et la fin, c’est la réunion des axiomes : des étapes qui marquent l’entrée ou la sortie, aux extrémités du diagramme, sans liaison qui arrive au début ni qui part de la fin, en général en forme de stade."]], "59": [["Axiome", "Axiome 1 — Le début et la fin sont des étapes."], ["Phrase", "Ils appartiennent à la catégorie des étapes."]], "60": [["Axiome", "Axiome 1 — Le début et la fin sont des étapes.\nAxiome 2 — Ils marquent l’entrée ou la sortie du processus.\nAxiome 3 — Ils se placent aux extrémités du diagramme.\nAxiome 4 — Aucune liaison n’arrive au début.\nAxiome 5 — Aucune liaison ne part de la fin.\nAxiome 6 — En général, ils ont la forme d’un stade."], ["Phrase", "Nécessaire : des étapes qui marquent l’entrée ou la sortie, aux extrémités, sans liaison qui arrive au début ni qui part de la fin. Habituel, mais pas obligatoire : la forme d’un stade."]], "61": [["Axiome", "Axiome 2 — Ils marquent l’entrée ou la sortie du processus."], ["Phrase", "Leur substance : l’entrée et la sortie du processus."]], "62": [["Axiome", "Axiome 3 — Ils se placent aux extrémités du diagramme."], ["Phrase", "Ils marquent les limites du diagramme : ses extrémités."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans ce projet, le début est l’appui sur le bouton, la fin est la note rangée."]], "64": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On les pose dès qu’on dessine un processus complet, pour savoir d’où il démarre et où il s’arrête."]], "65": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le symbole arrondi du terminal vient des normes de diagrammes de flux des années 1960 et 1970."]], "66": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On place le plus souvent le premier point en haut ou à gauche, selon le sens de lecture."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ils relèvent de la modélisation des processus."]], "68": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un point de départ clair permet à tous de savoir par où commencer la lecture."]], "69": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ils marquent le premier et le dernier moment du processus, pas sa durée."]], "70": [["Axiome", "Axiome 2 — Ils marquent l’entrée ou la sortie du processus."], ["Phrase", "Leur rôle : marquer l’entrée et la sortie du processus."]], "71": [["Axiome", "Axiome 6 — En général, ils ont la forme d’un stade.\nAxiome 7 — Le début « Appui » s’écrit `D([Appui])`.\nAxiome 8 — La fin « Note rangée » s’écrit `F([Note rangée])`."], ["Phrase", "Ils fournissent une forme reconnaissable, le stade : `D([Appui])` et `F([Note rangée])`."]], "72": [["Axiome", "Axiome 2 — Ils marquent l’entrée ou la sortie du processus.\nAxiome 3 — Ils se placent aux extrémités du diagramme."], ["Phrase", "Ils permettent de situer l’entrée et la sortie aux extrémités du diagramme."]], "73": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En pratique, ils montrent tout de suite où commencer la lecture."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ici, ils encadrent la structure de l’enregistreur : l’appui, puis la note rangée."]], "75": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ils deviennent utiles dès que le processus compte plus de deux ou trois points."]], "76": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Poser un dernier point, c’est décider où le processus s’arrête."]], "77": [["Axiome", "Axiome 3 — Ils se placent aux extrémités du diagramme.\nAxiome 6 — En général, ils ont la forme d’un stade.\nAxiome 7 — Le début « Appui » s’écrit `D([Appui])`.\nAxiome 8 — La fin « Note rangée » s’écrit `F([Note rangée])`."], ["Phrase · hors axiomes", "- Écrire le début en stade : `D([Appui])`.\n- Écrire la fin en stade : `F([Note rangée])`.\n- Les placer aux extrémités, puis relier le reste entre les deux."]], "78": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ils changent quand le processus commence ou s’arrête ailleurs."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Au fil du projet, on ajoute parfois une seconde fin, pour un cas d’erreur."]], "80": [["Axiome", "Axiome 6 — En général, ils ont la forme d’un stade."], ["Phrase · hors axiomes", "On peut changer leur forme ; le stade reste la plus courante."]], "81": [["Axiome", "Axiome 7 — Le début « Appui » s’écrit `D([Appui])`.\nAxiome 8 — La fin « Note rangée » s’écrit `F([Note rangée])`."], ["Phrase", "Ils naissent quand on écrit `D([Appui])` et `F([Note rangée])`."]], "82": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le processus démarre au premier point, suit les liens, et s’arrête au dernier."]], "83": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On les adapte au processus : plusieurs fins s’il y a plusieurs issues."]], "84": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "D’une version à l’autre, le premier point reste souvent le même ; les fins changent plus souvent."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On les juge à leur clarté : on voit tout de suite où le processus commence et où il s’arrête."]], "86": [["Axiome", "Axiome 6 — En général, ils ont la forme d’un stade."], ["Phrase · hors axiomes", "Norme habituelle : la forme d’un stade, comme dans la norme ISO 5807."]], "87": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Leur valeur tient à l’orientation qu’ils donnent : on sait où commencer et où s’arrêter."]], "88": [["Axiome", "Axiome 4 — Aucune liaison n’arrive au début.\nAxiome 5 — Aucune liaison ne part de la fin.\nAxiome 6 — En général, ils ont la forme d’un stade."], ["Phrase · hors axiomes", "Critères : rien n’arrive au début, rien ne part de la fin, et la forme d’un stade ; en plus, des textes courts."]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un début et une fin de qualité se repèrent en une seconde."]], "90": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ils sont pertinents pour tout processus complet ; pour un extrait, on peut s’en passer."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On les améliore en leur donnant un texte clair : ce qui déclenche le processus, ce qu’il produit."]]}, "don": {"1": [["Axiome", "Axiome 1 — Une donnée est une étape qui représente une information.\nAxiome 2 — Une donnée n’est pas une action.\nAxiome 3 — Une action la produit ou l’utilise.\nAxiome 4 — Elle se place entre l’action qui l’utilise et celle qui la produit.\nAxiome 5 — Sa forme habituelle est le parallélogramme."], ["Phrase", "Une donnée se compose d’une étape qui représente une information et qui n’est pas une action ; une action la produit ou l’utilise ; elle se place entre l’action qui l’utilise et celle qui la produit ; sa forme habituelle est le parallélogramme."]], "2": [["Axiome", "Axiome 1 — Une donnée est une étape qui représente une information.\nAxiome 2 — Une donnée n’est pas une action.\nAxiome 3 — Une action la produit ou l’utilise.\nAxiome 4 — Elle se place entre l’action qui l’utilise et celle qui la produit.\nAxiome 5 — Sa forme habituelle est le parallélogramme."], ["Phrase", "Ses éléments fondamentaux sont ceux que posent les axiomes : une étape, une information, qui n’est pas une action, une action qui la produit ou l’utilise, une place entre ces actions, et la forme d’un parallélogramme."]], "3": [["Axiome", "Axiome 5 — Sa forme habituelle est le parallélogramme.\nAxiome 6 — Le son « Audio » s’écrit `B[/Audio/]`."], ["Phrase", "On écrit l’identifiant, puis le texte entre barres obliques et crochets, ce qui donne un parallélogramme : `B[/Audio/]`."]], "4": [["Axiome", "Axiome 1 — Une donnée est une étape qui représente une information."], ["Phrase", "Elle ne se décompose pas : elle représente une information."]], "5": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le nombre de données d’un diagramme n’est pas fixé ; on ne dessine que les plus importantes."]], "6": [["Axiome", "Axiome 1 — Une donnée est une étape qui représente une information.\nAxiome 2 — Une donnée n’est pas une action."], ["Phrase", "Sa nature : une information, pas une action."]], "7": [["Axiome", "Axiome 1 — Une donnée est une étape qui représente une information."], ["Phrase", "Une donnée, c’est une étape qui représente une information."]], "8": [["Axiome", "Axiome 1 — Une donnée est une étape qui représente une information.\nAxiome 2 — Une donnée n’est pas une action.\nAxiome 3 — Une action la produit ou l’utilise.\nAxiome 4 — Elle se place entre l’action qui l’utilise et celle qui la produit.\nAxiome 5 — Sa forme habituelle est le parallélogramme."], ["Phrase", "Une donnée est une étape qui représente une information ; ce n’est pas une action ; une action la produit ou l’utilise ; elle se place entre l’action qui l’utilise et celle qui la produit ; sa forme habituelle est le parallélogramme."]], "9": [["Axiome", "Axiome 1 — Une donnée est une étape qui représente une information.\nAxiome 2 — Une donnée n’est pas une action.\nAxiome 3 — Une action la produit ou l’utilise."], ["Phrase", "Représenter une information, ne pas être une action, être produite ou utilisée par une action : ces propriétés la constituent."]], "10": [["Axiome", "Axiome 6 — Le son « Audio » s’écrit `B[/Audio/]`."], ["Phrase · hors axiomes", "Exemple des axiomes : le son « Audio », `B[/Audio/]` ; dans l’enregistreur, le texte transcrit en est une autre."]], "11": [["Axiome", "Axiome 1 — Une donnée est une étape qui représente une information."], ["Phrase · hors axiomes", "Les axiomes l’appellent donnée, ou information ; en anglais, data."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le mot vient du latin datum, « ce qui est donné »."]], "13": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le lecteur reconnaît à sa forme ce qui circule dans le processus, et non ce qui s’y fait."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Donnée » veut aussi dire, en mathématiques, ce qu’on connaît au départ d’un problème ; ici, c’est ce qui circule dans le processus."]], "15": [["Axiome", "Axiome 3 — Une action la produit ou l’utilise.\nAxiome 4 — Elle se place entre l’action qui l’utilise et celle qui la produit."], ["Phrase", "Elle s’insère entre l’action qui la produit et celle qui l’utilise."]], "16": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle n’est ni au-dessus ni au-dessous des autres points : elle circule entre eux."]], "17": [["Axiome", "Axiome 3 — Une action la produit ou l’utilise.\nAxiome 4 — Elle se place entre l’action qui l’utilise et celle qui la produit."], ["Phrase", "Dans l’ensemble, les données font le lien entre les actions : chacune entre l’action qui la produit et celle qui l’utilise."]], "18": [["Axiome", "Axiome 3 — Une action la produit ou l’utilise.\nAxiome 4 — Elle se place entre l’action qui l’utilise et celle qui la produit."], ["Phrase", "Elle se dispose sur le chemin, entre l’action qui la produit et celle qui l’utilise."]], "19": [["Axiome", "Axiome 1 — Une donnée est une étape qui représente une information."], ["Phrase", "Elle se range parmi les étapes, comme une étape d’information."]], "20": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On distingue souvent les données d’entrée, qu’on reçoit, et les données de sortie, qu’on fournit."]], "21": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une grosse donnée peut se découper en plusieurs plus petites : un enregistrement et sa date, par exemple."]], "22": [["Axiome", "Axiome 3 — Une action la produit ou l’utilise."], ["Phrase", "Elle est liée aux actions : une action la produit ou l’utilise."]], "23": [["Axiome", "Axiome 2 — Une donnée n’est pas une action.\nAxiome 3 — Une action la produit ou l’utilise."], ["Phrase", "Puisqu’elle n’est pas une action, il faut une action pour la produire ou l’utiliser."]], "24": [["Axiome", "Axiome 3 — Une action la produit ou l’utilise."], ["Phrase", "Une action la produit : sans cette action, pas de donnée."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Plus un processus traite d’éléments, plus il fait circuler de données."]], "26": [["Axiome", "Axiome 1 — Une donnée est une étape qui représente une information.\nAxiome 3 — Une action la produit ou l’utilise."], ["Phrase", "La donnée porte l’information ; l’action la produit ou l’utilise."]], "27": [["Axiome", "Axiome 3 — Une action la produit ou l’utilise."], ["Phrase · hors axiomes", "Elle dépend de l’action qui la produit. Dans la carte, elle dépend de Liaison, et Stockage dépend d’elle."]], "28": [["Axiome", "Axiome 2 — Une donnée n’est pas une action."], ["Phrase", "Elle s’oppose à l’action : une donnée n’est pas une action."]], "29": [["Axiome", "Axiome 3 — Une action la produit ou l’utilise."], ["Phrase", "Donnée et action se complètent : l’action la produit ou l’utilise."]], "30": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une décision peut dépendre d’une donnée : par exemple, la durée d’un enregistrement."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Comme un colis sur une chaîne de montage, elle passe d’un poste à l’autre."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Changer une donnée peut changer ce que font les points suivants."]], "33": [["Axiome", "Axiome 3 — Une action la produit ou l’utilise."], ["Phrase", "Elle existe après l’action qui la produit et avant celle qui l’utilise."]], "34": [["Axiome", "Axiome 3 — Une action la produit ou l’utilise.\nAxiome 4 — Elle se place entre l’action qui l’utilise et celle qui la produit."], ["Phrase", "Dans le dessin, elle se place entre l’action qui la produit et celle qui l’utilise."]], "35": [["Axiome", "Axiome 1 — Une donnée est une étape qui représente une information.\nAxiome 2 — Une donnée n’est pas une action.\nAxiome 3 — Une action la produit ou l’utilise.\nAxiome 4 — Elle se place entre l’action qui l’utilise et celle qui la produit.\nAxiome 5 — Sa forme habituelle est le parallélogramme.\nAxiome 6 — Le son « Audio » s’écrit `B[/Audio/]`."], ["Phrase", "Six propositions : c’est une étape qui représente une information ; ce n’est pas une action ; une action la produit ou l’utilise ; elle se place entre l’action qui l’utilise et celle qui la produit ; sa forme habituelle est le parallélogramme ; `B[/Audio/]` en est un exemple."]], "36": [["Axiome", "Axiome 1 — Une donnée est une étape qui représente une information.\nAxiome 2 — Une donnée n’est pas une action.\nAxiome 3 — Une action la produit ou l’utilise.\nAxiome 5 — Sa forme habituelle est le parallélogramme."], ["Phrase", "On dit d’une donnée qu’elle est une étape qui représente une information, qu’elle n’est pas une action, qu’une action la produit ou l’utilise, et qu’elle a en général la forme d’un parallélogramme."]], "37": [["Axiome", "Axiome 5 — Sa forme habituelle est le parallélogramme."], ["Phrase", "En voyant un parallélogramme, on sait qu’il s’agit en général d’une donnée."]], "38": [["Axiome", "Axiome 2 — Une donnée n’est pas une action.\nAxiome 3 — Une action la produit ou l’utilise."], ["Phrase", "Conséquence nécessaire : une donnée ne fait rien par elle-même, puisqu’elle n’est pas une action ; il faut une action qui l’utilise."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "À force d’en dessiner, on remarque que les données les plus utiles sont celles qui passent d’une partie du processus à une autre."]], "40": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Si un point du dessin porte un nom au lieu d’un verbe, l’explication la plus probable est qu’il s’agit d’une donnée."]], "41": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Argument habituel : dessiner les données montre ce qui circule, pas seulement ce qui se fait."]], "42": [["Axiome", "Non couvert par les axiomes."], ["Phrase ·
