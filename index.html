re trois et sept, l’ensemble reste lisible d’un coup d’œil."]], "6": [["Axiome", "Axiome 1 — La structure générale est un diagramme de flux."], ["Phrase", "Sa nature : un diagramme de flux."]], "7": [["Axiome", "Axiome 1 — La structure générale est un diagramme de flux.\nAxiome 2 — Elle montre le système entier."], ["Phrase", "La structure générale, c’est un diagramme de flux qui montre le système entier."]], "8": [["Axiome", "Axiome 1 — La structure générale est un diagramme de flux.\nAxiome 2 — Elle montre le système entier.\nAxiome 3 — Une grande phase y est un sous-groupe ou une seule boîte.\nAxiome 4 — Elle ne montre pas comment chaque phase est réalisée.\nAxiome 5 — Les décisions gardées sont celles qui changent le chemin du système entier."], ["Phrase", "La structure générale est un diagramme de flux qui montre le système entier ; chaque grande phase y est un sous-groupe ou une seule boîte ; elle ne montre pas comment chaque phase est réalisée ; elle ne garde que les décisions qui changent le chemin du système entier."]], "9": [["Axiome", "Axiome 1 — La structure générale est un diagramme de flux.\nAxiome 2 — Elle montre le système entier.\nAxiome 4 — Elle ne montre pas comment chaque phase est réalisée."], ["Phrase", "Être un diagramme de flux, montrer le système entier, ne pas montrer comment chaque phase est réalisée : ces propriétés la constituent."]], "10": [["Axiome", "Axiome 6 — Une phase « Emballer », sans détail, s’écrit `A[[Emballer]]`.\nAxiome 7 — Le début « Colis prêt » s’écrit `D([Colis prêt])`.\nAxiome 8 — La fin « Colis reçu » s’écrit `F([Colis reçu])`."], ["Phrase", "Exemple des axiomes : un envoi de colis, de `D([Colis prêt])` à `F([Colis reçu])`, avec la phase `A[[Emballer]]`."]], "11": [["Axiome", "Axiome 2 — Elle montre le système entier."], ["Phrase · hors axiomes", "Les axiomes l’appellent structure générale : la vue du système entier ; on dit aussi vue d’ensemble ou architecture."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Structure » vient du latin structura, « construction » ; « système » vient du grec systema, « ensemble »."]], "13": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le lecteur y cherche les grandes étapes et l’ordre dans lequel elles se suivent."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Structure » désigne aussi la charpente d’un bâtiment ; ici, c’est le plan d’ensemble d’un projet."]], "15": [["Axiome", "Axiome 3 — Une grande phase y est un sous-groupe ou une seule boîte."], ["Phrase · hors axiomes", "Un début, une suite de grandes phases, une fin."]], "16": [["Axiome", "Axiome 3 — Une grande phase y est un sous-groupe ou une seule boîte.\nAxiome 4 — Elle ne montre pas comment chaque phase est réalisée."], ["Phrase", "Elle est au niveau le plus haut : chaque grande phase y tient en une seule boîte, sans montrer comment chaque phase est réalisée."]], "17": [["Axiome", "Axiome 2 — Elle montre le système entier.\nAxiome 3 — Une grande phase y est un sous-groupe ou une seule boîte."], ["Phrase", "Elle montre le système entier, découpé en grandes phases."]], "18": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les phases se disposent dans l’ordre où elles se déroulent, du premier point au dernier."]], "19": [["Axiome", "Axiome 1 — La structure générale est un diagramme de flux."], ["Phrase", "Elle se range parmi les diagrammes de flux."]], "20": [["Axiome", "Axiome 3 — Une grande phase y est un sous-groupe ou une seule boîte."], ["Phrase", "Deux façons de montrer une grande phase : un sous-groupe ou une seule boîte."]], "21": [["Axiome", "Axiome 3 — Une grande phase y est un sous-groupe ou une seule boîte.\nAxiome 4 — Elle ne montre pas comment chaque phase est réalisée."], ["Phrase · hors axiomes", "Chaque grande phase forme une unité ; comment chaque phase est réalisée se voit ailleurs."]], "22": [["Axiome", "Axiome 1 — La structure générale est un diagramme de flux.\nAxiome 3 — Une grande phase y est un sous-groupe ou une seule boîte."], ["Phrase", "Elle relie les grandes phases dans un diagramme de flux."]], "23": [["Axiome", "Axiome 2 — Elle montre le système entier.\nAxiome 4 — Elle ne montre pas comment chaque phase est réalisée."], ["Phrase", "Pour montrer le système entier sur une page, elle ne montre pas comment chaque phase est réalisée."]], "24": [["Axiome", "Axiome 5 — Les décisions gardées sont celles qui changent le chemin du système entier."], ["Phrase", "Une décision n’y figure que si elle change le chemin du système entier."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Plus le système est grand, plus il faut de recul pour le dessiner sur une page."]], "26": [["Axiome", "Axiome 2 — Elle montre le système entier.\nAxiome 3 — Une grande phase y est un sous-groupe ou une seule boîte."], ["Phrase", "Les grandes phases découpent ; l’ensemble montre le système entier."]], "27": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans la carte, elle dépend de Début et fin, Stockage, Boucle et Sous-processus ; c’est le point d’arrivée de la carte."]], "28": [["Axiome", "Axiome 4 — Elle ne montre pas comment chaque phase est réalisée."], ["Phrase", "Elle s’oppose aux dessins de détail : elle ne montre pas comment chaque phase est réalisée."]], "29": [["Axiome", "Axiome 4 — Elle ne montre pas comment chaque phase est réalisée."], ["Phrase", "Elle et les dessins de détail se complètent : l’une montre l’ensemble, les autres comment chaque phase est réalisée."]], "30": [["Axiome", "Axiome 5 — Les décisions gardées sont celles qui changent le chemin du système entier."], ["Phrase", "Si une décision ne change que l’intérieur d’une phase, elle reste hors de la structure générale."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Comme le plan d’un métro, elle montre les lignes principales, pas chaque rue."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Changer une phase peut obliger à revoir celles qui suivent."]], "33": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle montre l’ordre des phases, pas leur durée."]], "34": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle tient sur une seule page : c’est sa contrainte de place."]], "35": [["Axiome", "Axiome 1 — La structure générale est un diagramme de flux.\nAxiome 2 — Elle montre le système entier.\nAxiome 3 — Une grande phase y est un sous-groupe ou une seule boîte.\nAxiome 4 — Elle ne montre pas comment chaque phase est réalisée.\nAxiome 5 — Les décisions gardées sont celles qui changent le chemin du système entier.\nAxiome 6 — Une phase « Emballer », sans détail, s’écrit `A[[Emballer]]`.\nAxiome 7 — Le début « Colis prêt » s’écrit `D([Colis prêt])`.\nAxiome 8 — La fin « Colis reçu » s’écrit `F([Colis reçu])`."], ["Phrase", "Huit propositions : c’est un diagramme de flux ; elle montre le système entier ; une grande phase y est un sous-groupe ou une seule boîte ; elle ne montre pas comment chaque phase est réalisée ; elle ne garde que les décisions qui changent le chemin du système entier ; `A[[Emballer]]`, `D([Colis prêt])` et `F([Colis reçu])` en sont des exemples."]], "36": [["Axiome", "Axiome 1 — La structure générale est un diagramme de flux.\nAxiome 2 — Elle montre le système entier.\nAxiome 3 — Une grande phase y est un sous-groupe ou une seule boîte.\nAxiome 4 — Elle ne montre pas comment chaque phase est réalisée.\nAxiome 5 — Les décisions gardées sont celles qui changent le chemin du système entier."], ["Phrase", "On dit d’elle qu’elle est un diagramme de flux, qu’elle montre le système entier, que ses grandes phases sont des sous-groupes ou des boîtes, qu’elle ne montre pas comment chaque phase est réalisée et qu’elle ne garde que certaines décisions."]], "37": [["Axiome", "Axiome 5 — Les décisions gardées sont celles qui changent le chemin du système entier."], ["Phrase", "Si une décision figure dans la structure générale, c’est qu’elle change le chemin du système entier."]], "38": [["Axiome", "Axiome 4 — Elle ne montre pas comment chaque phase est réalisée."], ["Phrase", "Conséquence nécessaire : pour savoir comment chaque phase est réalisée, il faut un autre dessin."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "À force d’en dessiner, on remarque qu’un bon plan d’ensemble tient en moins de dix points."]], "40": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Si le dessin d’ensemble devient illisible, l’explication la plus probable est qu’il contient trop de détails."]], "41": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Argument habituel : voir l’ensemble avant le détail évite de se perdre."]], "42": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les axiomes ne se démontrent pas : on les admet. On montre qu’un dessin est la structure générale en vérifiant qu’il respecte chacun d’eux."]], "43": [["Axiome", "Axiome 1 — La structure générale est un diagramme de flux.\nAxiome 2 — Elle montre le système entier.\nAxiome 3 — Une grande phase y est un sous-groupe ou une seule boîte.\nAxiome 4 — Elle ne montre pas comment chaque phase est réalisée.\nAxiome 5 — Les décisions gardées sont celles qui changent le chemin du système entier.\nAxiome 6 — Une phase « Emballer », sans détail, s’écrit `A[[Emballer]]`.\nAxiome 7 — Le début « Colis prêt » s’écrit `D([Colis prêt])`.\nAxiome 8 — La fin « Colis reçu » s’écrit `F([Colis reçu])`."], ["Phrase", "Huit principes fondent la notion : le diagramme de flux, le système entier, les grandes phases en sous-groupe ou en une seule boîte, l’absence de détail sur comment chaque phase est réalisée, les décisions qui changent le chemin du système entier, et les exemples `A[[Emballer]]`, `D([Colis prêt])` et `F([Colis reçu])`."]], "44": [["Axiome", "Axiome 4 — Elle ne montre pas comment chaque phase est réalisée."], ["Phrase", "Exclus : une structure générale qui montrerait comment chaque phase est réalisée."]], "45": [["Axiome", "Axiome 1 — La structure générale est un diagramme de flux.\nAxiome 2 — Elle montre le système entier.\nAxiome 3 — Une grande phase y est un sous-groupe ou une seule boîte.\nAxiome 4 — Elle ne montre pas comment chaque phase est réalisée.\nAxiome 5 — Les décisions gardées sont celles qui changent le chemin du système entier.\nAxiome 6 — Une phase « Emballer », sans détail, s’écrit `A[[Emballer]]`.\nAxiome 7 — Le début « Colis prêt » s’écrit `D([Colis prêt])`.\nAxiome 8 — La fin « Colis reçu » s’écrit `F([Colis reçu])`."], ["Phrase", "Les axiomes s’accordent : le premier dit ce qu’elle est (un diagramme de flux), les quatre suivants ce qu’elle montre et ce qu’elle laisse de côté (le système entier, les grandes phases, pas comment chaque phase est réalisée, seulement les décisions qui changent le chemin du système entier), et les trois derniers donnent des exemples (`A[[Emballer]]`, `D([Colis prêt])` et `F([Colis reçu])`)."]], "46": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans la carte, elle fait partie de la famille « Synthèse » : c’est la dernière notion, qui suppose toutes les autres."]], "47": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On la justifie par le but du projet : voir d’un coup d’œil comment fonctionne l’enregistreur."]], "48": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La preuve qu’elle est réussie : quelqu’un comprend le projet en la regardant une minute."]], "49": [["Axiome", "Axiome 1 — La structure générale est un diagramme de flux.\nAxiome 2 — Elle montre le système entier."], ["Phrase", "« X est la structure générale » est vrai si X est un diagramme de flux qui montre le système entier."]], "50": [["Axiome", "Axiome 2 — Elle montre le système entier.\nAxiome 4 — Elle ne montre pas comment chaque phase est réalisée."], ["Phrase", "Pour vérifier : montre-t-elle le système entier, sans montrer comment chaque phase est réalisée ?"]], "51": [["Axiome", "Axiome 4 — Elle ne montre pas comment chaque phase est réalisée."], ["Phrase", "Si on y voit comment chaque phase est réalisée, ce n’est plus la structure générale."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La notion est sûre : ses axiomes sont posés comme des définitions."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On fait une hypothèse en choisissant les phases : on suppose que ce découpage est le bon."]], "54": [["Axiome", "Axiome 3 — Une grande phase y est un sous-groupe ou une seule boîte."], ["Phrase", "On l’observe : chaque grande phase y apparaît comme un sous-groupe ou une seule boîte."]], "55": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Derrière, c’est le principe de l’abstraction : regarder un système de loin pour en voir la forme."]], "56": [["Axiome", "Axiome 1 — La structure générale est un diagramme de flux."], ["Phrase", "Elle n’est pas le système : c’est un diagramme de flux qui le représente."]], "57": [["Axiome", "Axiome 2 — Elle montre le système entier."], ["Phrase", "Elle existe dès qu’un dessin montre le système entier."]], "58": [["Axiome", "Axiome 1 — La structure générale est un diagramme de flux.\nAxiome 2 — Elle montre le système entier.\nAxiome 3 — Une grande phase y est un sous-groupe ou une seule boîte.\nAxiome 4 — Elle ne montre pas comment chaque phase est réalisée.\nAxiome 5 — Les décisions gardées sont celles qui changent le chemin du système entier."], ["Phrase", "Ce qui en fait la structure générale, c’est la réunion des axiomes : un diagramme de flux, le système entier, les grandes phases en sous-groupe ou en une seule boîte, pas comment chaque phase est réalisée, et seulement les décisions qui changent le chemin du système entier."]], "59": [["Axiome", "Axiome 1 — La structure générale est un diagramme de flux."], ["Phrase", "Elle appartient à la catégorie des diagrammes de flux."]], "60": [["Axiome", "Axiome 1 — La structure générale est un diagramme de flux.\nAxiome 2 — Elle montre le système entier.\nAxiome 3 — Une grande phase y est un sous-groupe ou une seule boîte.\nAxiome 4 — Elle ne montre pas comment chaque phase est réalisée.\nAxiome 5 — Les décisions gardées sont celles qui changent le chemin du système entier."], ["Phrase", "Nécessaire : un diagramme de flux qui montre le système entier, en grandes phases, sans montrer comment chaque phase est réalisée, avec seulement les décisions qui changent le chemin du système entier. Au choix : sous-groupe ou une seule boîte pour chaque phase."]], "61": [["Axiome", "Axiome 2 — Elle montre le système entier."], ["Phrase", "Sa substance : le système entier, vu de loin."]], "62": [["Axiome", "Axiome 4 — Elle ne montre pas comment chaque phase est réalisée."], ["Phrase", "Elle s’arrête là où commence le détail : elle ne montre pas comment chaque phase est réalisée."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans ce projet, c’est l’objectif final : dessiner l’enregistreur vocal en un seul bloc Mermaid."]], "64": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On la dessine au début, pour cadrer, et à la fin, pour vérifier que tout tient ensemble."]], "65": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "L’idée vient de l’ingénierie des systèmes : on dessine l’ensemble avant les parties."]], "66": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On parle aussi de vue d’ensemble, de carte ou de schéma directeur."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle relève de la conception de systèmes."]], "68": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle sert de référence commune : tout le monde part du même plan."]], "69": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle montre le projet à un moment donné ; elle évolue avec lui."]], "70": [["Axiome", "Axiome 2 — Elle montre le système entier."], ["Phrase", "Son rôle : montrer le système entier."]], "71": [["Axiome", "Axiome 3 — Une grande phase y est un sous-groupe ou une seule boîte.\nAxiome 6 — Une phase « Emballer », sans détail, s’écrit `A[[Emballer]]`.\nAxiome 7 — Le début « Colis prêt » s’écrit `D([Colis prêt])`.\nAxiome 8 — La fin « Colis reçu » s’écrit `F([Colis reçu])`."], ["Phrase", "Elle fournit un cadre : un début `D([Colis prêt])`, des grandes phases comme `A[[Emballer]]`, une fin `F([Colis reçu])`."]], "72": [["Axiome", "Axiome 3 — Une grande phase y est un sous-groupe ou une seule boîte.\nAxiome 4 — Elle ne montre pas comment chaque phase est réalisée."], ["Phrase", "Elle permet de voir les grandes phases sans se perdre dans comment chaque phase est réalisée."]], "73": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En pratique, elle évite de se perdre dans les détails."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ici, c’est le but : la structure de l’enregistreur vocal en un seul bloc Mermaid."]], "75": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle devient utile dès que le projet a plusieurs parties."]], "76": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La dessiner, c’est décider ce qui compte vraiment dans le projet."]], "77": [["Axiome", "Axiome 3 — Une grande phase y est un sous-groupe ou une seule boîte.\nAxiome 6 — Une phase « Emballer », sans détail, s’écrit `A[[Emballer]]`.\nAxiome 7 — Le début « Colis prêt » s’écrit `D([Colis prêt])`.\nAxiome 8 — La fin « Colis reçu » s’écrit `F([Colis reçu])`."], ["Phrase · hors axiomes", "- Écrire `flowchart`, puis le début : `D([Colis prêt])`.\n- Ajouter une boîte par grande phase : `A[[Emballer]]`.\n- Finir par la fin : `F([Colis reçu])`, puis relier."]], "78": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle change quand une phase s’ajoute ou disparaît."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Au fil du projet, elle se précise : les phases se nomment mieux."]], "80": [["Axiome", "Axiome 3 — Une grande phase y est un sous-groupe ou une seule boîte."], ["Phrase", "Une grande phase peut passer de sous-groupe à une seule boîte, ou l’inverse."]], "81": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle naît d’une liste des grandes étapes du projet."]], "82": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle se lit du début à la fin, phase après phase."]], "83": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’adapte à son public : plus simple pour expliquer, plus précise pour concevoir."]], "84": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "D’une version à l’autre, elle reste stable si le projet est bien pensé."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une bonne structure générale se juge à sa clarté : elle se comprend en une minute."]], "86": [["Axiome", "Axiome 1 — La structure générale est un diagramme de flux."], ["Phrase", "Norme : celle d’un diagramme de flux."]], "87": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Sa valeur tient à la vue qu’elle donne : on comprend le tout avant les parties."]], "88": [["Axiome", "Axiome 3 — Une grande phase y est un sous-groupe ou une seule boîte.\nAxiome 4 — Elle ne montre pas comment chaque phase est réalisée.\nAxiome 5 — Les décisions gardées sont celles qui changent le chemin du système entier."], ["Phrase · hors axiomes", "Critères : peu de grandes phases, pas de détail sur comment chaque phase est réalisée, seulement les décisions qui changent le chemin du système entier ; en plus, une seule page."]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une structure générale de qualité se lit sans explication."]], "90": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle est pertinente dès qu’un projet a plusieurs parties ; pour une tâche simple, un seul dessin suffit."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’améliore en retirant ce qui relève du détail et en nommant clairement chaque phase."]]}};

function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function code(e,s){s.split("`").forEach(function(p,i){if(i%2)e.appendChild(el("code",null,p));else if(p)e.appendChild(document.createTextNode(p.replace(/« /g,"«\u00a0").replace(/ ([»?!:;])/g,"\u00a0$1")))})}

/* lecture du plan Mermaid */
var N={},IDS=[];
PLAN.split("\n").forEach(function(l){var m=l.match(/^\s*([A-Za-z_]\w*)\s*\["(.*)"\]\s*$/);
  if(m){N[m[1]]={id:m[1],t:m[2],p:[],k:[]};IDS.push(m[1])}});
PLAN.split("\n").forEach(function(l){var m=l.match(/^\s*([A-Za-z_]\w*)\s*-->\s*([A-Za-z_]\w*)\s*$/);
  if(m&&N[m[1]]&&N[m[2]]){N[m[1]].k.push(m[2]);N[m[2]].p.push(m[1])}});
function depth(i){var n=N[i];if(n.d!=null)return n.d;n.d=0;n.p.forEach(function(p){n.d=Math.max(n.d,depth(p)+1)});return n.d}
IDS.forEach(depth);

/* état : compétences acquises, et type de contenu choisi pour chaque boîte
   ("p" principes, "r" pratique, ou n° de dimension) */
var KEY="plan-"+SUJET.nom,ACQ={},MODES={},DIM={};
G.forEach(function(g){g.i.forEach(function(d){DIM[d[0]]=d})});
try{var sv=JSON.parse(localStorage.getItem(KEY)||"null");if(sv){ACQ=sv.a||{};MODES=sv.ms||{}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({a:ACQ,ms:MODES}))}catch(e){}push()}
/* au départ, une boîte montre ses principes */
function mode(i){var m=MODES[i];if(m==="r"||DIM[m]||(m==="i"&&IMG[COMP[i].notion]))return m;return "p"}
/* notes : une par boîte, gardées à part (Recommencer ne les efface pas) */
var NKEY="notes-"+SUJET.nom,NOTES={};
try{NOTES=JSON.parse(localStorage.getItem(NKEY)||"{}")||{}}catch(e){}
function saveNotes(){try{localStorage.setItem(NKEY,JSON.stringify(NOTES))}catch(e){}push()}

/* page publiée : notes et compétences acquises sont aussi gardées en ligne, dans la base
   de la page (document etat/<sujet>, lisible et modifiable par le propriétaire seulement).
   Sans base (fichier ouvert seul), tout reste sur cet appareil. */
var DOC=null,LAST=null,WB=false,WN=false,ONL=false;
var DOCP="etat/"+(SUJET.nom.toLowerCase().replace(/[^a-z0-9]+/g,"-")||"sujet");
function snapshot(){return JSON.stringify({notes:NOTES,acq:ACQ})}
function push(){
  if(!DOC)return;
  if(WB){WN=true;return}
  var body=snapshot();if(body===LAST)return;
  WB=true;var tries=0;
  (function go(){DOC.set(JSON.parse(body)).then(function(){LAST=body;done()},function(e){
    if(e&&e.code==="unavailable"&&!tries++)return setTimeout(go,800+Math.random()*700);
    online(false,"L’enregistrement en ligne a échoué. Tes notes restent sur cet appareil : copie-les par sécurité.");done()})})();
  function done(){WB=false;if(WN){WN=false;push()}}
}
function online(ok,msg){
  ONL=ok;var p=document.getElementById("mp");if(!p)return;
  p.textContent=msg||(ok?"Tes notes sont enregistrées en ligne avec la page : elles restent d’une version à l’autre et d’un appareil à l’autre.":
    "Tes notes restent sur cet appareil. Copie-les de temps en temps : une nouvelle version du fichier peut repartir sans elles.");
}
function connect(){
  if(connect.done||!(window.claude&&typeof window.claude.use==="function"))return;connect.done=true;
  var timer=setTimeout(function(){online(false,"Enregistrement en ligne pas encore joignable. Tes notes restent sur cet appareil.")},10000);
  window.claude.use("db").then(function(db){
    if(!db){clearTimeout(timer);return online(false)}
    var ref=db.doc(DOCP);
    ref.get().then(function(sn){
      clearTimeout(timer);DOC=ref;
      var d=sn&&sn.exists?(sn.data()||{}):{},dn=d.notes||{},da=d.acq||{},changed=false;
      var mn={},ma={};Object.keys(dn).forEach(function(k){mn[k]=dn[k]});Object.keys(da).forEach(function(k){ma[k]=da[k]});
      Object.keys(NOTES).forEach(function(k){if(!(k in mn))mn[k]=NOTES[k]});   /* notes écrites ici avant la connexion */
      Object.keys(ACQ).forEach(function(k){if(!(k in ma))ma[k]=ACQ[k]});
      if(JSON.stringify(mn)!==JSON.stringify(NOTES)||JSON.stringify(ma)!==JSON.stringify(ACQ))changed=true;
      LAST=sn&&sn.exists?JSON.stringify({notes:dn,acq:da}):null;
      NOTES=mn;ACQ=ma;
      try{localStorage.setItem(NKEY,JSON.stringify(NOTES))}catch(e){}
      online(true);
      if(changed&&!(document.activeElement&&document.activeElement.classList.contains("nx")))sync();
      push();
    },function(){clearTimeout(timer);online(false)});
  },function(){clearTimeout(timer);online(false)});
}

/* le menu d'une boîte : un seul type de contenu affiché à la fois dans cette boîte */
function menu(i,onpick){
  var m=el("select");m.setAttribute("aria-label","Contenu affiché");
  var g0=document.createElement("optgroup");g0.label="Axiomes";
  [["p","Principes"],["r","Pratique"]].forEach(function(x){var o=el("option",null,x[1]);o.value=x[0];g0.appendChild(o)});m.appendChild(g0);
  if(IMG[COMP[i].notion]){var oi=el("option",null,"En image");oi.value="i";m.appendChild(oi)}
  G.forEach(function(g){var og=document.createElement("optgroup");og.label=g.t;
    g.i.forEach(function(d){var o=el("option",null,d[0]+" · "+d[1]+" — "+d[2]);o.value=d[0];og.appendChild(o)});m.appendChild(og)});
  m.value=mode(i);m.onchange=function(){MODES[i]=m.value;save();onpick()};
  return m;
}

/* contenu d'une boîte selon le type choisi */
function picture(nid){var d=el("div");d.innerHTML=IMG[nid].svg;return d.firstChild}
function unnum(t){return t.replace(/\s*\(axiomes? [\d ,et]+\)/g,"").replace(/Axiomes? [\d ,et]+ — /g,"")}
function legend(b,nid){IMG[nid].leg.forEach(function(l){var p=el("div","lg");p.appendChild(el("b",null,l[0]));p.appendChild(document.createTextNode(" — "+unnum(l[1])));b.appendChild(p)})}
function zoom(nid){
  var Z=document.getElementById("zo"),B=document.getElementById("zb");
  document.getElementById("zn").textContent=NOTIONS[nid].t;B.innerHTML="";
  var w=el("div","im");w.appendChild(picture(nid));B.appendChild(w);legend(B,nid);
  Z.hidden=false;Z.scrollTop=0;
}
document.getElementById("zc").onclick=function(){document.getElementById("zo").hidden=true};
function body(nid,MODE){
  var no=NOTIONS[nid],b=el("div","bd");
  if(MODE==="i"){
    b.appendChild(picture(nid));
    var z=el("button","im");z.setAttribute("aria-label","Agrandir l’image");
    while(b.firstChild)z.appendChild(b.firstChild);
    z.onclick=function(){zoom(nid)};b.appendChild(z);
    b.appendChild(el("div","zh","Toucher l’image pour l’agrandir"));
    legend(b,nid);
  }else if(MODE==="p"||MODE==="r"){
    var pa=no.pratique||[],l=no.ax.map(function(a,i){return [i+1,a]}).filter(function(x){return (pa.indexOf(x[0])>=0)===(MODE==="r")});
    if(!l.length)b.appendChild(el("div","no",MODE==="r"?"Pas de pratique pour cette notion.":"Pas de principe pour cette notion."));
    if(l.length){var r=el("div","axr");l.forEach(function(x){var d=el("div","ax");code(d,x[1]);r.appendChild(d)});b.appendChild(r)}
  }else{
    var v=(C[nid]||{})[MODE];
    if(!v)b.appendChild(el("div","no","Pas encore rempli."));
    else v.forEach(function(x){b.appendChild(el("div","vl",x[0]));
      x[1].split("\n").forEach(function(t){var li=t.indexOf("- ")===0,c=el("div","ct"+(li?" li":"")+(t.indexOf("Non couvert")===0?" nc":""));code(c,unnum(li?t.slice(2):t));b.appendChild(c)})});
  }
  return b;
}
var RAF=0;function redraw(){cancelAnimationFrame(RAF);RAF=requestAnimationFrame(rails)}
function grow(t){t.style.height="auto";t.style.height=t.scrollHeight+2+"px"}
function note(i){
  var w=el("div","nb");
  function closed(){w.innerHTML="";var a=el("button","na","✎ Ajouter une note");a.onclick=function(){opened(true)};w.appendChild(a)}
  function opened(focus){
    w.innerHTML="";w.appendChild(el("div","nl","Ma note"));
    var t=el("textarea","nx");t.value=NOTES[i]||"";t.setAttribute("aria-label","Ma note");t.rows=3;
    var tm=0;t.oninput=function(){grow(t);redraw();clearTimeout(tm);tm=setTimeout(function(){
      if(t.value.trim())NOTES[i]=t.value;else delete NOTES[i];saveNotes()},300)};
    t.onblur=function(){if(t.value.trim())NOTES[i]=t.value;else{delete NOTES[i];closed();redraw()}saveNotes()};
    w.appendChild(t);requestAnimationFrame(function(){grow(t);redraw()});if(focus)t.focus();
  }
  if(NOTES[i])opened(false);else closed();
  return w;
}
/* ordre des lignes, de bas en haut : celui du plan (ordre de lecture) */
var ORDER=IDS.slice();
function jx(c,p){var j=JONC[c];return j&&j[p]!=null?j[p]:null}
function junctionsOf(c){var o={};N[c].p.forEach(function(p){var n=jx(c,p);if(n!=null)o[n]=true});return o}
/* une ligne : le nom de la notion, puis ses axiomes en stations */
function line(i){
  var nid=COMP[i].notion,no=NOTIONS[nid],pa=no.pratique||[],J=junctionsOf(i),L=el("div","ln"+(ACQ[i]?" acq":""));L.dataset.id=i;
  var h=el("button","lh");h.appendChild(el("b",null,no.t));if(ACQ[i])h.appendChild(el("span","ok","✓"));
  h.onclick=function(){sheet(i)};L.appendChild(h);
  var tk=el("div","tk");
  no.ax.forEach(function(a,k){var n=k+1,st=el("div","st"),d=el("i","dt"+(J[n]?" jx":pa.indexOf(n)>=0?" pr":""));
    st.appendChild(d);var t=el("span");code(t,a);[].forEach.call(t.querySelectorAll("code"),function(c){if(c.textContent.length>14)c.className="w"});st.appendChild(t);tk.appendChild(st)});
  L.appendChild(tk);
  if(SHOWN&&NOTES[i])L.appendChild(el("div","lnn",NOTES[i]));
  return L;
}
function short(t){return t.replace(/\s*\(.*\)$/,"")}
/* une correspondance : l'axiome qui relie la notion du dessous à celle du dessus */
function junction(p,c){
  var n=jx(c,p),nc=NOTIONS[COMP[c].notion],np=NOTIONS[COMP[p].notion],J=el("div","jn"+(n==null?" no":""));J.dataset.e=p+">"+c;
  if(n==null){J.textContent="Aucun axiome ne relie encore "+short(np.t)+" et "+short(nc.t)+".";return J}
  var q=el("q");code(q,nc.ax[n-1].replace(/\.$/,""));J.appendChild(q);
  J.appendChild(el("small",null,short(np.t)+" → "+short(nc.t)));return J;
}
/* les rails : de la ligne du dessous à celle du dessus, en passant par la correspondance */
function rails(){
  var M=document.getElementById("map");if(!M)return;
  var old=M.querySelector("svg.rl");if(old)old.remove();
  var gw=parseFloat(getComputedStyle(M).getPropertyValue("--gw"))||40,o=M.getBoundingClientRect();
  var NS="http://www.w3.org/2000/svg",s=document.createElementNS(NS,"svg");s.setAttribute("class","rl");
  function yLine(i){var t=M.querySelector('.ln[data-id="'+i+'"] .tk');if(!t)return null;return t.getBoundingClientRect().top-o.top+12}
  E.forEach(function(e){
    var x=gw-13-e.lane*10,yp=yLine(e.p),yc=yLine(e.c),jb=M.querySelector('.jn[data-e="'+e.p+'>'+e.c+'"]');if(yp==null||yc==null)return;
    var r=jb.getBoundingClientRect(),yj=r.top-o.top+Math.min(r.height/2,22),col=ACQ[e.p]?"#2f6a48":"#4a4a52";
    var path=document.createElementNS(NS,"path");
    path.setAttribute("d","M"+gw+" "+yp+"H"+x+"V"+yc+"H"+gw);
    path.setAttribute("fill","none");path.setAttribute("stroke",col);path.setAttribute("stroke-width","2");s.appendChild(path);
    var c=document.createElementNS(NS,"circle");c.setAttribute("cx",x);c.setAttribute("cy",yj);c.setAttribute("r","6");
    c.setAttribute("fill","#0e0e10");c.setAttribute("stroke",jx(e.c,e.p)==null?"#6a6a72":"#8ab4ff");c.setAttribute("stroke-width","3");
    if(jx(e.c,e.p)==null){c.setAttribute("stroke-width","2");c.setAttribute("stroke-dasharray","3 2.5")}
    s.appendChild(c)});
  M.insertBefore(s,M.firstChild);
}
/* les liens et leurs voies (deux rails qui se chevauchent prennent deux voies) */
var E=[];
function lanes(){
  var pos={};ORDER.slice().reverse().forEach(function(i,k){pos[i]=k});
  E=[];var T={};
  ORDER.forEach(function(c){N[c].p.forEach(function(p){E.push({p:p,c:c});
    var t=T[p]||(T[p]={lo:pos[c],hi:pos[p]});t.lo=Math.min(t.lo,pos[c])})});
  var L=Object.keys(T).map(function(k){return T[k]}).sort(function(a,b){return (a.hi-a.lo)-(b.hi-b.lo)||a.hi-b.hi});
  var max=0;L.forEach(function(t){var l=0;while(L.some(function(f){return f!==t&&f.lane===l&&f.lo<t.hi&&t.lo<f.hi}))l++;t.lane=l;max=Math.max(max,l)});
  E.forEach(function(e){e.lane=T[e.p].lane});
  return max+1;
}
/* la fiche d'une notion : ✓, menu, contenu choisi, note */
/* la fiche d'une notion : la boîte d'origine (ligne « découle de », nom, menu, contenu, note), sans case à cocher */
function box(i){
  var n=N[i],nid=COMP[i].notion,b=el("div","bx");b.dataset.id=i;
  var h=el("div","bh"),t=el("span","bt");t.appendChild(el("span","cp",n.t));t.appendChild(el("span","nt",NOTIONS[nid].t));
  h.appendChild(t);b.appendChild(h);
  var bd=body(nid,mode(i));
  b.appendChild(menu(i,function(){var nb=body(nid,mode(i));b.replaceChild(nb,bd);bd=nb}));
  b.appendChild(bd);b.appendChild(note(i));return b;
}
var SHI=null;
function sheet(i){
  SHI=i;var B=document.getElementById("sb");B.innerHTML="";B.appendChild(box(i));
  var S=document.getElementById("sh");if(S.hidden){S.hidden=false;S.scrollTop=0}
}
document.getElementById("scl").onclick=function(){document.getElementById("sh").hidden=true;SHI=null;sync()};
function sync(){
  document.getElementById("sj").textContent=SUJET.nom;
  var M=document.getElementById("map");M.innerHTML="";
  var nl=lanes();M.style.setProperty("--gw",(18+nl*10)+"px");
  ORDER.slice().reverse().forEach(function(c){
    M.appendChild(line(c));
    N[c].p.forEach(function(p){M.appendChild(junction(p,c))});
  });
  rails();
}
/* afficher ou masquer mes notes sur le plan, sous chaque notion */
var SHOWN=false;try{SHOWN=localStorage.getItem("voir-notes-"+SUJET.nom)==="1"}catch(e){}
var TG=document.getElementById("tgn");
function tgLabel(){TG.textContent=SHOWN?"Masquer mes notes":"Afficher mes notes"}
TG.onclick=function(){SHOWN=!SHOWN;try{localStorage.setItem("voir-notes-"+SUJET.nom,SHOWN?"1":"0")}catch(e){}tgLabel();sync()};
tgLabel();
document.title="Support d’autoformation — "+SUJET.nom;
window.addEventListener("resize",rails);
sync();
(function(){var r=document.querySelector('.ln[data-id="'+IDS.filter(function(i){return !N[i].p.length})[0]+'"]');
  if(r)requestAnimationFrame(function(){r.scrollIntoView({block:"end"});window.scrollBy(0,16)})})();
try{connect()}catch(e){}
window.addEventListener("load",function(){try{connect()}catch(e){}});
</script>
