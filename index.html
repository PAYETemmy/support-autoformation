Axiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions.\nAxiome 4 — Son mot-clé, sur la première ligne, est `flowchart` (ou `graph`)."], ["Phrase", "Ce qui en fait un diagramme de flux, c’est la réunion des quatre : un processus, des boîtes, des traits orientés, le mot-clé `flowchart` ou `graph`."]], "59": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions."], ["Phrase", "Il appartient aux diagrammes qui représentent un processus."]], "60": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions.\nAxiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions.\nAxiome 4 — Son mot-clé, sur la première ligne, est `flowchart` (ou `graph`)."], ["Phrase", "Nécessaire : un processus, des boîtes, des traits orientés, le mot-clé. Accessoire : le nombre de boîtes, leur forme, leur place."]], "61": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions.\nAxiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions."], ["Phrase", "Sa substance : un processus, mis en boîtes et ordonné par des traits orientés."]], "62": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions.\nAxiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions.\nAxiome 4 — Son mot-clé, sur la première ligne, est `flowchart` (ou `graph`)."], ["Phrase", "Il s’arrête là où manque l’un des quatre : le processus, les boîtes, les traits orientés ou le mot-clé."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans ce projet, il sert à dessiner le déroulement de l’enregistreur vocal, de l’appui à la note rangée."]], "64": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On s’en sert quand il faut expliquer, concevoir ou vérifier un déroulement."]], "65": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On le fait remonter à 1921, quand Frank et Lillian Gilbreth présentent le « flow process chart » ; il se répand ensuite en informatique."]], "66": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le sens de lecture suit souvent celui de l’écriture : de gauche à droite et de haut en bas en Occident."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’utilise en informatique, en gestion, en industrie et en enseignement ; ici, pour concevoir un raccourci."]], "68": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il sert à partager un déroulement : tout le monde voit le même enchaînement."]], "69": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il est figé sur une page : il montre l’enchaînement des étapes, pas leur durée."]], "70": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions.\nAxiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions."], ["Phrase", "Son rôle : représenter un processus, en mettant ses actions dans des boîtes et leur ordre dans des traits orientés."]], "71": [["Axiome", "Axiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions.\nAxiome 4 — Son mot-clé, sur la première ligne, est `flowchart` (ou `graph`)."], ["Phrase", "Il fournit des boîtes pour les actions et les questions, des traits orientés pour l’ordre, et un mot-clé pour l’écrire en Mermaid."]], "72": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions.\nAxiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions."], ["Phrase", "Il permet de représenter un processus : poser ses actions dans des boîtes et indiquer leur ordre par des traits orientés."]], "73": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En pratique, il révèle les trous : une étape sans suite ou une question sans réponse se voit tout de suite."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ici, le but est de dessiner le déroulement de l’enregistreur vocal, puis sa structure générale."]], "75": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il devient utile dès qu’un déroulement a trop d’étapes pour être suivi de tête."]], "76": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le dessiner oblige à décider de l’enchaînement de chaque étape : le faire clarifie déjà ce qu’on veut."]], "77": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions.\nAxiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions.\nAxiome 4 — Son mot-clé, sur la première ligne, est `flowchart` (ou `graph`).\nNon couvert : les axiomes ne disent pas comment écrire une boîte ni un trait."], ["Phrase · hors axiomes", "- Lister les actions du processus.\n- Écrire `flowchart` sur la première ligne.\n- Poser une boîte par action ou par question.\n- Relier les boîtes par des traits orientés, dans l’ordre des actions."]], "78": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il change quand on ajoute, retire ou déplace des étapes et des flèches."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il évolue avec ce qu’il représente : quand le déroulement change, on le redessine."]], "80": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il peut passer d’un croquis à du code Mermaid sans perdre ses étapes ni leur enchaînement."]], "81": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On le forme souvent ainsi : lister les étapes, les relier, puis écrire le tout en Mermaid."]], "82": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions."], ["Phrase", "Le processus qui le caractérise est celui qu’il représente : une suite d’actions."]], "83": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il s’adapte au niveau de détail voulu : une étape peut rester seule ou être détaillée ailleurs."]], "84": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il passe par des versions successives, du brouillon à la version finale."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il se juge à sa clarté : on doit suivre l’enchaînement sans explication."]], "86": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions.\nAxiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions.\nAxiome 4 — Son mot-clé, sur la première ligne, est `flowchart` (ou `graph`)."], ["Phrase · hors axiomes", "La norme minimale est celle des axiomes : un processus, des boîtes, des traits orientés, `flowchart` ou `graph`. Il existe aussi des normes de symboles, comme l’ISO 5807."]], "87": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Sa valeur tient à la clarté : montrer l’enchaînement sans l’embrouiller ni en inventer."]], "88": [["Axiome", "Axiome 1 — Un diagramme de flux représente un processus : une suite d’actions.\nAxiome 2 — Chaque point du processus est une boîte (une action ou une question).\nAxiome 3 — Des traits orientés indiquent l’ordre des actions.\nAxiome 4 — Son mot-clé, sur la première ligne, est `flowchart` (ou `graph`)."], ["Phrase · hors axiomes", "Critères tirés des axiomes : un processus, des boîtes, des traits orientés, le bon mot-clé. Critères habituels en plus : lisibilité, peu de croisements, un seul sens de lecture."]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un diagramme de flux de qualité se suit d’un coup d’œil, du début à la fin."]], "90": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il est pertinent pour un déroulement ; pour une idée sans enchaînement, un texte suffit."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’améliore en retirant les étapes inutiles, en gardant un seul sens de lecture et en évitant les croisements."]]}, "ide": {"1": [["Axiome", "Axiome 1 — Un identifiant est un nom écrit dans le code Mermaid.\nAxiome 2 — Il désigne un seul élément du diagramme.\nAxiome 3 — Dans le diagramme, il est unique.\nAxiome 4 — Il n’a pas d’espace.\nAxiome 5 — Il est distinct du texte affiché.\nAxiome 6 — Sans texte, c’est lui qui s’affiche."], ["Phrase", "Un identifiant se compose d’un nom écrit dans le code Mermaid : il désigne un seul élément, il est unique, il n’a pas d’espace, il est distinct du texte affiché, et sans texte c’est lui qui s’affiche."]], "2": [["Axiome", "Axiome 1 — Un identifiant est un nom écrit dans le code Mermaid.\nAxiome 2 — Il désigne un seul élément du diagramme.\nAxiome 3 — Dans le diagramme, il est unique.\nAxiome 4 — Il n’a pas d’espace.\nAxiome 5 — Il est distinct du texte affiché.\nAxiome 6 — Sans texte, c’est lui qui s’affiche."], ["Phrase", "Ses éléments fondamentaux sont ceux que posent les axiomes : un nom du code Mermaid, qui désigne un seul élément, unique, sans espace, distinct du texte affiché, et qui s’affiche sans texte."]], "3": [["Axiome", "Axiome 1 — Un identifiant est un nom écrit dans le code Mermaid.\nAxiome 2 — Il désigne un seul élément du diagramme.\nAxiome 5 — Il est distinct du texte affiché."], ["Phrase · hors axiomes", "Dans le code Mermaid, le nom de l’identifiant s’écrit juste avant le texte affiché, dont il est distinct : les deux désignent le même élément."]], "4": [["Axiome", "Axiome 4 — Il n’a pas d’espace."], ["Phrase", "Il n’a pas d’espace : c’est un seul bloc, qui ne se décompose pas en plusieurs mots."]], "5": [["Axiome", "Axiome 2 — Il désigne un seul élément du diagramme.\nAxiome 3 — Dans le diagramme, il est unique.\nNon couvert : les axiomes ne fixent pas le nombre d’identifiants d’un diagramme."], ["Phrase", "Un identifiant désigne un seul élément, et il est unique : il n’y en a jamais deux pareils dans un diagramme."]], "6": [["Axiome", "Axiome 1 — Un identifiant est un nom écrit dans le code Mermaid.\nAxiome 4 — Il n’a pas d’espace.\nAxiome 5 — Il est distinct du texte affiché."], ["Phrase", "C’est un nom sans espace, écrit dans le code Mermaid, distinct du texte affiché."]], "7": [["Axiome", "Axiome 1 — Un identifiant est un nom écrit dans le code Mermaid.\nAxiome 2 — Il désigne un seul élément du diagramme.\nAxiome 3 — Dans le diagramme, il est unique."], ["Phrase", "Un identifiant, c’est un nom écrit dans le code Mermaid qui désigne un seul élément, et qui est unique dans le diagramme."]], "8": [["Axiome", "Axiome 1 — Un identifiant est un nom écrit dans le code Mermaid.\nAxiome 2 — Il désigne un seul élément du diagramme.\nAxiome 3 — Dans le diagramme, il est unique.\nAxiome 4 — Il n’a pas d’espace.\nAxiome 5 — Il est distinct du texte affiché.\nAxiome 6 — Sans texte, c’est lui qui s’affiche."], ["Phrase", "Un identifiant est un nom sans espace, écrit dans le code Mermaid, qui désigne un seul élément du diagramme ; il est unique, distinct du texte affiché, et c’est lui qui s’affiche sans texte."]], "9": [["Axiome", "Axiome 1 — Un identifiant est un nom écrit dans le code Mermaid.\nAxiome 2 — Il désigne un seul élément du diagramme.\nAxiome 3 — Dans le diagramme, il est unique.\nAxiome 4 — Il n’a pas d’espace.\nAxiome 5 — Il est distinct du texte affiché.\nAxiome 6 — Sans texte, c’est lui qui s’affiche."], ["Phrase", "Être un nom du code Mermaid, désigner un seul élément, être unique, ne pas avoir d’espace, être distinct du texte affiché, s’afficher sans texte : ces six propriétés le constituent."]], "10": [["Axiome", "Axiome 2 — Il désigne un seul élément du diagramme.\nAxiome 7 — Un identifiant court pour « Enregistrer la voix » peut être `enreg`."], ["Phrase · hors axiomes", "Il s’applique aux étapes, comme `enreg` pour « Enregistrer la voix », mais aussi aux sous-groupes : chacun est désigné par son identifiant."]], "11": [["Axiome", "Axiome 1 — Un identifiant est un nom écrit dans le code Mermaid.\nAxiome 2 — Il désigne un seul élément du diagramme.\nAxiome 5 — Il est distinct du texte affiché."], ["Phrase · hors axiomes", "Les axiomes l’appellent identifiant : un nom du code Mermaid qui désigne un seul élément, distinct du texte affiché. En anglais, on dit id."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le mot vient du latin idem, « le même » : identifier, c’est reconnaître une chose comme étant toujours la même."]], "13": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Celui qui lit le code doit deviner ce que représente chaque identifiant : un identifiant parlant se lit sans effort."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ailleurs, « identifiant » veut aussi dire le login d’un compte ; ici, il s’agit du repère d’une étape en Mermaid."]], "15": [["Axiome", "Axiome 1 — Un identifiant est un nom écrit dans le code Mermaid.\nAxiome 4 — Il n’a pas d’espace."], ["Phrase", "C’est un nom d’un seul tenant, sans espace."]], "16": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Tous les identifiants sont au même rang : aucun ne commande les autres."]], "17": [["Axiome", "Axiome 1 — Un identifiant est un nom écrit dans le code Mermaid.\nAxiome 5 — Il est distinct du texte affiché."], ["Phrase", "Dans le code Mermaid, deux couches cohabitent : les identifiants, et le texte affiché, qui en est distinct."]], "18": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En Mermaid, on le place en tête de ligne, juste avant le texte entre crochets."]], "19": [["Axiome", "Axiome 1 — Un identifiant est un nom écrit dans le code Mermaid."], ["Phrase", "Il se range parmi les noms écrits dans le code Mermaid."]], "20": [["Axiome", "Axiome 7 — Un identifiant court pour « Enregistrer la voix » peut être `enreg`."], ["Phrase · hors axiomes", "Deux styles se rencontrent : des lettres (A, B, C), ou des mots courts et parlants, comme `enreg`."]], "21": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les identifiants n’ont pas de sous-parties ; on peut toutefois leur donner un préfixe commun pour les regrouper, comme ent_appui et ent_voix."]], "22": [["Axiome", "Axiome 1 — Un identifiant est un nom écrit dans le code Mermaid.\nAxiome 2 — Il désigne un seul élément du diagramme."], ["Phrase", "Il lie un nom, écrit dans le code Mermaid, à un seul élément du diagramme, qu’il désigne."]], "23": [["Axiome", "Axiome 2 — Il désigne un seul élément du diagramme.\nAxiome 3 — Dans le diagramme, il est unique."], ["Phrase", "Puisqu’il désigne un seul élément et qu’il est unique, chaque identifiant renvoie sans ambiguïté à un seul élément."]], "24": [["Axiome", "Axiome 6 — Sans texte, c’est lui qui s’affiche."], ["Phrase", "Sans texte, c’est lui qui s’affiche : l’absence de texte fait apparaître l’identifiant dans le dessin."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Plus un diagramme a d’étapes, plus le choix des identifiants compte pour s’y retrouver."]], "26": [["Axiome", "Axiome 2 — Il désigne un seul élément du diagramme.\nAxiome 5 — Il est distinct du texte affiché."], ["Phrase", "L’identifiant sert à désigner l’élément ; le texte affiché, distinct, sert à le présenter au lecteur."]], "27": [["Axiome", "Axiome 2 — Il désigne un seul élément du diagramme."], ["Phrase · hors axiomes", "Les liaisons en dépendent : pour relier deux étapes, on écrit les identifiants qui les désignent. Dans la carte, il dépend de Mermaid, et Étape dépend de lui."]], "28": [["Axiome", "Axiome 5 — Il est distinct du texte affiché."], ["Phrase", "L’identifiant s’oppose au texte affiché : il en est distinct."]], "29": [["Axiome", "Axiome 5 — Il est distinct du texte affiché.\nAxiome 6 — Sans texte, c’est lui qui s’affiche."], ["Phrase", "Identifiant et texte affiché se complètent : ils sont distincts, et sans texte, c’est l’identifiant qui s’affiche."]], "30": [["Axiome", "Axiome 6 — Sans texte, c’est lui qui s’affiche."], ["Phrase", "Si une étape n’a pas de texte, c’est son identifiant qui s’affiche."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il ressemble à un numéro de dossier : il sert à retrouver une chose, pas à la décrire."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Changer un identifiant oblige à le changer partout : dans l’étape et dans chaque liaison qui l’emploie."]], "33": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il se déclare une fois, puis on le réutilise dans les lignes suivantes."]], "34": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans une ligne, il se place en tête, et de part et d’autre des flèches : `A --> B`."]], "35": [["Axiome", "Axiome 1 — Un identifiant est un nom écrit dans le code Mermaid.\nAxiome 2 — Il désigne un seul élément du diagramme.\nAxiome 3 — Dans le diagramme, il est unique.\nAxiome 4 — Il n’a pas d’espace.\nAxiome 5 — Il est distinct du texte affiché.\nAxiome 6 — Sans texte, c’est lui qui s’affiche.\nAxiome 7 — Un identifiant court pour « Enregistrer la voix » peut être `enreg`."], ["Phrase", "Les axiomes posent sept propositions : c’est un nom du code Mermaid, il désigne un seul élément, il est unique, sans espace, distinct du texte affiché, il s’affiche sans texte, et `enreg` en est un exemple."]], "36": [["Axiome", "Axiome 1 — Un identifiant est un nom écrit dans le code Mermaid.\nAxiome 2 — Il désigne un seul élément du diagramme.\nAxiome 3 — Dans le diagramme, il est unique.\nAxiome 4 — Il n’a pas d’espace.\nAxiome 5 — Il est distinct du texte affiché.\nAxiome 6 — Sans texte, c’est lui qui s’affiche."], ["Phrase", "On dit d’un identifiant qu’il est un nom du code Mermaid, qu’il désigne un seul élément, qu’il est unique, sans espace, distinct du texte affiché, et qu’il s’affiche sans texte."]], "37": [["Axiome", "Axiome 2 — Il désigne un seul élément du diagramme.\nAxiome 3 — Dans le diagramme, il est unique."], ["Phrase", "Puisqu’il est unique, deux étapes ne peuvent pas avoir le même identifiant ; puisqu’il désigne un seul élément, le lire suffit à savoir de quelle étape on parle."]], "38": [["Axiome", "Axiome 6 — Sans texte, c’est lui qui s’affiche."], ["Phrase", "Conséquence nécessaire : une étape sans texte montre son identifiant dans le dessin."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En lisant beaucoup de codes Mermaid, on remarque que les identifiants courts et parlants se relisent mieux."]], "40": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Si deux étapes fusionnent dans le dessin, l’explication la plus probable est qu’elles ont reçu le même identifiant."]], "41": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Argument habituel : un identifiant court et parlant rend le code plus facile à relire et à corriger."]], "42": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les axiomes ne se démontrent pas : on les admet. On montre qu’un mot est un identifiant valide en vérifiant qu’il respecte chacun d’eux."]], "43": [["Axiome", "Axiome 1 — Un identifiant est un nom écrit dans le code Mermaid.\nAxiome 2 — Il désigne un seul élément du diagramme.\nAxiome 3 — Dans le diagramme, il est unique.\nAxiome 4 — Il n’a pas d’espace.\nAxiome 5 — Il est distinct du texte affiché.\nAxiome 6 — Sans texte, c’est lui qui s’affiche.\nAxiome 7 — Un identifiant court pour « Enregistrer la voix » peut être `enreg`."], ["Phrase", "Sept principes fondent la notion : le nom dans le code Mermaid, la désignation d’un seul élément, le caractère unique, l’absence d’espace, la distinction avec le texte affiché, l’affichage sans texte, et l’exemple `enreg`."]], "44": [["Axiome", "Axiome 2 — Il désigne un seul élément du diagramme.\nAxiome 3 — Dans le diagramme, il est unique.\nAxiome 4 — Il n’a pas d’espace."], ["Phrase", "Exclus : un identifiant qui désigne deux éléments, deux identifiants pareils dans un même diagramme alors qu’il est unique, ou un identifiant avec un espace."]], "45": [["Axiome", "Axiome 1 — Un identifiant est un nom écrit dans le code Mermaid.\nAxiome 2 — Il désigne un seul élément du diagramme.\nAxiome 3 — Dans le diagramme, il est unique.\nAxiome 4 — Il n’a pas d’espace.\nAxiome 5 — Il est distinct du texte affiché.\nAxiome 6 — Sans texte, c’est lui qui s’affiche.\nAxiome 7 — Un identifiant court pour « Enregistrer la voix » peut être `enreg`."], ["Phrase", "Les axiomes s’accordent : le premier dit ce qu’il est (un nom du code Mermaid), les suivants ce qu’il fait (désigner un seul élément, être unique), comment il s’écrit (sans espace), son lien au texte (distinct, et affiché sans texte), et le dernier donne un exemple (`enreg`)."]], "46": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans la carte, Identifiant fait partie des Éléments de base et suppose de connaître Mermaid."]], "47": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On le justifie par le besoin d’écrire les liaisons : sans repère court, il faudrait réécrire chaque fois le texte complet d’une étape."]], "48": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La preuve qu’un identifiant est bien choisi : le dessin s’affiche sans erreur et chaque étape apparaît une seule fois."]], "49": [["Axiome", "Axiome 1 — Un identifiant est un nom écrit dans le code Mermaid.\nAxiome 2 — Il désigne un seul élément du diagramme.\nAxiome 3 — Dans le diagramme, il est unique.\nAxiome 4 — Il n’a pas d’espace."], ["Phrase", "« X est un identifiant » est vrai si X est un nom écrit dans le code Mermaid, qui désigne un seul élément, unique et sans espace."]], "50": [["Axiome", "Axiome 3 — Dans le diagramme, il est unique.\nAxiome 4 — Il n’a pas d’espace."], ["Phrase", "Pour vérifier : chercher s’il sert déjà pour une autre étape, puisqu’il doit être unique, et s’il contient un espace."]], "51": [["Axiome", "Axiome 3 — Dans le diagramme, il est unique.\nAxiome 4 — Il n’a pas d’espace."], ["Phrase", "Un mot qui contient un espace, ou qui sert pour deux étapes alors qu’il doit être unique, n’est pas un identifiant valide."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La notion est sûre : ses axiomes sont posés comme des définitions."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On fait une hypothèse en choisissant un identifiant : on suppose qu’il restera clair en relisant plus tard."]], "54": [["Axiome", "Axiome 6 — Sans texte, c’est lui qui s’affiche."], ["Phrase", "On peut l’observer : retire le texte d’une étape, et c’est l’identifiant qui s’affiche."]], "55": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Derrière, c’est le principe de la clé en informatique : une valeur qui permet de retrouver une seule chose."]], "56": [["Axiome", "Axiome 1 — Un identifiant est un nom écrit dans le code Mermaid.\nAxiome 2 — Il désigne un seul élément du diagramme.\nAxiome 5 — Il est distinct du texte affiché."], ["Phrase", "Un identifiant n’est pas l’élément : c’est un nom, écrit dans le code Mermaid, qui le désigne, et il est distinct du texte affiché."]], "57": [["Axiome", "Axiome 1 — Un identifiant est un nom écrit dans le code Mermaid."], ["Phrase", "Il existe dès qu’il est écrit dans le code Mermaid."]], "58": [["Axiome", "Axiome 1 — Un identifiant est un nom écrit dans le code Mermaid.\nAxiome 2 — Il désigne un seul élément du diagramme.\nAxiome 3 — Dans le diagramme, il est unique.\nAxiome 4 — Il n’a pas d’espace.\nAxiome 5 — Il est distinct du texte affiché.\nAxiome 6 — Sans texte, c’est lui qui s’affiche."], ["Phrase", "Ce qui en fait un identifiant, c’est la réunion des axiomes : un nom du code Mermaid, sans espace, qui désigne un seul élément, unique, distinct du texte affiché, et qui s’affiche sans texte."]], "59": [["Axiome", "Axiome 1 — Un identifiant est un nom écrit dans le code Mermaid."], ["Phrase", "Il appartient à la catégorie des noms écrits dans le code Mermaid."]], "60": [["Axiome", "Axiome 1 — Un identifiant est un nom écrit dans le code Mermaid.\nAxiome 2 — Il désigne un seul élément du diagramme.\nAxiome 3 — Dans le diagramme, il est unique.\nAxiome 4 — Il n’a pas d’espace.\nAxiome 5 — Il est distinct du texte affiché.\nAxiome 6 — Sans texte, c’est lui qui s’affiche."], ["Phrase", "Nécessaire : un nom du code Mermaid, sans espace, qui désigne un seul élément, unique, distinct du texte affiché, et qui s’affiche sans texte. Accessoire : sa longueur et les lettres choisies."]], "61": [["Axiome", "Axiome 1 — Un identifiant est un nom écrit dans le code Mermaid.\nAxiome 4 — Il n’a pas d’espace."], ["Phrase", "Sa substance : un nom d’un seul tenant, sans espace."]], "62": [["Axiome", "Axiome 1 — Un identifiant est un nom écrit dans le code Mermaid.\nAxiome 2 — Il désigne un seul élément du diagramme.\nAxiome 3 — Dans le diagramme, il est unique.\nAxiome 4 — Il n’a pas d’espace.\nAxiome 5 — Il est distinct du texte affiché."], ["Phrase", "Ses limites : un nom du code Mermaid, sans espace, qui désigne un seul élément et reste unique ; il ne se confond pas avec le texte affiché, qui en est distinct."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans ce projet, il sert à repérer chaque étape de l’enregistreur dans le bloc Mermaid de la structure générale."]], "64": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On en a besoin dès qu’une étape doit être reliée à une autre."]], "65": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "L’idée vient de la programmation, où l’on repère chaque variable par un mot sans ambiguïté."]], "66": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les identifiants s’écrivent souvent en anglais et sans accents, par une habitude héritée de la programmation."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il relève de l’informatique : on en trouve dans tous les langages de programmation et de description."]], "68": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un identifiant clair aide les autres à relire et à corriger un diagramme."]], "69": [["Axiome", "Axiome 1 — Un identifiant est un nom écrit dans le code Mermaid.\nAxiome 6 — Sans texte, c’est lui qui s’affiche."], ["Phrase", "Il vit dans le code Mermaid ; dans le dessin, on ne le voit que sans texte."]], "70": [["Axiome", "Axiome 2 — Il désigne un seul élément du diagramme.\nAxiome 3 — Dans le diagramme, il est unique."], ["Phrase", "Son rôle : désigner un seul élément, sans ambiguïté puisqu’il est unique."]], "71": [["Axiome", "Axiome 1 — Un identifiant est un nom écrit dans le code Mermaid.\nAxiome 2 — Il désigne un seul élément du diagramme."], ["Phrase · hors axiomes", "Il fournit un nom court pour désigner un élément dans le code Mermaid."]], "72": [["Axiome", "Axiome 2 — Il désigne un seul élément du diagramme."], ["Phrase · hors axiomes", "Il permet de désigner une étape pour la relier, lui donner un style ou la placer dans un sous-groupe."]], "73": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En pratique, il évite de réécrire le texte d’une étape à chaque liaison."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ici, il sert à écrire la structure de l’enregistreur sans ambiguïté sur les étapes."]], "75": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il devient utile dès qu’une étape est reliée plusieurs fois."]], "76": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Écrire un identifiant pour la première fois, c’est créer l’étape dans le dessin."]], "77": [["Axiome", "Axiome 2 — Il désigne un seul élément du diagramme.\nAxiome 3 — Dans le diagramme, il est unique.\nAxiome 4 — Il n’a pas d’espace.\nAxiome 5 — Il est distinct du texte affiché.\nAxiome 7 — Un identifiant court pour « Enregistrer la voix » peut être `enreg`.\nNon couvert : les axiomes ne disent pas où l’écrire dans la ligne."], ["Phrase · hors axiomes", "- Choisir un mot court, sans espace, comme `enreg`.\n- Vérifier qu’il est unique dans le diagramme.\n- L’écrire en tête de ligne, suivi du texte affiché entre crochets, qui en est distinct.\n- Le reprendre tel quel dans chaque liaison qui désigne cette étape."]], "78": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il change quand on le renomme ; il faut alors le changer dans chaque liaison."]], "79": [["Axiome", "Axiome 5 — Il est distinct du texte affiché."], ["Phrase", "Le texte affiché, distinct de lui, peut évoluer sans qu’il change : on reformule une étape sans toucher à son identifiant."]], "80": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On peut le renommer partout d’un coup avec la fonction Rechercher et remplacer."]], "81": [["Axiome", "Axiome 7 — Un identifiant court pour « Enregistrer la voix » peut être `enreg`."], ["Phrase", "On le forme en raccourcissant le texte de l’étape : `enreg` vient de « Enregistrer la voix »."]], "82": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le programme lit chaque identifiant, retrouve l’étape qu’il vise, et trace les liaisons entre elles."]], "83": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’adapte à la taille du diagramme : des lettres pour un petit, des mots parlants pour un grand."]], "84": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une fois choisi, il reste en général le même d’une version à l’autre du diagramme."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un bon identifiant se juge à sa clarté : on comprend de quelle étape il s’agit sans voir le dessin."]], "86": [["Axiome", "Axiome 3 — Dans le diagramme, il est unique.\nAxiome 4 — Il n’a pas d’espace."], ["Phrase · hors axiomes", "Norme minimale : être unique et sans espace. Mermaid demande aussi d’éviter le mot end en minuscules, qui casse le diagramme."]], "87": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Sa valeur tient à la clarté qu’il apporte : un repère compréhensible aide à garder le diagramme juste."]], "88": [["Axiome", "Axiome 3 — Dans le diagramme, il est unique.\nAxiome 4 — Il n’a pas d’espace.\nAxiome 7 — Un identifiant court pour « Enregistrer la voix » peut être `enreg`."], ["Phrase · hors axiomes", "Critères tirés des axiomes : unique, sans espace, et court comme `enreg`. Critères habituels en plus : parlant, sans accents, régulier."]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un identifiant de qualité se comprend sans explication et se tape vite."]], "90": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il est pertinent dès qu’une étape doit être reliée ; pour une étape isolée, une lettre suffit."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’améliore en le rendant plus court et plus parlant, et en harmonisant le style de tous les identifiants."]]}, "sens": {"1": [["Axiome", "Axiome 1 — Le sens est la direction de lecture.\nAxiome 2 — Il vaut pour tout le diagramme.\nAxiome 3 — Il s’écrit sur la première ligne, après `flowchart`.\nAxiome 4 — Sans sens écrit, le diagramme se lit de haut en bas.\nAxiome 5 — De gauche à droite, j’écris flowchart `LR`.\nAxiome 6 — De droite à gauche, j’écris flowchart `RL`.\nAxiome 7 — De haut en bas, j’écris flowchart `TD` (ou `TB`).\nAxiome 8 — De bas en haut, j’écris flowchart `BT`."], ["Phrase", "Le sens se compose d’une direction de lecture, valable pour tout le diagramme, écrite sur la première ligne après `flowchart` ; sans sens écrit, le diagramme se lit de haut en bas ; ses valeurs sont `LR`, `RL`, `TD` (ou `TB`) et `BT`."]], "2": [["Axiome", "Axiome 1 — Le sens est la direction de lecture.\nAxiome 2 — Il vaut pour tout le diagramme.\nAxiome 3 — Il s’écrit sur la première ligne, après `flowchart`.\nAxiome 4 — Sans sens écrit, le diagramme se lit de haut en bas.\nAxiome 5 — De gauche à droite, j’écris flowchart `LR`.\nAxiome 6 — De droite à gauche, j’écris flowchart `RL`.\nAxiome 7 — De haut en bas, j’écris flowchart `TD` (ou `TB`).\nAxiome 8 — De bas en haut, j’écris flowchart `BT`."], ["Phrase", "Ses éléments fondamentaux sont ceux que posent les axiomes : une direction de lecture, qui vaut pour tout le diagramme, écrite sur la première ligne après `flowchart`, une valeur prise sans sens écrit (il se lit de haut en bas), et quatre valeurs : `LR`, `RL`, `TD` (ou `TB`) et `BT`."]], "3": [["Axiome", "Axiome 3 — Il s’écrit sur la première ligne, après `flowchart`.\nAxiome 5 — De gauche à droite, j’écris flowchart `LR`.\nAxiome 6 — De droite à gauche, j’écris flowchart `RL`.\nAxiome 7 — De haut en bas, j’écris flowchart `TD` (ou `TB`).\nAxiome 8 — De bas en haut, j’écris flowchart `BT`."], ["Phrase", "On écrit `flowchart` sur la première ligne, puis, juste après, l’une des valeurs `LR`, `RL`, `TD` (ou `TB`) ou `BT`."]], "4": [["Axiome", "Axiome 5 — De gauche à droite, j’écris flowchart `LR`.\nAxiome 6 — De droite à gauche, j’écris flowchart `RL`.\nAxiome 7 — De haut en bas, j’écris flowchart `TD` (ou `TB`).\nAxiome 8 — De bas en haut, j’écris flowchart `BT`."], ["Phrase", "Il se décompose en quatre valeurs possibles : `LR`, `RL`, `TD` (ou `TB`) et `BT`."]], "5": [["Axiome", "Axiome 2 — Il vaut pour tout le diagramme.\nAxiome 5 — De gauche à droite, j’écris flowchart `LR`.\nAxiome 6 — De droite à gauche, j’écris flowchart `RL`.\nAxiome 7 — De haut en bas, j’écris flowchart `TD` (ou `TB`).\nAxiome 8 — De bas en haut, j’écris flowchart `BT`."], ["Phrase", "Quatre sens possibles (`LR`, `RL`, `TD` (ou `TB`) et `BT`), et un seul sens pour tout le diagramme."]], "6": [["Axiome", "Axiome 1 — Le sens est la direction de lecture."], ["Phrase", "Sa nature : une direction de lecture."]], "7": [["Axiome", "Axiome 1 — Le sens est la direction de lecture.\nAxiome 2 — Il vaut pour tout le diagramme."], ["Phrase", "Le sens, c’est la direction dans laquelle on lit tout le diagramme."]], "8": [["Axiome", "Axiome 1 — Le sens est la direction de lecture.\nAxiome 2 — Il vaut pour tout le diagramme.\nAxiome 3 — Il s’écrit sur la première ligne, après `flowchart`.\nAxiome 4 — Sans sens écrit, le diagramme se lit de haut en bas.\nAxiome 5 — De gauche à droite, j’écris flowchart `LR`.\nAxiome 6 — De droite à gauche, j’écris flowchart `RL`.\nAxiome 7 — De haut en bas, j’écris flowchart `TD` (ou `TB`).\nAxiome 8 — De bas en haut, j’écris flowchart `BT`."], ["Phrase", "Le sens est la direction de lecture de tout le diagramme ; il s’écrit sur la première ligne, après `flowchart` : `LR`, `RL`, `TD` (ou `TB`) et `BT` ; sans sens écrit, le diagramme se lit de haut en bas."]], "9": [["Axiome", "Axiome 1 — Le sens est la direction de lecture.\nAxiome 2 — Il vaut pour tout le diagramme.\nAxiome 3 — Il s’écrit sur la première ligne, après `flowchart`.\nAxiome 4 — Sans sens écrit, le diagramme se lit de haut en bas."], ["Phrase", "Être une direction de lecture, valoir pour tout le diagramme, s’écrire sur la première ligne après `flowchart`, et valoir de haut vers le bas par défaut : ces propriétés le constituent."]], "10": [["Axiome", "Axiome 3 — Il s’écrit sur la première ligne, après `flowchart`."], ["Phrase", "Il s’applique aux diagrammes de flux : il s’écrit après `flowchart`, sur la première ligne."]], "11": [["Axiome", "Axiome 1 — Le sens est la direction de lecture.\nAxiome 5 — De gauche à droite, j’écris flowchart `LR`.\nAxiome 6 — De droite à gauche, j’écris flowchart `RL`.\nAxiome 7 — De haut en bas, j’écris flowchart `TD` (ou `TB`).\nAxiome 8 — De bas en haut, j’écris flowchart `BT`."], ["Phrase · hors axiomes", "Les axiomes l’appellent sens, ou direction de lecture. Ses valeurs viennent de l’anglais : `LR` (left-right), `RL`, `TD` (top-down), `TB` (top-bottom), `BT` (bottom-top)."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le mot vient du latin sensus ; ici, il a la même valeur que dans « sens unique » ou « sens interdit »."]], "13": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le lecteur suit les flèches ; le réglage choisi l’aide à deviner par où commencer."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Sens » veut aussi dire signification ; ici, il ne s’agit que d’orientation."]], "15": [["Axiome", "Axiome 3 — Il s’écrit sur la première ligne, après `flowchart`."], ["Phrase", "Il tient sur la première ligne : le mot `flowchart`, puis la valeur du sens."]], "16": [["Axiome", "Axiome 2 — Il vaut pour tout le diagramme."], ["Phrase", "Il est au-dessus de toutes les étapes : il vaut pour tout le diagramme."]], "17": [["Axiome", "Axiome 1 — Le sens est la direction de lecture.\nAxiome 2 — Il vaut pour tout le diagramme."], ["Phrase", "Il donne l’orientation générale : une direction de lecture pour tout le diagramme."]], "18": [["Axiome", "Axiome 1 — Le sens est la direction de lecture.\nAxiome 2 — Il vaut pour tout le diagramme."], ["Phrase", "Toutes les étapes se disposent selon la même direction, puisqu’il vaut pour tout le diagramme."]], "19": [["Axiome", "Axiome 3 — Il s’écrit sur la première ligne, après `flowchart`."], ["Phrase", "Il se range parmi les réglages de la première ligne d’un diagramme de flux."]], "20": [["Axiome", "Axiome 5 — De gauche à droite, j’écris flowchart `LR`.\nAxiome 6 — De droite à gauche, j’écris flowchart `RL`.\nAxiome 7 — De haut en bas, j’écris flowchart `TD` (ou `TB`).\nAxiome 8 — De bas en haut, j’écris flowchart `BT`."], ["Phrase · hors axiomes", "Deux familles : horizontal (`LR`, `RL`) et vertical (`TD` ou `TB`, `BT`)."]], "21": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Mermaid permet à un sous-groupe d’avoir sa propre orientation, mais elle est ignorée dès qu’une de ses étapes est reliée à l’extérieur du sous-groupe."]], "22": [["Axiome", "Axiome 1 — Le sens est la direction de lecture.\nAxiome 2 — Il vaut pour tout le diagramme."], ["Phrase", "Il relie toutes les étapes à une même direction de lecture : il vaut pour tout le diagramme."]], "23": [["Axiome", "Axiome 2 — Il vaut pour tout le diagramme.\nAxiome 4 — Sans sens écrit, le diagramme se lit de haut en bas."], ["Phrase", "S’il vaut pour tout le diagramme, il ne peut y en avoir qu’un ; et sans sens écrit, c’est le haut vers le bas qui s’applique."]], "24": [["Axiome", "Axiome 1 — Le sens est la direction de lecture.\nAxiome 2 — Il vaut pour tout le diagramme.\nAxiome 5 — De gauche à droite, j’écris flowchart `LR`.\nAxiome 7 — De haut en bas, j’écris flowchart `TD` (ou `TB`)."], ["Phrase", "Changer `LR` en `TD` fait tourner tout le diagramme : la valeur écrite décide de sa direction de lecture."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Plus le diagramme a d’étapes à la suite, plus l’orientation verticale convient à un écran de téléphone."]], "26": [["Axiome", "Axiome 1 — Le sens est la direction de lecture.\nAxiome 3 — Il s’écrit sur la première ligne, après `flowchart`."], ["Phrase", "La valeur écrite après `flowchart` fixe la direction de lecture."]], "27": [["Axiome", "Axiome 3 — Il s’écrit sur la première ligne, après `flowchart`."], ["Phrase · hors axiomes", "Il dépend de `flowchart` : il s’écrit juste après, sur la première ligne. Dans la carte, il dépend de Diagramme de flux, et Étape dépend de lui."]], "28": [["Axiome", "Axiome 5 — De gauche à droite, j’écris flowchart `LR`.\nAxiome 6 — De droite à gauche, j’écris flowchart `RL`.\nAxiome 7 — De haut en bas, j’écris flowchart `TD` (ou `TB`).\nAxiome 8 — De bas en haut, j’écris flowchart `BT`."], ["Phrase", "`LR` s’oppose à `RL`, et `TD` (ou `TB`) à `BT`."]], "29": [["Axiome", "Axiome 3 — Il s’écrit sur la première ligne, après `flowchart`.\nAxiome 4 — Sans sens écrit, le diagramme se lit de haut en bas."], ["Phrase", "Le sens écrit et le sens par défaut se complètent : si rien n’est écrit sur la première ligne après `flowchart`, c’est le haut vers le bas qui vaut."]], "30": [["Axiome", "Axiome 4 — Sans sens écrit, le diagramme se lit de haut en bas."], ["Phrase", "Si aucun sens n’est écrit, le diagramme se lit de haut en bas ; sinon, c’est la valeur écrite qui compte."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Comme le sens de l’écriture, il dit par où commencer ; à la différence de l’écriture, on peut le changer d’un mot."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le réglage et les liaisons interagissent : une flèche de A vers B pointe toujours vers B, mais son orientation à l’écran suit le réglage."]], "33": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "L’ordre des étapes ne change pas avec le réglage : seule leur place à l’écran change."]], "34": [["Axiome", "Axiome 5 — De gauche à droite, j’écris flowchart `LR`.\nAxiome 6 — De droite à gauche, j’écris flowchart `RL`.\nAxiome 7 — De haut en bas, j’écris flowchart `TD` (ou `TB`).\nAxiome 8 — De bas en haut, j’écris flowchart `BT`."], ["Phrase", "Il fixe la place des étapes : côte à côte pour `LR` et `RL`, les unes sous les autres pour `TD` (ou `TB`) et `BT`."]], "35": [["Axiome", "Axiome 1 — Le sens est la direction de lecture.\nAxiome 2 — Il vaut pour tout le diagramme.\nAxiome 3 — Il s’écrit sur la première ligne, après `flowchart`.\nAxiome 4 — Sans sens écrit, le diagramme se lit de haut en bas.\nAxiome 5 — De gauche à droite, j’écris flowchart `LR`.\nAxiome 6 — De droite à gauche, j’écris flowchart `RL`.\nAxiome 7 — De haut en bas, j’écris flowchart `TD` (ou `TB`).\nAxiome 8 — De bas en haut, j’écris flowchart `BT`."], ["Phrase", "Huit propositions : c’est une direction de lecture ; elle vaut pour tout le diagramme ; elle s’écrit sur la première ligne, après `flowchart` ; sans sens écrit, le diagramme se lit de haut en bas ; ses valeurs sont `LR`, `RL`, `TD` (ou `TB`) et `BT`."]], "36": [["Axiome", "Axiome 1 — Le sens est la direction de lecture.\nAxiome 2 — Il vaut pour tout le diagramme.\nAxiome 3 — Il s’écrit sur la première ligne, après `flowchart`."], ["Phrase", "On dit du sens qu’il est une direction de lecture, qu’il vaut pour tout le diagramme et qu’il s’écrit sur la première ligne."]], "37": [["Axiome", "Axiome 3 — Il s’écrit sur la première ligne, après `flowchart`.\nAxiome 5 — De gauche à droite, j’écris flowchart `LR`."], ["Phrase", "En lisant `LR` après `flowchart`, on sait que le diagramme se lit de gauche à droite."]], "38": [["Axiome", "Axiome 2 — Il vaut pour tout le diagramme."], ["Phrase", "Conséquence nécessaire : un diagramme n’a qu’un seul sens, puisqu’il vaut pour tout le diagramme."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "À force d’en dessiner, on remarque que le vertical convient aux longues suites d’étapes."]], "40": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Si le dessin s’affiche en hauteur alors qu’on le voulait en largeur, l’explication la plus probable est un réglage oublié en tête du code."]], "41": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Argument habituel : choisir l’orientation selon l’écran rend le diagramme plus facile à suivre."]], "42": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les axiomes ne se démontrent pas : on les admet. On montre qu’un réglage est juste en regardant le dessin obtenu."]], "43": [["Axiome", "Axiome 1 — Le sens est la direction de lecture.\nAxiome 2 — Il vaut pour tout le diagramme.\nAxiome 3 — Il s’écrit sur la première ligne, après `flowchart`.\nAxiome 4 — Sans sens écrit, le diagramme se lit de haut en bas.\nAxiome 5 — De gauche à droite, j’écris flowchart `LR`.\nAxiome 6 — De droite à gauche, j’écris flowchart `RL`.\nAxiome 7 — De haut en bas, j’écris flowchart `TD` (ou `TB`).\nAxiome 8 — De bas en haut, j’écris flowchart `BT`."], ["Phrase", "Huit principes fondent la notion : la direction de lecture, sa portée sur tout le diagramme, sa place sur la première ligne, le sens par défaut, et les quatre valeurs `LR`, `RL`, `TD` (ou `TB`) et `BT`."]], "44": [["Axiome", "Axiome 2 — Il vaut pour tout le diagramme.\nAxiome 3 — Il s’écrit sur la première ligne, après `flowchart`."], ["Phrase", "Exclus : deux sens différents dans un même diagramme, puisqu’il vaut pour tout le diagramme, ou un sens écrit ailleurs que sur la première ligne."]], "45": [["Axiome", "Axiome 1 — Le sens est la direction de lecture.\nAxiome 2 — Il vaut pour tout le diagramme.\nAxiome 3 — Il s’écrit sur la première ligne, après `flowchart`.\nAxiome 4 — Sans sens écrit, le diagramme se lit de haut en bas.\nAxiome 5 — De gauche à droite, j’écris flowchart `LR`.\nAxiome 6 — De droite à gauche, j’écris flowchart `RL`.\nAxiome 7 — De haut en bas, j’écris flowchart `TD` (ou `TB`).\nAxiome 8 — De bas en haut, j’écris flowchart `BT`."], ["Phrase", "Les axiomes s’accordent : le premier dit ce qu’il est (une direction de lecture), le deuxième sa portée (tout le diagramme), le troisième sa place (la première ligne), le quatrième le cas sans sens écrit, et les derniers ses valeurs (`LR`, `RL`, `TD` (ou `TB`) et `BT`)."]], "46": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans la carte, Sens du diagramme fait partie des Fondations et suppose de connaître Diagramme de flux."]], "47": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On le justifie par l’écran : un téléphone est haut et étroit, un ordinateur est large."]], "48": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La preuve que le réglage est bon : le dessin s’affiche dans l’orientation voulue."]], "49": [["Axiome", "Axiome 3 — Il s’écrit sur la première ligne, après `flowchart`.\nAxiome 5 — De gauche à droite, j’écris flowchart `LR`.\nAxiome 6 — De droite à gauche, j’écris flowchart `RL`.\nAxiome 7 — De haut en bas, j’écris flowchart `TD` (ou `TB`).\nAxiome 8 — De bas en haut, j’écris flowchart `BT`."], ["Phrase", "Un sens est bien écrit s’il suit `flowchart` sur la première ligne et s’il vaut `LR`, `RL`, `TD`, `TB` ou `BT`."]], "50": [["Axiome", "Axiome 3 — Il s’écrit sur la première ligne, après `flowchart`."], ["Phrase", "Pour vérifier : regarder la première ligne, juste après `flowchart`."]], "51": [["Axiome", "Axiome 3 — Il s’écrit sur la première ligne, après `flowchart`.\nAxiome 5 — De gauche à droite, j’écris flowchart `LR`.\nAxiome 6 — De droite à gauche, j’écris flowchart `RL`.\nAxiome 7 — De haut en bas, j’écris flowchart `TD` (ou `TB`).\nAxiome 8 — De bas en haut, j’écris flowchart `BT`."], ["Phrase", "Une valeur autre que `LR`, `RL`, `TD`, `TB` ou `BT`, ou écrite ailleurs que sur la première ligne, n’est pas un sens valide."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La notion est sûre : ses axiomes sont posés comme des définitions."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On fait une hypothèse en choisissant l’orientation : on suppose qu’elle rendra le dessin plus clair."]], "54": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’observe directement : en changeant le réglage, le dessin tourne."]], "55": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Derrière, c’est le principe de la mise en page automatique : le programme place les étapes selon une orientation choisie."]], "56": [["Axiome", "Axiome 1 — Le sens est la direction de lecture."], ["Phrase", "Le sens n’est ni une étape ni une liaison : c’est une direction de lecture."]], "57": [["Axiome", "Axiome 4 — Sans sens écrit, le diagramme se lit de haut en bas."], ["Phrase", "Il existe toujours : sans sens écrit, le diagramme se lit de haut en bas."]], "58": [["Axiome", "Axiome 1 — Le sens est la direction de lecture.\nAxiome 2 — Il vaut pour tout le diagramme.\nAxiome 3 — Il s’écrit sur la première ligne, après `flowchart`.\nAxiome 4 — Sans sens écrit, le diagramme se lit de haut en bas.\nAxiome 5 — De gauche à droite, j’écris flowchart `LR`.\nAxiome 6 — De droite à gauche, j’écris flowchart `RL`.\nAxiome 7 — De haut en bas, j’écris flowchart `TD` (ou `TB`).\nAxiome 8 — De bas en haut, j’écris flowchart `BT`."], ["Phrase", "Ce qui en fait le sens du diagramme, c’est la réunion des axiomes : une direction de lecture, valable pour tout le diagramme, écrite sur la première ligne après `flowchart`, de haut en bas par défaut, et choisie parmi `LR`, `RL`, `TD` (ou `TB`) et `BT`."]], "59": [["Axiome", "Axiome 1 — Le sens est la direction de lecture."], ["Phrase", "Il appartient à la catégorie des directions de lecture."]], "60": [["Axiome", "Axiome 2 — Il vaut pour tout le diagramme.\nAxiome 4 — Sans sens écrit, le diagramme se lit de haut en bas.\nAxiome 5 — De gauche à droite, j’écris flowchart `LR`.\nAxiome 6 — De droite à gauche, j’écris flowchart `RL`.\nAxiome 7 — De haut en bas, j’écris flowchart `TD` (ou `TB`).\nAxiome 8 — De bas en haut, j’écris flowchart `BT`."], ["Phrase", "Nécessaire : un seul sens pour tout le diagramme ; sans sens écrit, il se lit de haut en bas. Au choix : `LR`, `RL`, `TD` (ou `TB`) et `BT`."]], "61": [["Axiome", "Axiome 1 — Le sens est la direction de lecture."], ["Phrase", "Sa substance : une direction."]], "62": [["Axiome", "Axiome 2 — Il vaut pour tout le diagramme.\nAxiome 3 — Il s’écrit sur la première ligne, après `flowchart`."], ["Phrase", "Il vaut pour tout le diagramme et s’écrit seulement sur la première ligne : au-delà, ce n’est plus le sens."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans ce projet, il décide si la structure de l’enregistreur se lit en largeur ou en hauteur sur l’iPhone."]], "64": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On le change quand le dessin déborde de l’écran, ou pour suivre l’ordre naturel d’un processus."]], "65": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On retrouve les mêmes abréviations dans Graphviz, un outil plus ancien de dessin de graphes."]], "66": [["Axiome", "Axiome 5 — De gauche à droite, j’écris flowchart `LR`.\nAxiome 6 — De droite à gauche, j’écris flowchart `RL`.\nAxiome 7 — De haut en bas, j’écris flowchart `TD` (ou `TB`)."], ["Phrase · hors axiomes", "En Occident, on lit de gauche à droite et de haut en bas ; en arabe ou en hébreu, on lit de droite à gauche."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il relève de la mise en page des diagrammes, un domaine de l’informatique."]], "68": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Choisir l’orientation habituelle de ses lecteurs rend un diagramme plus facile à partager."]], "69": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il agit sur l’espace du dessin, pas sur le temps : l’ordre des étapes reste le même."]], "70": [["Axiome", "Axiome 1 — Le sens est la direction de lecture.\nAxiome 2 — Il vaut pour tout le diagramme."], ["Phrase", "Son rôle : donner une direction de lecture à tout le diagramme."]], "71": [["Axiome", "Axiome 5 — De gauche à droite, j’écris flowchart `LR`.\nAxiome 6 — De droite à gauche, j’écris flowchart `RL`.\nAxiome 7 — De haut en bas, j’écris flowchart `TD` (ou `TB`).\nAxiome 8 — De bas en haut, j’écris flowchart `BT`."], ["Phrase", "Il fournit quatre réglages : `LR`, `RL`, `TD` (ou `TB`) et `BT`."]], "72": [["Axiome", "Axiome 3 — Il s’écrit sur la première ligne, après `flowchart`.\nAxiome 5 — De gauche à droite, j’écris flowchart `LR`.\nAxiome 6 — De droite à gauche, j’écris flowchart `RL`.\nAxiome 7 — De haut en bas, j’écris flowchart `TD` (ou `TB`).\nAxiome 8 — De bas en haut, j’écris flowchart `BT`."], ["Phrase", "Il permet d’orienter le dessin en écrivant, après `flowchart`, `LR`, `RL`, `TD` (ou `TB`) ou `BT`."]], "73": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En pratique, il évite qu’un long diagramme déborde de l’écran."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ici, il sert à rendre la structure de l’enregistreur lisible sur un iPhone."]], "75": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il devient utile dès que l’orientation habituelle ne convient pas à l’écran."]], "76": [["Axiome", "Axiome 3 — Il s’écrit sur la première ligne, après `flowchart`.\nAxiome 5 — De gauche à droite, j’écris flowchart `LR`."], ["Phrase", "Écrire flowchart `LR` sur la première ligne, c’est déjà orienter tout le dessin."]], "77": [["Axiome", "Axiome 1 — Le sens est la direction de lecture.\nAxiome 3 — Il s’écrit sur la première ligne, après `flowchart`.\nAxiome 5 — De gauche à droite, j’écris flowchart `LR`.\nAxiome 6 — De droite à gauche, j’écris flowchart `RL`.\nAxiome 7 — De haut en bas, j’écris flowchart `TD` (ou `TB`).\nAxiome 8 — De bas en haut, j’écris flowchart `BT`."], ["Phrase · hors axiomes", "- Choisir la direction voulue.\n- Sur la première ligne, après `flowchart`, écrire `LR`, `RL`, `TD` (ou `TB`) ou `BT`.\n- Regarder le dessin et changer la valeur si besoin."]], "78": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il change d’un seul mot : remplacer la valeur suffit à réorienter tout le dessin."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Au fil du projet, on peut passer d’une orientation à une autre quand le diagramme grandit."]], "80": [["Axiome", "Axiome 5 — De gauche à droite, j’écris flowchart `LR`.\nAxiome 7 — De haut en bas, j’écris flowchart `TD` (ou `TB`)."], ["Phrase · hors axiomes", "Passer de `LR` à `TD` transforme un diagramme horizontal en diagramme vertical, sans toucher aux étapes."]], "81": [["Axiome", "Axiome 4 — Sans sens écrit, le diagramme se lit de haut en bas."], ["Phrase", "À sa création, un diagramme sans sens écrit se lit de haut en bas."]], "82": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le programme lit le réglage, puis place les étapes l’une après l’autre dans l’orientation demandée."]], "83": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il permet d’adapter un même diagramme à l’écran : vertical sur téléphone, horizontal sur ordinateur."]], "84": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "D’une version à l’autre, seul ce réglage peut changer, sans toucher au reste du code."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un bon réglage se juge à l’œil : le dessin tient à l’écran et se suit sans effort."]], "86": [["Axiome", "Axiome 3 — Il s’écrit sur la première ligne, après `flowchart`.\nAxiome 5 — De gauche à droite, j’écris flowchart `LR`.\nAxiome 6 — De droite à gauche, j’écris flowchart `RL`.\nAxiome 7 — De haut en bas, j’écris flowchart `TD` (ou `TB`).\nAxiome 8 — De bas en haut, j’écris flowchart `BT`."], ["Phrase", "Norme : `flowchart`, puis l’une des valeurs `LR`, `RL`, `TD`, `TB` ou `BT`, sur la première ligne."]], "87": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Sa valeur tient au confort du lecteur : une orientation bien choisie évite de faire défiler le dessin dans tous les sens."]], "88": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Critères : le dessin tient à l’écran, les flèches vont toutes du même côté, l’orientation suit l’ordre naturel du processus."]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un bon réglage est celui qu’on ne remarque pas : le dessin se suit de lui-même."]], "90": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il est pertinent dès qu’un diagramme dépasse quelques étapes ; pour trois étapes, n’importe quelle orientation convient."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’améliore en testant les deux orientations, horizontale et verticale, et en gardant la plus lisible."]]}, "eta": {"1": [["Axiome", "Axiome 1 — Dans un diagramme de flux, une étape est une boîte.\nAxiome 2 — Elle porte un texte affiché.\nAxiome 3 — Elle représente une seule action, un seul état ou une seule question.\nAxiome 4 — Son terme technique est nœud.\nAxiome 5 — Elle s’écrit avec un identifiant suivi du texte entre crochets.\nAxiome 6 — Un texte à caractères spéciaux se met entre guillemets.\nAxiome 8 — Pour des angles arrondis, j’écris `C(Arrondi)`.\nAxiome 9 — Pour un cercle, j’écris `D((Rond))`.\nAxiome 10 — Pour un losange, j’écris `E{Question ?}`."], ["Phrase", "Une étape se compose d’une boîte (un nœud, en terme technique) qui porte un texte affiché et représente une seule action, un seul état ou une seule question ; elle s’écrit avec un identifiant suivi du texte entre crochets, entre guillemets s’il a des caractères spéciaux ; la boîte peut aussi être arrondie, en cercle ou en losange."]], "2": [["Axiome", "Axiome 1 — Dans un diagramme de flux, une étape est une boîte.\nAxiome 2 — Elle porte un texte affiché.\nAxiome 3 — Elle représente une seule action, un seul état ou une seule question.\nAxiome 4 — Son terme technique est nœud.\nAxiome 5 — Elle s’écrit avec un identifiant suivi du texte entre crochets.\nAxiome 6 — Un texte à caractères spéciaux se met entre guillemets.\nAxiome 8 — Pour des angles arrondis, j’écris `C(Arrondi)`.\nAxiome 9 — Pour un cercle, j’écris `D((Rond))`.\nAxiome 10 — Pour un losange, j’écris `E{Question ?}`."], ["Phrase", "Ses éléments fondamentaux sont ceux que posent les axiomes : une boîte, ou nœud, un texte affiché, une seule action, un seul état ou une seule question, un identifiant suivi du texte entre crochets, des guillemets pour les caractères spéciaux, et trois autres formes : arrondie, cercle, losange."]], "3": [["Axiome", "Axiome 5 — Elle s’écrit avec un identifiant suivi du texte entre crochets.\nAxiome 6 — Un texte à caractères spéciaux se met entre guillemets.\nAxiome 7 — L’étape « Enregistrer » d’identifiant A s’écrit `A[Enregistrer]`."], ["Phrase", "On écrit l’identifiant, puis le texte entre crochets, comme `A[Enregistrer]` ; si le texte a des caractères spéciaux, on le met aussi entre guillemets."]], "4": [["Axiome", "Axiome 1 — Dans un diagramme de flux, une étape est une boîte.\nAxiome 2 — Elle porte un texte affiché.\nAxiome 5 — Elle s’écrit avec un identifiant suivi du texte entre crochets."], ["Phrase", "Dans le code, elle se décompose en un identifiant et un texte entre crochets ; dans le dessin, en une boîte et le texte affiché qu’elle porte."]], "5": [["Axiome", "Axiome 3 — Elle représente une seule action, un seul état ou une seule question.\nNon couvert : les axiomes ne fixent pas le nombre d’étapes d’un diagramme."], ["Phrase", "Une étape représente une seule chose : une seule action, un seul état ou une seule question."]], "6": [["Axiome", "Axiome 1 — Dans un diagramme de flux, une étape est une boîte.\nAxiome 2 — Elle porte un texte affiché.\nAxiome 3 — Elle représente une seule action, un seul état ou une seule question."], ["Phrase", "Sa nature : une boîte qui porte un texte affiché, et qui représente une seule action, un seul état ou une seule question."]], "7": [["Axiome", "Axiome 1 — Dans un diagramme de flux, une étape est une boîte.\nAxiome 3 — Elle représente une seule action, un seul état ou une seule question."], ["Phrase", "Une étape, c’est une boîte du diagramme de flux qui représente une seule action, un seul état ou une seule question."]], "8": [["Axiome", "Axiome 1 — Dans un diagramme de flux, une étape est une boîte.\nAxiome 2 — Elle porte un texte affiché.\nAxiome 3 — Elle représente une seule action, un seul état ou une seule question.\nAxiome 4 — Son terme technique est nœud."], ["Phrase", "Une étape est une boîte d’un diagramme de flux, appelée nœud en terme technique, qui porte un texte affiché et représente une seule action, un seul état ou une seule question."]], "9": [["Axiome", "Axiome 1 — Dans un diagramme de flux, une étape est une boîte.\nAxiome 2 — Elle porte un texte affiché.\nAxiome 3 — Elle représente une seule action, un seul état ou une seule question."], ["Phrase", "Être une boîte, porter un texte affiché, représenter une seule action, un seul état ou une seule question : ces propriétés la constituent."]], "10": [["Axiome", "Axiome 3 — Elle représente une seule action, un seul état ou une seule question.\nAxiome 7 — L’étape « Enregistrer » d’identifiant A s’écrit `A[Enregistrer]`."], ["Phrase", "Elle s’applique à chaque point d’un processus qui est une seule action, un seul état ou une seule question, comme `A[Enregistrer]`."]], "11": [["Axiome", "Axiome 1 — Dans un diagramme de flux, une étape est une boîte.\nAxiome 4 — Son terme technique est nœud."], ["Phrase · hors axiomes", "Les axiomes l’appellent étape, ou boîte ; son terme technique est nœud, en anglais node."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le mot vient de l’ancien français estaple, un entrepôt de marchandises, devenu un lieu où l’on s’arrête en chemin."]], "13": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On lit chaque étape selon sa forme : une action, une question à trancher, un début ou une fin."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Étape » veut aussi dire une halte en voyage ou un stade d’un projet ; ici, il s’agit d’un point du processus."]], "15": [["Axiome", "Axiome 5 — Elle s’écrit avec un identifiant suivi du texte entre crochets."], ["Phrase", "Sa structure dans le code : d’abord l’identifiant, ensuite le texte entre crochets."]], "16": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les étapes n’ont pas de rang entre elles : les liaisons donnent un ordre, pas une hiérarchie."]], "17": [["Axiome", "Axiome 1 — Dans un diagramme de flux, une étape est une boîte."], ["Phrase", "Vu de loin, un diagramme de flux est fait de boîtes, et chaque étape en est une."]], "18": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les étapes se disposent selon le sens du diagramme, l’une après l’autre."]], "19": [["Axiome", "Axiome 1 — Dans un diagramme de flux, une étape est une boîte.\nAxiome 4 — Son terme technique est nœud."], ["Phrase", "Elle se range parmi les nœuds : les boîtes d’un diagramme de flux."]], "20": [["Axiome", "Axiome 3 — Elle représente une seule action, un seul état ou une seule question.\nAxiome 8 — Pour des angles arrondis, j’écris `C(Arrondi)`.\nAxiome 9 — Pour un cercle, j’écris `D((Rond))`.\nAxiome 10 — Pour un losange, j’écris `E{Question ?}`."], ["Phrase · hors axiomes", "Trois types selon ce qu’elle représente : une seule action, un seul état ou une seule question ; et quatre formes : rectangle, arrondi, cercle, losange."]], "21": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une étape peut regrouper tout un processus : c’est alors un sous-processus, dessiné à part."]], "22": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les étapes sont reliées entre elles par des liaisons, qui vont d’une étape de départ à une étape d’arrivée."]], "23": [["Axiome", "Axiome 3 — Elle représente une seule action, un seul état ou une seule question."], ["Phrase", "Puisqu’elle représente une seule action, un seul état ou une seule question, deux actions demandent deux étapes."]], "24": [["Axiome", "Axiome 8 — Pour des angles arrondis, j’écris `C(Arrondi)`.\nAxiome 9 — Pour un cercle, j’écris `D((Rond))`.\nAxiome 10 — Pour un losange, j’écris `E{Question ?}`."], ["Phrase", "Changer les signes autour du texte change la forme dessinée : parenthèses pour un arrondi, doubles parenthèses pour un cercle, accolades pour un losange."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Plus un processus a d’actions, plus il a d’étapes."]], "26": [["Axiome", "Axiome 1 — Dans un diagramme de flux, une étape est une boîte.\nAxiome 2 — Elle porte un texte affiché.\nAxiome 5 — Elle s’écrit avec un identifiant suivi du texte entre crochets."], ["Phrase · hors axiomes", "L’identifiant sert à la désigner dans le code ; la boîte et son texte affiché servent à la montrer dans le dessin."]], "27": [["Axiome", "Axiome 5 — Elle s’écrit avec un identifiant suivi du texte entre crochets."], ["Phrase · hors axiomes", "Elle dépend de l’identifiant : sans lui, on ne peut pas l’écrire. Dans la carte, elle dépend de Sens du diagramme et d’Identifiant ; Indentation et Liaison dépendent d’elle."]], "28": [["Axiome", "Axiome 3 — Elle représente une seule action, un seul état ou une seule question."], ["Phrase", "Une étape représente une seule action, un seul état ou une seule question : jamais deux à la fois."]], "29": [["Axiome", "Axiome 1 — Dans un diagramme de flux, une étape est une boîte.\nAxiome 2 — Elle porte un texte affiché."], ["Phrase", "La boîte et le texte affiché se complètent : la boîte donne la forme, le texte dit ce qu’elle représente."]], "30": [["Axiome", "Axiome 6 — Un texte à caractères spéciaux se met entre guillemets."], ["Phrase", "Si le texte contient des caractères spéciaux, il se met entre guillemets."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Comme une phrase dans un texte, elle porte une seule idée ; à la différence d’une phrase, elle se relie aux autres par des flèches."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Modifier une étape peut obliger à revoir les flèches qui y arrivent et qui en partent."]], "33": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les étapes se suivent dans l’ordre que donnent les liaisons."]], "34": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Sa place dépend du sens du diagramme et de ses liaisons : le programme la positionne automatiquement."]], "35": [["Axiome", "Axiome 1 — Dans un diagramme de flux, une étape est une boîte.\nAxiome 2 — Elle porte un texte affiché.\nAxiome 3 — Elle représente une seule action, un seul état ou une seule question.\nAxiome 4 — Son terme technique est nœud.\nAxiome 5 — Elle s’écrit avec un identifiant suivi du texte entre crochets.\nAxiome 6 — Un texte à caractères spéciaux se met entre guillemets.\nAxiome 7 — L’étape « Enregistrer » d’identifiant A s’écrit `A[Enregistrer]`.\nAxiome 8 — Pour des angles arrondis, j’écris `C(Arrondi)`.\nAxiome 9 — Pour un cercle, j’écris `D((Rond))`.\nAxiome 10 — Pour un losange, j’écris `E{Question ?}`."], ["Phrase", "Dix propositions : une étape est une boîte ; elle porte un texte affiché ; elle représente une seule action, un seul état ou une seule question ; son terme technique est nœud ; elle s’écrit avec un identifiant suivi du texte entre crochets ; les caractères spéciaux demandent des guillemets ; `A[Enregistrer]` en est un exemple ; `C(Arrondi)`, `D((Rond))` et `E{Question ?}` donnent l’arrondi, le cercle et le losange."]], "36": [["Axiome", "Axiome 1 — Dans un diagramme de flux, une étape est une boîte.\nAxiome 2 — Elle porte un texte affiché.\nAxiome 3 — Elle représente une seule action, un seul état ou une seule question."], ["Phrase", "On dit d’une étape qu’elle est une boîte, qu’elle porte un texte affiché et qu’elle représente une seule action, un seul état ou une seule question."]], "37": [["Axiome", "Axiome 10 — Pour un losange, j’écris `E{Question ?}`."], ["Phrase", "En voyant `E{Question ?}`, on sait que l’étape sera dessinée en losange."]], "38": [["Axiome", "Axiome 3 — Elle représente une seule action, un seul état ou une seule question."], ["Phrase", "Conséquence nécessaire : deux actions ne tiennent pas dans une même étape, puisqu’elle représente une seule action."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "À force d’en écrire, on remarque que les textes courts, avec un verbe, se lisent mieux."]], "40": [["Axiome", "Axiome 6 — Un texte à caractères spéciaux se met entre guillemets."], ["Phrase · hors axiomes", "Si le dessin ne s’affiche pas, l’explication la plus probable est un texte à caractères spéciaux oublié hors des guillemets."]], "41": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Argument habituel : une étape par action rend le processus plus facile à suivre et à corriger."]], "42": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les axiomes ne se démontrent pas : on les admet. On montre qu’une étape est bien écrite en vérifiant qu’elle respecte chacun d’eux."]], "43": [["Axiome", "Axiome 1 — Dans un diagramme de flux, une étape est une boîte.\nAxiome 2 — Elle porte un texte affiché.\nAxiome 3 — Elle représente une seule action, un seul état ou une seule question.\nAxiome 4 — Son terme technique est nœud.\nAxiome 5 — Elle s’écrit avec un identifiant suivi du texte entre crochets.\nAxiome 6 — Un texte à caractères spéciaux se met entre guillemets.\nAxiome 7 — L’étape « Enregistrer » d’identifiant A s’écrit `A[Enregistrer]`.\nAxiome 8 — Pour des angles arrondis, j’écris `C(Arrondi)`.\nAxiome 9 — Pour un cercle, j’écris `D((Rond))`.\nAxiome 10 — Pour un losange, j’écris `E{Question ?}`."], ["Phrase", "Dix principes fondent la notion : la boîte, le texte affiché, une seule action, un seul état ou une seule question, le nom de nœud, l’identifiant suivi du texte entre crochets, les guillemets, l’exemple `A[Enregistrer]`, et les formes arrondie, cercle et losange."]], "44": [["Axiome", "Axiome 3 — Elle représente une seule action, un seul état ou une seule question.\nAxiome 6 — Un texte à caractères spéciaux se met entre guillemets."], ["Phrase", "Exclus : une étape qui ne représenterait pas une seule action, un seul état ou une seule question, ou un texte à caractères spéciaux laissé sans guillemets."]], "45": [["Axiome", "Axiome 1 — Dans un diagramme de flux, une étape est une boîte.\nAxiome 2 — Elle porte un texte affiché.\nAxiome 3 — Elle représente une seule action, un seul état ou une seule question.\nAxiome 4 — Son terme technique est nœud.\nAxiome 5 — Elle s’écrit avec un identifiant suivi du texte entre crochets.\nAxiome 6 — Un texte à caractères spéciaux se met entre guillemets.\nAxiome 7 — L’étape « Enregistrer » d’identifiant A s’écrit `A[Enregistrer]`.\nAxiome 8 — Pour des angles arrondis, j’écris `C(Arrondi)`.\nAxiome 9 — Pour un cercle, j’écris `D((Rond))`.\nAxiome 10 — Pour un losange, j’écris `E{Question ?}`."], ["Phrase", "Les axiomes s’accordent : les trois premiers disent ce qu’elle est (une boîte, un texte affiché, une seule action, un seul état ou une seule question), le quatrième son nom (nœud), les deux suivants comment l’écrire (identifiant, crochets, guillemets), et les derniers donnent des exemples (`A[Enregistrer]`, arrondi, cercle, losange)."]], "46": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans la carte, Étape fait partie des Éléments de base et suppose de connaître Sens du diagramme et Identifiant."]], "47": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On la justifie par le besoin de découper un processus en morceaux qu’on peut nommer et relier."]], "48": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La preuve qu’une étape est bien écrite : elle apparaît dans le dessin avec la forme voulue."]], "49": [["Axiome", "Axiome 1 — Dans un diagramme de flux, une étape est une boîte.\nAxiome 3 — Elle représente une seule action, un seul état ou une seule question.\nAxiome 5 — Elle s’écrit avec un identifiant suivi du texte entre crochets."], ["Phrase", "« X est une étape » est vrai si X est une boîte qui représente une seule action, un seul état ou une seule question, écrite avec un identifiant et un texte entre crochets."]], "50": [["Axiome", "Axiome 3 — Elle représente une seule action, un seul état ou une seule question."], ["Phrase", "Pour vérifier : son texte doit décrire une seule action, un seul état ou une seule question."]], "51": [["Axiome", "Axiome 3 — Elle représente une seule action, un seul état ou une seule question."], ["Phrase", "Un texte qui décrit deux actions montre que l’étape doit être découpée : elle représente une seule action."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La notion est sûre : ses axiomes sont posés comme des définitions."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On fait une hypothèse en découpant un processus : on suppose que chaque morceau est assez simple pour tenir en une étape."]], "54": [["Axiome", "Axiome 1 — Dans un diagramme de flux, une étape est une boîte."], ["Phrase", "On l’observe directement : chaque étape apparaît comme une boîte dans le dessin."]], "55": [["Axiome", "Axiome 4 — Son terme technique est nœud."], ["Phrase · hors axiomes", "Derrière, c’est la théorie des graphes : chaque étape y est un nœud, ou sommet."]], "56": [["Axiome", "Axiome 3 — Elle représente une seule action, un seul état ou une seule question."], ["Phrase", "Une étape n’est pas l’action elle-même : elle la représente, une seule action, un seul état ou une seule question."]], "57": [["Axiome", "Axiome 5 — Elle s’écrit avec un identifiant suivi du texte entre crochets."], ["Phrase", "Elle existe dès qu’on écrit son identifiant suivi du texte entre crochets."]], "58": [["Axiome", "Axiome 1 — Dans un diagramme de flux, une étape est une boîte.\nAxiome 2 — Elle porte un texte affiché.\nAxiome 3 — Elle représente une seule action, un seul état ou une seule question.\nAxiome 4 — Son terme technique est nœud.\nAxiome 5 — Elle s’écrit avec un identifiant suivi du texte entre crochets.\nAxiome 6 — Un texte à caractères spéciaux se met entre guillemets.\nAxiome 8 — Pour des angles arrondis, j’écris `C(Arrondi)`.\nAxiome 9 — Pour un cercle, j’écris `D((Rond))`.\nAxiome 10 — Pour un losange, j’écris `E{Question ?}`."], ["Phrase", "Ce qui en fait une étape, c’est la réunion des axiomes : une boîte, ou nœud, qui porte un texte affiché et représente une seule action, un seul état ou une seule question, écrite avec un identifiant et un texte entre crochets, entre guillemets si besoin, et dont la forme peut être arrondie, en cercle ou en losange."]], "59": [["Axiome", "Axiome 1 — Dans un diagramme de flux, une étape est une boîte.\nAxiome 4 — Son terme technique est nœud."], ["Phrase", "Elle appartient à la catégorie des nœuds : les boîtes d’un diagramme."]], "60": [["Axiome", "Axiome 1 — Dans un diagramme de flux, une étape est une boîte.\nAxiome 2 — Elle porte un texte affiché.\nAxiome 3 — Elle représente une seule action, un seul état ou une seule question.\nAxiome 8 — Pour des angles arrondis, j’écris `C(Arrondi)`.\nAxiome 9 — Pour un cercle, j’écris `D((Rond))`.\nAxiome 10 — Pour un losange, j’écris `E{Question ?}`."], ["Phrase", "Nécessaire : une boîte qui porte un texte affiché et représente une seule action, un seul état ou une seule question. Au choix : la forme, arrondie, en cercle ou en losange."]], "61": [["Axiome", "Axiome 3 — Elle représente une seule action, un seul état ou une seule question."], ["Phrase", "Sa substance : une seule action, un seul état ou une seule question."]], "62": [["Axiome", "Axiome 3 — Elle représente une seule action, un seul état ou une seule question."], ["Phrase", "Elle se limite à une seule action, un seul état ou une seule question : au-delà, il faut une autre étape."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans ce projet, chaque étape est une action de l’enregistreur : appuyer, enregistrer, transcrire, classer."]], "64": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On en crée une chaque fois que le processus avance d’un pas."]], "65": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les symboles des diagrammes de flux ont été normalisés dans les années 1960 et 1970, avec une forme par type d’opération."]], "66": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On écrit souvent le texte d’une étape avec un verbe à l’infinitif : Enregistrer, Classer."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle relève de l’informatique et de l’organisation du travail."]], "68": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Des étapes bien nommées permettent à d’autres de comprendre le processus sans explication."]], "69": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une étape montre un moment du processus, pas sa durée."]], "70": [["Axiome", "Axiome 1 — Dans un diagramme de flux, une étape est une boîte.\nAxiome 3 — Elle représente une seule action, un seul état ou une seule question."], ["Phrase", "Son rôle : représenter, dans une boîte, une seule action, un seul état ou une seule question."]], "71": [["Axiome", "Axiome 5 — Elle s’écrit avec un identifiant suivi du texte entre crochets.\nAxiome 8 — Pour des angles arrondis, j’écris `C(Arrondi)`.\nAxiome 9 — Pour un cercle, j’écris `D((Rond))`.\nAxiome 10 — Pour un losange, j’écris `E{Question ?}`."], ["Phrase", "Elle fournit un moyen d’écrire chaque point du processus : un identifiant, un texte entre crochets, et des formes arrondie, en cercle ou en losange."]], "72": [["Axiome", "Axiome 3 — Elle représente une seule action, un seul état ou une seule question."], ["Phrase", "Elle permet de découper un processus en points simples : une seule action, un seul état ou une seule question chacun."]], "73": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En pratique, elle oblige à nommer clairement chaque action."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ici, elle sert à poser les grandes actions de l’enregistreur avant de les relier."]], "75": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle devient utile dès qu’un processus a plus d’une action."]], "76": [["Axiome", "Axiome 5 — Elle s’écrit avec un identifiant suivi du texte entre crochets."], ["Phrase · hors axiomes", "Écrire un identifiant suivi d’un texte entre crochets, c’est faire apparaître une étape dans le dessin."]], "77": [["Axiome", "Axiome 3 — Elle représente une seule action, un seul état ou une seule question.\nAxiome 5 — Elle s’écrit avec un identifiant suivi du texte entre crochets.\nAxiome 6 — Un texte à caractères spéciaux se met entre guillemets.\nAxiome 7 — L’étape « Enregistrer » d’identifiant A s’écrit `A[Enregistrer]`.\nAxiome 8 — Pour des angles arrondis, j’écris `C(Arrondi)`.\nAxiome 9 — Pour un cercle, j’écris `D((Rond))`.\nAxiome 10 — Pour un losange, j’écris `E{Question ?}`."], ["Phrase", "- Choisir une seule action, un seul état ou une seule question.\n- Écrire l’identifiant, puis le texte entre crochets : `A[Enregistrer]`.\n- Mettre le texte entre guillemets s’il a des caractères spéciaux.\n- Pour une autre forme, changer les signes : arrondi, cercle ou losange."]], "78": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle change quand on modifie son texte ou sa
