hors axiomes", "Les axiomes ne se démontrent pas : on les admet. On montre qu’un point est une donnée en vérifiant qu’il respecte chacun d’eux."]], "43": [["Axiome", "Axiome 1 — Une donnée est une étape qui représente une information.\nAxiome 2 — Une donnée n’est pas une action.\nAxiome 3 — Une action la produit ou l’utilise.\nAxiome 4 — Elle se place entre l’action qui l’utilise et celle qui la produit.\nAxiome 5 — Sa forme habituelle est le parallélogramme.\nAxiome 6 — Le son « Audio » s’écrit `B[/Audio/]`."], ["Phrase", "Six principes fondent la notion : l’étape qui représente une information, qui n’est pas une action, qu’une action produit ou utilise, placée entre l’action qui l’utilise et celle qui la produit, en forme de parallélogramme, et l’exemple `B[/Audio/]`."]], "44": [["Axiome", "Axiome 2 — Une donnée n’est pas une action.\nAxiome 3 — Une action la produit ou l’utilise."], ["Phrase", "Exclus : une donnée qui agirait, alors qu’elle n’est pas une action, ou qu’aucune action ne produirait ni n’utiliserait."]], "45": [["Axiome", "Axiome 1 — Une donnée est une étape qui représente une information.\nAxiome 2 — Une donnée n’est pas une action.\nAxiome 3 — Une action la produit ou l’utilise.\nAxiome 4 — Elle se place entre l’action qui l’utilise et celle qui la produit.\nAxiome 5 — Sa forme habituelle est le parallélogramme.\nAxiome 6 — Le son « Audio » s’écrit `B[/Audio/]`."], ["Phrase", "Les axiomes s’accordent : le premier dit ce qu’elle est (une étape qui représente une information), le deuxième ce qu’elle n’est pas (pas une action), les deux suivants son lien aux actions (une action la produit ou l’utilise ; elle se place entre l’action qui l’utilise et celle qui la produit), puis sa forme (le parallélogramme) et un exemple (`B[/Audio/]`)."]], "46": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans la carte, Donnée fait partie de la famille « Début, fin et données » et suppose de connaître Liaison."]], "47": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On la justifie par le besoin de montrer ce qui passe d’un point à l’autre, en plus de ce qui se fait."]], "48": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La preuve qu’une donnée est utile : on peut dire d’où elle vient et où elle va."]], "49": [["Axiome", "Axiome 1 — Une donnée est une étape qui représente une information.\nAxiome 2 — Une donnée n’est pas une action."], ["Phrase", "« X est une donnée » est vrai si X représente une information et n’est pas une action."]], "50": [["Axiome", "Axiome 2 — Une donnée n’est pas une action.\nAxiome 3 — Une action la produit ou l’utilise."], ["Phrase", "Pour vérifier : ce n’est pas une action, et on peut nommer l’action qui la produit ou qui l’utilise."]], "51": [["Axiome", "Axiome 3 — Une action la produit ou l’utilise."], ["Phrase · hors axiomes", "Une donnée qu’aucune action ne produit ni n’utilise est sans doute inutile."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La notion est sûre : ses axiomes sont posés comme des définitions."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On fait une hypothèse en choisissant les données à dessiner : on suppose qu’elles aident à comprendre le processus."]], "54": [["Axiome", "Axiome 5 — Sa forme habituelle est le parallélogramme."], ["Phrase", "On la reconnaît dans le dessin à sa forme de parallélogramme."]], "55": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Derrière, c’est l’idée du flux de données : ce qui entre et sort de chaque traitement."]], "56": [["Axiome", "Axiome 1 — Une donnée est une étape qui représente une information.\nAxiome 2 — Une donnée n’est pas une action."], ["Phrase", "Une donnée n’est pas une action : c’est une information."]], "57": [["Axiome", "Axiome 3 — Une action la produit ou l’utilise."], ["Phrase", "Elle existe dès qu’une action la produit."]], "58": [["Axiome", "Axiome 1 — Une donnée est une étape qui représente une information.\nAxiome 2 — Une donnée n’est pas une action.\nAxiome 3 — Une action la produit ou l’utilise.\nAxiome 4 — Elle se place entre l’action qui l’utilise et celle qui la produit.\nAxiome 5 — Sa forme habituelle est le parallélogramme."], ["Phrase", "Ce qui en fait une donnée, c’est la réunion des axiomes : une étape qui représente une information, qui n’est pas une action, qu’une action produit ou utilise, placée entre l’action qui l’utilise et celle qui la produit, en général en forme de parallélogramme."]], "59": [["Axiome", "Axiome 1 — Une donnée est une étape qui représente une information."], ["Phrase", "Elle appartient à la catégorie des étapes, comme étape d’information."]], "60": [["Axiome", "Axiome 1 — Une donnée est une étape qui représente une information.\nAxiome 2 — Une donnée n’est pas une action.\nAxiome 3 — Une action la produit ou l’utilise.\nAxiome 4 — Elle se place entre l’action qui l’utilise et celle qui la produit.\nAxiome 5 — Sa forme habituelle est le parallélogramme."], ["Phrase", "Nécessaire : une étape qui représente une information, qui n’est pas une action, produite ou utilisée par une action, placée entre l’action qui l’utilise et celle qui la produit. Habituel, mais pas obligatoire : le parallélogramme."]], "61": [["Axiome", "Axiome 1 — Une donnée est une étape qui représente une information."], ["Phrase", "Sa substance : une information."]], "62": [["Axiome", "Axiome 2 — Une donnée n’est pas une action."], ["Phrase", "Elle s’arrête là où commence l’action : une donnée n’est pas une action."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans ce projet, le son enregistré et le texte transcrit sont les deux données principales."]], "64": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On en dessine une quand ce qui circule compte autant que ce qui se fait."]], "65": [["Axiome", "Axiome 5 — Sa forme habituelle est le parallélogramme."], ["Phrase · hors axiomes", "Le parallélogramme comme symbole d’entrée et de sortie vient des normes des années 1960 et 1970."]], "66": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En informatique, on écrit souvent « data », même en français."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle relève de l’informatique et de l’analyse des flux."]], "68": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Nommer les données aide les autres à savoir ce qui circule dans le processus."]], "69": [["Axiome", "Axiome 3 — Une action la produit ou l’utilise.\nAxiome 4 — Elle se place entre l’action qui l’utilise et celle qui la produit."], ["Phrase", "Elle vit entre deux moments : elle se place entre l’action qui la produit et celle qui l’utilise."]], "70": [["Axiome", "Axiome 1 — Une donnée est une étape qui représente une information."], ["Phrase", "Son rôle : représenter une information dans le processus."]], "71": [["Axiome", "Axiome 5 — Sa forme habituelle est le parallélogramme.\nAxiome 6 — Le son « Audio » s’écrit `B[/Audio/]`."], ["Phrase", "Elle fournit une forme reconnaissable, le parallélogramme : `B[/Audio/]`."]], "72": [["Axiome", "Axiome 3 — Une action la produit ou l’utilise.\nAxiome 4 — Elle se place entre l’action qui l’utilise et celle qui la produit."], ["Phrase", "Elle permet de montrer ce qui passe entre l’action qui la produit et celle qui l’utilise."]], "73": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En pratique, elle évite d’oublier ce dont chaque point a besoin pour avancer."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ici, elle montre que l’audio passe de l’enregistrement à la transcription."]], "75": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle devient utile dès que ce qui circule n’est pas évident."]], "76": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dessiner une donnée, c’est affirmer qu’elle compte dans le processus."]], "77": [["Axiome", "Axiome 3 — Une action la produit ou l’utilise.\nAxiome 4 — Elle se place entre l’action qui l’utilise et celle qui la produit.\nAxiome 5 — Sa forme habituelle est le parallélogramme.\nAxiome 6 — Le son « Audio » s’écrit `B[/Audio/]`."], ["Phrase · hors axiomes", "- Repérer l’action qui la produit et celle qui l’utilise.\n- Écrire la donnée en parallélogramme : `B[/Audio/]`.\n- La placer entre ces deux actions, puis relier."]], "78": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle change quand ce qui circule change, par exemple un autre format de fichier."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Au fil du projet, de nouvelles données apparaissent, comme le nom du dossier choisi."]], "80": [["Axiome", "Axiome 3 — Une action la produit ou l’utilise."], ["Phrase", "Une action peut en faire une autre : elle utilise un son et produit un texte."]], "81": [["Axiome", "Axiome 3 — Une action la produit ou l’utilise."], ["Phrase", "Elle naît de l’action qui la produit."]], "82": [["Axiome", "Axiome 3 — Une action la produit ou l’utilise."], ["Phrase", "Une action la produit, puis une autre l’utilise."]], "83": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’adapte au niveau de détail voulu : une donnée globale, ou plusieurs plus fines."]], "84": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "D’une version à l’autre, on renomme souvent les données pour plus de précision."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une bonne donnée se juge à sa clarté : un nom, pas un verbe."]], "86": [["Axiome", "Axiome 5 — Sa forme habituelle est le parallélogramme."], ["Phrase · hors axiomes", "Norme habituelle : le parallélogramme, comme dans la norme ISO 5807."]], "87": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Sa valeur tient à ce qu’elle rend visible : ce qui circule réellement."]], "88": [["Axiome", "Axiome 3 — Une action la produit ou l’utilise.\nAxiome 5 — Sa forme habituelle est le parallélogramme."], ["Phrase · hors axiomes", "Critères : une action la produit, une autre l’utilise, la forme d’un parallélogramme ; en plus, un nom court."]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une donnée de qualité se comprend sans explication."]], "90": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle est pertinente si ce qui circule aide à comprendre ; sinon, on la laisse de côté."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’améliore en lui donnant un nom précis et en retirant celles qui n’apportent rien."]]}, "sto": {"1": [["Axiome", "Axiome 1 — Un stockage est une étape qui représente un lieu où l’information est conservée.\nAxiome 2 — L’information y reste après la fin du processus.\nAxiome 3 — Sa forme habituelle est le cylindre.\nAxiome 5 — Écrire dedans depuis B s’écrit `B --> C`.\nAxiome 6 — Lire dedans pour aller vers B s’écrit `C --> B`."], ["Phrase", "Un stockage se compose d’une étape qui représente un lieu où l’information est conservée, et où elle reste après la fin du processus ; sa forme habituelle est le cylindre ; on peut écrire dedans ou lire dedans."]], "2": [["Axiome", "Axiome 1 — Un stockage est une étape qui représente un lieu où l’information est conservée.\nAxiome 2 — L’information y reste après la fin du processus.\nAxiome 3 — Sa forme habituelle est le cylindre.\nAxiome 5 — Écrire dedans depuis B s’écrit `B --> C`.\nAxiome 6 — Lire dedans pour aller vers B s’écrit `C --> B`."], ["Phrase", "Ses éléments fondamentaux sont ceux que posent les axiomes : une étape, un lieu où l’information est conservée, qui y reste après la fin du processus, la forme d’un cylindre, et deux opérations : écrire dedans, lire dedans."]], "3": [["Axiome", "Axiome 3 — Sa forme habituelle est le cylindre.\nAxiome 4 — L’app Notes comme stockage s’écrit `C[(Notes)]`."], ["Phrase", "On écrit l’identifiant, puis le texte entre parenthèses et crochets, ce qui donne un cylindre : `C[(Notes)]`."]], "4": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un stockage peut contenir beaucoup d’éléments : chaque note rangée en est un."]], "5": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le nombre de stockages n’est pas fixé ; un petit processus en a souvent un seul."]], "6": [["Axiome", "Axiome 1 — Un stockage est une étape qui représente un lieu où l’information est conservée."], ["Phrase", "Sa nature : un lieu où l’information est conservée."]], "7": [["Axiome", "Axiome 1 — Un stockage est une étape qui représente un lieu où l’information est conservée."], ["Phrase", "Un stockage, c’est une étape qui représente un lieu où l’information est conservée."]], "8": [["Axiome", "Axiome 1 — Un stockage est une étape qui représente un lieu où l’information est conservée.\nAxiome 2 — L’information y reste après la fin du processus.\nAxiome 3 — Sa forme habituelle est le cylindre."], ["Phrase", "Un stockage est une étape qui représente un lieu où l’information est conservée ; elle y reste après la fin du processus ; sa forme habituelle est le cylindre."]], "9": [["Axiome", "Axiome 1 — Un stockage est une étape qui représente un lieu où l’information est conservée.\nAxiome 2 — L’information y reste après la fin du processus."], ["Phrase", "Représenter un lieu où l’information est conservée, et où elle reste après la fin du processus : ces propriétés le constituent."]], "10": [["Axiome", "Axiome 4 — L’app Notes comme stockage s’écrit `C[(Notes)]`."], ["Phrase · hors axiomes", "Exemple des axiomes : l’app Notes, `C[(Notes)]` ; on peut aussi penser à un fichier, une base de données, un dossier."]], "11": [["Axiome", "Axiome 1 — Un stockage est une étape qui représente un lieu où l’information est conservée."], ["Phrase · hors axiomes", "Les axiomes l’appellent stockage, ou lieu de conservation ; en anglais, data store."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le mot vient de l’anglais stock, la réserve de marchandises."]], "13": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le lecteur y voit l’endroit où regarder pour retrouver un résultat."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Stockage » désigne aussi la mémoire d’un téléphone ; ici, c’est un point du diagramme."]], "15": [["Axiome", "Axiome 5 — Écrire dedans depuis B s’écrit `B --> C`.\nAxiome 6 — Lire dedans pour aller vers B s’écrit `C --> B`."], ["Phrase", "Il a deux sortes de liaisons : celles qui y arrivent, pour écrire dedans, et celles qui en partent, pour lire dedans."]], "16": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il n’est pas au-dessus des autres points ; il est souvent en marge du chemin principal."]], "17": [["Axiome", "Axiome 2 — L’information y reste après la fin du processus."], ["Phrase", "Dans l’ensemble, il est ce qui dure : l’information y reste après la fin du processus."]], "18": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On le place souvent sur le côté, pour ne pas couper le chemin principal."]], "19": [["Axiome", "Axiome 1 — Un stockage est une étape qui représente un lieu où l’information est conservée."], ["Phrase", "Il se range parmi les étapes, comme une étape qui représente un lieu."]], "20": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On distingue les stockages locaux, sur le téléphone, et les stockages en ligne, dans le cloud."]], "21": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un stockage peut se découper en dossiers, qui rangent chacun une partie de l’ensemble."]], "22": [["Axiome", "Axiome 5 — Écrire dedans depuis B s’écrit `B --> C`.\nAxiome 6 — Lire dedans pour aller vers B s’écrit `C --> B`."], ["Phrase", "Il est relié aux points qui écrivent dedans et à ceux qui lisent dedans."]], "23": [["Axiome", "Axiome 1 — Un stockage est une étape qui représente un lieu où l’information est conservée.\nAxiome 2 — L’information y reste après la fin du processus."], ["Phrase", "Puisque l’information y est conservée, elle y reste après la fin du processus."]], "24": [["Axiome", "Axiome 5 — Écrire dedans depuis B s’écrit `B --> C`."], ["Phrase", "Une flèche vers lui, `B --> C`, fait écrire dedans : son contenu change."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Plus un processus tourne souvent, plus son contenu grossit."]], "26": [["Axiome", "Axiome 1 — Un stockage est une étape qui représente un lieu où l’information est conservée.\nAxiome 5 — Écrire dedans depuis B s’écrit `B --> C`.\nAxiome 6 — Lire dedans pour aller vers B s’écrit `C --> B`."], ["Phrase", "Il conserve l’information ; on écrit dedans pour l’y mettre, on lit dedans pour la reprendre."]], "27": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans la carte, Stockage dépend de Donnée ; Structure générale du système dépend de lui."]], "28": [["Axiome", "Axiome 5 — Écrire dedans depuis B s’écrit `B --> C`.\nAxiome 6 — Lire dedans pour aller vers B s’écrit `C --> B`."], ["Phrase", "Écrire dedans s’oppose à lire dedans : `B --> C` contre `C --> B`."]], "29": [["Axiome", "Axiome 5 — Écrire dedans depuis B s’écrit `B --> C`.\nAxiome 6 — Lire dedans pour aller vers B s’écrit `C --> B`."], ["Phrase", "Écrire dedans et lire dedans se complètent : l’un remplit, l’autre reprend."]], "30": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On ne peut reprendre une information que si elle a déjà été rangée."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Comme une armoire, il garde ce qu’on y range, pour plus tard."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Deux points qui se servent du même contenu peuvent se gêner si l’un l’efface pendant que l’autre s’en sert."]], "33": [["Axiome", "Axiome 2 — L’information y reste après la fin du processus."], ["Phrase", "L’information y reste après la fin du processus : il dure plus longtemps que le processus."]], "34": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans le dessin, il est souvent placé à côté du chemin principal."]], "35": [["Axiome", "Axiome 1 — Un stockage est une étape qui représente un lieu où l’information est conservée.\nAxiome 2 — L’information y reste après la fin du processus.\nAxiome 3 — Sa forme habituelle est le cylindre.\nAxiome 4 — L’app Notes comme stockage s’écrit `C[(Notes)]`.\nAxiome 5 — Écrire dedans depuis B s’écrit `B --> C`.\nAxiome 6 — Lire dedans pour aller vers B s’écrit `C --> B`."], ["Phrase", "Six propositions : c’est une étape qui représente un lieu où l’information est conservée ; elle y reste après la fin du processus ; sa forme habituelle est le cylindre ; l’app Notes s’écrit `C[(Notes)]` ; écrire dedans depuis B s’écrit `B --> C` ; lire dedans pour aller vers B s’écrit `C --> B`."]], "36": [["Axiome", "Axiome 1 — Un stockage est une étape qui représente un lieu où l’information est conservée.\nAxiome 2 — L’information y reste après la fin du processus.\nAxiome 3 — Sa forme habituelle est le cylindre."], ["Phrase", "On dit d’un stockage qu’il est une étape qui représente un lieu où l’information est conservée, qu’elle y reste après la fin du processus, et qu’il a en général la forme d’un cylindre."]], "37": [["Axiome", "Axiome 5 — Écrire dedans depuis B s’écrit `B --> C`.\nAxiome 6 — Lire dedans pour aller vers B s’écrit `C --> B`."], ["Phrase", "Une flèche vers le stockage, `B --> C`, veut dire écrire dedans ; une flèche qui en part, `C --> B`, veut dire lire dedans."]], "38": [["Axiome", "Axiome 2 — L’information y reste après la fin du processus."], ["Phrase", "Conséquence nécessaire : ce qu’on y a rangé est encore là au prochain usage, puisque l’information y reste après la fin du processus."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "À force d’en dessiner, on remarque qu’un processus a rarement besoin de plus d’un ou deux stockages."]], "40": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Si une information disparaît d’une fois sur l’autre, l’explication la plus probable est qu’elle n’a jamais été rangée."]], "41": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Argument habituel : montrer où l’on range les choses évite de les chercher ensuite."]], "42": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les axiomes ne se démontrent pas : on les admet. On montre qu’un point est un stockage en vérifiant qu’il respecte chacun d’eux."]], "43": [["Axiome", "Axiome 1 — Un stockage est une étape qui représente un lieu où l’information est conservée.\nAxiome 2 — L’information y reste après la fin du processus.\nAxiome 3 — Sa forme habituelle est le cylindre.\nAxiome 4 — L’app Notes comme stockage s’écrit `C[(Notes)]`.\nAxiome 5 — Écrire dedans depuis B s’écrit `B --> C`.\nAxiome 6 — Lire dedans pour aller vers B s’écrit `C --> B`."], ["Phrase", "Six principes fondent la notion : l’étape qui représente un lieu où l’information est conservée, qui y reste après la fin du processus, le cylindre, l’exemple `C[(Notes)]`, écrire dedans avec `B --> C`, lire dedans avec `C --> B`."]], "44": [["Axiome", "Axiome 2 — L’information y reste après la fin du processus."], ["Phrase", "Exclus : un stockage qui effacerait tout à la fin du processus, puisque l’information y reste après la fin du processus."]], "45": [["Axiome", "Axiome 1 — Un stockage est une étape qui représente un lieu où l’information est conservée.\nAxiome 2 — L’information y reste après la fin du processus.\nAxiome 3 — Sa forme habituelle est le cylindre.\nAxiome 4 — L’app Notes comme stockage s’écrit `C[(Notes)]`.\nAxiome 5 — Écrire dedans depuis B s’écrit `B --> C`.\nAxiome 6 — Lire dedans pour aller vers B s’écrit `C --> B`."], ["Phrase", "Les axiomes s’accordent : les deux premiers disent ce qu’il est (une étape qui représente un lieu où l’information est conservée, et y reste après la fin du processus), le troisième sa forme (le cylindre), le quatrième un exemple (`C[(Notes)]`), les deux derniers comment écrire dedans (`B --> C`) et lire dedans (`C --> B`)."]], "46": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans la carte, Stockage fait partie de la famille « Début, fin et données » et suppose de connaître Donnée."]], "47": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On le justifie par le besoin de retrouver plus tard ce que le processus a produit."]], "48": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La preuve qu’il fonctionne : on retrouve l’information quand on en a besoin."]], "49": [["Axiome", "Axiome 1 — Un stockage est une étape qui représente un lieu où l’information est conservée.\nAxiome 2 — L’information y reste après la fin du processus."], ["Phrase", "« X est un stockage » est vrai si X est un lieu où l’information est conservée et y reste après la fin du processus."]], "50": [["Axiome", "Axiome 2 — L’information y reste après la fin du processus."], ["Phrase", "Pour vérifier : l’information y reste-t-elle après la fin du processus ?"]], "51": [["Axiome", "Axiome 2 — L’information y reste après la fin du processus."], ["Phrase", "Un point dont le contenu disparaît à la fin du processus n’est pas un stockage, puisque l’information y reste après la fin du processus."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La notion est sûre : ses axiomes sont posés comme des définitions."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On fait une hypothèse en choisissant où ranger : on suppose qu’on saura retrouver l’information."]], "54": [["Axiome", "Axiome 3 — Sa forme habituelle est le cylindre."], ["Phrase", "On le reconnaît dans le dessin à sa forme de cylindre."]], "55": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Derrière, c’est l’idée de mémoire en informatique : ce qui garde un état d’une fois sur l’autre."]], "56": [["Axiome", "Axiome 1 — Un stockage est une étape qui représente un lieu où l’information est conservée."], ["Phrase", "Un stockage n’est pas une action : c’est une étape qui représente un lieu."]], "57": [["Axiome", "Axiome 1 — Un stockage est une étape qui représente un lieu où l’information est conservée."], ["Phrase", "Il existe dès qu’un lieu conserve l’information."]], "58": [["Axiome", "Axiome 1 — Un stockage est une étape qui représente un lieu où l’information est conservée.\nAxiome 2 — L’information y reste après la fin du processus.\nAxiome 3 — Sa forme habituelle est le cylindre.\nAxiome 5 — Écrire dedans depuis B s’écrit `B --> C`.\nAxiome 6 — Lire dedans pour aller vers B s’écrit `C --> B`."], ["Phrase", "Ce qui en fait un stockage, c’est la réunion des axiomes : une étape qui représente un lieu où l’information est conservée, qui y reste après la fin du processus, en général en forme de cylindre, où l’on peut écrire dedans et lire dedans."]], "59": [["Axiome", "Axiome 1 — Un stockage est une étape qui représente un lieu où l’information est conservée."], ["Phrase", "Il appartient à la catégorie des étapes, comme lieu de conservation."]], "60": [["Axiome", "Axiome 1 — Un stockage est une étape qui représente un lieu où l’information est conservée.\nAxiome 2 — L’information y reste après la fin du processus.\nAxiome 3 — Sa forme habituelle est le cylindre."], ["Phrase", "Nécessaire : un lieu où l’information est conservée et reste après la fin du processus. Habituel, mais pas obligatoire : le cylindre."]], "61": [["Axiome", "Axiome 1 — Un stockage est une étape qui représente un lieu où l’information est conservée."], ["Phrase", "Sa substance : un lieu de conservation."]], "62": [["Axiome", "Axiome 2 — L’information y reste après la fin du processus."], ["Phrase", "Il ne s’arrête pas avec le processus : l’information y reste après la fin du processus."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans ce projet, le stockage est l’app Notes, où chaque enregistrement finit rangé."]], "64": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On en dessine un dès qu’un résultat doit servir plus tard."]], "65": [["Axiome", "Axiome 3 — Sa forme habituelle est le cylindre."], ["Phrase · hors axiomes", "Le cylindre vient du dessin des disques et des bandes magnétiques, les premiers supports de mémoire."]], "66": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On parle aujourd’hui de cloud pour les stockages en ligne."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il relève de l’informatique et de la gestion des données."]], "68": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un stockage partagé permet à plusieurs personnes d’accéder aux mêmes informations."]], "69": [["Axiome", "Axiome 2 — L’information y reste après la fin du processus."], ["Phrase", "Il traverse le temps : l’information y reste après la fin du processus."]], "70": [["Axiome", "Axiome 1 — Un stockage est une étape qui représente un lieu où l’information est conservée."], ["Phrase", "Son rôle : représenter le lieu où l’information est conservée."]], "71": [["Axiome", "Axiome 3 — Sa forme habituelle est le cylindre.\nAxiome 4 — L’app Notes comme stockage s’écrit `C[(Notes)]`."], ["Phrase", "Il fournit une forme reconnaissable, le cylindre : `C[(Notes)]`."]], "72": [["Axiome", "Axiome 5 — Écrire dedans depuis B s’écrit `B --> C`.\nAxiome 6 — Lire dedans pour aller vers B s’écrit `C --> B`."], ["Phrase", "Il permet d’écrire dedans, `B --> C`, et de lire dedans, `C --> B`."]], "73": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En pratique, il évite de tout recommencer à chaque fois."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ici, il montre que chaque note finit dans l’app Notes."]], "75": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il devient utile dès qu’un résultat doit être retrouvé plus tard."]], "76": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dessiner un stockage, c’est décider de ce que le processus garde."]], "77": [["Axiome", "Axiome 3 — Sa forme habituelle est le cylindre.\nAxiome 4 — L’app Notes comme stockage s’écrit `C[(Notes)]`.\nAxiome 5 — Écrire dedans depuis B s’écrit `B --> C`.\nAxiome 6 — Lire dedans pour aller vers B s’écrit `C --> B`."], ["Phrase", "- Écrire le stockage en cylindre : `C[(Notes)]`.\n- Pour écrire dedans depuis B : `B --> C`.\n- Pour lire dedans et aller vers B : `C --> B`."]], "78": [["Axiome", "Axiome 5 — Écrire dedans depuis B s’écrit `B --> C`."], ["Phrase", "Son contenu change chaque fois qu’on écrit dedans."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Au fil du projet, son contenu grandit : une note de plus à chaque enregistrement."]], "80": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On peut changer d’app de rangement sans changer le reste du processus."]], "81": [["Axiome", "Axiome 5 — Écrire dedans depuis B s’écrit `B --> C`."], ["Phrase", "Son contenu se forme au fil des écritures : chaque `B --> C` y ajoute quelque chose."]], "82": [["Axiome", "Axiome 5 — Écrire dedans depuis B s’écrit `B --> C`.\nAxiome 6 — Lire dedans pour aller vers B s’écrit `C --> B`."], ["Phrase", "On écrit dedans à un moment, on lit dedans à un autre."]], "83": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’adapte au besoin : un dossier par sujet, par exemple."]], "84": [["Axiome", "Axiome 2 — L’information y reste après la fin du processus."], ["Phrase", "D’une fois sur l’autre, l’information y reste après la fin du processus : il garde la trace des passages précédents."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un bon stockage se juge à la facilité de retrouver ce qu’on y a mis."]], "86": [["Axiome", "Axiome 3 — Sa forme habituelle est le cylindre."], ["Phrase · hors axiomes", "Norme habituelle : le cylindre, comme dans la norme ISO 5807."]], "87": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Sa valeur tient à la fiabilité : rien de ce qu’on y range ne doit se perdre."]], "88": [["Axiome", "Axiome 2 — L’information y reste après la fin du processus.\nAxiome 3 — Sa forme habituelle est le cylindre."], ["Phrase · hors axiomes", "Critères : l’information y reste après la fin du processus, et la forme d’un cylindre ; en plus, un nom clair."]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un stockage de qualité se comprend d’un coup d’œil : on sait ce qu’il contient."]], "90": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il est pertinent si un résultat doit servir plus tard ; sinon, on s’en passe."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’améliore en rangeant mieux : des dossiers clairs et des noms précis."]]}, "dec": {"1": [["Axiome", "Axiome 1 — D’une décision partent au moins deux flèches.\nAxiome 2 — Chaque flèche correspond à un résultat possible d’une condition.\nAxiome 3 — Un seul est suivi à la fois : le chemin.\nAxiome 4 — Elle se dessine en général en losange."], ["Phrase", "Une décision se compose d’une condition et d’au moins deux flèches qui en partent, chacune pour un résultat possible ; un seul chemin est suivi à la fois ; elle se dessine en général en losange."]], "2": [["Axiome", "Axiome 1 — D’une décision partent au moins deux flèches.\nAxiome 2 — Chaque flèche correspond à un résultat possible d’une condition.\nAxiome 3 — Un seul est suivi à la fois : le chemin.\nAxiome 4 — Elle se dessine en général en losange."], ["Phrase", "Ses éléments fondamentaux sont ceux que posent les axiomes : une condition, au moins deux flèches, un résultat possible par flèche, un seul chemin suivi à la fois, et la forme d’un losange."]], "3": [["Axiome", "Axiome 4 — Elle se dessine en général en losange.\nAxiome 5 — La question « Dossier existant ? » s’écrit `A{Dossier existant ?}`.\nAxiome 6 — Ses sorties « oui » vers B et « non » vers C s’écrivent `A -->|oui| B` et `A -->|non| C`."], ["Phrase", "On écrit la question entre accolades, ce qui donne un losange : `A{Dossier existant ?}` ; puis une flèche par réponse : `A -->|oui| B` et `A -->|non| C`."]], "4": [["Axiome", "Axiome 1 — D’une décision partent au moins deux flèches.\nAxiome 2 — Chaque flèche correspond à un résultat possible d’une condition."], ["Phrase", "Elle se décompose en une condition et au moins deux flèches, une par résultat possible."]], "5": [["Axiome", "Axiome 1 — D’une décision partent au moins deux flèches.\nNon couvert : les axiomes ne fixent pas de maximum."], ["Phrase", "Au moins deux flèches en partent."]], "6": [["Axiome", "Axiome 2 — Chaque flèche correspond à un résultat possible d’une condition."], ["Phrase", "Sa nature : une condition, avec plusieurs résultats possibles."]], "7": [["Axiome", "Axiome 1 — D’une décision partent au moins deux flèches.\nAxiome 2 — Chaque flèche correspond à un résultat possible d’une condition."], ["Phrase", "Une décision, c’est le point d’où partent au moins deux flèches, une par résultat possible d’une condition."]], "8": [["Axiome", "Axiome 1 — D’une décision partent au moins deux flèches.\nAxiome 2 — Chaque flèche correspond à un résultat possible d’une condition.\nAxiome 3 — Un seul est suivi à la fois : le chemin.\nAxiome 4 — Elle se dessine en général en losange."], ["Phrase", "Une décision est le point d’où partent au moins deux flèches, chacune correspondant à un résultat possible d’une condition ; un seul chemin est suivi à la fois ; elle se dessine en général en losange."]], "9": [["Axiome", "Axiome 1 — D’une décision partent au moins deux flèches.\nAxiome 2 — Chaque flèche correspond à un résultat possible d’une condition.\nAxiome 3 — Un seul est suivi à la fois : le chemin."], ["Phrase", "Avoir au moins deux flèches qui partent, une par résultat possible d’une condition, et ne suivre qu’un seul chemin à la fois : ces propriétés la constituent."]], "10": [["Axiome", "Axiome 5 — La question « Dossier existant ? » s’écrit `A{Dossier existant ?}`.\nAxiome 6 — Ses sorties « oui » vers B et « non » vers C s’écrivent `A -->|oui| B` et `A -->|non| C`."], ["Phrase", "Exemple des axiomes : `A{Dossier existant ?}`, avec `A -->|oui| B` et `A -->|non| C`."]], "11": [["Axiome", "Axiome 1 — D’une décision partent au moins deux flèches."], ["Phrase · hors axiomes", "Les axiomes l’appellent décision ; on dit aussi embranchement, parce que plusieurs flèches en partent."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le mot vient du latin decidere, « trancher »."]], "13": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le lecteur lit le texte comme une question, et chaque sortie comme une réponse."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Décision » veut aussi dire un choix qu’on fait librement ; ici, la réponse dépend d’un test."]], "15": [["Axiome", "Axiome 1 — D’une décision partent au moins deux flèches.\nAxiome 2 — Chaque flèche correspond à un résultat possible d’une condition."], ["Phrase", "Elle a au moins deux flèches qui en partent, chacune liée à un résultat possible."]], "16": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle n’est pas au-dessus des autres points ; elle oriente seulement la suite."]], "17": [["Axiome", "Axiome 3 — Un seul est suivi à la fois : le chemin."], ["Phrase", "Dans l’ensemble, elle crée des chemins séparés, dont un seul est suivi à la fois."]], "18": [["Axiome", "Axiome 1 — D’une décision partent au moins deux flèches."], ["Phrase · hors axiomes", "Les flèches qui en partent se répartissent de part et d’autre."]], "19": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle se range parmi les points de logique du diagramme, avec la boucle."]], "20": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On distingue les décisions à deux réponses, oui ou non, et les décisions à plusieurs réponses."]], "21": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une décision complexe peut se découper en plusieurs décisions simples, l’une après l’autre."]], "22": [["Axiome", "Axiome 1 — D’une décision partent au moins deux flèches.\nAxiome 2 — Chaque flèche correspond à un résultat possible d’une condition."], ["Phrase", "Elle relie une condition à au moins deux suites : une flèche par résultat possible."]], "23": [["Axiome", "Axiome 2 — Chaque flèche correspond à un résultat possible d’une condition.\nAxiome 3 — Un seul est suivi à la fois : le chemin."], ["Phrase", "Chaque flèche correspond à un résultat possible ; comme un seul chemin est suivi, un seul résultat compte à la fois."]], "24": [["Axiome", "Axiome 2 — Chaque flèche correspond à un résultat possible d’une condition."], ["Phrase", "Le résultat de la condition décide de la flèche suivie."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Plus un processus a de cas à traiter, plus il a de décisions."]], "26": [["Axiome", "Axiome 2 — Chaque flèche correspond à un résultat possible d’une condition."], ["Phrase", "Chaque flèche a un rôle : représenter un résultat possible de la condition."]], "27": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans la carte, Décision dépend de Liaison, et Boucle dépend d’elle."]], "28": [["Axiome", "Axiome 6 — Ses sorties « oui » vers B et « non » vers C s’écrivent `A -->|oui| B` et `A -->|non| C`."], ["Phrase", "Les sorties s’opposent : `A -->|oui| B` d’un côté, `A -->|non| C` de l’autre."]], "29": [["Axiome", "Axiome 2 — Chaque flèche correspond à un résultat possible d’une condition."], ["Phrase · hors axiomes", "Les résultats possibles se complètent : ensemble, ils couvrent toutes les réponses à la condition."]], "30": [["Axiome", "Axiome 2 — Chaque flèche correspond à un résultat possible d’une condition."], ["Phrase", "Elle dépend d’une condition : chaque flèche correspond à un résultat possible."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Comme un carrefour, elle propose plusieurs directions."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Changer la question change la suite du processus."]], "33": [["Axiome", "Axiome 3 — Un seul est suivi à la fois : le chemin."], ["Phrase", "À un moment donné, un seul chemin est suivi."]], "34": [["Axiome", "Axiome 1 — D’une décision partent au moins deux flèches.\nAxiome 4 — Elle se dessine en général en losange."], ["Phrase", "Dans le dessin, c’est un losange d’où partent les flèches."]], "35": [["Axiome", "Axiome 1 — D’une décision partent au moins deux flèches.\nAxiome 2 — Chaque flèche correspond à un résultat possible d’une condition.\nAxiome 3 — Un seul est suivi à la fois : le chemin.\nAxiome 4 — Elle se dessine en général en losange.\nAxiome 5 — La question « Dossier existant ? » s’écrit `A{Dossier existant ?}`.\nAxiome 6 — Ses sorties « oui » vers B et « non » vers C s’écrivent `A -->|oui| B` et `A -->|non| C`."], ["Phrase", "Six propositions : au moins deux flèches en partent ; chaque flèche correspond à un résultat possible d’une condition ; un seul chemin est suivi à la fois ; elle se dessine en général en losange ; `A{Dossier existant ?}` en est un exemple ; ses sorties s’écrivent `A -->|oui| B` et `A -->|non| C`."]], "36": [["Axiome", "Axiome 1 — D’une décision partent au moins deux flèches.\nAxiome 2 — Chaque flèche correspond à un résultat possible d’une condition.\nAxiome 3 — Un seul est suivi à la fois : le chemin.\nAxiome 4 — Elle se dessine en général en losange."], ["Phrase", "On dit d’une décision qu’au moins deux flèches en partent, que chacune correspond à un résultat possible d’une condition, qu’un seul chemin est suivi à la fois et qu’elle se dessine en général en losange."]], "37": [["Axiome", "Axiome 4 — Elle se dessine en général en losange."], ["Phrase", "En voyant un losange, on sait qu’il s’agit en général d’une décision."]], "38": [["Axiome", "Axiome 1 — D’une décision partent au moins deux flèches.\nAxiome 3 — Un seul est suivi à la fois : le chemin."], ["Phrase", "Conséquence nécessaire : puisque au moins deux flèches en partent et qu’un seul chemin est suivi, au moins une flèche reste inutilisée à chaque passage."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "À force d’en dessiner, on remarque que les questions fermées, à réponse oui ou non, sont les plus claires."]], "40": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Si le processus prend une voie inattendue, l’explication la plus probable est une réponse mal prévue."]], "41": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Argument habituel : montrer les décisions rend visibles les cas qu’il faut traiter."]], "42": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les axiomes ne se démontrent pas : on les admet. On montre qu’un point est une décision en vérifiant qu’il respecte chacun d’eux."]], "43": [["Axiome", "Axiome 1 — D’une décision partent au moins deux flèches.\nAxiome 2 — Chaque flèche correspond à un résultat possible d’une condition.\nAxiome 3 — Un seul est suivi à la fois : le chemin.\nAxiome 4 — Elle se dessine en général en losange.\nAxiome 5 — La question « Dossier existant ? » s’écrit `A{Dossier existant ?}`.\nAxiome 6 — Ses sorties « oui » vers B et « non » vers C s’écrivent `A -->|oui| B` et `A -->|non| C`."], ["Phrase", "Six principes fondent la notion : au moins deux flèches qui partent, un résultat possible par flèche, un seul chemin suivi à la fois, le losange, l’exemple `A{Dossier existant ?}`, et les sorties `A -->|oui| B` et `A -->|non| C`."]], "44": [["Axiome", "Axiome 1 — D’une décision partent au moins deux flèches.\nAxiome 3 — Un seul est suivi à la fois : le chemin."], ["Phrase", "Exclus : une décision d’où ne part qu’une flèche, alors qu’au moins deux en partent, ou deux chemins suivis à la fois."]], "45": [["Axiome", "Axiome 1 — D’une décision partent au moins deux flèches.\nAxiome 2 — Chaque flèche correspond à un résultat possible d’une condition.\nAxiome 3 — Un seul est suivi à la fois : le chemin.\nAxiome 4 — Elle se dessine en général en losange.\nAxiome 5 — La question « Dossier existant ? » s’écrit `A{Dossier existant ?}`.\nAxiome 6 — Ses sorties « oui » vers B et « non » vers C s’écrivent `A -->|oui| B` et `A -->|non| C`."], ["Phrase", "Les axiomes s’accordent : les trois premiers disent ce qu’elle fait (au moins deux flèches qui partent, un résultat possible par flèche, un seul chemin suivi), le quatrième sa forme (le losange), les deux derniers comment l’écrire (`A{Dossier existant ?}`, `A -->|oui| B` et `A -->|non| C`)."]], "46": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans la carte, Décision fait partie de la famille « Logique » et suppose de connaître Liaison."]], "47": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On la justifie par le besoin de traiter des cas différents dans un même processus."]], "48": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La preuve qu’elle est complète : chaque réponse possible mène quelque part."]], "49": [["Axiome", "Axiome 1 — D’une décision partent au moins deux flèches.\nAxiome 2 — Chaque flèche correspond à un résultat possible d’une condition."], ["Phrase", "« X est une décision » est vrai si au moins deux flèches en partent, chacune pour un résultat possible d’une condition."]], "50": [["Axiome", "Axiome 2 — Chaque flèche correspond à un résultat possible d’une condition."], ["Phrase", "Pour vérifier : chaque résultat possible de la condition a sa flèche."]], "51": [["Axiome", "Axiome 1 — D’une décision partent au moins deux flèches."], ["Phrase", "Un point d’où ne part qu’une seule flèche n’est pas une décision, puisqu’au moins deux en partent."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La notion est sûre : ses axiomes sont posés comme des définitions."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On fait une hypothèse en posant la question : on suppose avoir prévu toutes les réponses."]], "54": [["Axiome", "Axiome 4 — Elle se dessine en général en losange."], ["Phrase", "On la reconnaît dans le dessin à sa forme de losange."]], "55": [["Axiome", "Axiome 2 — Chaque flèche correspond à un résultat possible d’une condition."], ["Phrase · hors axiomes", "Derrière, c’est la logique booléenne : une condition est vraie ou fausse."]], "56": [["Axiome", "Axiome 2 — Chaque flèche correspond à un résultat possible d’une condition."], ["Phrase · hors axiomes", "Une décision ne fait rien elle-même : elle oriente selon le résultat d’une condition."]], "57": [["Axiome", "Axiome 1 — D’une décision partent au moins deux flèches."], ["Phrase", "Elle existe dès qu’au moins deux flèches partent d’un même point."]], "58": [["Axiome", "Axiome 1 — D’une décision partent au moins deux flèches.\nAxiome 2 — Chaque flèche correspond à un résultat possible d’une condition.\nAxiome 3 — Un seul est suivi à la fois : le chemin.\nAxiome 4 — Elle se dessine en général en losange."], ["Phrase", "Ce qui en fait une décision, c’est la réunion des axiomes : au moins deux flèches qui partent, un résultat possible d’une condition pour chacune, un seul chemin suivi à la fois, et en général la forme d’un losange."]], "59": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle appartient à la catégorie des points de logique."]], "60": [["Axiome", "Axiome 1 — D’une décision partent au moins deux flèches.\nAxiome 2 — Chaque flèche correspond à un résultat possible d’une condition.\nAxiome 3 — Un seul est suivi à la fois : le chemin.\nAxiome 4 — Elle se dessine en général en losange."], ["Phrase", "Nécessaire : au moins deux flèches qui partent, une par résultat possible d’une condition, et un seul chemin suivi à la fois. Habituel, mais pas obligatoire : le losange."]], "61": [["Axiome", "Axiome 2 — Chaque flèche correspond à un résultat possible d’une condition."], ["Phrase", "Sa substance : une condition et ses résultats possibles."]], "62": [["Axiome", "Axiome 1 — D’une décision partent au moins deux flèches."], ["Phrase", "Elle s’arrête là où partent les flèches : au moins deux."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans ce projet, une décision demande si le dossier existe déjà, pour ranger la note au bon endroit."]], "64": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On en dessine une dès que la suite dépend d’une réponse."]], "65": [["Axiome", "Axiome 4 — Elle se dessine en général en losange."], ["Phrase · hors axiomes", "Le losange comme symbole de décision vient des premiers organigrammes de programmation."]], "66": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On formule souvent la question avec un point d’interrogation, pour qu’elle se lise comme une vraie question."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle relève de la logique et de la programmation : c’est le « si… alors… sinon »."]], "68": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Des questions claires permettent à d’autres de comprendre les cas prévus."]], "69": [["Axiome", "Axiome 3 — Un seul est suivi à la fois : le chemin."], ["Phrase", "À un moment donné, un seul chemin est suivi ; au passage suivant, ce peut être un autre."]], "70": [["Axiome", "Axiome 2 — Chaque flèche correspond à un résultat possible d’une condition."], ["Phrase", "Son rôle : orienter la suite selon le résultat d’une condition."]], "71": [["Axiome", "Axiome 4 — Elle se dessine en général en losange.\nAxiome 5 — La question « Dossier existant ? » s’écrit `A{Dossier existant ?}`.\nAxiome 6 — Ses sorties « oui » vers B et « non » vers C s’écrivent `A -->|oui| B` et `A -->|non| C`."], ["Phrase", "Elle fournit un losange et des sorties étiquetées : `A{Dossier existant ?}`, `A -->|oui| B` et `A -->|non| C`."]], "72": [["Axiome", "Axiome 1 — D’une décision partent au moins deux flèches.\nAxiome 2 — Chaque flèche correspond à un résultat possible d’une condition."], ["Phrase", "Elle permet de prévoir plusieurs suites : au moins deux flèches, une par résultat possible."]], "73": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En pratique, elle oblige à penser aux cas qu’on oublie."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ici, elle sert à décider où ranger chaque note."]], "75": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle devient utile dès qu’il y a plus d’une suite possible."]], "76": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Poser une question dans le diagramme, c’est reconnaître qu’il y a plusieurs cas."]], "77": [["Axiome", "Axiome 2 — Chaque flèche correspond à un résultat possible d’une condition.\nAxiome 4 — Elle se dessine en général en losange.\nAxiome 5 — La question « Dossier existant ? » s’écrit `A{Dossier existant ?}`.\nAxiome 6 — Ses sorties « oui » vers B et « non » vers C s’écrivent `A -->|oui| B` et `A -->|non| C`."], ["Phrase", "- Formuler la condition sous forme de question.\n- L’écrire en losange : `A{Dossier existant ?}`.\n- Écrire une flèche par résultat : `A -->|oui| B`, `A -->|non| C`."]], "78": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle change quand on ajoute une réponse possible."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Au fil du projet, de nouveaux cas apparaissent et demandent de nouvelles sorties."]], "80": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On peut transformer une décision à trois réponses en deux décisions à deux réponses."]], "81": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle naît quand on repère qu’une suite dépend d’une réponse."]], "82": [["Axiome", "Axiome 2 — Chaque flèche correspond à un résultat possible d’une condition.\nAxiome 3 — Un seul est suivi à la fois : le chemin."], ["Phrase", "Le processus tranche la condition, puis suit un seul chemin."]], "83": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’adapte en ajoutant ou en retirant des sorties selon les cas."]], "84": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "D’une version à l’autre, la question se reformule souvent pour être plus claire."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une bonne décision se juge à sa question : courte, fermée, sans ambiguïté."]], "86": [["Axiome", "Axiome 4 — Elle se dessine en général en losange."], ["Phrase · hors axiomes", "Norme habituelle : le losange, comme dans la norme ISO 5807."]], "87": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Sa valeur tient à ce qu’elle rend explicite : les cas que le processus doit traiter."]], "88": [["Axiome", "Axiome 1 — D’une décision partent au moins deux flèches.\nAxiome 4 — Elle se dessine en général en losange.\nAxiome 6 — Ses sorties « oui » vers B et « non » vers C s’écrivent `A -->|oui| B` et `A -->|non| C`."], ["Phrase · hors axiomes", "Critères : au moins deux sorties qui partent, la forme d’un losange, des sorties étiquetées comme `A -->|oui| B` ; en plus, une question courte."]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une décision de qualité se lit d’un coup d’œil : question et réponses sont évidentes."]], "90": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle est pertinente si la suite change vraiment selon la réponse ; sinon, on la retire."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’améliore en reformulant la question et en nommant clairement chaque sortie."]]}, "bou": {"1": [["Axiome", "Axiome 1 — Une boucle est une suite de liaisons.\nAxiome 2 — Elle revient vers une étape déjà passée.\nAxiome 3 — Elle part d’une décision, qui permet d’en sortir."], ["Phrase", "Une boucle se compose d’une suite de liaisons qui revient vers une étape déjà passée ; elle part d’une décision, qui permet d’en sortir."]], "2": [["Axiome", "Axiome 1 — Une boucle est une suite de liaisons.\nAxiome 2 — Elle revient vers une étape déjà passée.\nAxiome 3 — Elle part d’une décision, qui permet d’en sortir."], ["Phrase", "Ses éléments fondamentaux sont ceux que posent les axiomes : une suite de liaisons, un retour vers une étape déjà passée, et une décision qui permet d’en sortir."]], "3": [["Axiome", "Axiome 2 — Elle revient vers une étape déjà passée.\nAxiome 3 — Elle part d’une décision, qui permet d’en sortir.\nAxiome 4 — Revenir de B (Code correct ?) à A (Saisir le code) si c’est non s’écrit `B -->|non| A`.\nAxiome 5 — Sortir de B vers C (Ouvrir) si c’est oui s’écrit `B -->|oui| C`."], ["Phrase", "On part de la décision : une sortie revient en arrière, `B -->|non| A`, l’autre quitte la boucle, `B -->|oui| C`."]], "4": [["Axiome", "Axiome 1 — Une boucle est une suite de liaisons.\nAxiome 2 — Elle revient vers une étape déjà passée.\nAxiome 3 — Elle part d’une décision, qui permet d’en sortir."], ["Phrase", "Elle se décompose en trois parties : la décision, la suite de liaisons qui revient en arrière, et l’étape déjà passée qu’elle rejoint."]], "5": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le nombre de tours n’est pas fixé : elle tourne tant que la réponse ne change pas."]], "6": [["Axiome", "Axiome 1 — Une boucle est une suite de liaisons."], ["Phrase", "Sa nature : une suite de liaisons."]], "7": [["Axiome", "Axiome 1 — Une boucle est une suite de liaisons.\nAxiome 2 — Elle revient vers une étape déjà passée."], ["Phrase", "Une boucle, c’est une suite de liaisons qui revient vers une étape déjà passée."]], "8": [["Axiome", "Axiome 1 — Une boucle est une suite de liaisons.\nAxiome 2 — Elle revient vers une étape déjà passée.\nAxiome 3 — Elle part d’une décision, qui permet d’en sortir."], ["Phrase", "Une boucle est une suite de liaisons qui revient vers une étape déjà passée ; elle part d’une décision, qui permet d’en sortir."]], "9": [["Axiome", "Axiome 1 — Une boucle est une suite de liaisons.\nAxiome 2 — Elle revient vers une étape déjà passée.\nAxiome 3 — Elle part d’une décision, qui permet d’en sortir."], ["Phrase", "Être une suite de liaisons, revenir vers une étape déjà passée, partir d’une décision qui permet d’en sortir : ces propriétés la constituent."]], "10": [["Axiome", "Axiome 3 — Elle part d’une décision, qui permet d’en sortir.\nAxiome 4 — Revenir de B (Code correct ?) à A (Saisir le code) si c’est non s’écrit `B -->|non| A`.\nAxiome 5 — Sortir de B vers C (Ouvrir) si c’est oui s’écrit `B -->|oui| C`."], ["Phrase", "Exemple des axiomes : la décision « Code correct ? », avec `B -->|non| A` pour recommencer et `B -->|oui| C` pour sortir."]], "11": [["Axiome", "Axiome 1 — Une boucle est une suite de liaisons."], ["Phrase · hors axiomes", "Les axiomes l’appellent boucle, une suite de liaisons ; en anglais, loop ; on parle aussi d’itération."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le mot vient du latin buccula, la bosse d’un bouclier, devenue l’anneau d’une ceinture."]], "13": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le lecteur y voit une action qu’on répète jusqu’à obtenir le bon résultat."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Boucle » désigne aussi une boucle d’oreille ou de ceinture ; ici, c’est un circuit qui fait recommencer."]], "15": [["Axiome", "Axiome 1 — Une boucle est une suite de liaisons.\nAxiome 2 — Elle revient vers une étape déjà passée.\nAxiome 3 — Elle part d’une décision, qui permet d’en sortir."], ["Phrase", "Une décision, puis une suite de liaisons qui revient vers une étape déjà passée."]], "16": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle n’a pas de rang au-dessus du reste ; elle répète une partie du processus."]], "17": [["Axiome", "Axiome 2 — Elle revient vers une étape déjà passée."], ["Phrase", "Dans l’ensemble, elle forme un circuit : le chemin revient vers une étape déjà passée."]], "18": [["Axiome", "Axiome 2 — Elle revient vers une étape déjà passée."], ["Phrase · hors axiomes", "On dessine le retour sur le côté, pour qu’il ne croise pas le reste."]], "19": [["Axiome", "Axiome 3 — Elle part d’une décision, qui permet d’en sortir."], ["Phrase · hors axiomes", "Elle se range parmi les points de logique, avec la décision."]], "20": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On distingue les boucles qui testent avant d’agir et celles qui agissent avant de tester."]], "21": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une boucle peut en contenir une autre : on parle de boucles imbriquées."]], "22": [["Axiome", "Axiome 1 — Une boucle est une suite de liaisons.\nAxiome 3 — Elle part d’une décision, qui permet d’en sortir."], ["Phrase", "Elle relie une décision à une suite de liaisons."]], "23": [["Axiome", "Axiome 2 — Elle revient vers une étape déjà passée.\nAxiome 3 — Elle part d’une décision, qui permet d’en sortir."], ["Phrase", "Puisqu’elle revient vers une étape déjà passée, il faut une décision qui permet d’en sortir ; sinon, elle ne s’arrêterait pas."]], "24": [["Axiome", "Axiome 3 — Elle part d’une décision, qui permet d’en sortir.\nAxiome 4 — Revenir de B (Code correct ?) à A (Saisir le code) si c’est non s’écrit `B -->|non| A`."], ["Phrase", "La réponse « non » à la décision fait recommencer : `B -->|non| A`."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Plus l’action est difficile à réussir, plus on fait de tours."]], "26": [["Axiome", "Axiome 1 — Une boucle est une suite de liaisons.\nAxiome 2 — Elle revient vers une étape déjà passée.\nAxiome 3 — Elle part d’une décision, qui permet d’en sortir."], ["Phrase", "La décision tranche ; la suite de liaisons ramène vers une étape déjà passée."]], "27": [["Axiome", "Axiome 3 — Elle part d’une décision, qui permet d’en sortir."], ["Phrase · hors axiomes", "Dans la carte, Boucle dépend de Décision, et Structure générale du système dépend d’elle."]], "28": [["Axiome", "Axiome 3 — Elle part d’une décision, qui permet d’en sortir.\nAxiome 4 — Revenir de B (Code correct ?) à A (Saisir le code) si c’est non s’écrit `B -->|non| A`.\nAxiome 5 — Sortir de B vers C (Ouvrir) si c’est oui s’écrit `B -->|oui| C`."], ["Phrase", "Les deux issues s’opposent : `B -->|non| A` fait recommencer, `B -->|oui| C` fait sortir."]], "29": [["Axiome", "Axiome 3 — Elle part d’une décision, qui permet d’en sortir.\nAxiome 4 — Revenir de B (Code correct ?) à A (Saisir le code) si c’est non s’écrit `B -->|non| A`.\nAxiome 5 — Sortir de B vers C (Ouvrir) si c’est oui s’écrit `B -->|oui| C`."], ["Phrase", "Recommencer et sortir se complètent : `B -->|non| A` et `B -->|oui| C`."]], "30": [["Axiome", "Axiome 2 — Elle revient vers une étape déjà passée.\nAxiome 4 — Revenir de B (Code correct ?) à A (Saisir le code) si c’est non s’écrit `B -->|non| A`.\nAxiome 5 — Sortir de B vers C (Ouvrir) si c’est oui s’écrit `B -->|oui| C`."], ["Phrase", "Si c’est non, on revient : `B -->|non| A` ; si c’est oui, on continue : `B -->|oui| C`."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Comme un code de carte bancaire qu’on retape, elle fait recommencer tant que ce n’est pas bon."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une action à l’intérieur peut changer la réponse au tour suivant."]], "33": [["Axiome", "Axiome 2 — Elle revient vers une étape déjà passée."], ["Phrase", "Elle répète un moment du processus : elle revient vers une étape déjà passée."]], "34": [["Axiome", "Axiome 2 — Elle revient vers une étape déjà passée."], ["Phrase · hors axiomes", "Dans le dessin, le trait de retour remonte vers une étape plus haute."]], "35": [["Axiome", "Axiome 1 — Une boucle est une suite de liaisons.\nAxiome 2 — Elle revient vers une étape déjà passée.\nAxiome 3 — Elle part d’une décision, qui permet d’en sortir.\nAxiome 4 — Revenir de B (Code correct ?) à A (Saisir le code) si c’est non s’écrit `B -->|non| A`.\nAxiome 5 — Sortir de B vers C (Ouvrir) si c’est oui s’écrit `B -->|oui| C`."], ["Phrase", "Cinq propositions : c’est une suite de liaisons ; elle revient vers une étape déjà passée ; elle part d’une décision, qui permet d’en sortir ; revenir si c’est non s’écrit `B -->|non| A` ; sortir si c’est oui s’écrit `B -->|oui| C`."]], "36": [["Axiome", "Axiome 1 — Une boucle est une suite de liaisons.\nAxiome 2 — Elle revient vers une étape déjà passée.\nAxiome 3 — Elle part d’une décision, qui permet d’en sortir."], ["Phrase", "On dit d’une boucle qu’elle est une suite de liaisons, qu’elle revient vers une étape déjà passée et qu’elle part d’une décision qui permet d’en sortir."]], "37": [["Axiome", "Axiome 1 — Une boucle est une suite de liaisons.\nAxiome 2 — Elle revient vers une étape déjà passée."], ["Phrase", "Si une suite de liaisons revient vers une étape déjà passée, c’est une boucle."]], "38": [["Axiome", "Axiome 3 — Elle part d’une décision, qui permet d’en sortir."], ["Phrase", "Conséquence nécessaire : toute boucle a une décision, puisqu’elle en part."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "À force d’en dessiner, on remarque que les boucles servent surtout à refaire une saisie ou une tentative."]], "40": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Si le processus tourne sans fin, l’explication la plus probable est une réponse qui ne change jamais."]], "41": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Argument habituel : dessiner la boucle évite d’oublier le cas où il faut recommencer."]], "42": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les axiomes ne se démontrent pas : on les admet. On montre qu’un circuit est une boucle en vérifiant qu’il respecte chacun d’eux."]], "43": [["Axiome", "Axiome 1 — Une boucle est une suite de liaisons.\nAxiome 2 — Elle revient vers une étape déjà passée.\nAxiome 3 — Elle part d’une décision, qui permet d’en sortir.\nAxiome 4 — Revenir de B (Code correct ?) à A (Saisir le code) si c’est non s’écrit `B -->|non| A`.\nAxiome 5 — Sortir de B vers C (Ouvrir) si c’est oui s’écrit `B -->|oui| C`."], ["Phrase", "Cinq principes fondent la notion : la suite de liaisons, le retour vers une étape déjà passée, la décision qui permet d’en sortir, `B -->|non| A` et `B -->|oui| C`."]], "44": [["Axiome", "Axiome 2 — Elle revient vers une étape déjà passée.\nAxiome 3 — Elle part d’une décision, qui permet d’en sortir."], ["Phrase", "Exclus : une boucle sans décision pour en sortir, ou qui ne revient vers aucune étape déjà passée."]], "45": [["Axiome", "Axiome 1 — Une boucle est une suite de liaisons.\nAxiome 2 — Elle revient vers une étape déjà passée.\nAxiome 3 — Elle part d’une décision, qui permet d’en sortir.\nAxiome 4 — Revenir de B (Code correct ?) à A (Saisir le code) si c’est non s’écrit `B -->|non| A`.\nAxiome 5 — Sortir de B vers C (Ouvrir) si c’est oui s’écrit `B -->|oui| C`."], ["Phrase", "Les axiomes s’accordent : les trois premiers disent ce qu’elle est (une suite de liaisons qui revient vers une étape déjà passée, à partir d’une décision qui permet d’en sortir), les deux derniers comment l’écrire (`B -->|non| A`, `B -->|oui| C`)."]], "46": [["Axiome", "Axiome 3 — Elle part d’une décision, qui permet d’en sortir."], ["Phrase · hors axiomes", "Dans la carte, Boucle fait partie de la famille « Logique » et suppose de connaître Décision."]], "47": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On la justifie par le besoin de refaire une action jusqu’à ce qu’elle réussisse."]], "48": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La preuve qu’elle est bien faite : elle s’arrête toujours à un moment."]], "49": [["Axiome", "Axiome 1 — Une boucle est une suite de liaisons.\nAxiome 2 — Elle revient vers une étape déjà passée.\nAxiome 3 — Elle part d’une décision, qui permet d’en sortir."], ["Phrase", "« X est une boucle » est vrai si X est une suite de liaisons qui revient vers une étape déjà passée, à partir d’une décision."]], "50": [["Axiome", "Axiome 3 — Elle part d’une décision, qui permet d’en sortir."], ["Phrase", "Pour vérifier : la décision a-t-elle bien une sortie ?"]], "51": [["Axiome", "Axiome 3 — Elle part d’une décision, qui permet d’en sortir."], ["Phrase", "Un circuit sans moyen d’en sortir tourne sans fin : ce n’est pas une boucle au sens des axiomes, qui demandent une décision."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La notion est sûre : ses axiomes sont posés comme des définitions."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On fait une hypothèse en dessinant une boucle : on suppose qu’un nouvel essai peut réussir."]], "54": [["Axiome", "Axiome 2 — Elle revient vers une étape déjà passée."], ["Phrase", "On la reconnaît dans le dessin à un trait qui revient vers une étape déjà passée."]], "55": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Derrière, c’est la théorie des graphes : une boucle y forme un cycle."]], "56": [["Axiome", "Axiome 1 — Une boucle est une suite de liaisons."], ["Phrase", "Une boucle n’est pas une étape : c’est une suite de liaisons."]], "57": [["Axiome", "Axiome 1 — Une boucle est une suite de liaisons.\nAxiome 2 — Elle revient vers une étape déjà passée."], ["Phrase", "Elle existe dès qu’une suite de liaisons revient vers une étape déjà passée."]], "58": [["Axiome", "Axiome 1 — Une boucle est une suite de liaisons.\nAxiome 2 — Elle revient vers une étape déjà passée.\nAxiome 3 — Elle part d’une décision, qui permet d’en sortir."], ["Phrase", "Ce qui en fait une boucle, c’est la réunion des axiomes : une suite de liaisons qui revient vers une étape déjà passée, à partir d’une décision qui permet d’en sortir."]], "59": [["Axiome", "Axiome 1 — Une boucle est une suite de liaisons."], ["Phrase", "Elle appartient à la catégorie des suites de liaisons."]], "60": [["Axiome", "Axiome 1 — Une boucle est une suite de liaisons.\nAxiome 2 — Elle revient vers une étape déjà passée.\nAxiome 3 — Elle part d’une décision, qui permet d’en sortir."], ["Phrase", "Nécessaire : une suite de liaisons qui revient vers une étape déjà passée, et une décision qui permet d’en sortir. Au choix : les étapes répétées et le nombre de tours."]], "61": [["Axiome", "Axiome 1 — Une boucle est une suite de liaisons."], ["Phrase", "Sa substance : une suite de liaisons."]], "62": [["Axiome", "Axiome 3 — Elle part d’une décision, qui permet d’en sortir."], ["Phrase", "Elle s’arrête à la décision, qui permet d’en sortir."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans ce projet, une boucle pourrait faire réessayer la transcription quand elle échoue."]], "64": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On en dessine une dès qu’une action peut échouer et doit être refaite."]], "65": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "L’idée vient des premiers programmes, où l’on répétait une instruction au lieu de l’écrire plusieurs fois."]], "66": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En programmation, on parle de « tant que » ou de « pour chaque »."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle relève de la logique et de la programmation."]], "68": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une boucle bien dessinée montre aux autres que l’échec est prévu."]], "69": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle étire le processus dans le temps : un tour de plus, c’est plus de temps."]], "70": [["Axiome", "Axiome 2 — Elle revient vers une étape déjà passée."], ["Phrase", "Son rôle : faire revenir vers une étape déjà passée."]], "71": [["Axiome", "Axiome 4 — Revenir de B (Code correct ?) à A (Saisir le code) si c’est non s’écrit `B -->|non| A`.\nAxiome 5 — Sortir de B vers C (Ouvrir) si c’est oui s’écrit `B -->|oui| C`."], ["Phrase", "Elle fournit deux issues étiquetées : `B -->|non| A` et `B -->|oui| C`."]], "72": [["Axiome", "Axiome 2 — Elle revient vers une étape déjà passée.\nAxiome 3 — Elle part d’une décision, qui permet d’en sortir."], ["Phrase", "Elle permet de recommencer une partie du processus, en repassant par une étape déjà passée, jusqu’à ce que la décision permette d’en sortir."]], "73": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En pratique, elle évite de tout reprendre depuis le début."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ici, elle sert à refaire une action de l’enregistreur qui a échoué."]], "75": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle devient utile dès qu’une action peut échouer."]], "76": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dessiner une boucle, c’est accepter qu’une action puisse rater."]], "77": [["Axiome", "Axiome 2 — Elle revient vers une étape déjà passée.\nAxiome 3 — Elle part d’une décision, qui permet d’en sortir.\nAxiome 4 — Revenir de B (Code correct ?) à A (Saisir le code) si c’est non s’écrit `B -->|non| A`.\nAxiome 5 — Sortir de B vers C (Ouvrir) si c’est oui s’écrit `B -->|oui| C`."], ["Phrase · hors axiomes", "- Poser la décision : `B{Code correct ?}`.\n- Écrire le retour : `B -->|non| A`.\n- Écrire la sortie : `B -->|oui| C`."]], "78": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle change quand on modifie la condition d’arrêt."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Au fil du projet, on peut ajouter une limite de tours, pour ne pas tourner sans fin."]], "80": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On peut la remplacer par un simple message d’erreur si recommencer ne sert à rien."]], "81": [["Axiome", "Axiome 3 — Elle part d’une décision, qui permet d’en sortir."], ["Phrase", "Elle naît d’une décision : c’est de là qu’elle part."]], "82": [["Axiome", "Axiome 2 — Elle revient vers une étape déjà passée.\nAxiome 3 — Elle part d’une décision, qui permet d’en sortir."], ["Phrase", "On passe par la décision ; si besoin, on revient vers une étape déjà passée, sinon on continue."]], "83": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’adapte en limitant le nombre de tours."]], "84": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "D’une version à l’autre, la condition d’arrêt devient souvent plus précise."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une bonne boucle se juge à sa fin : on sait toujours comment elle s’arrête."]], "86": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Pas de symbole propre : elle se dessine avec des traits ordinaires."]], "87": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Sa valeur tient à la robustesse qu’elle apporte : un échec ne bloque plus tout."]], "88": [["Axiome", "Axiome 2 — Elle revient vers une étape déjà passée.\nAxiome 3 — Elle part d’une décision, qui permet d’en sortir."], ["Phrase · hors axiomes", "Critères : elle revient vers une étape déjà passée, et une décision permet d’en sortir ; en plus, une limite de tours."]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une boucle de qualité se suit sans se perdre : on voit où elle commence et où elle s’arrête."]], "90": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle est pertinente si recommencer a une chance de réussir ; sinon, mieux vaut s’arrêter."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’améliore en ajoutant une limite de tours et un message clair en cas d’échec."]]}, "sg": {"1": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre.\nAxiome 2 — Il contient une ou plusieurs étapes.\nAxiome 3 — Des liaisons peuvent traverser ses bords.\nAxiome 4 — Son titre s’affiche en haut du cadre.\nAxiome 5 — Il s’écrit entre subgraph et `end`.\nAxiome 6 — Son titre se met entre guillemets, pour éviter les erreurs dues aux apostrophes et aux accents.\nAxiome 8 — Pour un groupe dans un autre, j’écris le subgraph intérieur dans le groupe extérieur, entre son `subgraph` et son `end`."], ["Phrase", "Un sous-groupe se compose d’un cadre avec un titre, affiché en haut du cadre et mis entre guillemets, qui contient une ou plusieurs étapes, voire un autre groupe à l’intérieur ; des liaisons peuvent traverser ses bords ; il s’écrit entre subgraph et end."]], "2": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre.\nAxiome 2 — Il contient une ou plusieurs étapes.\nAxiome 3 — Des liaisons peuvent traverser ses bords.\nAxiome 4 — Son titre s’affiche en haut du cadre.\nAxiome 5 — Il s’écrit entre subgraph et `end`.\nAxiome 6 — Son titre se met entre guillemets, pour éviter les erreurs dues aux apostrophes et aux accents.\nAxiome 8 — Pour un groupe dans un autre, j’écris le subgraph intérieur dans le groupe extérieur, entre son `subgraph` et son `end`."], ["Phrase", "Ses éléments fondamentaux sont ceux que posent les axiomes : un cadre avec un titre en haut, entre guillemets, une ou plusieurs étapes, des bords que des liaisons peuvent traverser, subgraph et end, et la possibilité d’un groupe intérieur."]], "3": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre.\nAxiome 2 — Il contient une ou plusieurs étapes.\nAxiome 5 — Il s’écrit entre subgraph et `end`.\nAxiome 6 — Son titre se met entre guillemets, pour éviter les erreurs dues aux apostrophes et aux accents.\nAxiome 7 — Un groupe « Entrée » autour de A s’écrit `subgraph entree [\"Entrée\"]`, puis `A`, puis `end`."], ["Phrase", "On ouvre avec subgraph, l’identifiant et le titre entre guillemets, on liste les étapes, puis on ferme avec end : `subgraph entree [\"Entrée\"]`, puis `A`, puis `end`."]], "4": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre.\nAxiome 2 — Il contient une ou plusieurs étapes."], ["Phrase", "Il se décompose en un cadre avec un titre, et les étapes qu’il contient."]], "5": [["Axiome", "Axiome 2 — Il contient une ou plusieurs étapes.\nNon couvert : les axiomes ne fixent pas de maximum."], ["Phrase", "Il contient une ou plusieurs étapes."]], "6": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre."], ["Phrase", "Sa nature : un cadre avec un titre."]], "7": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre.\nAxiome 2 — Il contient une ou plusieurs étapes."], ["Phrase", "Un sous-groupe, c’est un cadre avec un titre, qui contient une ou plusieurs étapes."]], "8": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre.\nAxiome 2 — Il contient une ou plusieurs étapes.\nAxiome 3 — Des liaisons peuvent traverser ses bords.\nAxiome 4 — Son titre s’affiche en haut du cadre."], ["Phrase", "Un sous-groupe est un cadre avec un titre affiché en haut, qui contient une ou plusieurs étapes, et dont les bords peuvent être traversés par des liaisons."]], "9": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre.\nAxiome 2 — Il contient une ou plusieurs étapes.\nAxiome 3 — Des liaisons peuvent traverser ses bords."], ["Phrase", "Être un cadre avec un titre, contenir une ou plusieurs étapes, laisser des liaisons traverser ses bords : ces propriétés le constituent."]], "10": [["Axiome", "Axiome 5 — Il s’écrit entre subgraph et `end`.\nAxiome 7 — Un groupe « Entrée » autour de A s’écrit `subgraph entree [\"Entrée\"]`, puis `A`, puis `end`."], ["Phrase", "Exemple des axiomes : le groupe « Entrée », `subgraph entree [\"Entrée\"]`, puis `A`, puis `end`."]], "11": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre.\nAxiome 5 — Il s’écrit entre subgraph et `end`."], ["Phrase · hors axiomes", "Les axiomes l’appellent sous-groupe, ou cadre ; dans le code, subgraph ; on dit aussi groupe ou cluster."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Groupe » vient de l’italien gruppo, « assemblage » ; « sous- » marque qu’il fait partie d’un ensemble plus grand."]], "13": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le lecteur comprend que ce qui est regroupé va ensemble."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Groupe » désigne aussi un ensemble de personnes ; ici, c’est un ensemble de points du diagramme."]], "15": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre.\nAxiome 2 — Il contient une ou plusieurs étapes.\nAxiome 4 — Son titre s’affiche en haut du cadre."], ["Phrase", "Un cadre, son titre en haut, et les étapes dedans."]], "16": [["Axiome", "Axiome 8 — Pour un groupe dans un autre, j’écris le subgraph intérieur dans le groupe extérieur, entre son `subgraph` et son `end`."], ["Phrase", "Il peut contenir un autre groupe : un groupe intérieur dans un groupe extérieur."]], "17": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre.\nAxiome 2 — Il contient une ou plusieurs étapes."], ["Phrase", "Vu de loin, le diagramme se découpe en cadres, chacun avec ses étapes."]], "18": [["Axiome", "Axiome 2 — Il contient une ou plusieurs étapes."], ["Phrase · hors axiomes", "Les étapes qui vont ensemble sont rangées dans le même groupe."]], "19": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre."], ["Phrase", "Il se range parmi les cadres du diagramme."]], "20": [["Axiome", "Axiome 8 — Pour un groupe dans un autre, j’écris le subgraph intérieur dans le groupe extérieur, entre son `subgraph` et son `end`."], ["Phrase", "Deux cas : un groupe simple, ou un groupe intérieur placé dans un groupe extérieur."]], "21": [["Axiome", "Axiome 1 — Un sous-groupe est un cadre avec un titre.\nAxiome 2 — Il contient une ou plusieurs étapes."], ["Phrase · hors axiomes", "Chaque cadre forme une unité : un ensemble d’étapes qu’on lit séparément."]], "22": [["Axiome", "Axiome 3 — Des liaisons peuvent traverser ses bords.\nAxiome 9 — Relier deux groupes s’écrit `appel --> entree`."], ["Phrase", "Des liaisons peuvent traverser ses bords, et deux groupes peuvent être reliés : `appel --> entree`."]], "23": [["Axiome", "Axiome 2 — Il contient une ou plusieurs étapes."], ["Phrase", "Puisqu’il contient une ou plusieurs étapes, un groupe vide n’en est pas un."]], "24": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Regrouper des points ne change pas leurs liens : seule la mise en page change."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Plus un diagramme est grand, plus les regroupements aident à s’y retrouver."]], "26": [["Axiome", "Axiome 1 — Un sous-gro
