<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guide — Pseudo-code</title>
<!--
  Guide de lecture de l'explorateur : lit donnees.json (même fichier que index.html)
  et l'affiche d'un bout à l'autre, procédures d'abord. Un seul exemple par fiche.
-->
<style>
:root{color-scheme:light;--bg:#f4f6f9;--panel:#fff;--line:#d8e0e9;--text:#202b3c;--muted:#637083;--accent:#285ea8;--accentbg:#eaf1fb;
  --c-concept:#528bd4;--c-prop:#2eaa91;--c-regle:#d99a42;--c-proc:#9874d5;--c-ex:#4aa9b9;--c-cex:#d66e75}
*{box-sizing:border-box;min-width:0}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
a{color:var(--accent)}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
header{padding:28px 0 12px}
h1{font-size:clamp(22px,4vw,30px);line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}
.sub{margin:0;color:var(--muted);font-size:14px}
.sub a{white-space:nowrap}
nav{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:8px;padding-bottom:8px}
nav a{flex:none;text-decoration:none;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;min-height:36px;display:inline-flex;align-items:center;gap:6px}
nav a b{font-weight:600;color:var(--muted)}
section{padding-top:18px}
h2{font-size:21px;margin:10px 0 4px}
.lead{margin:0 0 12px;color:var(--muted);font-size:14px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;padding:0;list-style:none}
.toc a{display:inline-block;font-size:13px;text-decoration:none;background:var(--accentbg);border-radius:6px;padding:4px 9px}
article{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px;break-inside:avoid}
article h3{font-size:17px;line-height:1.35;margin:0 0 8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.dot{flex:none;width:10px;height:10px;border-radius:50%;display:inline-block;transform:translateY(-1px)}
.tag{font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr)}
dt{font-size:12px;font-weight:600;color:var(--muted);text-transform:none;margin-top:8px}
dt:first-child{margin-top:0}
dd{margin:1px 0 0}
.steps p{margin:2px 0}
.code{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;background:#f6f8fb;border:1px solid var(--line);border-radius:6px;padding:6px 9px;display:block}
.ex{margin-top:10px;border-left:3px solid var(--c-ex);padding:4px 0 4px 10px}
.ex.cex{border-left-color:var(--c-cex)}
.ex .k{font-size:12px;font-weight:600;color:var(--muted)}
.ex p{margin:3px 0 0}
.links a{white-space:normal}
.muted{color:var(--muted)}
.msg{max-width:560px;margin:15vh auto;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.pick{display:inline-flex;align-items:center;min-height:44px;padding:10px 16px;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
footer{padding:24px 0 40px;color:var(--muted);font-size:13px}
@media print{nav,.sub a,footer{display:none}body{background:#fff}article{border-color:#ccc}}
</style>
</head>
<body>
<div id="app"></div>
<script>
{
const COUL={"Concept":"var(--c-concept)","Propriété":"var(--c-prop)","Règle":"var(--c-regle)","Procédure":"var(--c-proc)"};
const PRIM="Terme primitif (non défini)";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const app=document.getElementById("app");

async function charger(){
  try{const r=await fetch("donnees.json",{cache:"no-store"});if(!r.ok)throw 0;afficher(JSON.parse(await r.text()))}
  catch(e){
    app.innerHTML=`<div class="msg"><h1>Ouvre donnees.json</h1><p class="muted">Le guide n'a pas pu lire « donnees.json » à côté de lui. Choisis le fichier.</p><label class="pick">Choisir un fichier<input type="file" id="f" accept=".json,application/json" hidden></label></div>`;
    document.getElementById("f").addEventListener("change",ev=>{const f=ev.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{afficher(JSON.parse(String(rd.result)))}catch(err){alerteFichier()}};rd.readAsText(f,"utf-8")});
  }
}
function alerteFichier(){app.innerHTML=`<div class="msg"><h1>Fichier illisible</h1><p class="muted">Ce fichier n'est pas un donnees.json valide.</p></div>`}

function afficher(d){
  if(!d||!Array.isArray(d.items)||!Array.isArray(d.links))return alerteFichier();
  const actifs=d.items.filter(x=>x&&x.id&&(x.life||"Actif")!=="Archivé");
  const par=new Map(actifs.map(x=>[x.id,x]));
  const rang=new Map(actifs.map((x,i)=>[x.id,i]));
  const liens=d.links.filter(l=>par.has(l.source)&&par.has(l.target));
  const sortants=(id,type)=>liens.filter(l=>l.source===id&&l.type===type).map(l=>par.get(l.target));
  const entrants=(id,type)=>liens.filter(l=>l.target===id&&l.type===type).map(l=>par.get(l.source));
  const f=x=>x.fields||{};
  const nom=x=>x.name||"Sans nom";
  const lien=x=>`<a href="#${esc(x.id)}">${esc(nom(x))}</a>`;
  const liste=xs=>xs.map(lien).join(", ");

  /* Ordre d'apprentissage : prérequis d'abord (« A pour prérequis » : la cible s'apprend avant la source) */
  function ordonner(xs,rel){
    const ids=new Set(xs.map(x=>x.id)),fait=new Set(),out=[];
    const visite=(x,pile)=>{if(fait.has(x.id)||pile.has(x.id))return;pile.add(x.id);
      sortants(x.id,rel).filter(y=>ids.has(y.id)).sort((a,b)=>rang.get(a.id)-rang.get(b.id)).forEach(y=>visite(y,pile));
      pile.delete(x.id);fait.add(x.id);out.push(x)};
    [...xs].sort((a,b)=>rang.get(a.id)-rang.get(b.id)).forEach(x=>visite(x,new Set()));
    return out;
  }
  /* Concepts : termes primitifs d'abord, puis par profondeur de définition */
  const prof=new Map();
  const profondeur=(x,pile=new Set())=>{if(prof.has(x.id))return prof.get(x.id);if(pile.has(x.id))return 0;pile.add(x.id);
    const s=sortants(x.id,"Se définit à partir de");const p=s.length?1+Math.max(...s.map(y=>profondeur(y,pile))):0;pile.delete(x.id);prof.set(x.id,p);return p};

  const exemple=x=>{const e=entrants(x.id,"Illustre").find(y=>y.type==="Exemple");if(!e)return"";const g=f(e);
    return `<div class="ex"><div class="k">Exemple — ${esc(nom(e))}</div>${g.case?`<p><span class="code">${esc(g.case)}</span></p>`:""}${g.shown?`<p>Montre : ${esc(g.shown)}.</p>`:""}</div>`};
  const contreExemples=x=>entrants(x.id,"Met à l’épreuve").filter(y=>y.type==="Contre-exemple").map(c=>{const g=f(c);
    return `<div class="ex cex"><div class="k">Limite — ${esc(nom(c))}</div>${g.case?`<p><span class="code">${esc(g.case)}</span></p>`:""}${g.condition?`<p>Ne s'applique pas lorsque ${esc(g.condition)}.</p>`:""}${g.verdict?`<p class="muted">${esc(g.verdict)}</p>`:""}</div>`}).join("");
  const ligne=(t,v)=>v?`<dt>${t}</dt><dd>${v}</dd>`:"";
  const statut=x=>x.status&&x.status!=="Établi"?`<span class="tag">${esc(x.status)}</span>`:"";
  const titre=x=>`<h3><span class="dot" style="background:${COUL[x.type]}" aria-hidden="true"></span>${esc(nom(x))}${statut(x)}</h3>`;
  const prereq=x=>{const p=sortants(x.id,"A pour prérequis");return p.length?ligne("Avant, savoir",liste(p)):""};

  const fiche={
    "Procédure":x=>{const g=f(x);return `<article id="${esc(x.id)}">${titre(x)}<dl>
      ${ligne("But",esc(g.goal))}${ligne("Contexte",esc(g.context))}${ligne("À partir de",esc(g.inputs))}
      ${g.steps?`<dt>Étapes</dt><dd class="steps">${String(g.steps).split("\n").filter(s=>s.trim()).map(s=>`<p>${esc(s)}</p>`).join("")}</dd>`:""}
      ${ligne("Résultat",esc(g.result))}${ligne("Réussie si",esc(g.success))}
      ${ligne("Règles appliquées",liste(sortants(x.id,"Applique")))}${ligne("S’appuie sur",liste(sortants(x.id,"S’appuie sur")))}
      ${ligne("Contient",liste(sortants(x.id,"Contient")))}${prereq(x)}</dl>${exemple(x)}${contreExemples(x)}</article>`},
    "Règle":x=>{const g=f(x),m=g.exceptionMode;return `<article id="${esc(x.id)}">${titre(x)}<dl>
      ${ligne("Sorte",esc(g.kind==="D’action"?"Règle d’action : dit quoi faire":g.kind==="Descriptive"?"Règle descriptive : dit ce qui se passe":g.kind))}
      ${ligne("Contexte",esc(g.context))}${ligne("Si",esc(g.condition))}${ligne("Alors",esc(g.conclusion))}
      ${ligne("Sauf si",m==="Exception réelle"?esc(g.exception):m?`<span class="muted">${esc(m)}</span>`:"")}
      ${ligne("Porte sur",liste(sortants(x.id,"Porte sur")))}${prereq(x)}</dl>${exemple(x)}${contreExemples(x)}</article>`},
    "Propriété":x=>{const g=f(x),cs=["Définit","Caractérise","Met en relation"].flatMap(t=>sortants(x.id,t));
      const sujet=cs.map(c=>"« "+esc(nom(c))+" »").join(" et ");
      return `<article id="${esc(x.id)}">${titre(x)}<dl>
      ${ligne("Énoncé",[g.domain?`Dans le domaine ${esc(g.domain)},`:"",sujet,esc(g.qualifier||""),esc(g.relation||""),esc(g.object||"")].filter(Boolean).join(" ")+".")}
      ${ligne("Concerne",liste(cs))}${prereq(x)}</dl>${exemple(x)}${contreExemples(x)}</article>`},
    "Concept":x=>{const g=f(x),prim=g.nature===PRIM;return `<article id="${esc(x.id)}">${titre(x)}<dl>
      ${prim?ligne("Terme primitif, non défini. Sens intuitif",esc(g.intuition)):ligne("Définition",esc(g.definition))}
      ${ligne("Caractéristiques",esc(g.traits))}${ligne("Se définit à partir de",liste(sortants(x.id,"Se définit à partir de")))}
      ${prereq(x)}</dl>${exemple(x)}${contreExemples(x)}</article>`}
  };

  const deType=t=>actifs.filter(x=>x.type===t);
  const procs=ordonner(deType("Procédure"),"A pour prérequis");
  const regles=ordonner(deType("Règle"),"A pour prérequis");
  const props=ordonner(deType("Propriété"),"A pour prérequis");
  const concepts=deType("Concept").sort((a,b)=>profondeur(a)-profondeur(b)||rang.get(a.id)-rang.get(b.id));

  const sections=[
    ["procedures","Procédures",procs,"Comment faire, étape par étape, dans l'ordre où les apprendre."],
    ["regles","Règles",regles,"Si…, alors… : ce qui se passe, ou ce qu'il faut faire. Dans l'ordre où les apprendre."],
    ["proprietes","Propriétés",props,"Ce qui est toujours vrai."],
    ["concepts","Concepts",concepts,"Les mots du domaine, des termes primitifs aux concepts qui en découlent."]
  ];
  document.title=(d.titre?d.titre.split(" (")[0]:"Guide")+" — guide";
  app.innerHTML=`<header class="wrap"><h1>${esc(d.titre||"Guide")}</h1>
    <p class="sub">Le contenu de l'explorateur, à lire d'un bout à l'autre. Un exemple par fiche. <a href="index.html">Ouvrir l'explorateur</a></p></header>
    <nav aria-label="Sections"><div class="wrap">${sections.map(([id,t,xs])=>`<a href="#${id}">${t} <b>${xs.length}</b></a>`).join("")}</div></nav>
    <main class="wrap">${sections.map(([id,t,xs,lead])=>`<section id="${id}"><h2>${t}</h2><p class="lead">${lead}</p>
      ${id==="procedures"?`<ul class="toc">${xs.map(x=>`<li>${lien(x)}</li>`).join("")}</ul>`:""}
      ${xs.map(x=>fiche[x.type](x)).join("")}</section>`).join("")}</main>
    <footer class="wrap">Généré à partir de donnees.json${d.version?` (v${esc(d.version)})`:""}, à chaque ouverture : modifier le fichier met le guide à jour.</footer>`;
  if(location.hash){const el=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(el)el.scrollIntoView()}
}
charger();
}
</script>
</body>
</html>
