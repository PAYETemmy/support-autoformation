15": [["Axiome", "Axiome 4 — Ils sont rangés en sections, dans une colonne à gauche.\nAxiome 5 — La « Danger Zone », tout en bas, regroupe les réglages risqués."], ["Phrase", "Organisation : une colonne de sections à gauche, le contenu à droite, la « Danger Zone » en bas de la première section."]], "16": [["Axiome", "Axiome 5 — La « Danger Zone », tout en bas, regroupe les réglages risqués."], ["Phrase", "Hiérarchie de risque : réglages ordinaires d’abord, réglages risqués tout en bas."]], "17": [["Axiome", "Axiome 2 — Ils se trouvent dans l’onglet « Settings » du dépôt.\nAxiome 4 — Ils sont rangés en sections, dans une colonne à gauche."], ["Phrase", "Vue d’ensemble : un onglet, une colonne de sections, des réglages."]], "18": [["Axiome", "Axiome 4 — Ils sont rangés en sections, dans une colonne à gauche."], ["Phrase · hors axiomes", "Les sections sont listées à gauche ; sur un petit écran, la liste peut passer au-dessus."]], "19": [["Axiome", "Axiome 1 — Les paramètres sont les réglages d’un dépôt."], ["Phrase", "Ils se rangent parmi les réglages."]], "20": [["Axiome", "Axiome 5 — La « Danger Zone », tout en bas, regroupe les réglages risqués."], ["Phrase", "Deux types : les réglages ordinaires et ceux de la « Danger Zone »."]], "21": [["Axiome", "Axiome 4 — Ils sont rangés en sections, dans une colonne à gauche."], ["Phrase", "Chaque section est une unité à part."]], "22": [["Axiome", "Axiome 1 — Les paramètres sont les réglages d’un dépôt."], ["Phrase", "Chaque réglage est lié au dépôt qu’il règle."]], "23": [["Axiome", "Axiome 3 — Seuls le propriétaire du dépôt et ses administrateurs y ont accès."], ["Phrase", "Puisqu’ils sont réservés au propriétaire, un visiteur ne peut rien y changer."]], "24": [["Axiome", "Axiome 7 — Pour renommer le dépôt, je change « Repository name », puis je clique sur « Rename »."], ["Phrase · hors axiomes", "Renommer change l’adresse du dépôt."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Plus un dépôt a d’outils activés, plus il a de sections utiles."]], "26": [["Axiome", "Axiome 1 — Les paramètres sont les réglages d’un dépôt."], ["Phrase", "Leur fonction : régler le dépôt."]], "27": [["Axiome", "Axiome 3 — Seuls le propriétaire du dépôt et ses administrateurs y ont accès."], ["Phrase", "Ils dépendent des droits : sans droit d’administration, pas d’onglet."]], "28": [["Axiome", "Axiome 5 — La « Danger Zone », tout en bas, regroupe les réglages risqués."], ["Phrase", "La « Danger Zone » s’oppose aux réglages ordinaires."]], "29": [["Axiome", "Axiome 4 — Ils sont rangés en sections, dans une colonne à gauche.\nAxiome 5 — La « Danger Zone », tout en bas, regroupe les réglages risqués."], ["Phrase", "Sections ordinaires et « Danger Zone » se complètent : régler au quotidien, agir rarement en profondeur."]], "30": [["Axiome", "Axiome 3 — Seuls le propriétaire du dépôt et ses administrateurs y ont accès.\nAxiome 6 — Si l’onglet « Settings » n’apparaît pas, je l’ouvre par le menu « … » des onglets."], ["Phrase", "Si l’onglet n’apparaît pas : soit il est replié dans « … », soit on n’a pas les droits."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Comme les réglages d’un téléphone : des sections, et les actions graves tout au fond."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un réglage peut en influencer un autre : désactiver Actions peut gêner la publication du site."]], "33": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un réglage modifié s’applique aussitôt, ou après « Save »."]], "34": [["Axiome", "Axiome 2 — Ils se trouvent dans l’onglet « Settings » du dépôt.\nAxiome 5 — La « Danger Zone », tout en bas, regroupe les réglages risqués."], ["Phrase", "L’onglet « Settings » est à droite des onglets ; la « Danger Zone », tout en bas."]], "35": [["Axiome", "Axiome 1 — Les paramètres sont les réglages d’un dépôt.\nAxiome 2 — Ils se trouvent dans l’onglet « Settings » du dépôt.\nAxiome 3 — Seuls le propriétaire du dépôt et ses administrateurs y ont accès.\nAxiome 4 — Ils sont rangés en sections, dans une colonne à gauche.\nAxiome 5 — La « Danger Zone », tout en bas, regroupe les réglages risqués.\nAxiome 6 — Si l’onglet « Settings » n’apparaît pas, je l’ouvre par le menu « … » des onglets.\nAxiome 7 — Pour renommer le dépôt, je change « Repository name », puis je clique sur « Rename »."], ["Phrase", "Sept propositions : réglages ; onglet « Settings » ; réservés ; sections ; « Danger Zone » ; menu « … » ; renommer."]], "36": [["Axiome", "Axiome 1 — Les paramètres sont les réglages d’un dépôt.\nAxiome 3 — Seuls le propriétaire du dépôt et ses administrateurs y ont accès."], ["Phrase", "On dit des paramètres qu’ils règlent le dépôt et qu’ils sont réservés."]], "37": [["Axiome", "Axiome 2 — Ils se trouvent dans l’onglet « Settings » du dépôt.\nAxiome 3 — Seuls le propriétaire du dépôt et ses administrateurs y ont accès."], ["Phrase", "Si je vois « Settings », c’est que j’ai les droits sur ce dépôt."]], "38": [["Axiome", "Axiome 3 — Seuls le propriétaire du dépôt et ses administrateurs y ont accès."], ["Phrase", "Conséquence nécessaire : on ne règle que ses propres dépôts."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Tous les dépôts ont les mêmes sections : on retrouve vite ses repères."]], "40": [["Axiome", "Axiome 3 — Seuls le propriétaire du dépôt et ses administrateurs y ont accès.\nAxiome 6 — Si l’onglet « Settings » n’apparaît pas, je l’ouvre par le menu « … » des onglets."], ["Phrase", "Si l’onglet manque, l’explication la plus probable sur téléphone : il est replié dans « … »."]], "41": [["Axiome", "Axiome 5 — La « Danger Zone », tout en bas, regroupe les réglages risqués."], ["Phrase", "Argument : regrouper les réglages risqués évite les erreurs."]], "42": [["Axiome", "Axiome 2 — Ils se trouvent dans l’onglet « Settings » du dépôt."], ["Phrase", "On le montre en ouvrant l’onglet « Settings »."]], "43": [["Axiome", "Axiome 1 — Les paramètres sont les réglages d’un dépôt.\nAxiome 2 — Ils se trouvent dans l’onglet « Settings » du dépôt.\nAxiome 3 — Seuls le propriétaire du dépôt et ses administrateurs y ont accès.\nAxiome 4 — Ils sont rangés en sections, dans une colonne à gauche.\nAxiome 5 — La « Danger Zone », tout en bas, regroupe les réglages risqués.\nAxiome 6 — Si l’onglet « Settings » n’apparaît pas, je l’ouvre par le menu « … » des onglets.\nAxiome 7 — Pour renommer le dépôt, je change « Repository name », puis je clique sur « Rename »."], ["Phrase", "Sept principes : réglage, onglet, réserve, sections, zone de danger, menu replié, renommage."]], "44": [["Axiome", "Axiome 3 — Seuls le propriétaire du dépôt et ses administrateurs y ont accès."], ["Phrase", "Exclu : un visiteur qui modifie les réglages d’un dépôt qui n’est pas le sien."]], "45": [["Axiome", "Axiome 1 — Les paramètres sont les réglages d’un dépôt.\nAxiome 2 — Ils se trouvent dans l’onglet « Settings » du dépôt.\nAxiome 3 — Seuls le propriétaire du dépôt et ses administrateurs y ont accès.\nAxiome 4 — Ils sont rangés en sections, dans une colonne à gauche.\nAxiome 5 — La « Danger Zone », tout en bas, regroupe les réglages risqués.\nAxiome 6 — Si l’onglet « Settings » n’apparaît pas, je l’ouvre par le menu « … » des onglets.\nAxiome 7 — Pour renommer le dépôt, je change « Repository name », puis je clique sur « Rename »."], ["Phrase", "Les axiomes s’accordent : un onglet réservé, organisé en sections, avec une zone à part."]], "46": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Connaissance sûre, mais l’ordre des sections peut changer."]], "47": [["Axiome", "Axiome 5 — La « Danger Zone », tout en bas, regroupe les réglages risqués."], ["Phrase", "Justification de la « Danger Zone » : certaines actions ne se rattrapent pas."]], "48": [["Axiome", "Axiome 2 — Ils se trouvent dans l’onglet « Settings » du dépôt."], ["Phrase", "Preuve : l’onglet est là."]], "49": [["Axiome", "Axiome 1 — Les paramètres sont les réglages d’un dépôt."], ["Phrase", "Un réglage appartient aux paramètres s’il règle le dépôt."]], "50": [["Axiome", "Axiome 7 — Pour renommer le dépôt, je change « Repository name », puis je clique sur « Rename »."], ["Phrase", "On vérifie un réglage en le changeant puis en regardant l’effet, par exemple le nouveau nom."]], "51": [["Axiome", "Axiome 3 — Seuls le propriétaire du dépôt et ses administrateurs y ont accès."], ["Phrase", "Réfuté si un non-propriétaire voyait « Settings » : impossible."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Certitude élevée."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Aucune hypothèse."]], "54": [["Axiome", "Axiome 4 — Ils sont rangés en sections, dans une colonne à gauche."], ["Phrase", "On les observe en parcourant les sections."]], "55": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Modèle : chaque dépôt a une fiche de réglages, modifiable par ses administrateurs."]], "56": [["Axiome", "Axiome 1 — Les paramètres sont les réglages d’un dépôt."], ["Phrase", "Ce sont des réglages."]], "57": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ils existent dès la création du dépôt, avec des valeurs par défaut."]], "58": [["Axiome", "Axiome 2 — Ils se trouvent dans l’onglet « Settings » du dépôt."], ["Phrase", "Leur identité : l’onglet « Settings » d’un dépôt précis."]], "59": [["Axiome", "Axiome 1 — Les paramètres sont les réglages d’un dépôt."], ["Phrase", "Catégorie : la configuration."]], "60": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Changer un réglage est possible, rarement nécessaire."]], "61": [["Axiome", "Axiome 1 — Les paramètres sont les réglages d’un dépôt."], ["Phrase", "Leur essence : régler."]], "62": [["Axiome", "Axiome 1 — Les paramètres sont les réglages d’un dépôt."], ["Phrase", "Ils s’arrêtent au dépôt : ils ne règlent pas le compte."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ils servent au début d’un projet, puis rarement."]], "64": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On y va pour renommer, changer la visibilité, activer GitHub Pages."]], "65": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Leur nombre a grandi avec les outils de GitHub."]], "66": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les noms des sections sont en anglais."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Domaine : l’administration."]], "68": [["Axiome", "Axiome 3 — Seuls le propriétaire du dépôt et ses administrateurs y ont accès."], ["Phrase", "Ils marquent la différence entre propriétaire et visiteur."]], "69": [["Axiome", "Axiome 2 — Ils se trouvent dans l’onglet « Settings » du dépôt."], ["Phrase · hors axiomes", "Ils ont leur place : `…/dépôt/settings`."]], "70": [["Axiome", "Axiome 1 — Les paramètres sont les réglages d’un dépôt."], ["Phrase", "Leur rôle : régler le dépôt."]], "71": [["Axiome", "Axiome 4 — Ils sont rangés en sections, dans une colonne à gauche."], ["Phrase", "Ils fournissent une section pour chaque outil."]], "72": [["Axiome", "Axiome 7 — Pour renommer le dépôt, je change « Repository name », puis je clique sur « Rename »."], ["Phrase", "Opérations : renommer, changer la visibilité, activer ou désactiver un outil."]], "73": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans l’action : un réglage change le comportement du dépôt."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ils contribuent à adapter le dépôt à son usage."]], "75": [["Axiome", "Axiome 1 — Les paramètres sont les réglages d’un dépôt."], ["Phrase", "Utiles pour adapter le dépôt."]], "76": [["Axiome", "Axiome 7 — Pour renommer le dépôt, je change « Repository name », puis je clique sur « Rename »."], ["Phrase", "Cliquer sur « Rename » renomme le dépôt."]], "77": [["Axiome", "Axiome 2 — Ils se trouvent dans l’onglet « Settings » du dépôt.\nAxiome 4 — Ils sont rangés en sections, dans une colonne à gauche.\nAxiome 7 — Pour renommer le dépôt, je change « Repository name », puis je clique sur « Rename »."], ["Phrase", "Étape par étape : « Settings », la section voulue, le réglage, puis le bouton de validation."]], "78": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ils changent quand on les règle, et quand GitHub ajoute des options."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "De nouvelles sections apparaissent avec les nouveaux outils."]], "80": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un réglage transforme le dépôt : nom, visibilité, publication."]], "81": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ils naissent avec le dépôt."]], "82": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Processus : ouvrir, changer, valider."]], "83": [["Axiome", "Axiome 6 — Si l’onglet « Settings » n’apparaît pas, je l’ouvre par le menu « … » des onglets."], ["Phrase", "Ils s’adaptent à l’écran : l’onglet se replie dans « … » quand la place manque."]], "84": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Leurs états : les valeurs par défaut, puis celles qu’on choisit."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Appréciation : nombreux mais bien rangés."]], "86": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Norme : ne toucher qu’à ce qu’on comprend."]], "87": [["Axiome", "Axiome 5 — La « Danger Zone », tout en bas, regroupe les réglages risqués."], ["Phrase", "Valeur : la prudence, incarnée par la « Danger Zone »."]], "88": [["Axiome", "Axiome 3 — Seuls le propriétaire du dépôt et ses administrateurs y ont accès.\nAxiome 4 — Ils sont rangés en sections, dans une colonne à gauche."], ["Phrase", "Critères : bien rangés, bien protégés."]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Qualité : clairs, mais en anglais."]], "90": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Pertinents pour régler ; inutiles pour modifier des fichiers."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On s’y retrouve mieux en connaissant les deux ou trois sections utiles : General, Pages, Actions."]]}, "vis": {"1": [["Axiome", "Axiome 1 — Un dépôt est public ou privé."], ["Phrase", "La visibilité se compose de deux valeurs possibles : public, privé."]], "2": [["Axiome", "Axiome 1 — Un dépôt est public ou privé."], ["Phrase", "Son élément fondamental : le choix entre public et privé."]], "3": [["Axiome", "Axiome 1 — Un dépôt est public ou privé.\nAxiome 4 — Une étiquette « Public » ou « Private » est affichée à côté du nom du dépôt."], ["Phrase", "Une valeur choisie, affichée par une étiquette à côté du nom."]], "4": [["Axiome", "Axiome 2 — Un dépôt public peut être lu par tout le monde.\nAxiome 3 — Un dépôt privé ne peut être lu que par son propriétaire et les personnes qu’il invite."], ["Phrase", "Elle se décompose en deux cercles de lecteurs : tout le monde, ou le propriétaire et ses invités."]], "5": [["Axiome", "Axiome 1 — Un dépôt est public ou privé."], ["Phrase · hors axiomes", "Deux valeurs pour un compte personnel ; les entreprises en ont une troisième, « Internal »."]], "6": [["Axiome", "Axiome 2 — Un dépôt public peut être lu par tout le monde.\nAxiome 3 — Un dépôt privé ne peut être lu que par son propriétaire et les personnes qu’il invite."], ["Phrase", "Nature de chaque valeur : une permission de lecture."]], "7": [["Axiome", "Axiome 1 — Un dépôt est public ou privé.\nAxiome 2 — Un dépôt public peut être lu par tout le monde.\nAxiome 3 — Un dépôt privé ne peut être lu que par son propriétaire et les personnes qu’il invite."], ["Phrase", "La visibilité dit qui peut lire un dépôt."]], "8": [["Axiome", "Axiome 1 — Un dépôt est public ou privé.\nAxiome 2 — Un dépôt public peut être lu par tout le monde.\nAxiome 3 — Un dépôt privé ne peut être lu que par son propriétaire et les personnes qu’il invite."], ["Phrase", "La visibilité d’un dépôt est publique, lisible par tous, ou privée, lisible par le propriétaire et ses invités."]], "9": [["Axiome", "Axiome 1 — Un dépôt est public ou privé.\nAxiome 4 — Une étiquette « Public » ou « Private » est affichée à côté du nom du dépôt.\nAxiome 5 — La visibilité se choisit à la création du dépôt et peut changer ensuite."], ["Phrase", "Deux valeurs, une étiquette, un choix qui peut changer."]], "10": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Public : un site, un outil partagé ; privé : un brouillon, des notes personnelles."]], "11": [["Axiome", "Axiome 4 — Une étiquette « Public » ou « Private » est affichée à côté du nom du dépôt."], ["Phrase", "En anglais : visibility ; les valeurs « Public » et « Private »."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Visibilité » : la qualité de ce qui peut être vu."]], "13": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Public ne veut pas dire modifiable par tous : seulement lisible."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Visibilité » désigne aussi la notoriété ; ici, c’est le droit de lire."]], "15": [["Axiome", "Axiome 4 — Une étiquette « Public » ou « Private » est affichée à côté du nom du dépôt."], ["Phrase", "L’étiquette se place juste à côté du nom du dépôt."]], "16": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le privé est plus restreint que le public."]], "17": [["Axiome", "Axiome 1 — Un dépôt est public ou privé.\nAxiome 4 — Une étiquette « Public » ou « Private » est affichée à côté du nom du dépôt."], ["Phrase", "Vue d’ensemble : un réglage à deux valeurs, visible d’un coup d’œil."]], "18": [["Axiome", "Axiome 4 — Une étiquette « Public » ou « Private » est affichée à côté du nom du dépôt."], ["Phrase", "L’étiquette « Public » ou « Private », à côté du nom."]], "19": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle se range parmi les droits d’accès."]], "20": [["Axiome", "Axiome 1 — Un dépôt est public ou privé."], ["Phrase", "Deux types de dépôts : publics et privés."]], "21": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Chaque dépôt a sa propre visibilité, indépendante des autres."]], "22": [["Axiome", "Axiome 2 — Un dépôt public peut être lu par tout le monde.\nAxiome 3 — Un dépôt privé ne peut être lu que par son propriétaire et les personnes qu’il invite."], ["Phrase", "Elle relie un dépôt à ceux qui peuvent le lire."]], "23": [["Axiome", "Axiome 1 — Un dépôt est public ou privé.\nAxiome 2 — Un dépôt public peut être lu par tout le monde.\nAxiome 3 — Un dépôt privé ne peut être lu que par son propriétaire et les personnes qu’il invite."], ["Phrase", "Un dépôt n’étant que public ou privé, il est soit lisible par tous, soit par un cercle restreint."]], "24": [["Axiome", "Axiome 6 — Pour la changer, j’ouvre les paramètres, puis « Change visibility » dans la « Danger Zone »."], ["Phrase", "Changer la visibilité change aussitôt qui peut lire."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les dépôts qui publient un site gratuit sont publics."]], "26": [["Axiome", "Axiome 2 — Un dépôt public peut être lu par tout le monde.\nAxiome 3 — Un dépôt privé ne peut être lu que par son propriétaire et les personnes qu’il invite."], ["Phrase", "Sa fonction : contrôler la lecture."]], "27": [["Axiome", "Axiome 5 — La visibilité se choisit à la création du dépôt et peut changer ensuite."], ["Phrase", "Elle dépend d’un choix fait à la création, puis modifiable."]], "28": [["Axiome", "Axiome 2 — Un dépôt public peut être lu par tout le monde.\nAxiome 3 — Un dépôt privé ne peut être lu que par son propriétaire et les personnes qu’il invite."], ["Phrase", "Public et privé s’opposent."]], "29": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le public partage, le privé protège : on choisit selon le projet."]], "30": [["Axiome", "Axiome 3 — Un dépôt privé ne peut être lu que par son propriétaire et les personnes qu’il invite."], ["Phrase", "Pour lire un dépôt privé, il faut y être invité."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Comme une porte ouverte ou fermée à clé."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Rendre privé un dépôt public coupe l’accès aux visiteurs, et aux sites qu’il publie sur un compte gratuit."]], "33": [["Axiome", "Axiome 5 — La visibilité se choisit à la création du dépôt et peut changer ensuite."], ["Phrase", "D’abord choisie à la création, elle peut changer ensuite."]], "34": [["Axiome", "Axiome 4 — Une étiquette « Public » ou « Private » est affichée à côté du nom du dépôt."], ["Phrase", "Elle s’affiche à côté du nom."]], "35": [["Axiome", "Axiome 1 — Un dépôt est public ou privé.\nAxiome 2 — Un dépôt public peut être lu par tout le monde.\nAxiome 3 — Un dépôt privé ne peut être lu que par son propriétaire et les personnes qu’il invite.\nAxiome 4 — Une étiquette « Public » ou « Private » est affichée à côté du nom du dépôt.\nAxiome 5 — La visibilité se choisit à la création du dépôt et peut changer ensuite.\nAxiome 6 — Pour la changer, j’ouvre les paramètres, puis « Change visibility » dans la « Danger Zone ».\nAxiome 7 — GitHub me demande de confirmer avant de changer la visibilité."], ["Phrase", "Sept propositions : deux valeurs ; public pour tous ; privé pour le cercle ; étiquette ; choix modifiable ; « Change visibility » ; confirmation."]], "36": [["Axiome", "Axiome 2 — Un dépôt public peut être lu par tout le monde.\nAxiome 3 — Un dépôt privé ne peut être lu que par son propriétaire et les personnes qu’il invite."], ["Phrase", "On dit d’un dépôt qu’il est public ou qu’il est privé."]], "37": [["Axiome", "Axiome 3 — Un dépôt privé ne peut être lu que par son propriétaire et les personnes qu’il invite.\nAxiome 4 — Une étiquette « Public » ou « Private » est affichée à côté du nom du dépôt."], ["Phrase", "Si l’étiquette dit « Private », un inconnu ne verra pas le dépôt."]], "38": [["Axiome", "Axiome 1 — Un dépôt est public ou privé."], ["Phrase", "Conséquence nécessaire : un dépôt a toujours une visibilité."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La plupart des projets partagés sont publics."]], "40": [["Axiome", "Axiome 3 — Un dépôt privé ne peut être lu que par son propriétaire et les personnes qu’il invite."], ["Phrase", "Si une adresse de dépôt donne une erreur 404 à un ami, c’est sans doute qu’il est privé."]], "41": [["Axiome", "Axiome 7 — GitHub me demande de confirmer avant de changer la visibilité."], ["Phrase", "Argument pour la confirmation : un changement de visibilité a des conséquences."]], "42": [["Axiome", "Axiome 4 — Une étiquette « Public » ou « Private » est affichée à côté du nom du dépôt."], ["Phrase", "On le montre par l’étiquette."]], "43": [["Axiome", "Axiome 1 — Un dépôt est public ou privé.\nAxiome 2 — Un dépôt public peut être lu par tout le monde.\nAxiome 3 — Un dépôt privé ne peut être lu que par son propriétaire et les personnes qu’il invite.\nAxiome 4 — Une étiquette « Public » ou « Private » est affichée à côté du nom du dépôt.\nAxiome 5 — La visibilité se choisit à la création du dépôt et peut changer ensuite.\nAxiome 6 — Pour la changer, j’ouvre les paramètres, puis « Change visibility » dans la « Danger Zone ».\nAxiome 7 — GitHub me demande de confirmer avant de changer la visibilité."], ["Phrase", "Sept principes : le choix, ses deux sens, l’étiquette, le changement et sa confirmation."]], "44": [["Axiome", "Axiome 1 — Un dépôt est public ou privé."], ["Phrase", "Exclu : un dépôt à la fois public et privé."]], "45": [["Axiome", "Axiome 1 — Un dépôt est public ou privé.\nAxiome 2 — Un dépôt public peut être lu par tout le monde.\nAxiome 3 — Un dépôt privé ne peut être lu que par son propriétaire et les personnes qu’il invite.\nAxiome 4 — Une étiquette « Public » ou « Private » est affichée à côté du nom du dépôt.\nAxiome 5 — La visibilité se choisit à la création du dépôt et peut changer ensuite.\nAxiome 6 — Pour la changer, j’ouvre les paramètres, puis « Change visibility » dans la « Danger Zone ».\nAxiome 7 — GitHub me demande de confirmer avant de changer la visibilité."], ["Phrase", "Les axiomes s’accordent."]], "46": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Connaissance sûre."]], "47": [["Axiome", "Axiome 3 — Un dépôt privé ne peut être lu que par son propriétaire et les personnes qu’il invite."], ["Phrase", "Justification du privé : certains projets ne regardent que leur propriétaire."]], "48": [["Axiome", "Axiome 4 — Une étiquette « Public » ou « Private » est affichée à côté du nom du dépôt."], ["Phrase", "Preuve : l’étiquette."]], "49": [["Axiome", "Axiome 2 — Un dépôt public peut être lu par tout le monde."], ["Phrase", "Un dépôt est public si tout le monde peut le lire."]], "50": [["Axiome", "Axiome 2 — Un dépôt public peut être lu par tout le monde."], ["Phrase", "On le vérifie en ouvrant son adresse sans être connecté."]], "51": [["Axiome", "Axiome 3 — Un dépôt privé ne peut être lu que par son propriétaire et les personnes qu’il invite."], ["Phrase", "Réfuté si un inconnu lisait un dépôt privé."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Certitude élevée."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Aucune hypothèse."]], "54": [["Axiome", "Axiome 4 — Une étiquette « Public » ou « Private » est affichée à côté du nom du dépôt."], ["Phrase", "On l’observe à l’étiquette."]], "55": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Modèle : une liste de personnes autorisées, qui vaut « tout le monde » pour un dépôt public."]], "56": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "C’est un réglage de droits."]], "57": [["Axiome", "Axiome 5 — La visibilité se choisit à la création du dépôt et peut changer ensuite."], ["Phrase", "Elle existe dès la création du dépôt."]], "58": [["Axiome", "Axiome 1 — Un dépôt est public ou privé."], ["Phrase", "Son identité : sa valeur, public ou privé."]], "59": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Catégorie : les droits d’accès."]], "60": [["Axiome", "Axiome 5 — La visibilité se choisit à la création du dépôt et peut changer ensuite."], ["Phrase", "Public ou privé, aucun n’est obligatoire ; on peut changer."]], "61": [["Axiome", "Axiome 2 — Un dépôt public peut être lu par tout le monde.\nAxiome 3 — Un dépôt privé ne peut être lu que par son propriétaire et les personnes qu’il invite."], ["Phrase", "Son essence : qui peut lire."]], "62": [["Axiome", "Axiome 2 — Un dépôt public peut être lu par tout le monde."], ["Phrase · hors axiomes", "Elle ne règle que la lecture : public ne donne pas le droit de modifier."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle prend son sens selon ce que contient le dépôt."]], "64": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On la change quand un projet passe de brouillon à publication, ou l’inverse."]], "65": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "GitHub a rendu les dépôts privés gratuits en 2019."]], "66": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le public correspond à la culture du partage du logiciel libre."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Domaine : la sécurité et le partage."]], "68": [["Axiome", "Axiome 3 — Un dépôt privé ne peut être lu que par son propriétaire et les personnes qu’il invite."], ["Phrase", "Elle trace un cercle : ceux qui lisent, ceux qui ne lisent pas."]], "69": [["Axiome", "Axiome 4 — Une étiquette « Public » ou « Private » est affichée à côté du nom du dépôt."], ["Phrase", "Elle se voit à côté du nom."]], "70": [["Axiome", "Axiome 2 — Un dépôt public peut être lu par tout le monde.\nAxiome 3 — Un dépôt privé ne peut être lu que par son propriétaire et les personnes qu’il invite."], ["Phrase", "Son rôle : choisir qui lit."]], "71": [["Axiome", "Axiome 6 — Pour la changer, j’ouvre les paramètres, puis « Change visibility » dans la « Danger Zone »."], ["Phrase", "Elle fournit un moyen de partager ou de protéger."]], "72": [["Axiome", "Axiome 6 — Pour la changer, j’ouvre les paramètres, puis « Change visibility » dans la « Danger Zone »."], ["Phrase", "Opération : rendre public, rendre privé."]], "73": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans l’action : un dépôt public peut être montré à tous par un simple lien."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle contribue à partager ce qui doit l’être et à garder le reste."]], "75": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Utile pour publier un site gratuit, ou garder des notes pour soi."]], "76": [["Axiome", "Axiome 6 — Pour la changer, j’ouvre les paramètres, puis « Change visibility » dans la « Danger Zone ».\nAxiome 7 — GitHub me demande de confirmer avant de changer la visibilité."], ["Phrase", "Confirmer « Change visibility » change qui peut lire."]], "77": [["Axiome", "Axiome 6 — Pour la changer, j’ouvre les paramètres, puis « Change visibility » dans la « Danger Zone ».\nAxiome 7 — GitHub me demande de confirmer avant de changer la visibilité."], ["Phrase", "Étape par étape : « Settings », « Danger Zone », « Change visibility », choix, confirmation."]], "78": [["Axiome", "Axiome 5 — La visibilité se choisit à la création du dépôt et peut changer ensuite."], ["Phrase", "Elle change quand on la change, et seulement alors."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un dépôt passe souvent de privé à public quand il est prêt."]], "80": [["Axiome", "Axiome 5 — La visibilité se choisit à la création du dépôt et peut changer ensuite."], ["Phrase", "Le passage d’une valeur à l’autre transforme l’accès."]], "81": [["Axiome", "Axiome 5 — La visibilité se choisit à la création du dépôt et peut changer ensuite."], ["Phrase", "Elle naît du choix à la création."]], "82": [["Axiome", "Axiome 7 — GitHub me demande de confirmer avant de changer la visibilité."], ["Phrase", "Processus : choisir, confirmer."]], "83": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On peut inviter quelqu’un sur un dépôt privé plutôt que de le rendre public."]], "84": [["Axiome", "Axiome 1 — Un dépôt est public ou privé."], ["Phrase", "États : public, privé."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Appréciation : simple et essentielle."]], "86": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Norme : ne jamais mettre de mot de passe ou de donnée personnelle dans un dépôt public."]], "87": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Valeurs : ouverture d’un côté, confidentialité de l’autre."]], "88": [["Axiome", "Axiome 2 — Un dépôt public peut être lu par tout le monde.\nAxiome 3 — Un dépôt privé ne peut être lu que par son propriétaire et les personnes qu’il invite."], ["Phrase", "Critère : qui doit pouvoir lire ?"]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Bon choix : public pour ce qu’on publie, privé pour ce qu’on garde."]], "90": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Pertinente pour chaque dépôt, à la création."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’améliore en vérifiant qu’aucun fichier privé ne traîne dans un dépôt public."]]}, "fic": {"1": [["Axiome", "Axiome 1 — Un dépôt contient des fichiers, rangés dans des dossiers.\nAxiome 4 — La fin du nom d’un fichier, l’extension, dit son type : `.html`, `.md`, `.png`."], ["Phrase", "Un fichier se compose d’un nom, terminé par son extension, et d’un contenu."]], "2": [["Axiome", "Axiome 1 — Un dépôt contient des fichiers, rangés dans des dossiers."], ["Phrase", "Les éléments fondamentaux d’un dépôt : ses fichiers, et les dossiers qui les rangent."]], "3": [["Axiome", "Axiome 1 — Un dépôt contient des fichiers, rangés dans des dossiers."], ["Phrase", "Fichiers et dossiers s’emboîtent : un dossier contient des fichiers et d’autres dossiers."]], "4": [["Axiome", "Axiome 1 — Un dépôt contient des fichiers, rangés dans des dossiers."], ["Phrase", "Le dépôt se décompose en dossiers, les dossiers en fichiers."]], "5": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un fichier importé depuis le site peut peser jusqu’à 25 Mo."]], "6": [["Axiome", "Axiome 4 — La fin du nom d’un fichier, l’extension, dit son type : `.html`, `.md`, `.png`."], ["Phrase", "Leur nature varie : page web, texte, image, selon l’extension."]], "7": [["Axiome", "Axiome 1 — Un dépôt contient des fichiers, rangés dans des dossiers.\nAxiome 3 — Cliquer sur un fichier affiche son contenu."], ["Phrase", "Un fichier, c’est un contenu rangé dans le dépôt, qu’on ouvre pour le lire."]], "8": [["Axiome", "Axiome 1 — Un dépôt contient des fichiers, rangés dans des dossiers.\nAxiome 4 — La fin du nom d’un fichier, l’extension, dit son type : `.html`, `.md`, `.png`."], ["Phrase", "Un fichier est un contenu nommé, rangé dans un dépôt, dont l’extension dit le type."]], "9": [["Axiome", "Axiome 1 — Un dépôt contient des fichiers, rangés dans des dossiers.\nAxiome 3 — Cliquer sur un fichier affiche son contenu.\nAxiome 4 — La fin du nom d’un fichier, l’extension, dit son type : `.html`, `.md`, `.png`."], ["Phrase", "Être rangé, s’ouvrir, avoir un type : ses propriétés."]], "10": [["Axiome", "Axiome 4 — La fin du nom d’un fichier, l’extension, dit son type : `.html`, `.md`, `.png`."], ["Phrase", "`index.html` (une page), `README.md` (un texte), `icon-512.png` (une image)."]], "11": [["Axiome", "Axiome 4 — La fin du nom d’un fichier, l’extension, dit son type : `.html`, `.md`, `.png`."], ["Phrase · hors axiomes", "En anglais : file, folder ; « extension » se dit pareil."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Fichier » vient de « fiche » : on y range des informations."]], "13": [["Axiome", "Axiome 4 — La fin du nom d’un fichier, l’extension, dit son type : `.html`, `.md`, `.png`."], ["Phrase", "Un même contenu peut être lu comme texte ou comme page, selon son extension."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Fichier » désigne aussi un registre administratif ; ici, un document numérique."]], "15": [["Axiome", "Axiome 1 — Un dépôt contient des fichiers, rangés dans des dossiers."], ["Phrase", "Organisation : une arborescence de dossiers et de fichiers."]], "16": [["Axiome", "Axiome 1 — Un dépôt contient des fichiers, rangés dans des dossiers."], ["Phrase", "Hiérarchie : dépôt, dossiers, sous-dossiers, fichiers."]], "17": [["Axiome", "Axiome 1 — Un dépôt contient des fichiers, rangés dans des dossiers.\nAxiome 2 — L’onglet « Code » affiche la liste des fichiers."], ["Phrase", "Vue d’ensemble : la liste de l’onglet « Code », dossiers d’abord, puis fichiers."]], "18": [["Axiome", "Axiome 2 — L’onglet « Code » affiche la liste des fichiers."], ["Phrase · hors axiomes", "Les dossiers apparaissent en premier, puis les fichiers, par ordre alphabétique."]], "19": [["Axiome", "Axiome 4 — La fin du nom d’un fichier, l’extension, dit son type : `.html`, `.md`, `.png`."], ["Phrase", "On les classe par type, grâce à l’extension."]], "20": [["Axiome", "Axiome 4 — La fin du nom d’un fichier, l’extension, dit son type : `.html`, `.md`, `.png`."], ["Phrase", "Types courants : `.html` page, `.md` texte mis en forme, `.png` image, `.json` données."]], "21": [["Axiome", "Axiome 1 — Un dépôt contient des fichiers, rangés dans des dossiers."], ["Phrase", "Chaque fichier est une unité : il s’ouvre, se modifie, se supprime seul."]], "22": [["Axiome", "Axiome 1 — Un dépôt contient des fichiers, rangés dans des dossiers."], ["Phrase", "Un fichier est lié au dossier qui le contient."]], "23": [["Axiome", "Axiome 4 — La fin du nom d’un fichier, l’extension, dit son type : `.html`, `.md`, `.png`."], ["Phrase", "Puisque l’extension dit le type, renommer `.html` en `.md` change la façon de l’afficher."]], "24": [["Axiome", "Axiome 5 — Pour modifier un fichier, je clique sur le crayon, en haut à droite du fichier."], ["Phrase", "Modifier un fichier produit un changement à enregistrer."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un dossier qui contient `index.html` est souvent un site."]], "26": [["Axiome", "Axiome 1 — Un dépôt contient des fichiers, rangés dans des dossiers."], ["Phrase", "Sa fonction : contenir une partie du projet."]], "27": [["Axiome", "Axiome 1 — Un dépôt contient des fichiers, rangés dans des dossiers."], ["Phrase", "Un fichier dépend de son dossier ; supprimer le dossier supprime ses fichiers."]], "28": [["Axiome", "Axiome 1 — Un dépôt contient des fichiers, rangés dans des dossiers."], ["Phrase", "Le fichier s’oppose au dossier : l’un contient du contenu, l’autre des fichiers."]], "29": [["Axiome", "Axiome 5 — Pour modifier un fichier, je clique sur le crayon, en haut à droite du fichier.\nAxiome 6 — Pour créer un fichier, je clique sur « Add file », puis sur « Create new file ».\nAxiome 7 — Pour importer un fichier de mon appareil, je clique sur « Add file », puis sur « Upload files »."], ["Phrase", "Créer, importer, modifier : trois gestes complémentaires."]], "30": [["Axiome", "Axiome 5 — Pour modifier un fichier, je clique sur le crayon, en haut à droite du fichier."], ["Phrase · hors axiomes", "Le crayon n’apparaît que si l’on a le droit de modifier."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Comme sur un ordinateur, mais en ligne et avec un historique."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un fichier peut en appeler un autre : `index.html` affiche `icon-512.png`."]], "33": [["Axiome", "Axiome 3 — Cliquer sur un fichier affiche son contenu."], ["Phrase", "On l’ouvre, puis on le lit."]], "34": [["Axiome", "Axiome 5 — Pour modifier un fichier, je clique sur le crayon, en haut à droite du fichier."], ["Phrase", "Le crayon est en haut à droite du fichier ouvert."]], "35": [["Axiome", "Axiome 1 — Un dépôt contient des fichiers, rangés dans des dossiers.\nAxiome 2 — L’onglet « Code » affiche la liste des fichiers.\nAxiome 3 — Cliquer sur un fichier affiche son contenu.\nAxiome 4 — La fin du nom d’un fichier, l’extension, dit son type : `.html`, `.md`, `.png`.\nAxiome 5 — Pour modifier un fichier, je clique sur le crayon, en haut à droite du fichier.\nAxiome 6 — Pour créer un fichier, je clique sur « Add file », puis sur « Create new file ».\nAxiome 7 — Pour importer un fichier de mon appareil, je clique sur « Add file », puis sur « Upload files »."], ["Phrase", "Sept propositions : rangés en dossiers ; listés dans « Code » ; ouverts d’un clic ; typés par l’extension ; crayon ; « Create new file » ; « Upload files »."]], "36": [["Axiome", "Axiome 4 — La fin du nom d’un fichier, l’extension, dit son type : `.html`, `.md`, `.png`."], ["Phrase", "On dit d’un fichier qu’il a un type."]], "37": [["Axiome", "Axiome 4 — La fin du nom d’un fichier, l’extension, dit son type : `.html`, `.md`, `.png`."], ["Phrase", "Si un nom finit par `.png`, c’est une image."]], "38": [["Axiome", "Axiome 1 — Un dépôt contient des fichiers, rangés dans des dossiers."], ["Phrase", "Conséquence nécessaire : tout fichier est quelque part dans l’arborescence."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les sites ont presque tous un `index.html` : c’est la règle."]], "40": [["Axiome", "Axiome 4 — La fin du nom d’un fichier, l’extension, dit son type : `.html`, `.md`, `.png`."], ["Phrase", "Un fichier qui s’affiche en code brut est sans doute du texte, pas une image."]], "41": [["Axiome", "Axiome 5 — Pour modifier un fichier, je clique sur le crayon, en haut à droite du fichier."], ["Phrase", "Argument : on modifie sur le site, sans rien installer."]], "42": [["Axiome", "Axiome 3 — Cliquer sur un fichier affiche son contenu."], ["Phrase", "On montre son contenu en l’ouvrant."]], "43": [["Axiome", "Axiome 1 — Un dépôt contient des fichiers, rangés dans des dossiers.\nAxiome 2 — L’onglet « Code » affiche la liste des fichiers.\nAxiome 3 — Cliquer sur un fichier affiche son contenu.\nAxiome 4 — La fin du nom d’un fichier, l’extension, dit son type : `.html`, `.md`, `.png`.\nAxiome 5 — Pour modifier un fichier, je clique sur le crayon, en haut à droite du fichier.\nAxiome 6 — Pour créer un fichier, je clique sur « Add file », puis sur « Create new file ».\nAxiome 7 — Pour importer un fichier de mon appareil, je clique sur « Add file », puis sur « Upload files »."], ["Phrase", "Sept principes : rangement, liste, ouverture, type, modification, création, import."]], "44": [["Axiome", "Axiome 1 — Un dépôt contient des fichiers, rangés dans des dossiers."], ["Phrase", "Exclu : un fichier hors de tout dépôt sur GitHub."]], "45": [["Axiome", "Axiome 1 — Un dépôt contient des fichiers, rangés dans des dossiers.\nAxiome 2 — L’onglet « Code » affiche la liste des fichiers.\nAxiome 3 — Cliquer sur un fichier affiche son contenu.\nAxiome 4 — La fin du nom d’un fichier, l’extension, dit son type : `.html`, `.md`, `.png`.\nAxiome 5 — Pour modifier un fichier, je clique sur le crayon, en haut à droite du fichier.\nAxiome 6 — Pour créer un fichier, je clique sur « Add file », puis sur « Create new file ».\nAxiome 7 — Pour importer un fichier de mon appareil, je clique sur « Add file », puis sur « Upload files »."], ["Phrase", "Les axiomes s’accordent."]], "46": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Connaissance sûre."]], "47": [["Axiome", "Axiome 4 — La fin du nom d’un fichier, l’extension, dit son type : `.html`, `.md`, `.png`."], ["Phrase", "Justification de l’extension : savoir comment afficher le fichier."]], "48": [["Axiome", "Axiome 3 — Cliquer sur un fichier affiche son contenu."], ["Phrase", "Preuve : son contenu s’affiche."]], "49": [["Axiome", "Axiome 1 — Un dépôt contient des fichiers, rangés dans des dossiers."], ["Phrase", "Un fichier est dans le dépôt s’il apparaît dans sa liste."]], "50": [["Axiome", "Axiome 2 — L’onglet « Code » affiche la liste des fichiers."], ["Phrase", "On vérifie sa présence dans l’onglet « Code »."]], "51": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Réfuté si la liste ne le montre pas : il n’existe pas sur cette branche."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Certitude élevée."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Aucune hypothèse."]], "54": [["Axiome", "Axiome 3 — Cliquer sur un fichier affiche son contenu."], ["Phrase", "On l’observe en l’ouvrant."]], "55": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Modèle : un arbre, des dossiers pour branches, des fichiers pour feuilles."]], "56": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "C’est un document numérique."]], "57": [["Axiome", "Axiome 6 — Pour créer un fichier, je clique sur « Add file », puis sur « Create new file ».\nAxiome 7 — Pour importer un fichier de mon appareil, je clique sur « Add file », puis sur « Upload files »."], ["Phrase", "Il existe dès qu’on le crée ou l’importe."]], "58": [["Axiome", "Axiome 1 — Un dépôt contient des fichiers, rangés dans des dossiers."], ["Phrase · hors axiomes", "Son identité : son chemin, dossiers et nom, comme `github/index.html`."]], "59": [["Axiome", "Axiome 4 — La fin du nom d’un fichier, l’extension, dit son type : `.html`, `.md`, `.png`."], ["Phrase", "Catégorie : selon son extension."]], "60": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un dossier vide n’existe pas dans Git : il faut au moins un fichier dedans."]], "61": [["Axiome", "Axiome 1 — Un dépôt contient des fichiers, rangés dans des dossiers."], ["Phrase", "Son essence : un contenu rangé."]], "62": [["Axiome", "Axiome 1 — Un dépôt contient des fichiers, rangés dans des dossiers."], ["Phrase", "Il s’arrête à son contenu."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il prend son sens dans le projet : une page, une image, un réglage."]], "64": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On le modifie pour corriger, compléter, mettre à jour."]], "65": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Chaque fichier garde toutes ses versions passées."]], "66": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les noms de fichiers évitent souvent espaces et accents."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Domaine : l’informatique."]], "68": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Plusieurs personnes peuvent modifier le même fichier, l’une après l’autre."]], "69": [["Axiome", "Axiome 1 — Un dépôt contient des fichiers, rangés dans des dossiers."], ["Phrase", "Il a une place : son dossier."]], "70": [["Axiome", "Axiome 1 — Un dépôt contient des fichiers, rangés dans des dossiers."], ["Phrase", "Son rôle : porter une partie du projet."]], "71": [["Axiome", "Axiome 5 — Pour modifier un fichier, je clique sur le crayon, en haut à droite du fichier.\nAxiome 6 — Pour créer un fichier, je clique sur « Add file », puis sur « Create new file ».\nAxiome 7 — Pour importer un fichier de mon appareil, je clique sur « Add file », puis sur « Upload files »."], ["Phrase", "Le site fournit trois moyens : modifier, créer, importer."]], "72": [["Axiome", "Axiome 5 — Pour modifier un fichier, je clique sur le crayon, en haut à droite du fichier.\nAxiome 6 — Pour créer un fichier, je clique sur « Add file », puis sur « Create new file ».\nAxiome 7 — Pour importer un fichier de mon appareil, je clique sur « Add file », puis sur « Upload files »."], ["Phrase", "Opérations : ouvrir, modifier, créer, importer, renommer, supprimer."]], "73": [["Axiome", "Axiome 5 — Pour modifier un fichier, je clique sur le crayon, en haut à droite du fichier."], ["Phrase", "Dans l’action : on corrige une page directement depuis le navigateur."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il contribue à construire le projet, fichier par fichier."]], "75": [["Axiome", "Axiome 3 — Cliquer sur un fichier affiche son contenu.\nAxiome 5 — Pour modifier un fichier, je clique sur le crayon, en haut à droite du fichier."], ["Phrase", "Utile : lire et corriger sans ordinateur particulier."]], "76": [["Axiome", "Axiome 6 — Pour créer un fichier, je clique sur « Add file », puis sur « Create new file »."], ["Phrase · hors axiomes", "Pour créer un dossier, on tape son nom suivi de `/` dans le nom du nouveau fichier."]], "77": [["Axiome", "Axiome 5 — Pour modifier un fichier, je clique sur le crayon, en haut à droite du fichier."], ["Phrase", "Étape par étape : ouvrir le fichier, crayon, modifier, puis enregistrer."]], "78": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il change à chaque modification enregistrée."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il évolue de version en version."]], "80": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il peut être renommé ou déplacé : son chemin change, son historique reste."]], "81": [["Axiome", "Axiome 6 — Pour créer un fichier, je clique sur « Add file », puis sur « Create new file ».\nAxiome 7 — Pour importer un fichier de mon appareil, je clique sur « Add file », puis sur « Upload files »."], ["Phrase", "Il naît par création ou par import."]], "82": [["Axiome", "Axiome 5 — Pour modifier un fichier, je clique sur le crayon, en haut à droite du fichier."], ["Phrase", "Processus : ouvrir, modifier, enregistrer."]], "83": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "L’éditeur du site colore le code selon l’extension."]], "84": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ses états successifs sont ses versions."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Appréciation : la matière première du dépôt."]], "86": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Norme : noms en minuscules, sans espaces, avec la bonne extension."]], "87": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Valeur : un projet rangé est un projet lisible."]], "88": [["Axiome", "Axiome 1 — Un dépôt contient des fichiers, rangés dans des dossiers.\nAxiome 4 — La fin du nom d’un fichier, l’extension, dit son type : `.html`, `.md`, `.png`."], ["Phrase", "Critères : bien rangé, bien nommé."]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un bon fichier a un nom qui dit ce qu’il contient."]], "90": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Pertinent s’il sert le projet ; sinon, à supprimer."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On améliore un dépôt en rangeant les fichiers dans des dossiers parlants."]]}, "com": {"1": [["Axiome", "Axiome 1 — Un commit enregistre un ou plusieurs changements dans le dépôt.\nAxiome 3 — Un commit porte un message qui décrit le changement.\nAxiome 4 — Il garde son auteur et sa date.\nAxiome 5 — Il a un identifiant unique, souvent abrégé à sept caractères, comme `bd46bc0`."], ["Phrase", "Un commit se compose de changements, d’un message, d’un auteur, d’une date et d’un identifiant."]], "2": [["Axiome", "Axiome 1 — Un commit enregistre un ou plusieurs changements dans le dépôt."], ["Phrase", "Son élément fondamental : le changement enregistré."]], "3": [["Axiome", "Axiome 1 — Un commit enregistre un ou plusieurs changements dans le dépôt.\nAxiome 3 — Un commit porte un message qui décrit le changement."], ["Phrase", "Un ou plusieurs changements, réunis sous un message qui les décrit."]], "4": [["Axiome", "Axiome 1 — Un commit enregistre un ou plusieurs changements dans le dépôt."], ["Phrase", "Il se décompose en changements, fichier par fichier, ligne par ligne."]], "5": [["Axiome", "Axiome 1 — Un commit enregistre un ou plusieurs changements dans le dépôt."], ["Phrase", "Un commit contient un changement ou plusieurs."]], "6": [["Axiome", "Axiome 2 — Chaque commit crée une nouvelle version du dépôt."], ["Phrase", "Sa nature : une version du dépôt."]], "7": [["Axiome", "Axiome 1 — Un commit enregistre un ou plusieurs changements dans le dépôt.\nAxiome 2 — Chaque commit crée une nouvelle version du dépôt."], ["Phrase", "Un commit, c’est l’enregistrement d’un changement : une version de plus."]], "8": [["Axiome", "Axiome 1 — Un commit enregistre un ou plusieurs changements dans le dépôt.\nAxiome 2 — Chaque commit crée une nouvelle version du dépôt."], ["Phrase", "Un commit enregistre un ou plusieurs changements dans le dépôt et crée ainsi une nouvelle version."]], "9": [["Axiome", "Axiome 2 — Chaque commit crée une nouvelle version du dépôt.\nAxiome 3 — Un commit porte un message qui décrit le changement.\nAxiome 4 — Il garde son auteur et sa date.\nAxiome 5 — Il a un identifiant unique, souvent abrégé à sept caractères, comme `bd46bc0`."], ["Phrase", "Créer une version, porter un message, un auteur, une date, un identifiant."]], "10": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Corriger une faute, ajouter une page, changer une couleur : chacun peut faire un commit."]], "11": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le mot anglais est gardé ; on dit « faire un commit » ou « commiter »."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« To commit » : s’engager, confier ; on confie le changement au dépôt."]], "13": [["Axiome", "Axiome 3 — Un commit porte un message qui décrit le changement."], ["Phrase", "Un commit se lit d’abord par son message."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Commit » désigne l’enregistrement, mais aussi l’acte d’enregistrer."]], "15": [["Axiome", "Axiome 3 — Un commit porte un message qui décrit le changement.\nAxiome 4 — Il garde son auteur et sa date.\nAxiome 5 — Il a un identifiant unique, souvent abrégé à sept caractères, comme `bd46bc0`."], ["Phrase", "Organisation : en tête le message, puis l’auteur, la date et l’identifiant, puis les changements."]], "16": [["Axiome", "Axiome 2 — Chaque commit crée une nouvelle version du dépôt."], ["Phrase", "Chaque commit vient après le précédent et en dépend."]], "17": [["Axiome", "Axiome 1 — Un commit enregistre un ou plusieurs changements dans le dépôt.\nAxiome 2 — Chaque commit crée une nouvelle version du dépôt."], ["Phrase", "Vue d’ensemble : des changements regroupés, qui forment une version."]], "18": [["Axiome", "Axiome 7 — J’écris le message dans « Commit message », puis je clique sur « Commit changes »."], ["Phrase", "La fenêtre : le champ « Commit message » en haut, le bouton « Commit changes » en bas."]], "19": [["Axiome", "Axiome 2 — Chaque commit crée une nouvelle version du dépôt."], ["Phrase", "Il se range parmi les versions."]], "20": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Types : commit direct sur la branche, ou commit sur une nouvelle branche."]], "21": [["Axiome", "Axiome 1 — Un commit enregistre un ou plusieurs changements dans le dépôt."], ["Phrase", "Chaque commit forme une unité qu’on peut consulter seule."]], "22": [["Axiome", "Axiome 2 — Chaque commit crée une nouvelle version du dépôt."], ["Phrase", "Chaque commit est lié au commit précédent."]], "23": [["Axiome", "Axiome 1 — Un commit enregistre un ou plusieurs changements dans le dépôt.\nAxiome 2 — Chaque commit crée une nouvelle version du dépôt."], ["Phrase", "Puisqu’il enregistre des changements, il crée une version qui les contient."]], "24": [["Axiome", "Axiome 2 — Chaque commit crée une nouvelle version du dépôt."], ["Phrase", "Un commit est la cause de chaque nouvelle version du dépôt."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Des messages clairs vont avec des historiques faciles à lire."]], "26": [["Axiome", "Axiome 1 — Un commit enregistre un ou plusieurs changements dans le dépôt."], ["Phrase", "Sa fonction : enregistrer."]], "27": [["Axiome", "Axiome 1 — Un commit enregistre un ou plusieurs changements dans le dépôt."], ["Phrase", "Il dépend des changements : sans changement, rien à enregistrer."]], "28": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il s’oppose à la modification non enregistrée, qui disparaît si l’on quitte la page."]], "29": [["Axiome", "Axiome 1 — Un commit enregistre un ou plusieurs changements dans le dépôt.\nAxiome 3 — Un commit porte un message qui décrit le changement."], ["Phrase", "Le changement et son message se complètent : ce qui change, et pourquoi."]], "30": [["Axiome", "Axiome 6 — Après avoir modifié un fichier, je clique sur « Commit changes… »."], ["Phrase", "Le bouton « Commit changes… » n’est utile qu’après une modification."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Comme « Enregistrer » dans un logiciel, mais avec un message et sans écraser le passé."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un commit peut annuler un commit précédent : on dit « revert »."]], "33": [["Axiome", "Axiome 2 — Chaque commit crée une nouvelle version du dépôt.\nAxiome 4 — Il garde son auteur et sa date."], ["Phrase", "Les commits se succèdent ; chacun porte sa date."]], "34": [["Axiome", "Axiome 6 — Après avoir modifié un fichier, je clique sur « Commit changes… »."], ["Phrase · hors axiomes", "Le bouton « Commit changes… » est en haut à droite de l’éditeur."]], "35": [["Axiome", "Axiome 1 — Un commit enregistre un ou plusieurs changements dans le dépôt.\nAxiome 2 — Chaque commit crée une nouvelle version du dépôt.\nAxiome 3 — Un commit porte un message qui décrit le changement.\nAxiome 4 — Il garde son auteur et sa date.\nAxiome 5 — Il a un identifiant unique, souvent abrégé à sept caractères, comme `bd46bc0`.\nAxiome 6 — Après avoir modifié un fichier, je clique sur « Commit changes… ».\nAxiome 7 — J’écris le message dans « Commit message », puis je clique sur « Commit changes »."], ["Phrase", "Sept propositions : il enregistre ; il crée une version ; un message ; auteur et date ; identifiant ; « Commit changes… » ; message puis validation."]], "36": [["Axiome", "Axiome 3 — Un commit porte un message qui décrit le changement.\nAxiome 4 — Il garde son auteur et sa date.\nAxiome 5 — Il a un identifiant unique, souvent abrégé à sept caractères, comme `bd46bc0`."], ["Phrase", "On dit d’un commit qu’il a un message, un auteur, une date et un identifiant."]], "37": [["Axiome", "Axiome 2 — Chaque commit crée une nouvelle version du dépôt.\nAxiome 5 — Il a un identifiant unique, souvent abrégé à sept caractères, comme `bd46bc0`."], ["Phrase", "Si deux versions ont des identifiants différents, ce sont deux commits différents."]], "38": [["Axiome", "Axiome 2 — Chaque commit crée une nouvelle version du dépôt."], ["Phrase", "Conséquence nécessaire : chaque commit ajoute une version."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Chaque changement visible dans l’historique vient d’un commit."]], "40": [["Axiome", "Axiome 4 — Il garde son auteur et sa date."], ["Phrase", "Si un changement apparaît sans que tu l’aies fait, son auteur dit qui l’a fait."]], "41": [["Axiome", "Axiome 3 — Un commit porte un message qui décrit le changement."], ["Phrase", "Argument pour un bon message : il permet de retrouver un changement des mois après."]], "42": [["Axiome", "Axiome 5 — Il a un identifiant unique, souvent abrégé à sept caractères, comme `bd46bc0`."], ["Phrase", "On montre un commit par son identifiant."]], "43": [["Axiome", "Axiome 1 — Un commit enregistre un ou plusieurs changements dans le dépôt.\nAxiome 2 — Chaque commit crée une nouvelle version du dépôt.\nAxiome 3 — Un commit porte un message qui décrit le changement.\nAxiome 4 — Il garde son auteur et sa date.\nAxiome 5 — Il a un identifiant unique, souvent abrégé à sept caractères, comme `bd46bc0`.\nAxiome 6 — Après avoir modifié un fichier, je clique sur « Commit changes… ».\nAxiome 7 — J’écris le message dans « Commit message », puis je clique sur « Commit changes »."], ["Phrase", "Sept principes : l’enregistrement, la version, le message, l’auteur et la date, l’identifiant, le bouton, la validation."]], "44": [["Axiome", "Axiome 1 — Un commit enregistre un ou plusieurs changements dans le dépôt."], ["Phrase", "Exclu : un commit qui ne change rien."]], "45": [["Axiome", "Axiome 1 — Un commit enregistre un ou plusieurs changements dans le dépôt.\nAxiome 2 — Chaque commit crée une nouvelle version du dépôt.\nAxiome 3 — Un commit porte un message qui décrit le changement.\nAxiome 4 — Il garde son auteur et sa date.\nAxiome 5 — Il a un identifiant unique, souvent abrégé à sept caractères, comme `bd46bc0`.\nAxiome 6 — Après avoir modifié un fichier, je clique sur « Commit changes… ».\nAxiome 7 — J’écris le message dans « Commit message », puis je clique sur « Commit changes »."], ["Phrase", "Les axiomes s’accordent."]], "46": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Connaissance sûre : c’est le geste de base de Git."]], "47": [["Axiome", "Axiome 1 — Un commit enregistre un ou plusieurs changements dans le dépôt.\nAxiome 2 — Chaque commit crée une nouvelle version du dépôt."], ["Phrase", "Justification : sans commit, pas de version, pas de retour possible."]], "48": [["Axiome", "Axiome 5 — Il a un identifiant unique, souvent abrégé à sept caractères, comme `bd46bc0`."], ["Phrase", "Preuve qu’il existe : son identifiant."]], "49": [["Axiome", "Axiome 2 — Chaque commit crée une nouvelle version du dépôt."], ["Phrase", "Il y a commit si une nouvelle version apparaît."]], "50": [["Axiome", "Axiome 5 — Il a un identifiant unique, souvent abrégé à sept caractères, comme `bd46bc0`."], ["Phrase", "On le vérifie en retrouvant son identifiant dans l’historique."]], "51": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Réfuté si la modification n’apparaît pas : on a quitté sans valider."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Certitude élevée."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Aucune hypothèse."]], "54": [["Axiome", "Axiome 3 — Un commit porte un message qui décrit le changement.\nAxiome 4 — Il garde son auteur et sa date."], ["Phrase", "On l’observe : message, auteur, date."]], "55": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Modèle : chaque commit est une photo du dépôt entier, reliée à la photo précédente."]], "56": [["Axiome", "Axiome 2 — Chaque commit crée une nouvelle version du dépôt."], ["Phrase", "C’est une version."]], "57": [["Axiome", "Axiome 7 — J’écris le message dans « Commit message », puis je clique sur « Commit changes »."], ["Phrase", "Il existe dès qu’on clique sur « Commit changes »."]], "58": [["Axiome", "Axiome 5 — Il a un identifiant unique, souvent abrégé à sept caractères, comme `bd46bc0`."], ["Phrase", "Son identité : son identifiant unique."]], "59": [["Axiome", "Axiome 2 — Chaque commit crée une nouvelle version du dépôt."], ["Phrase", "Catégorie : les versions."]], "60": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un message est obligatoire ; GitHub en propose un par défaut, comme « Update index.html »."]], "61": [["Axiome", "Axiome 1 — Un commit enregistre un ou plusieurs changements dans le dépôt."], ["Phrase", "Son essence : enregistrer un changement."]], "62": [["Axiome", "Axiome 1 — Un commit enregistre un ou plusieurs changements dans le dépôt."], ["Phrase", "Il ne contient que les changements de ce moment-là."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il prend son sens dans l’historique, au milieu des autres."]], "64": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On fait un commit à chaque changement qui a un sens, pas à chaque lettre."]], "65": [["Axiome", "Axiome 5 — Il a un identifiant unique, souvent abrégé à sept caractères, comme `bd46bc0`."], ["Phrase", "L’identifiant complet fait 40 caractères ; on n’en montre que sept."]], "66": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On écrit souvent les messages en anglais, mais le français va très bien."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Domaine : la gestion de versions."]], "68": [["Axiome", "Axiome 4 — Il garde son auteur et sa date."], ["Phrase", "Il dit qui a fait quoi."]], "69": [["Axiome", "Axiome 4 — Il garde son auteur et sa date."], ["Phrase", "Il est daté."]], "70": [["Axiome", "Axiome 1 — Un commit enregistre un ou plusieurs changements dans le dépôt."], ["Phrase", "Son rôle : enregistrer."]], "71": [["Axiome", "Axiome 2 — Chaque commit crée une nouvelle version du dépôt."], ["Phrase", "Il fournit un point de retour."]], "72": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Opérations : faire un commit, le consulter, l’annuler par un nouveau commit."]], "73": [["Axiome", "Axiome 2 — Chaque commit crée une nouvelle version du dépôt."], ["Phrase", "Dans l’action : chaque commit est une sauvegarde datée."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il contribue à un historique propre."]], "75": [["Axiome", "Axiome 1 — Un commit enregistre un ou plusieurs changements dans le dépôt."], ["Phrase", "Utile : rien n’est enregistré sans lui."]], "76": [["Axiome", "Axiome 7 — J’écris le message dans « Commit message », puis je clique sur « Commit changes »."], ["Phrase", "Cliquer sur « Commit changes » enregistre : le geste fait l’action."]], "77": [["Axiome", "Axiome 6 — Après avoir modifié un fichier, je clique sur « Commit changes… ».\nAxiome 7 — J’écris le message dans « Commit message », puis je clique sur « Commit changes »."], ["Phrase", "Étape par étape : modifier, « Commit changes… », écrire le message, « Commit changes »."]], "78": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un commit ne change plus une fois fait."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les commits s’accumulent ; aucun ne disparaît."]], "80": [["Axiome", "Axiome 1 — Un commit enregistre un ou plusieurs changements dans le dépôt."], ["Phrase", "Il transforme une modification en version."]], "81": [["Axiome", "Axiome 7 — J’écris le message dans « Commit message », puis je clique sur « Commit changes »."], ["Phrase", "Il naît du clic sur « Commit changes »."]], "82": [["Axiome", "Axiome 6 — Après avoir modifié un fichier, je clique sur « Commit changes… ».\nAxiome 7 — J’écris le message dans « Commit message », puis je clique sur « Commit changes »."], ["Phrase", "Processus : modification, message, validation."]], "83": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La fenêtre propose aussi de créer une nouvelle branche pour ce commit."]], "84": [["Axiome", "Axiome 2 — Chaque commit crée une nouvelle version du dépôt."], ["Phrase", "États : modification en cours, puis version enregistrée."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Appréciation : le geste le plus fréquent sur GitHub."]], "86": [["Axiome", "Axiome 3 — Un commit porte un message qui décrit le changement."], ["Phrase", "Norme : un message court, au présent, qui dit ce que fait le changement."]], "87": [["Axiome", "Axiome 3 — Un commit porte un message qui décrit le changement."], ["Phrase", "Valeur : la clarté pour soi et pour les autres."]], "88": [["Axiome", "Axiome 3 — Un commit porte un message qui décrit le changement."], ["Phrase", "Critère : un changement par commit, un message clair."]], "89": [["Axiome", "Axiome 3 — Un commit porte un message qui décrit le changement."], ["Phrase", "« Corrige le titre de la page » vaut mieux que « Update index.html »."]], "90": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Pertinent à chaque étape terminée."]], "91": [["Axiome", "Axiome 3 — Un commit porte un message qui décrit le changement."], ["Phrase", "On l’améliore en écrivant des messages précis."]]}, "his": {"1": [["Axiome", "Axiome 1 — L’historique est la liste des commits d’un dépôt.\nAxiome 3 — Chaque ligne montre le message, l’auteur et la date d’un commit."], ["Phrase", "L’historique se compose de commits, une ligne chacun."]], "2": [["Axiome", "Axiome 1 — L’historique est la liste des commits d’un dépôt."], ["Phrase", "Son élément fondamental : le commit."]], "3": [["Axiome", "Axiome 1 — L’historique est la liste des commits d’un dépôt.\nAxiome 2 — Il va du commit le plus récent au plus ancien."], ["Phrase", "Les commits mis bout à bout, du plus récent au plus ancien."]], "4": [["Axiome", "Axiome 3 — Chaque ligne montre le message, l’auteur et la date d’un commit."], ["Phrase", "Chaque ligne se décompose en message, auteur et date."]], "5": [["Axiome", "Axiome 1 — L’historique est la liste des commits d’un dépôt."], ["Phrase", "Autant de lignes que de commits."]], "6": [["Axiome", "Axiome 1 — L’historique est la liste des commits d’un dépôt."], ["Phrase", "Des éléments de même nature : des commits."]], "7": [["Axiome", "Axiome 1 — L’historique est la liste des commits d’un dépôt."], ["Phrase", "L’historique, c’est la mémoire du dépôt, commit par commit."]], "8": [["Axiome", "Axiome 1 — L’historique est la liste des commits d’un dépôt.\nAxiome 2 — Il va du commit le plus récent au plus ancien."], ["Phrase", "L’historique est la liste des commits d’un dépôt, du plus récent au plus ancien."]], "9": [["Axiome", "Axiome 1 — L’historique est la liste des commits d’un dépôt.\nAxiome 2 — Il va du commit le plus récent au plus ancien.\nAxiome 3 — Chaque ligne montre le message, l’auteur et la date d’un commit."], ["Phrase", "Lister, ordonner dans le temps, résumer chaque commit."]], "10": [["Axiome", "Axiome 6 — Pour voir les commits d’un seul fichier, j’ouvre ce fichier et je clique sur « History »."], ["Phrase", "Il existe pour tout le dépôt, ou pour un seul fichier."]], "11": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En anglais : history ; la page s’intitule « Commits »."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Historique » : le récit des faits dans l’ordre du temps."]], "13": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On le lit comme un journal de bord du projet."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Historique » désigne aussi celui du navigateur ; ici, celui du dépôt."]], "15": [["Axiome", "Axiome 2 — Il va du commit le plus récent au plus ancien."], ["Phrase", "Organisation : chronologique inversée."]], "16": [["Axiome", "Axiome 2 — Il va du commit le plus récent au plus ancien."], ["Phrase", "Le plus récent en haut, le plus ancien en bas."]], "17": [["Axiome", "Axiome 1 — L’historique est la liste des commits d’un dépôt.\nAxiome 2 — Il va du commit le plus récent au plus ancien.\nAxiome 3 — Chaque ligne montre le message, l’auteur et la date d’un commit."], ["Phrase", "Vue d’ensemble : une colonne de commits datés."]], "18": [["Axiome", "Axiome 3 — Chaque ligne montre le message, l’auteur et la date d’un commit."], ["Phrase · hors axiomes", "Les lignes sont regroupées par jour, avec le message à gauche et l’identifiant à droite."]], "19": [["Axiome", "Axiome 1 — L’historique est la liste des commits d’un dépôt."], ["Phrase", "Il se range parmi les listes de versions."]], "20": [["Axiome", "Axiome 6 — Pour voir les commits d’un seul fichier, j’ouvre ce fichier et je clique sur « History »."], ["Phrase", "Deux types : celui du dépôt, celui d’un fichier."]], "21": [["Axiome", "Axiome 4 — Ouvrir un commit montre ses changements : en rouge ce qui est retiré, en vert ce qui est ajouté."], ["Phrase", "Chaque commit s’ouvre à part."]], "22": [["Axiome", "Axiome 1 — L’historique est la liste des commits d’un dépôt.\nAxiome 2 — Il va du commit le plus récent au plus ancien."], ["Phrase", "Chaque ligne est liée à la précédente dans le temps."]], "23": [["Axiome", "Axiome 1 — L’historique est la liste des commits d’un dépôt.\nAxiome 2 — Il va du commit le plus récent au plus ancien."], ["Phrase · hors axiomes", "Puisque chaque commit est daté, l’ordre est certain."]], "24": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Chaque commit ajoute une ligne en haut."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les jours de grande activité ont beaucoup de lignes."]], "26": [["Axiome", "Axiome 1 — L’historique est la liste des commits d’un dépôt."], ["Phrase", "Sa fonction : montrer le passé du dépôt."]], "27": [["Axiome", "Axiome 1 — L’historique est la liste des commits d’un dépôt."], ["Phrase", "Il dépend des commits."]], "28": [["Axiome", "Axiome 4 — Ouvrir un commit montre ses changements : en rouge ce qui est retiré, en vert ce qui est ajouté."], ["Phrase", "Le rouge s’oppose au vert : retiré, ajouté."]], "29": [["Axiome", "Axiome 4 — Ouvrir un commit montre ses changements : en rouge ce qui est retiré, en vert ce qui est ajouté.\nAxiome 6 — Pour voir les commits d’un seul fichier, j’ouvre ce fichier et je clique sur « History »."], ["Phrase", "L’historique du dépôt et celui d’un fichier se complètent."]], "30": [["Axiome", "Axiome 4 — Ouvrir un commit montre ses changements : en rouge ce qui est retiré, en vert ce qui est ajouté."], ["Phrase", "On ne voit les changements qu’en ouvrant un commit."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Comme l’historique du navigateur, mais pour les versions du projet."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un commit ancien peut expliquer un problème récent."]], "33": [["Axiome", "Axiome 2 — Il va du commit le plus récent au plus ancien."], ["Phrase", "Il est une succession : chaque commit après le précédent."]], "34": [["Axiome", "Axiome 5 — Pour ouvrir l’historique, je clique sur le nombre de commits, à côté de l’horloge, au-dessus des fichiers."], ["Phrase", "Son accès est au-dessus de la liste des fichiers."]], "35": [["Axiome", "Axiome 1 — L’historique est la liste des commits d’un dépôt.\nAxiome 2 — Il va du commit le plus récent au plus ancien.\nAxiome 3 — Chaque ligne montre le message, l’auteur et la date d’un commit.\nAxiome 4 — Ouvrir un commit montre ses changements : en rouge ce qui est retiré, en vert ce qui est ajouté.\nAxiome 5 — Pour ouvrir l’historique, je clique sur le nombre de commits, à côté de l’horloge, au-dessus des fichiers.\nAxiome 6 — Pour voir les commits d’un seul fichier, j’ouvre ce fichier et je clique sur « History »."], ["Phrase", "Six propositions : la liste ; l’ordre ; le contenu des lignes ; les couleurs ; l’accès ; « History »."]], "36": [["Axiome", "Axiome 2 — Il va du commit le plus récent au plus ancien."], ["Phrase", "On dit
