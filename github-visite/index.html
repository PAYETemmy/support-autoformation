Axiome 2 — Il va du commit le plus récent au plus ancien.\nAxiome 3 — Chaque ligne montre le message, l’auteur et la date d’un commit.\nAxiome 4 — Ouvrir un commit montre ses changements : en rouge ce qui est retiré, en vert ce qui est ajouté.\nAxiome 5 — Pour ouvrir l’historique, je clique sur le nombre de commits, à côté de l’horloge, au-dessus des fichiers.\nAxiome 6 — Pour voir les commits d’un seul fichier, j’ouvre ce fichier et je clique sur « History »."], ["Phrase", "Les axiomes s’accordent."]], "46": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Connaissance sûre."]], "47": [["Axiome", "Axiome 1 — L’historique est la liste des commits d’un dépôt."], ["Phrase", "Justification : comprendre d’où vient l’état actuel."]], "48": [["Axiome", "Axiome 4 — Ouvrir un commit montre ses changements : en rouge ce qui est retiré, en vert ce qui est ajouté."], ["Phrase", "Preuve : le détail de chaque commit."]], "49": [["Axiome", "Axiome 1 — L’historique est la liste des commits d’un dépôt."], ["Phrase", "Un commit est fait s’il apparaît dans l’historique."]], "50": [["Axiome", "Axiome 5 — Pour ouvrir l’historique, je clique sur le nombre de commits, à côté de l’horloge, au-dessus des fichiers."], ["Phrase", "On le vérifie en ouvrant l’historique."]], "51": [["Axiome", "Axiome 1 — L’historique est la liste des commits d’un dépôt."], ["Phrase", "Réfuté si un commit n’y apparaissait pas."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Certitude élevée."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Aucune hypothèse."]], "54": [["Axiome", "Axiome 4 — Ouvrir un commit montre ses changements : en rouge ce qui est retiré, en vert ce qui est ajouté."], ["Phrase", "On l’observe : chaque commit montre ses lignes."]], "55": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Modèle : une chaîne de versions, parcourue à l’envers."]], "56": [["Axiome", "Axiome 1 — L’historique est la liste des commits d’un dépôt."], ["Phrase", "C’est une liste."]], "57": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il existe dès le premier commit."]], "58": [["Axiome", "Axiome 1 — L’historique est la liste des commits d’un dépôt."], ["Phrase", "Son identité : les commits d’un dépôt."]], "59": [["Axiome", "Axiome 1 — L’historique est la liste des commits d’un dépôt."], ["Phrase", "Catégorie : les listes."]], "60": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il ne peut que s’allonger dans l’usage courant."]], "61": [["Axiome", "Axiome 1 — L’historique est la liste des commits d’un dépôt."], ["Phrase", "Son essence : la liste des commits."]], "62": [["Axiome", "Axiome 1 — L’historique est la liste des commits d’un dépôt."], ["Phrase", "Il s’arrête au premier commit."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il prend son sens après une erreur, ou pour comprendre un changement."]], "64": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’ouvre quand quelque chose a changé sans qu’on sache pourquoi."]], "65": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il raconte toute la vie du dépôt."]], "66": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les couleurs rouge et vert sont communes à tous les outils de versions."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Domaine : la gestion de versions."]], "68": [["Axiome", "Axiome 3 — Chaque ligne montre le message, l’auteur et la date d’un commit."], ["Phrase", "Il montre qui a fait quoi."]], "69": [["Axiome", "Axiome 3 — Chaque ligne montre le message, l’auteur et la date d’un commit."], ["Phrase", "Chaque ligne est datée."]], "70": [["Axiome", "Axiome 1 — L’historique est la liste des commits d’un dépôt."], ["Phrase", "Son rôle : la mémoire du dépôt."]], "71": [["Axiome", "Axiome 4 — Ouvrir un commit montre ses changements : en rouge ce qui est retiré, en vert ce qui est ajouté."], ["Phrase", "Il fournit le détail de chaque changement."]], "72": [["Axiome", "Axiome 4 — Ouvrir un commit montre ses changements : en rouge ce qui est retiré, en vert ce qui est ajouté.\nAxiome 6 — Pour voir les commits d’un seul fichier, j’ouvre ce fichier et je clique sur « History »."], ["Phrase", "Opérations : parcourir, ouvrir un commit, filtrer par fichier."]], "73": [["Axiome", "Axiome 4 — Ouvrir un commit montre ses changements : en rouge ce qui est retiré, en vert ce qui est ajouté."], ["Phrase", "Dans l’action : on retrouve ce qui a été retiré."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il contribue à comprendre le projet."]], "75": [["Axiome", "Axiome 4 — Ouvrir un commit montre ses changements : en rouge ce qui est retiré, en vert ce qui est ajouté."], ["Phrase", "Utile pour retrouver une version."]], "76": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ouvrir un commit le fait parler : voici ce qui a changé."]], "77": [["Axiome", "Axiome 4 — Ouvrir un commit montre ses changements : en rouge ce qui est retiré, en vert ce qui est ajouté.\nAxiome 5 — Pour ouvrir l’historique, je clique sur le nombre de commits, à côté de l’horloge, au-dessus des fichiers."], ["Phrase", "Étape par étape : le nombre de commits, puis la ligne voulue, puis lire le rouge et le vert."]], "78": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il change à chaque commit."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il s’allonge."]], "80": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il ne se transforme pas : il s’allonge."]], "81": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il naît avec le premier commit."]], "82": [["Axiome", "Axiome 2 — Il va du commit le plus récent au plus ancien."], ["Phrase", "Processus : chaque commit se place en haut."]], "83": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On peut le filtrer par branche, par auteur ou par date."]], "84": [["Axiome", "Axiome 2 — Il va du commit le plus récent au plus ancien."], ["Phrase", "Ses états successifs sont ses commits, l’un après l’autre."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Appréciation : précieux, surtout après une erreur."]], "86": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Norme : des messages clairs le rendent lisible."]], "87": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Valeur : la transparence."]], "88": [["Axiome", "Axiome 3 — Chaque ligne montre le message, l’auteur et la date d’un commit."], ["Phrase", "Critère : chaque ligne dit ce qui a changé."]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un bon historique se lit comme un récit."]], "90": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Pertinent pour comprendre ; inutile tant que tout va bien."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’améliore en faisant de petits commits bien nommés."]]}, "bra": {"1": [["Axiome", "Axiome 1 — Une branche est une suite de commits."], ["Phrase", "Une branche se compose de commits, à la suite."]], "2": [["Axiome", "Axiome 1 — Une branche est une suite de commits."], ["Phrase", "Son élément fondamental : le commit."]], "3": [["Axiome", "Axiome 1 — Une branche est une suite de commits.\nAxiome 3 — Une nouvelle branche part d’une branche existante, comme une copie."], ["Phrase", "Une suite de commits, partie d’une autre branche."]], "4": [["Axiome", "Axiome 1 — Une branche est une suite de commits."], ["Phrase", "Elle se décompose en commits."]], "5": [["Axiome", "Axiome 2 — Chaque dépôt a une branche principale, en général nommée `main`."], ["Phrase", "Un dépôt a au moins une branche, la principale ; il peut en avoir beaucoup."]], "6": [["Axiome", "Axiome 1 — Une branche est une suite de commits."], ["Phrase", "Nature : un chemin de versions."]], "7": [["Axiome", "Axiome 1 — Une branche est une suite de commits.\nAxiome 5 — Une branche sert à essayer un changement sans toucher à la branche principale."], ["Phrase", "Une branche, c’est un chemin à part pour essayer un changement."]], "8": [["Axiome", "Axiome 1 — Une branche est une suite de commits.\nAxiome 3 — Une nouvelle branche part d’une branche existante, comme une copie."], ["Phrase", "Une branche est une suite de commits, partie d’une branche existante."]], "9": [["Axiome", "Axiome 1 — Une branche est une suite de commits.\nAxiome 3 — Une nouvelle branche part d’une branche existante, comme une copie.\nAxiome 4 — Les commits faits sur une branche ne touchent pas les autres branches."], ["Phrase", "Être une suite, partir d’une autre, rester indépendante."]], "10": [["Axiome", "Axiome 2 — Chaque dépôt a une branche principale, en général nommée `main`."], ["Phrase", "`main`, la principale ; `essai`, `correction-titre`, des branches de travail."]], "11": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En anglais : branch ; la principale s’appelle `main` (autrefois `master`)."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "L’image vient de l’arbre : des branches partent du tronc."]], "13": [["Axiome", "Axiome 5 — Une branche sert à essayer un changement sans toucher à la branche principale."], ["Phrase", "On la voit comme un brouillon à côté de la version officielle."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Branche » désigne aussi une discipline ; ici, un chemin de commits."]], "15": [["Axiome", "Axiome 2 — Chaque dépôt a une branche principale, en général nommée `main`.\nAxiome 3 — Une nouvelle branche part d’une branche existante, comme une copie."], ["Phrase", "Organisation : une branche principale, et d’autres qui en partent."]], "16": [["Axiome", "Axiome 2 — Chaque dépôt a une branche principale, en général nommée `main`."], ["Phrase", "La branche principale est au-dessus des autres."]], "17": [["Axiome", "Axiome 2 — Chaque dépôt a une branche principale, en général nommée `main`.\nAxiome 3 — Une nouvelle branche part d’une branche existante, comme une copie."], ["Phrase", "Vue d’ensemble : un tronc et des rameaux."]], "18": [["Axiome", "Axiome 6 — Le menu des branches, en haut à gauche des fichiers, montre la branche affichée."], ["Phrase", "Le menu des branches, en haut à gauche des fichiers, avec le nom de la branche affichée."]], "19": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle se range parmi les chemins de versions."]], "20": [["Axiome", "Axiome 2 — Chaque dépôt a une branche principale, en général nommée `main`."], ["Phrase", "Types : principale et secondaires."]], "21": [["Axiome", "Axiome 4 — Les commits faits sur une branche ne touchent pas les autres branches."], ["Phrase", "Chaque branche est autonome."]], "22": [["Axiome", "Axiome 3 — Une nouvelle branche part d’une branche existante, comme une copie."], ["Phrase", "Une branche est liée à celle dont elle part."]], "23": [["Axiome", "Axiome 3 — Une nouvelle branche part d’une branche existante, comme une copie.\nAxiome 4 — Les commits faits sur une branche ne touchent pas les autres branches."], ["Phrase", "Partie d’une autre, elle évolue ensuite seule."]], "24": [["Axiome", "Axiome 4 — Les commits faits sur une branche ne touchent pas les autres branches."], ["Phrase", "Un commit sur une branche ne change qu’elle."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les branches nombreuses vont avec les projets où plusieurs essais se mènent en même temps."]], "26": [["Axiome", "Axiome 5 — Une branche sert à essayer un changement sans toucher à la branche principale."], ["Phrase", "Sa fonction : essayer sans risque."]], "27": [["Axiome", "Axiome 3 — Une nouvelle branche part d’une branche existante, comme une copie."], ["Phrase", "Elle dépend de sa branche de départ."]], "28": [["Axiome", "Axiome 2 — Chaque dépôt a une branche principale, en général nommée `main`.\nAxiome 5 — Une branche sert à essayer un changement sans toucher à la branche principale."], ["Phrase", "Branche principale et branche d’essai s’opposent : l’officiel et l’essai."]], "29": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Branche et fusion se complètent : on part, puis on revient."]], "30": [["Axiome", "Axiome 4 — Les commits faits sur une branche ne touchent pas les autres branches."], ["Phrase", "Tant qu’on ne fusionne pas, la branche principale ne bouge pas."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Comme une copie de travail, mais qui garde ses propres versions."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Deux branches peuvent évoluer en parallèle puis se rejoindre."]], "33": [["Axiome", "Axiome 3 — Une nouvelle branche part d’une branche existante, comme une copie."], ["Phrase", "Une branche naît après le commit d’où elle part."]], "34": [["Axiome", "Axiome 6 — Le menu des branches, en haut à gauche des fichiers, montre la branche affichée."], ["Phrase", "Le menu est en haut à gauche des fichiers."]], "35": [["Axiome", "Axiome 1 — Une branche est une suite de commits.\nAxiome 2 — Chaque dépôt a une branche principale, en général nommée `main`.\nAxiome 3 — Une nouvelle branche part d’une branche existante, comme une copie.\nAxiome 4 — Les commits faits sur une branche ne touchent pas les autres branches.\nAxiome 5 — Une branche sert à essayer un changement sans toucher à la branche principale.\nAxiome 6 — Le menu des branches, en haut à gauche des fichiers, montre la branche affichée.\nAxiome 7 — Pour créer une branche, j’ouvre ce menu, je tape un nom, puis je clique sur « Create branch »."], ["Phrase", "Sept propositions : suite de commits ; `main` ; départ d’une existante ; indépendance ; essai ; menu ; création."]], "36": [["Axiome", "Axiome 4 — Les commits faits sur une branche ne touchent pas les autres branches."], ["Phrase", "On dit d’une branche qu’elle est indépendante."]], "37": [["Axiome", "Axiome 4 — Les commits faits sur une branche ne touchent pas les autres branches."], ["Phrase", "Si je commite sur `essai`, `main` reste intacte."]], "38": [["Axiome", "Axiome 2 — Chaque dépôt a une branche principale, en général nommée `main`."], ["Phrase", "Conséquence nécessaire : il y a toujours une branche principale."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les équipes font une branche par changement : c’est l’usage."]], "40": [["Axiome", "Axiome 6 — Le menu des branches, en haut à gauche des fichiers, montre la branche affichée."], ["Phrase", "Si un fichier n’apparaît pas, peut-être n’es-tu pas sur la bonne branche : regarde le menu."]], "41": [["Axiome", "Axiome 5 — Une branche sert à essayer un changement sans toucher à la branche principale."], ["Phrase", "Argument : on peut tout essayer sans casser le site publié."]], "42": [["Axiome", "Axiome 6 — Le menu des branches, en haut à gauche des fichiers, montre la branche affichée."], ["Phrase", "On montre la branche affichée par le menu."]], "43": [["Axiome", "Axiome 1 — Une branche est une suite de commits.\nAxiome 2 — Chaque dépôt a une branche principale, en général nommée `main`.\nAxiome 3 — Une nouvelle branche part d’une branche existante, comme une copie.\nAxiome 4 — Les commits faits sur une branche ne touchent pas les autres branches.\nAxiome 5 — Une branche sert à essayer un changement sans toucher à la branche principale.\nAxiome 6 — Le menu des branches, en haut à gauche des fichiers, montre la branche affichée.\nAxiome 7 — Pour créer une branche, j’ouvre ce menu, je tape un nom, puis je clique sur « Create branch »."], ["Phrase", "Sept principes : suite, principale, départ, indépendance, essai, menu, création."]], "44": [["Axiome", "Axiome 4 — Les commits faits sur une branche ne touchent pas les autres branches."], ["Phrase", "Exclu : un commit qui changerait deux branches à la fois."]], "45": [["Axiome", "Axiome 1 — Une branche est une suite de commits.\nAxiome 2 — Chaque dépôt a une branche principale, en général nommée `main`.\nAxiome 3 — Une nouvelle branche part d’une branche existante, comme une copie.\nAxiome 4 — Les commits faits sur une branche ne touchent pas les autres branches.\nAxiome 5 — Une branche sert à essayer un changement sans toucher à la branche principale.\nAxiome 6 — Le menu des branches, en haut à gauche des fichiers, montre la branche affichée.\nAxiome 7 — Pour créer une branche, j’ouvre ce menu, je tape un nom, puis je clique sur « Create branch »."], ["Phrase", "Les axiomes s’accordent."]], "46": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Connaissance sûre."]], "47": [["Axiome", "Axiome 5 — Une branche sert à essayer un changement sans toucher à la branche principale."], ["Phrase", "Justification : protéger la branche principale."]], "48": [["Axiome", "Axiome 6 — Le menu des branches, en haut à gauche des fichiers, montre la branche affichée."], ["Phrase", "Preuve : le menu liste les branches."]], "49": [["Axiome", "Axiome 4 — Les commits faits sur une branche ne touchent pas les autres branches."], ["Phrase", "Un changement est sur une branche s’il apparaît quand elle est affichée."]], "50": [["Axiome", "Axiome 6 — Le menu des branches, en haut à gauche des fichiers, montre la branche affichée."], ["Phrase", "On vérifie en changeant de branche dans le menu."]], "51": [["Axiome", "Axiome 4 — Les commits faits sur une branche ne touchent pas les autres branches."], ["Phrase", "Réfuté si un commit sur une branche apparaissait sur une autre sans fusion."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Certitude élevée."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Aucune hypothèse."]], "54": [["Axiome", "Axiome 6 — Le menu des branches, en haut à gauche des fichiers, montre la branche affichée."], ["Phrase", "On l’observe dans le menu des branches."]], "55": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Modèle : un nom qui pointe vers le dernier commit d’un chemin."]], "56": [["Axiome", "Axiome 1 — Une branche est une suite de commits."], ["Phrase", "C’est une suite de commits."]], "57": [["Axiome", "Axiome 7 — Pour créer une branche, j’ouvre ce menu, je tape un nom, puis je clique sur « Create branch »."], ["Phrase", "Elle existe dès sa création."]], "58": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Son identité : son nom."]], "59": [["Axiome", "Axiome 1 — Une branche est une suite de commits."], ["Phrase", "Catégorie : les suites de versions."]], "60": [["Axiome", "Axiome 5 — Une branche sert à essayer un changement sans toucher à la branche principale."], ["Phrase", "Créer une branche est possible, jamais obligatoire."]], "61": [["Axiome", "Axiome 1 — Une branche est une suite de commits."], ["Phrase", "Son essence : un chemin de commits."]], "62": [["Axiome", "Axiome 4 — Les commits faits sur une branche ne touchent pas les autres branches."], ["Phrase", "Ses commits restent chez elle."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle prend son sens quand on veut tester avant de publier."]], "64": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On en crée une pour un changement risqué."]], "65": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La branche principale s’appelait `master` jusqu’en 2020 ; c’est `main` depuis."]], "66": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les noms de branches sont courts, en minuscules, avec des tirets."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Domaine : la gestion de versions."]], "68": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Chacun peut travailler sur sa branche sans gêner les autres."]], "69": [["Axiome", "Axiome 6 — Le menu des branches, en haut à gauche des fichiers, montre la branche affichée."], ["Phrase", "Elle a sa place dans le menu."]], "70": [["Axiome", "Axiome 5 — Une branche sert à essayer un changement sans toucher à la branche principale."], ["Phrase", "Son rôle : isoler un essai."]], "71": [["Axiome", "Axiome 4 — Les commits faits sur une branche ne touchent pas les autres branches."], ["Phrase", "Elle fournit un espace protégé."]], "72": [["Axiome", "Axiome 7 — Pour créer une branche, j’ouvre ce menu, je tape un nom, puis je clique sur « Create branch »."], ["Phrase", "Opérations : créer, changer de branche, supprimer."]], "73": [["Axiome", "Axiome 5 — Une branche sert à essayer un changement sans toucher à la branche principale."], ["Phrase", "Dans l’action : on essaie librement."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle contribue à des changements sûrs."]], "75": [["Axiome", "Axiome 5 — Une branche sert à essayer un changement sans toucher à la branche principale."], ["Phrase", "Utile pour tester avant de toucher à `main`."]], "76": [["Axiome", "Axiome 7 — Pour créer une branche, j’ouvre ce menu, je tape un nom, puis je clique sur « Create branch »."], ["Phrase", "Cliquer sur « Create branch » crée la branche."]], "77": [["Axiome", "Axiome 6 — Le menu des branches, en haut à gauche des fichiers, montre la branche affichée.\nAxiome 7 — Pour créer une branche, j’ouvre ce menu, je tape un nom, puis je clique sur « Create branch »."], ["Phrase", "Étape par étape : le menu, un nom, « Create branch »."]], "78": [["Axiome", "Axiome 1 — Une branche est une suite de commits."], ["Phrase", "Elle s’allonge à chaque commit."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle vit le temps d’un essai, puis est fusionnée ou supprimée."]], "80": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Fusionnée, elle transforme la branche principale."]], "81": [["Axiome", "Axiome 3 — Une nouvelle branche part d’une branche existante, comme une copie."], ["Phrase", "Elle naît d’une branche existante."]], "82": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Processus : créer, commiter, proposer, fusionner."]], "83": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On peut créer une branche directement dans la fenêtre du commit."]], "84": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "États : créée, en cours, fusionnée, supprimée."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Appréciation : puissante, à utiliser pour les changements importants."]], "86": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Norme : ne pas commiter directement sur `main` quand on travaille à plusieurs."]], "87": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Valeur : la sécurité de la version officielle."]], "88": [["Axiome", "Axiome 5 — Une branche sert à essayer un changement sans toucher à la branche principale."], ["Phrase", "Critère : un essai, une branche."]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une bonne branche a un nom qui dit son objet."]], "90": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Pertinente pour un changement risqué ; superflue pour corriger une faute."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’améliore en la supprimant une fois fusionnée."]]}, "pr": {"1": [["Axiome", "Axiome 2 — Elle compare deux branches : celle qui propose et celle qui reçoit.\nAxiome 3 — Elle montre les changements proposés avant toute intégration.\nAxiome 4 — On peut en discuter par des commentaires.\nAxiome 5 — Elle a un numéro, précédé de `#`."], ["Phrase", "Une pull request se compose de deux branches comparées, des changements, des commentaires et d’un numéro."]], "2": [["Axiome", "Axiome 1 — Une pull request propose d’intégrer les commits d’une branche dans une autre."], ["Phrase", "Son élément fondamental : une proposition d’intégration."]], "3": [["Axiome", "Axiome 2 — Elle compare deux branches : celle qui propose et celle qui reçoit.\nAxiome 3 — Elle montre les changements proposés avant toute intégration."], ["Phrase", "Deux branches comparées, dont on montre la différence."]], "4": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle se décompose en trois onglets : « Conversation », « Commits », « Files changed »."]], "5": [["Axiome", "Axiome 2 — Elle compare deux branches : celle qui propose et celle qui reçoit."], ["Phrase", "Toujours deux branches : une qui propose, une qui reçoit."]], "6": [["Axiome", "Axiome 1 — Une pull request propose d’intégrer les commits d’une branche dans une autre."], ["Phrase", "Sa nature : une proposition."]], "7": [["Axiome", "Axiome 1 — Une pull request propose d’intégrer les commits d’une branche dans une autre."], ["Phrase", "Une pull request, c’est une demande : « intègre mes changements »."]], "8": [["Axiome", "Axiome 1 — Une pull request propose d’intégrer les commits d’une branche dans une autre.\nAxiome 2 — Elle compare deux branches : celle qui propose et celle qui reçoit."], ["Phrase", "Une pull request propose d’intégrer les commits d’une branche dans une autre, en comparant les deux."]], "9": [["Axiome", "Axiome 1 — Une pull request propose d’intégrer les commits d’une branche dans une autre.\nAxiome 3 — Elle montre les changements proposés avant toute intégration.\nAxiome 5 — Elle a un numéro, précédé de `#`.\nAxiome 6 — Elle reste ouverte jusqu’à ce qu’elle soit fusionnée ou fermée."], ["Phrase", "Proposer, montrer avant d’intégrer, porter un numéro, rester ouverte."]], "10": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une correction de texte, une nouvelle page, une amélioration proposée par un inconnu."]], "11": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Abrégé « PR » ; GitLab dit « merge request »."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Pull request » : demande de tirer les changements vers soi."]], "13": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On peut la voir comme une relecture avant publication."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Pull » désigne aussi une commande Git qui récupère des commits ; ici, c’est une proposition."]], "15": [["Axiome", "Axiome 2 — Elle compare deux branches : celle qui propose et celle qui reçoit."], ["Phrase · hors axiomes", "Organisation : branche qui reçoit à gauche, branche qui propose à droite."]], "16": [["Axiome", "Axiome 2 — Elle compare deux branches : celle qui propose et celle qui reçoit."], ["Phrase", "La branche qui reçoit est au-dessus : c’est elle qui décide."]], "17": [["Axiome", "Axiome 1 — Une pull request propose d’intégrer les commits d’une branche dans une autre.\nAxiome 3 — Elle montre les changements proposés avant toute intégration.\nAxiome 4 — On peut en discuter par des commentaires."], ["Phrase", "Vue d’ensemble : une proposition, ses changements et sa discussion."]], "18": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le titre en haut avec son numéro, l’état (« Open »), puis les onglets."]], "19": [["Axiome", "Axiome 1 — Une pull request propose d’intégrer les commits d’une branche dans une autre."], ["Phrase", "Elle se range parmi les propositions."]], "20": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Types : normale ou brouillon (« draft »), qu’on ne peut pas fusionner tant qu’elle est brouillon."]], "21": [["Axiome", "Axiome 5 — Elle a un numéro, précédé de `#`."], ["Phrase", "Chaque pull request est une unité, avec son numéro."]], "22": [["Axiome", "Axiome 2 — Elle compare deux branches : celle qui propose et celle qui reçoit."], ["Phrase", "Elle relie deux branches."]], "23": [["Axiome", "Axiome 1 — Une pull request propose d’intégrer les commits d’une branche dans une autre.\nAxiome 3 — Elle montre les changements proposés avant toute intégration."], ["Phrase", "Puisqu’elle propose avant d’intégrer, rien ne change tant qu’elle n’est pas acceptée."]], "24": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un nouveau commit sur la branche qui propose s’ajoute à la pull request."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les petites pull requests sont plus vite relues."]], "26": [["Axiome", "Axiome 1 — Une pull request propose d’intégrer les commits d’une branche dans une autre."], ["Phrase", "Sa fonction : proposer."]], "27": [["Axiome", "Axiome 2 — Elle compare deux branches : celle qui propose et celle qui reçoit."], ["Phrase", "Elle dépend de deux branches."]], "28": [["Axiome", "Axiome 6 — Elle reste ouverte jusqu’à ce qu’elle soit fusionnée ou fermée."], ["Phrase", "Ouverte s’oppose à fermée ou fusionnée."]], "29": [["Axiome", "Axiome 3 — Elle montre les changements proposés avant toute intégration.\nAxiome 4 — On peut en discuter par des commentaires."], ["Phrase", "Changements et commentaires se complètent : on voit, puis on discute."]], "30": [["Axiome", "Axiome 1 — Une pull request propose d’intégrer les commits d’une branche dans une autre."], ["Phrase", "Il faut des commits différents entre les deux branches pour proposer quelque chose."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Comme un document envoyé en relecture avant impression."]], "32": [["Axiome", "Axiome 4 — On peut en discuter par des commentaires."], ["Phrase", "Les commentaires peuvent amener de nouveaux commits."]], "33": [["Axiome", "Axio  et une description précise."]]}, "rdm": {"1": [["Axiome", "Axiome 4 — Il s’appelle en général `README.md`.\nAxiome 5 — L’extension `.md` signale du Markdown : du texte avec des marques de mise en forme."], ["Phrase", "Un README se compose de texte en Markdown, avec titres et mises en forme."]], "2": [["Axiome", "Axiome 1 — Le README est le fichier qui présente un dépôt."], ["Phrase", "Son élément fondamental : la présentation du dépôt."]], "3": [["Axiome", "Axiome 5 — L’extension `.md` signale du Markdown : du texte avec des marques de mise en forme.\nAxiome 6 — En Markdown, je mets `#` en début de ligne pour faire un titre.\nAxiome 7 — En Markdown, j’entoure un mot de `**` pour le mettre en gras."], ["Phrase", "Du texte, des titres faits avec `#`, des mots en gras faits avec `**`."]], "4": [["Axiome", "Axiome 6 — En Markdown, je mets `#` en début de ligne pour faire un titre."], ["Phrase", "Il se décompose en sections, chacune ouverte par un titre."]], "5": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un seul README par dépôt, en général."]], "6": [["Axiome", "Axiome 5 — L’extension `.md` signale du Markdown : du texte avec des marques de mise en forme."], ["Phrase", "Nature : du texte mis en forme."]], "7": [["Axiome", "Axiome 1 — Le README est le fichier qui présente un dépôt."], ["Phrase", "Le README, c’est la page d’accueil du dépôt."]], "8": [["Axiome", "Axiome 1 — Le README est le fichier qui présente un dépôt.\nAxiome 2 — Il est placé à la racine du dépôt, hors des dossiers.\nAxiome 3 — Son contenu s’affiche sous la liste des fichiers, sur la page du dépôt."], ["Phrase", "Le README est le fichier qui présente un dépôt ; placé à sa racine, il s’affiche sous la liste des fichiers."]], "9": [["Axiome", "Axiome 1 — Le README est le fichier qui présente un dépôt.\nAxiome 2 — Il est placé à la racine du dépôt, hors des dossiers.\nAxiome 3 — Son contenu s’affiche sous la liste des fichiers, sur la page du dépôt."], ["Phrase", "Présenter, "], ["Phrase", "Chaque section se lit seule."]], "22": [["Axiome", "Axiome 2 — Il est placé à la racine du dépôt, hors des dossiers.\nAxiome 3 — Son contenu s’affiche sous la liste des fichiers, sur la page du dépôt."], ["Phrase", "Sa place, la racine, est liée à son affichage sur la page."]], "23": [["Axiome", "Axiome 2 — Il est placé à la racine du dépôt, hors des dossiers.\nAxiome 3 — Son contenu s’affiche sous la liste des fichiers, sur la page du dépôt."], ["Phrase", "Puisqu’il est à la racine, GitHub l’affiche sur la page du dépôt."]], "24": [["Axiome", "Axiome 3 — Son contenu s’affiche sous la liste des fichiers, sur la page du dépôt."], ["Phrase", "Modifier le README change la page d’accueil du dépôt."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les dépôts les plus suivis ont des README soignés."]], "26": [["Axiome", "Axiome 1 — Le README est le fichier qui présente un dépôt."], ["Phrase", "Sa fonction : présenter."]], "27": [["Axiome", "Axiome 2 — Il est placé à la racine du dépôt, hors des dossiers."], ["Phrase", "Son affichage dépend de sa place, à la racine."]], "28": [["Axiome", "Axiome 5 — L’extension `.md` signale du Markdown : du texte avec des marques de mise en forme."], ["Phrase", "Le Markdown s’oppose au texte brut : il se met en forme à l’affichage."]], "29": [["Axiome", "Axiome 1 — Le README est le fichier qui présente un dépôt.\nAxiome 3 — Son contenu s’affiche sous la liste des fichiers, sur la page du dépôt."], ["Phrase", "Le README complète la liste des fichiers : l’une montre, l’autre explique."]], "30": [["Axiome", "Axiome 2 — Il est placé à la racine du dépôt, hors des dossiers.\nAxiome 4 — Il s’appelle en général `README.md`."], ["Phrase", "Pour qu’il s’affiche, il doit s’appeler README et être à la racine."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Comme la quatrième de couverture d’un livre."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hor t."], ["Phrase", "Si rien ne s’affiche sous les fichiers, le dépôt n’a pas de README."]], "41": [["Axiome", "Axiome 1 — Le README est le fichier qui présente un dépôt."], ["Phrase", "Argument : un dépôt sans présentation est difficile à comprendre."]], "42": [["Axiome", "Axiome 3 — Son contenu s’affiche sous la liste des fichiers, sur la page du dépôt."], ["Phrase", "On le montre en ouvrant la page du dépôt."]], "43": [["Axiome", "Axiome 1 — Le README est le fichier qui présente un dépôt.\nAxiome 2 — Il est placé à la racine du dépôt, hors des dossiers.\nAxiome 3 — Son contenu s’affiche sous la liste des fichiers, sur la page du dépôt.\nAxiome 4 — Il s’appelle en général `README.md`.\nAxiome 5 — L’extension `.md` signale du Markdown : du texte avec des marques de mise en forme.\nAxiome 6 — En Markdown, je mets `#` en début de ligne pour faire un titre.\nAxiome 7 — En Markdown, j’entoure un mot de `**` pour le mettre en gras.\nAxiome 8 — Pour ajouter un README, je crée un fichier nommé `README.md`."], ["Phrase", "Huit principes."]], "44": [["Axiome", "Axiome 2 — Il est placé à la racine du dépôt, hors des dossiers."], ["Phrase · hors axiomes", "Exclu : un README de page d’accueil ailleurs qu’à la racine."]], "45": [["Axiome", "Axiome 1 — Le README est le fichier qui présente un dépôt.\nAxiome 2 — Il est placé à la racine du dépôt, hors des dossiers.\nAxiome 3 — Son contenu s’affiche sous la liste des fichiers, sur la page du dépôt.\nAxiome 4 — Il s’appelle en général `README.md`.\nAxiome 5 — L’extension `.md` signale du Markdown : du texte avec des marques de mise en forme.\nAxiome 6 — En Markdown, je mets `#` en début de ligne pour faire un titre.\nAxiome 7 — En Markdown, j’entoure un mot de `**` pour le mettre en gras.\nAxiome 8 — Pour ajouter un README, je crée un fichier nommé `README.md`."], ["Phrase", "Les axiomes s’accordent."]], "46": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Connaissance sûre."]], "47": [["Axiome", "Axiome 1 — L
