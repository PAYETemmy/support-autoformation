n dépôt compréhensible."]], "75": [["Axiome", "Axiome 1 — Le README est le fichier qui présente un dépôt."], ["Phrase", "Utile pour présenter le projet."]], "76": [["Axiome", "Axiome 6 — En Markdown, je mets `#` en début de ligne pour faire un titre."], ["Phrase", "Taper `#` en début de ligne fait un titre."]], "77": [["Axiome", "Axiome 8 — Pour ajouter un README, je crée un fichier nommé `README.md`."], ["Phrase", "Étape par étape : « Add file », « Create new file », nom `README.md`, texte, commit."]], "78": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il change comme les autres fichiers, par commit."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il s’enrichit avec le projet."]], "80": [["Axiome", "Axiome 5 — L’extension `.md` signale du Markdown : du texte avec des marques de mise en forme."], ["Phrase", "Le Markdown transforme des signes simples en mise en forme."]], "81": [["Axiome", "Axiome 8 — Pour ajouter un README, je crée un fichier nommé `README.md`."], ["Phrase", "Il naît par création du fichier, ou par la case « Add a README file » à la création du dépôt."]], "82": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Processus : écrire, enregistrer, voir le résultat sur la page."]], "83": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "L’éditeur propose un onglet « Preview » pour voir le rendu avant d’enregistrer."]], "84": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ses états successifs sont ses versions."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Appréciation : petit fichier, grande utilité."]], "86": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Norme : dire ce qu’est le projet et comment s’en servir."]], "87": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Valeur : la clarté."]], "88": [["Axiome", "Axiome 1 — Le README est le fichier qui présente un dépôt."], ["Phrase", "Critère : un inconnu comprend-il le projet ?"]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un bon README est court, avec un titre et quelques lignes claires."]], "90": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Pertinent pour tout dépôt qu’on montre."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’améliore en ajoutant le lien vers le site publié."]]}, "act": {"1": [["Axiome", "Axiome 1 — GitHub Actions lance des tâches automatiquement, sur les serveurs de GitHub.\nAxiome 2 — Une tâche se lance à la suite d’un événement, par exemple un commit.\nAxiome 3 — Un ensemble de tâches s’appelle un workflow.\nAxiome 4 — Chaque lancement d’un workflow s’appelle une exécution, « run » en anglais."], ["Phrase", "Actions se compose de tâches, regroupées en workflows, lancées par des événements, et de leurs exécutions."]], "2": [["Axiome", "Axiome 1 — GitHub Actions lance des tâches automatiquement, sur les serveurs de GitHub."], ["Phrase", "Son élément fondamental : la tâche automatique."]], "3": [["Axiome", "Axiome 2 — Une tâche se lance à la suite d’un événement, par exemple un commit.\nAxiome 3 — Un ensemble de tâches s’appelle un workflow.\nAxiome 4 — Chaque lancement d’un workflow s’appelle une exécution, « run » en anglais."], ["Phrase", "Un événement lance un workflow, ce qui crée une exécution."]], "4": [["Axiome", "Axiome 3 — Un ensemble de tâches s’appelle un workflow."], ["Phrase · hors axiomes", "Un workflow se décompose en tâches, chacune en étapes."]], "5": [["Axiome", "Axiome 4 — Chaque lancement d’un workflow s’appelle une exécution, « run » en anglais."], ["Phrase", "Une exécution par lancement ; un dépôt peut en compter des centaines."]], "6": [["Axiome", "Axiome 1 — GitHub Actions lance des tâches automatiquement, sur les serveurs de GitHub."], ["Phrase", "Nature : un service d’automatisation."]], "7": [["Axiome", "Axiome 1 — GitHub Actions lance des tâches automatiquement, sur les serveurs de GitHub."], ["Phrase", "Actions, c’est GitHub qui travaille tout seul pour toi."]], "8": [["Axiome", "Axiome 1 — GitHub Actions lance des tâches automatiquement, sur les serveurs de GitHub.\nAxiome 2 — Une tâche se lance à la suite d’un événement, par exemple un commit."], ["Phrase", "GitHub Actions lance des tâches automatiquement, sur ses serveurs, à la suite d’un événement."]], "9": [["Axiome", "Axiome 1 — GitHub Actions lance des tâches automatiquement, sur les serveurs de GitHub.\nAxiome 2 — Une tâche se lance à la suite d’un événement, par exemple un commit.\nAxiome 4 — Chaque lancement d’un workflow s’appelle une exécution, « run » en anglais.\nAxiome 5 — Une exécution réussie a une coche verte, une exécution échouée une croix rouge, une exécution en cours un rond jaune."], ["Phrase", "Automatique, déclenché, enregistré en exécutions, avec un état visible."]], "10": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Publier un site, vérifier du code, envoyer une notification."]], "11": [["Axiome", "Axiome 3 — Un ensemble de tâches s’appelle un workflow.\nAxiome 4 — Chaque lancement d’un workflow s’appelle une exécution, « run » en anglais."], ["Phrase", "Termes : workflow (ensemble de tâches), run (exécution), job (tâche)."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Action » : ce qui est fait ; ici, fait par la machine."]], "13": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On le voit comme un robot qui réagit à ce qui se passe dans le dépôt."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Actions » désigne l’outil, l’onglet, et aussi des briques réutilisables."]], "15": [["Axiome", "Axiome 2 — Une tâche se lance à la suite d’un événement, par exemple un commit.\nAxiome 3 — Un ensemble de tâches s’appelle un workflow."], ["Phrase", "Organisation : événement, workflow, exécution."]], "16": [["Axiome", "Axiome 3 — Un ensemble de tâches s’appelle un workflow."], ["Phrase · hors axiomes", "Hiérarchie : workflow, puis tâches, puis étapes."]], "17": [["Axiome", "Axiome 1 — GitHub Actions lance des tâches automatiquement, sur les serveurs de GitHub.\nAxiome 2 — Une tâche se lance à la suite d’un événement, par exemple un commit."], ["Phrase", "Vue d’ensemble : un événement, un travail automatique, un résultat."]], "18": [["Axiome", "Axiome 6 — Pour suivre les exécutions, j’ouvre l’onglet « Actions »."], ["Phrase · hors axiomes", "L’onglet « Actions » : la liste des workflows à gauche, les exécutions à droite."]], "19": [["Axiome", "Axiome 1 — GitHub Actions lance des tâches automatiquement, sur les serveurs de GitHub."], ["Phrase", "Il se range parmi les automatisations."]], "20": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Workflows écrits par soi, ou fournis par GitHub, comme celui de Pages."]], "21": [["Axiome", "Axiome 3 — Un ensemble de tâches s’appelle un workflow."], ["Phrase", "Chaque workflow est autonome."]], "22": [["Axiome", "Axiome 2 — Une tâche se lance à la suite d’un événement, par exemple un commit."], ["Phrase", "Un événement est lié au workflow qu’il lance."]], "23": [["Axiome", "Axiome 2 — Une tâche se lance à la suite d’un événement, par exemple un commit.\nAxiome 4 — Chaque lancement d’un workflow s’appelle une exécution, « run » en anglais."], ["Phrase", "Pas d’événement, pas d’exécution."]], "24": [["Axiome", "Axiome 2 — Une tâche se lance à la suite d’un événement, par exemple un commit."], ["Phrase", "Un commit peut être la cause d’une exécution."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une croix rouge suit souvent un commit qui a introduit une erreur."]], "26": [["Axiome", "Axiome 1 — GitHub Actions lance des tâches automatiquement, sur les serveurs de GitHub."], ["Phrase", "Sa fonction : automatiser."]], "27": [["Axiome", "Axiome 2 — Une tâche se lance à la suite d’un événement, par exemple un commit."], ["Phrase", "Une exécution dépend de l’événement qui la lance."]], "28": [["Axiome", "Axiome 5 — Une exécution réussie a une coche verte, une exécution échouée une croix rouge, une exécution en cours un rond jaune."], ["Phrase", "La coche verte s’oppose à la croix rouge : réussite, échec."]], "29": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Actions et Pages se complètent : l’un construit, l’autre publie."]], "30": [["Axiome", "Axiome 2 — Une tâche se lance à la suite d’un événement, par exemple un commit."], ["Phrase", "Un workflow ne s’exécute que si son événement se produit."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Comme une automatisation de Raccourcis sur l’iPhone : un déclencheur, puis des actions."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une exécution peut en déclencher une autre."]], "33": [["Axiome", "Axiome 2 — Une tâche se lance à la suite d’un événement, par exemple un commit.\nAxiome 4 — Chaque lancement d’un workflow s’appelle une exécution, « run » en anglais."], ["Phrase", "L’événement d’abord, l’exécution ensuite."]], "34": [["Axiome", "Axiome 1 — GitHub Actions lance des tâches automatiquement, sur les serveurs de GitHub."], ["Phrase", "Les tâches tournent sur les serveurs de GitHub, pas sur ton appareil."]], "35": [["Axiome", "Axiome 1 — GitHub Actions lance des tâches automatiquement, sur les serveurs de GitHub.\nAxiome 2 — Une tâche se lance à la suite d’un événement, par exemple un commit.\nAxiome 3 — Un ensemble de tâches s’appelle un workflow.\nAxiome 4 — Chaque lancement d’un workflow s’appelle une exécution, « run » en anglais.\nAxiome 5 — Une exécution réussie a une coche verte, une exécution échouée une croix rouge, une exécution en cours un rond jaune.\nAxiome 6 — Pour suivre les exécutions, j’ouvre l’onglet « Actions ».\nAxiome 7 — Pour relancer une exécution échouée, je l’ouvre, puis je clique sur « Re-run jobs »."], ["Phrase", "Sept propositions : automatique ; déclenché ; workflow ; exécution ; couleurs ; onglet ; relance."]], "36": [["Axiome", "Axiome 5 — Une exécution réussie a une coche verte, une exécution échouée une croix rouge, une exécution en cours un rond jaune."], ["Phrase", "On dit d’une exécution qu’elle a réussi, échoué, ou qu’elle est en cours."]], "37": [["Axiome", "Axiome 5 — Une exécution réussie a une coche verte, une exécution échouée une croix rouge, une exécution en cours un rond jaune."], ["Phrase", "Si la coche est verte, la tâche a réussi."]], "38": [["Axiome", "Axiome 1 — GitHub Actions lance des tâches automatiquement, sur les serveurs de GitHub."], ["Phrase", "Conséquence nécessaire : on n’a rien à lancer soi-même."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les dépôts qui publient un site ont presque tous une exécution par commit."]], "40": [["Axiome", "Axiome 5 — Une exécution réussie a une coche verte, une exécution échouée une croix rouge, une exécution en cours un rond jaune."], ["Phrase", "Si le site n’a pas changé et que la croix est rouge, l’explication est l’échec de l’exécution."]], "41": [["Axiome", "Axiome 1 — GitHub Actions lance des tâches automatiquement, sur les serveurs de GitHub."], ["Phrase", "Argument : ce qui est automatique n’est pas oublié."]], "42": [["Axiome", "Axiome 4 — Chaque lancement d’un workflow s’appelle une exécution, « run » en anglais."], ["Phrase", "On montre une exécution en l’ouvrant : chaque étape s’y lit."]], "43": [["Axiome", "Axiome 1 — GitHub Actions lance des tâches automatiquement, sur les serveurs de GitHub.\nAxiome 2 — Une tâche se lance à la suite d’un événement, par exemple un commit.\nAxiome 3 — Un ensemble de tâches s’appelle un workflow.\nAxiome 4 — Chaque lancement d’un workflow s’appelle une exécution, « run » en anglais.\nAxiome 5 — Une exécution réussie a une coche verte, une exécution échouée une croix rouge, une exécution en cours un rond jaune.\nAxiome 6 — Pour suivre les exécutions, j’ouvre l’onglet « Actions ».\nAxiome 7 — Pour relancer une exécution échouée, je l’ouvre, puis je clique sur « Re-run jobs »."], ["Phrase", "Sept principes."]], "44": [["Axiome", "Axiome 5 — Une exécution réussie a une coche verte, une exécution échouée une croix rouge, une exécution en cours un rond jaune."], ["Phrase", "Exclu : une exécution à la fois réussie et échouée."]], "45": [["Axiome", "Axiome 1 — GitHub Actions lance des tâches automatiquement, sur les serveurs de GitHub.\nAxiome 2 — Une tâche se lance à la suite d’un événement, par exemple un commit.\nAxiome 3 — Un ensemble de tâches s’appelle un workflow.\nAxiome 4 — Chaque lancement d’un workflow s’appelle une exécution, « run » en anglais.\nAxiome 5 — Une exécution réussie a une coche verte, une exécution échouée une croix rouge, une exécution en cours un rond jaune.\nAxiome 6 — Pour suivre les exécutions, j’ouvre l’onglet « Actions ».\nAxiome 7 — Pour relancer une exécution échouée, je l’ouvre, puis je clique sur « Re-run jobs »."], ["Phrase", "Les axiomes s’accordent."]], "46": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Connaissance sûre."]], "47": [["Axiome", "Axiome 1 — GitHub Actions lance des tâches automatiquement, sur les serveurs de GitHub."], ["Phrase", "Justification : les tâches répétitives se font mieux toutes seules."]], "48": [["Axiome", "Axiome 5 — Une exécution réussie a une coche verte, une exécution échouée une croix rouge, une exécution en cours un rond jaune."], ["Phrase", "Preuve : la coche verte."]], "49": [["Axiome", "Axiome 5 — Une exécution réussie a une coche verte, une exécution échouée une croix rouge, une exécution en cours un rond jaune."], ["Phrase", "Une exécution a réussi si elle a une coche verte."]], "50": [["Axiome", "Axiome 6 — Pour suivre les exécutions, j’ouvre l’onglet « Actions »."], ["Phrase", "On vérifie dans l’onglet « Actions »."]], "51": [["Axiome", "Axiome 5 — Une exécution réussie a une coche verte, une exécution échouée une croix rouge, une exécution en cours un rond jaune."], ["Phrase", "Une croix rouge réfute le succès."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Certitude élevée sur l’état affiché."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Aucune hypothèse."]], "54": [["Axiome", "Axiome 5 — Une exécution réussie a une coche verte, une exécution échouée une croix rouge, une exécution en cours un rond jaune."], ["Phrase", "On observe l’état de chaque exécution."]], "55": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Modèle : si tel événement, alors telles tâches."]], "56": [["Axiome", "Axiome 1 — GitHub Actions lance des tâches automatiquement, sur les serveurs de GitHub."], ["Phrase", "C’est un service."]], "57": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Lancé en 2018, ouvert à tous en 2019."]], "58": [["Axiome", "Axiome 3 — Un ensemble de tâches s’appelle un workflow."], ["Phrase", "Son identité : le nom du workflow."]], "59": [["Axiome", "Axiome 1 — GitHub Actions lance des tâches automatiquement, sur les serveurs de GitHub."], ["Phrase", "Catégorie : les automatisations."]], "60": [["Axiome", "Axiome 2 — Une tâche se lance à la suite d’un événement, par exemple un commit."], ["Phrase", "Une exécution est possible à chaque événement, jamais obligatoire sans workflow."]], "61": [["Axiome", "Axiome 1 — GitHub Actions lance des tâches automatiquement, sur les serveurs de GitHub."], ["Phrase", "Son essence : automatiser."]], "62": [["Axiome", "Axiome 1 — GitHub Actions lance des tâches automatiquement, sur les serveurs de GitHub."], ["Phrase", "Il ne fait que les tâches décrites."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il prend son sens dans la publication et la vérification."]], "64": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On le regarde surtout quand le site ne se met pas à jour."]], "65": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les exécutions passées restent listées un certain temps."]], "66": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les workflows s’écrivent dans un format de texte, le YAML."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Domaine : l’automatisation."]], "68": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il travaille pour tous les membres du dépôt."]], "69": [["Axiome", "Axiome 1 — GitHub Actions lance des tâches automatiquement, sur les serveurs de GitHub."], ["Phrase", "Il tourne sur les serveurs de GitHub."]], "70": [["Axiome", "Axiome 1 — GitHub Actions lance des tâches automatiquement, sur les serveurs de GitHub."], ["Phrase", "Son rôle : automatiser."]], "71": [["Axiome", "Axiome 1 — GitHub Actions lance des tâches automatiquement, sur les serveurs de GitHub."], ["Phrase", "Il fournit des machines qui travaillent à ta place."]], "72": [["Axiome", "Axiome 7 — Pour relancer une exécution échouée, je l’ouvre, puis je clique sur « Re-run jobs »."], ["Phrase", "Opérations : suivre, relancer, annuler une exécution."]], "73": [["Axiome", "Axiome 5 — Une exécution réussie a une coche verte, une exécution échouée une croix rouge, une exécution en cours un rond jaune."], ["Phrase", "Dans l’action : un coup d’œil à la couleur dit si tout va bien."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il contribue à publier sans effort."]], "75": [["Axiome", "Axiome 1 — GitHub Actions lance des tâches automatiquement, sur les serveurs de GitHub."], ["Phrase", "Utile pour tout ce qui se répète."]], "76": [["Axiome", "Axiome 7 — Pour relancer une exécution échouée, je l’ouvre, puis je clique sur « Re-run jobs »."], ["Phrase", "Cliquer sur « Re-run jobs » relance l’exécution."]], "77": [["Axiome", "Axiome 6 — Pour suivre les exécutions, j’ouvre l’onglet « Actions ».\nAxiome 7 — Pour relancer une exécution échouée, je l’ouvre, puis je clique sur « Re-run jobs »."], ["Phrase", "Étape par étape : « Actions », l’exécution, l’état, et si besoin « Re-run jobs »."]], "78": [["Axiome", "Axiome 5 — Une exécution réussie a une coche verte, une exécution échouée une croix rouge, une exécution en cours un rond jaune."], ["Phrase", "Une exécution passe de jaune à vert ou à rouge."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La liste des exécutions s’allonge à chaque événement."]], "80": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il transforme un commit en site publié."]], "81": [["Axiome", "Axiome 2 — Une tâche se lance à la suite d’un événement, par exemple un commit."], ["Phrase", "Une exécution naît d’un événement."]], "82": [["Axiome", "Axiome 4 — Chaque lancement d’un workflow s’appelle une exécution, « run » en anglais.\nAxiome 5 — Une exécution réussie a une coche verte, une exécution échouée une croix rouge, une exécution en cours un rond jaune."], ["Phrase", "Processus : lancement, déroulement, résultat."]], "83": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les workflows se règlent dans `.github/workflows` et dans les paramètres."]], "84": [["Axiome", "Axiome 5 — Une exécution réussie a une coche verte, une exécution échouée une croix rouge, une exécution en cours un rond jaune."], ["Phrase", "États : en cours, réussie, échouée."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Appréciation : invisible quand tout va bien, précieux quand ça casse."]], "86": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Norme : vérifier la coche après chaque publication."]], "87": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Valeur : la fiabilité."]], "88": [["Axiome", "Axiome 5 — Une exécution réussie a une coche verte, une exécution échouée une croix rouge, une exécution en cours un rond jaune."], ["Phrase", "Critère : la coche verte."]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un bon workflow est rapide et réussit."]], "90": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Pertinent pour publier ; facultatif pour un dépôt qui ne publie rien."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’améliore en lisant l’étape en rouge pour comprendre l’échec."]]}, "pag": {"1": [["Axiome", "Axiome 1 — GitHub Pages publie un site web à partir des fichiers d’un dépôt.\nAxiome 2 — L’adresse du site est `compte.github.io/dépôt`.\nAxiome 3 — Le fichier `index.html` est la page d’accueil du site."], ["Phrase", "GitHub Pages met en jeu un dépôt, ses fichiers, une adresse, et une page d’accueil `index.html`."]], "2": [["Axiome", "Axiome 1 — GitHub Pages publie un site web à partir des fichiers d’un dépôt."], ["Phrase", "Son élément fondamental : les fichiers du dépôt, devenus site."]], "3": [["Axiome", "Axiome 1 — GitHub Pages publie un site web à partir des fichiers d’un dépôt.\nAxiome 3 — Le fichier `index.html` est la page d’accueil du site."], ["Phrase", "Les fichiers du dépôt forment le site ; `index.html` en est l’entrée."]], "4": [["Axiome", "Axiome 3 — Le fichier `index.html` est la page d’accueil du site."], ["Phrase", "Le site se décompose en pages : `index.html`, puis les autres."]], "5": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un site par dépôt ; un site de 1 Go au plus."]], "6": [["Axiome", "Axiome 1 — GitHub Pages publie un site web à partir des fichiers d’un dépôt."], ["Phrase", "Nature : un hébergement de site."]], "7": [["Axiome", "Axiome 1 — GitHub Pages publie un site web à partir des fichiers d’un dépôt."], ["Phrase", "GitHub Pages, c’est ce qui transforme un dépôt en site web."]], "8": [["Axiome", "Axiome 1 — GitHub Pages publie un site web à partir des fichiers d’un dépôt.\nAxiome 2 — L’adresse du site est `compte.github.io/dépôt`."], ["Phrase", "GitHub Pages publie un site web à partir des fichiers d’un dépôt, à l’adresse `compte.github.io/dépôt`."]], "9": [["Axiome", "Axiome 1 — GitHub Pages publie un site web à partir des fichiers d’un dépôt.\nAxiome 2 — L’adresse du site est `compte.github.io/dépôt`.\nAxiome 5 — Le site se met à jour après chaque commit sur la branche publiée."], ["Phrase", "Publier, donner une adresse, se mettre à jour à chaque commit."]], "10": [["Axiome", "Axiome 2 — L’adresse du site est `compte.github.io/dépôt`."], ["Phrase", "`payetemmy.github.io/support-autoformation` : ton site est publié ainsi."]], "11": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Nom officiel : GitHub Pages ; on dit aussi « Pages »."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Pages » : les pages web du site."]], "13": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On peut le voir comme un hébergeur gratuit attaché à GitHub."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Page » désigne aussi la page d’un livre ; ici, une page web."]], "15": [["Axiome", "Axiome 3 — Le fichier `index.html` est la page d’accueil du site."], ["Phrase", "Organisation : `index.html` à l’entrée, les autres pages autour."]], "16": [["Axiome", "Axiome 3 — Le fichier `index.html` est la page d’accueil du site."], ["Phrase", "Hiérarchie : la page d’accueil, puis les pages des sous-dossiers."]], "17": [["Axiome", "Axiome 1 — GitHub Pages publie un site web à partir des fichiers d’un dépôt.\nAxiome 2 — L’adresse du site est `compte.github.io/dépôt`."], ["Phrase", "Vue d’ensemble : un dépôt d’un côté, un site en ligne de l’autre."]], "18": [["Axiome", "Axiome 2 — L’adresse du site est `compte.github.io/dépôt`."], ["Phrase · hors axiomes", "Un dossier du dépôt devient une partie de l’adresse : `github/` donne `…/github/`."]], "19": [["Axiome", "Axiome 1 — GitHub Pages publie un site web à partir des fichiers d’un dépôt."], ["Phrase", "Il se range parmi les hébergeurs de sites."]], "20": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Deux sortes de sites : celui d’un compte (`compte.github.io`) et ceux des dépôts (`compte.github.io/dépôt`)."]], "21": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Chaque dépôt peut avoir son propre site."]], "22": [["Axiome", "Axiome 1 — GitHub Pages publie un site web à partir des fichiers d’un dépôt."], ["Phrase", "Le site est lié au dépôt dont il vient."]], "23": [["Axiome", "Axiome 1 — GitHub Pages publie un site web à partir des fichiers d’un dépôt.\nAxiome 5 — Le site se met à jour après chaque commit sur la branche publiée."], ["Phrase", "Puisque le site vient des fichiers, changer un fichier change le site après le commit."]], "24": [["Axiome", "Axiome 5 — Le site se met à jour après chaque commit sur la branche publiée."], ["Phrase", "Un commit sur la branche publiée cause une mise à jour du site."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Plus les fichiers sont lourds, plus la publication est lente."]], "26": [["Axiome", "Axiome 1 — GitHub Pages publie un site web à partir des fichiers d’un dépôt."], ["Phrase", "Sa fonction : publier."]], "27": [["Axiome", "Axiome 4 — Sur un compte gratuit, le dépôt doit être public."], ["Phrase", "Sur un compte gratuit, il dépend de la visibilité publique."]], "28": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il s’oppose aux sites dynamiques : il ne sert que des fichiers, sans base de données."]], "29": [["Axiome", "Axiome 5 — Le site se met à jour après chaque commit sur la branche publiée."], ["Phrase", "Commit et publication se complètent : on enregistre, le site suit."]], "30": [["Axiome", "Axiome 4 — Sur un compte gratuit, le dépôt doit être public.\nAxiome 6 — Pour activer GitHub Pages, j’ouvre les paramètres, section « Pages »."], ["Phrase", "Il faut un dépôt public, sur un compte gratuit, et Pages activé."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Comme un hébergeur classique, mais alimenté directement par le dépôt."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le site reflète le dépôt ; ce que les visiteurs voient vient des fichiers."]], "33": [["Axiome", "Axiome 5 — Le site se met à jour après chaque commit sur la branche publiée."], ["Phrase", "Le commit d’abord, la mise à jour ensuite."]], "34": [["Axiome", "Axiome 2 — L’adresse du site est `compte.github.io/dépôt`."], ["Phrase", "Le site est à une autre adresse que le dépôt : `github.io` au lieu de `github.com`."]], "35": [["Axiome", "Axiome 1 — GitHub Pages publie un site web à partir des fichiers d’un dépôt.\nAxiome 2 — L’adresse du site est `compte.github.io/dépôt`.\nAxiome 3 — Le fichier `index.html` est la page d’accueil du site.\nAxiome 4 — Sur un compte gratuit, le dépôt doit être public.\nAxiome 5 — Le site se met à jour après chaque commit sur la branche publiée.\nAxiome 6 — Pour activer GitHub Pages, j’ouvre les paramètres, section « Pages ».\nAxiome 7 — Sous « Source », je choisis « Deploy from a branch », puis la branche et le dossier, puis « Save »."], ["Phrase", "Sept propositions : publier ; adresse ; `index.html` ; public ; mise à jour ; « Pages » ; « Source »."]], "36": [["Axiome", "Axiome 1 — GitHub Pages publie un site web à partir des fichiers d’un dépôt."], ["Phrase", "On dit d’un dépôt qu’il est publié."]], "37": [["Axiome", "Axiome 3 — Le fichier `index.html` est la page d’accueil du site."], ["Phrase", "Si `index.html` manque, la page d’accueil ne s’affiche pas."]], "38": [["Axiome", "Axiome 4 — Sur un compte gratuit, le dépôt doit être public."], ["Phrase", "Conséquence nécessaire : sur un compte gratuit, rendre le dépôt privé arrête le site."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Des milliers de sites personnels et de documentations sont publiés ainsi."]], "40": [["Axiome", "Axiome 3 — Le fichier `index.html` est la page d’accueil du site."], ["Phrase", "Si l’adresse donne une erreur 404, la meilleure explication est un `index.html` absent ou mal nommé."]], "41": [["Axiome", "Axiome 4 — Sur un compte gratuit, le dépôt doit être public."], ["Phrase", "Argument : gratuit pour un dépôt public."]], "42": [["Axiome", "Axiome 2 — L’adresse du site est `compte.github.io/dépôt`."], ["Phrase", "On le montre en ouvrant l’adresse du site."]], "43": [["Axiome", "Axiome 1 — GitHub Pages publie un site web à partir des fichiers d’un dépôt.\nAxiome 2 — L’adresse du site est `compte.github.io/dépôt`.\nAxiome 3 — Le fichier `index.html` est la page d’accueil du site.\nAxiome 4 — Sur un compte gratuit, le dépôt doit être public.\nAxiome 5 — Le site se met à jour après chaque commit sur la branche publiée.\nAxiome 6 — Pour activer GitHub Pages, j’ouvre les paramètres, section « Pages ».\nAxiome 7 — Sous « Source », je choisis « Deploy from a branch », puis la branche et le dossier, puis « Save »."], ["Phrase", "Sept principes."]], "44": [["Axiome", "Axiome 4 — Sur un compte gratuit, le dépôt doit être public."], ["Phrase", "Exclu, sur un compte gratuit : un site publié depuis un dépôt privé."]], "45": [["Axiome", "Axiome 1 — GitHub Pages publie un site web à partir des fichiers d’un dépôt.\nAxiome 2 — L’adresse du site est `compte.github.io/dépôt`.\nAxiome 3 — Le fichier `index.html` est la page d’accueil du site.\nAxiome 4 — Sur un compte gratuit, le dépôt doit être public.\nAxiome 5 — Le site se met à jour après chaque commit sur la branche publiée.\nAxiome 6 — Pour activer GitHub Pages, j’ouvre les paramètres, section « Pages ».\nAxiome 7 — Sous « Source », je choisis « Deploy from a branch », puis la branche et le dossier, puis « Save »."], ["Phrase", "Les axiomes s’accordent."]], "46": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Connaissance sûre ; les détails de réglage changent parfois."]], "47": [["Axiome", "Axiome 1 — GitHub Pages publie un site web à partir des fichiers d’un dépôt."], ["Phrase", "Justification : avoir un site sans serveur à soi."]], "48": [["Axiome", "Axiome 2 — L’adresse du site est `compte.github.io/dépôt`."], ["Phrase", "Preuve : le site s’ouvre à son adresse."]], "49": [["Axiome", "Axiome 2 — L’adresse du site est `compte.github.io/dépôt`."], ["Phrase", "Un dépôt est publié si son adresse `github.io` répond."]], "50": [["Axiome", "Axiome 6 — Pour activer GitHub Pages, j’ouvre les paramètres, section « Pages »."], ["Phrase", "On vérifie dans « Settings » › « Pages », où l’adresse du site est affichée."]], "51": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Réfuté par une erreur 404 : site non publié, ou page absente."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Certitude élevée."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Aucune hypothèse."]], "54": [["Axiome", "Axiome 2 — L’adresse du site est `compte.github.io/dépôt`."], ["Phrase", "On observe le site à son adresse."]], "55": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Modèle : les fichiers du dépôt sont copiés sur un serveur web."]], "56": [["Axiome", "Axiome 1 — GitHub Pages publie un site web à partir des fichiers d’un dépôt."], ["Phrase", "C’est un hébergement de site."]], "57": [["Axiome", "Axiome 6 — Pour activer GitHub Pages, j’ouvre les paramètres, section « Pages ».\nAxiome 7 — Sous « Source », je choisis « Deploy from a branch », puis la branche et le dossier, puis « Save »."], ["Phrase", "Il existe dès qu’on l’active."]], "58": [["Axiome", "Axiome 2 — L’adresse du site est `compte.github.io/dépôt`."], ["Phrase", "Son identité : l’adresse du site."]], "59": [["Axiome", "Axiome 1 — GitHub Pages publie un site web à partir des fichiers d’un dépôt."], ["Phrase", "Catégorie : les hébergeurs."]], "60": [["Axiome", "Axiome 6 — Pour activer GitHub Pages, j’ouvre les paramètres, section « Pages »."], ["Phrase", "Il est possible, pas activé par défaut."]], "61": [["Axiome", "Axiome 1 — GitHub Pages publie un site web à partir des fichiers d’un dépôt."], ["Phrase", "Son essence : publier des fichiers comme site."]], "62": [["Axiome", "Axiome 1 — GitHub Pages publie un site web à partir des fichiers d’un dépôt."], ["Phrase · hors axiomes", "Il ne publie que des fichiers : pas de programme côté serveur."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il prend son sens pour les sites simples : présentation, documentation, outil en une page."]], "64": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’active une fois ; ensuite, chaque commit publie."]], "65": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il existe depuis 2008."]], "66": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Très utilisé pour les documentations de projets libres."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Domaine : la publication web."]], "68": [["Axiome", "Axiome 2 — L’adresse du site est `compte.github.io/dépôt`."], ["Phrase", "Il donne une adresse publique à partager."]], "69": [["Axiome", "Axiome 2 — L’adresse du site est `compte.github.io/dépôt`."], ["Phrase", "Il place le site à une adresse fixe."]], "70": [["Axiome", "Axiome 1 — GitHub Pages publie un site web à partir des fichiers d’un dépôt."], ["Phrase", "Son rôle : publier."]], "71": [["Axiome", "Axiome 2 — L’adresse du site est `compte.github.io/dépôt`."], ["Phrase", "Il fournit une adresse et un hébergement."]], "72": [["Axiome", "Axiome 6 — Pour activer GitHub Pages, j’ouvre les paramètres, section « Pages ».\nAxiome 7 — Sous « Source », je choisis « Deploy from a branch », puis la branche et le dossier, puis « Save »."], ["Phrase", "Opérations : activer, choisir la branche et le dossier, désactiver."]], "73": [["Axiome", "Axiome 5 — Le site se met à jour après chaque commit sur la branche publiée."], ["Phrase", "Dans l’action : un commit et le site change."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il contribue à montrer son travail au monde."]], "75": [["Axiome", "Axiome 4 — Sur un compte gratuit, le dépôt doit être public."], ["Phrase", "Utile et gratuit pour un dépôt public."]], "76": [["Axiome", "Axiome 7 — Sous « Source », je choisis « Deploy from a branch », puis la branche et le dossier, puis « Save »."], ["Phrase", "Cliquer sur « Save » active la publication."]], "77": [["Axiome", "Axiome 6 — Pour activer GitHub Pages, j’ouvre les paramètres, section « Pages ».\nAxiome 7 — Sous « Source », je choisis « Deploy from a branch », puis la branche et le dossier, puis « Save »."], ["Phrase", "Étape par étape : « Settings », « Pages », « Deploy from a branch », branche, dossier, « Save »."]], "78": [["Axiome", "Axiome 5 — Le site se met à jour après chaque commit sur la branche publiée."], ["Phrase", "Le site change à chaque commit sur la branche publiée."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il grandit avec le dépôt."]], "80": [["Axiome", "Axiome 1 — GitHub Pages publie un site web à partir des fichiers d’un dépôt."], ["Phrase", "Il transforme des fichiers en site."]], "81": [["Axiome", "Axiome 7 — Sous « Source », je choisis « Deploy from a branch », puis la branche et le dossier, puis « Save »."], ["Phrase", "Il naît du réglage « Source »."]], "82": [["Axiome", "Axiome 5 — Le site se met à jour après chaque commit sur la branche publiée."], ["Phrase", "Processus : commit, construction, mise en ligne."]], "83": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On peut lui donner son propre nom de domaine."]], "84": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "États : désactivé, en construction, publié."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Appréciation : simple, gratuit, fiable."]], "86": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Norme : un `index.html` à la racine du dossier publié."]], "87": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Valeur : publier sans coût."]], "88": [["Axiome", "Axiome 3 — Le fichier `index.html` est la page d’accueil du site.\nAxiome 5 — Le site se met à jour après chaque commit sur la branche publiée."], ["Phrase", "Critères : un `index.html`, une mise à jour qui suit les commits."]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un bon site Pages est léger et se charge vite."]], "90": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Pertinent pour un site simple ; insuffisant pour un site avec comptes et base de données."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un fichier `.nojekyll` à la racine publie les fichiers tels quels, sans transformation."]]}, "cyc": {"1": [["Axiome", "Axiome 2 — Il a quatre étapes : modifier, enregistrer, construire, afficher."], ["Phrase", "Le cycle se compose de quatre étapes : modifier, enregistrer, construire, afficher."]], "2": [["Axiome", "Axiome 2 — Il a quatre étapes : modifier, enregistrer, construire, afficher."], ["Phrase", "Son élément fondamental : l’étape."]], "3": [["Axiome", "Axiome 3 — Modifier : je change un fichier du dépôt.\nAxiome 4 — Enregistrer : je fais un commit sur la branche publiée.\nAxiome 5 — Construire : une exécution « pages build and deployment » se lance dans « Actions ».\nAxiome 6 — Afficher : quand elle a sa coche verte, la nouvelle version est en ligne."], ["Phrase", "Les quatre étapes s’enchaînent : un fichier changé, un commit, une exécution, un site à jour."]], "4": [["Axiome", "Axiome 3 — Modifier : je change un fichier du dépôt.\nAxiome 4 — Enregistrer : je fais un commit sur la branche publiée.\nAxiome 5 — Construire : une exécution « pages build and deployment » se lance dans « Actions ».\nAxiome 6 — Afficher : quand elle a sa coche verte, la nouvelle version est en ligne."], ["Phrase", "Il se décompose en quatre étapes, chacune avec son geste ou son signe."]], "5": [["Axiome", "Axiome 2 — Il a quatre étapes : modifier, enregistrer, construire, afficher."], ["Phrase", "Quatre étapes, pas une de plus."]], "6": [["Axiome", "Axiome 3 — Modifier : je change un fichier du dépôt.\nAxiome 4 — Enregistrer : je fais un commit sur la branche publiée.\nAxiome 5 — Construire : une exécution « pages build and deployment » se lance dans « Actions ».\nAxiome 6 — Afficher : quand elle a sa coche verte, la nouvelle version est en ligne."], ["Phrase", "Deux étapes sont faites par toi, modifier et enregistrer ; deux par GitHub, construire et afficher."]], "7": [["Axiome", "Axiome 1 — Le cycle de publication mène d’un changement à sa mise en ligne."], ["Phrase", "Le cycle de publication, c’est le chemin d’un changement jusqu’au site en ligne."]], "8": [["Axiome", "Axiome 1 — Le cycle de publication mène d’un changement à sa mise en ligne.\nAxiome 2 — Il a quatre étapes : modifier, enregistrer, construire, afficher."], ["Phrase", "Le cycle de publication mène d’un changement à sa mise en ligne, en quatre étapes."]], "9": [["Axiome", "Axiome 1 — Le cycle de publication mène d’un changement à sa mise en ligne.\nAxiome 2 — Il a quatre étapes : modifier, enregistrer, construire, afficher.\nAxiome 7 — La mise en ligne prend en général une à deux minutes."], ["Phrase", "Mener du changement au site, en quatre étapes, en une à deux minutes."]], "10": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Corriger une faute sur ton support, ajouter une notion, changer une couleur."]], "11": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En anglais : deployment, « déploiement »."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Cycle » : ce qui revient ; on le refait à chaque changement."]], "13": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On peut le voir comme une chaîne : si un maillon casse, le site ne change pas."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Publication » désigne aussi un livre ou un article ; ici, la mise en ligne."]], "15": [["Axiome", "Axiome 2 — Il a quatre étapes : modifier, enregistrer, construire, afficher."], ["Phrase", "Organisation : une suite de quatre étapes."]], "16": [["Axiome", "Axiome 2 — Il a quatre étapes : modifier, enregistrer, construire, afficher."], ["Phrase", "Pas de hiérarchie : chaque étape attend la précédente."]], "17": [["Axiome", "Axiome 1 — Le cycle de publication mène d’un changement à sa mise en ligne.\nAxiome 2 — Il a quatre étapes : modifier, enregistrer, construire, afficher."], ["Phrase", "Vue d’ensemble : du fichier au site."]], "18": [["Axiome", "Axiome 5 — Construire : une exécution « pages build and deployment » se lance dans « Actions »."], ["Phrase", "On passe de l’onglet « Code » à l’onglet « Actions », puis au site."]], "19": [["Axiome", "Axiome 1 — Le cycle de publication mène d’un changement à sa mise en ligne."], ["Phrase", "Il se range parmi les processus de publication."]], "20": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Variante : publier par une pull request fusionnée, au lieu d’un commit direct."]], "21": [["Axiome", "Axiome 2 — Il a quatre étapes : modifier, enregistrer, construire, afficher."], ["Phrase", "Chaque étape se vérifie seule."]], "22": [["Axiome", "Axiome 2 — Il a quatre étapes : modifier, enregistrer, construire, afficher."], ["Phrase", "Chaque étape est liée à la suivante."]], "23": [["Axiome", "Axiome 4 — Enregistrer : je fais un commit sur la branche publiée.\nAxiome 5 — Construire : une exécution « pages build and deployment » se lance dans « Actions »."], ["Phrase", "Pas de commit, pas de construction."]], "24": [["Axiome", "Axiome 4 — Enregistrer : je fais un commit sur la branche publiée.\nAxiome 5 — Construire : une exécution « pages build and deployment » se lance dans « Actions »."], ["Phrase", "Le commit cause l’exécution, qui cause la mise en ligne."]], "25": [["Axiome", "Axiome 7 — La mise en ligne prend en général une à deux minutes."], ["Phrase · hors axiomes", "Plus le site est gros, plus le cycle est long."]], "26": [["Axiome", "Axiome 1 — Le cycle de publication mène d’un changement à sa mise en ligne."], ["Phrase", "Sa fonction : mettre en ligne."]], "27": [["Axiome", "Axiome 5 — Construire : une exécution « pages build and deployment » se lance dans « Actions ».\nAxiome 6 — Afficher : quand elle a sa coche verte, la nouvelle version est en ligne."], ["Phrase", "L’affichage dépend de la construction."]], "28": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il s’oppose au changement resté dans l’éditeur, jamais enregistré."]], "29": [["Axiome", "Axiome 3 — Modifier : je change un fichier du dépôt.\nAxiome 4 — Enregistrer : je fais un commit sur la branche publiée."], ["Phrase", "Modifier et enregistrer se complètent : sans commit, la modification est perdue."]], "30": [["Axiome", "Axiome 4 — Enregistrer : je fais un commit sur la branche publiée."], ["Phrase", "Le commit doit être sur la branche publiée."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Comme envoyer un document à l’imprimeur : on corrige, on envoie, on attend, on reçoit."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ce que tu vois sur le site dépend de ce que tu as enregistré."]], "33": [["Axiome", "Axiome 2 — Il a quatre étapes : modifier, enregistrer, construire, afficher.\nAxiome 7 — La mise en ligne prend en général une à deux minutes."], ["Phrase", "Une suite dans le temps, d’une à deux minutes."]], "34": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il traverse trois endroits : l’éditeur, l’onglet « Actions », le site."]], "35": [["Axiome", "Axiome 1 — Le cycle de publication mène d’un changement à sa mise en ligne.\nAxiome 2 — Il a quatre étapes : modifier, enregistrer, construire, afficher.\nAxiome 3 — Modifier : je change un fichier du dépôt.\nAxiome 4 — Enregistrer : je fais un commit sur la branche publiée.\nAxiome 5 — Construire : une exécution « pages build and deployment » se lance dans « Actions ».\nAxiome 6 — Afficher : quand elle a sa coche verte, la nouvelle version est en ligne.\nAxiome 7 — La mise en ligne prend en général une à deux minutes.\nAxiome 8 — Si le site ne change pas, je recharge sa page, car le navigateur peut garder l’ancienne version."], ["Phrase", "Huit propositions : le chemin ; les quatre étapes ; chacune ; la durée ; recharger."]], "36": [["Axiome", "Axiome 1 — Le cycle de publication mène d’un changement à sa mise en ligne."], ["Phrase", "On dit d’un changement qu’il est publié."]], "37": [["Axiome", "Axiome 6 — Afficher : quand elle a sa coche verte, la nouvelle version est en ligne."], ["Phrase", "Si la coche est verte, la nouvelle version est en ligne."]], "38": [["Axiome", "Axiome 2 — Il a quatre étapes : modifier, enregistrer, construire, afficher."], ["Phrase", "Conséquence nécessaire : sauter une étape bloque le cycle."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Après quelques publications, le cycle devient un réflexe."]], "40": [["Axiome", "Axiome 8 — Si le site ne change pas, je recharge sa page, car le navigateur peut garder l’ancienne version."], ["Phrase", "Coche verte mais site inchangé : la meilleure explication est que le navigateur garde l’ancienne version."]], "41": [["Axiome", "Axiome 1 — Le cycle de publication mène d’un changement à sa mise en ligne.\nAxiome 2 — Il a quatre étapes : modifier, enregistrer, construire, afficher."], ["Phrase", "Argument : quatre étapes simples suffisent pour publier."]], "42": [["Axiome", "Axiome 6 — Afficher : quand elle a sa coche verte, la nouvelle version est en ligne."], ["Phrase", "On montre la publication par la coche verte puis le site."]], "43": [["Axiome", "Axiome 1 — Le cycle de publication mène d’un changement à sa mise en ligne.\nAxiome 2 — Il a quatre étapes : modifier, enregistrer, construire, afficher.\nAxiome 3 — Modifier : je change un fichier du dépôt.\nAxiome 4 — Enregistrer : je fais un commit sur la branche publiée.\nAxiome 5 — Construire : une exécution « pages build and deployment » se lance dans « Actions ».\nAxiome 6 — Afficher : quand elle a sa coche verte, la nouvelle version est en ligne.\nAxiome 7 — La mise en ligne prend en général une à deux minutes.\nAxiome 8 — Si le site ne change pas, je recharge sa page, car le navigateur peut garder l’ancienne version."], ["Phrase", "Huit principes."]], "44": [["Axiome", "Axiome 2 — Il a quatre étapes : modifier, enregistrer, construire, afficher."], ["Phrase", "Exclu : un site à jour sans commit."]], "45": [["Axiome", "Axiome 1 — Le cycle de publication mène d’un changement à sa mise en ligne.\nAxiome 2 — Il a quatre étapes : modifier, enregistrer, construire, afficher.\nAxiome 3 — Modifier : je change un fichier du dépôt.\nAxiome 4 — Enregistrer : je fais un commit sur la branche publiée.\nAxiome 5 — Construire : une exécution « pages build and deployment » se lance dans « Actions ».\nAxiome 6 — Afficher : quand elle a sa coche verte, la nouvelle version est en ligne.\nAxiome 7 — La mise en ligne prend en général une à deux minutes.\nAxiome 8 — Si le site ne change pas, je recharge sa page, car le navigateur peut garder l’ancienne version."], ["Phrase", "Les axiomes s’accordent."]], "46": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Connaissance sûre, vérifiée sur ton propre site."]], "47": [["Axiome", "Axiome 1 — Le cycle de publication mène d’un changement à sa mise en ligne."], ["Phrase", "Justification : savoir où en est son changement."]], "48": [["Axiome", "Axiome 6 — Afficher : quand elle a sa coche verte, la nouvelle version est en ligne."], ["Phrase", "Preuve : la coche verte, puis la page changée."]], "49": [["Axiome", "Axiome 6 — Afficher : quand elle a sa coche verte, la nouvelle version est en ligne."], ["Phrase", "Un changement est publié quand l’exécution a sa coche verte."]], "50": [["Axiome", "Axiome 6 — Afficher : quand elle a sa coche verte, la nouvelle version est en ligne.\nAxiome 8 — Si le site ne change pas, je recharge sa page, car le navigateur peut garder l’ancienne version."], ["Phrase", "On vérifie en ouvrant le site, après rechargement."]], "51": [["Axiome", "Axiome 5 — Construire : une exécution « pages build and deployment » se lance dans « Actions »."], ["Phrase", "Réfuté par une croix rouge : la construction a échoué."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Certitude élevée."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Aucune hypothèse."]], "54": [["Axiome", "Axiome 5 — Construire : une exécution « pages build and deployment » se lance dans « Actions ».\nAxiome 6 — Afficher : quand elle a sa coche verte, la nouvelle version est en ligne."], ["Phrase", "On l’observe dans « Actions » puis sur le site."]], "55": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Modèle : une chaîne qui part du dépôt et arrive au site."]], "56": [["Axiome", "Axiome 1 — Le cycle de publication mène d’un changement à sa mise en ligne."], ["Phrase", "C’est un processus."]], "57": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il existe dès que GitHub Pages est activé."]], "58": [["Axiome", "Axiome 2 — Il a quatre étapes : modifier, enregistrer, construire, afficher."], ["Phrase", "Son identité : ses quatre étapes."]], "59": [["Axiome", "Axiome 1 — Le cycle de publication mène d’un changement à sa mise en ligne."], ["Phrase", "Catégorie : les processus."]], "60": [["Axiome", "Axiome 7 — La mise en ligne prend en général une à deux minutes."], ["Phrase", "La durée varie : une à deux minutes en général, parfois plus."]], "61": [["Axiome", "Axiome 1 — Le cycle de publication mène d’un changement à sa mise en ligne."], ["Phrase", "Son essence : du changement au site."]], "62": [["Axiome", "Axiome 1 — Le cycle de publication mène d’un changement à sa mise en ligne."], ["Phrase", "Il s’arrête à la mise en ligne."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il prend son sens à chaque changement de ton support."]], "64": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On le suit de près quand le site ne change pas."]], "65": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Chaque cycle laisse une trace : un commit et une exécution."]], "66": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "C’est le geste quotidien de qui publie un site sur GitHub."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Domaine : la publication web."]], "68": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il rend le changement visible pour tous."]], "69": [["Axiome", "Axiome 7 — La mise en ligne prend en général une à deux minutes."], ["Phrase", "Il prend une à deux minutes."]], "70": [["Axiome", "Axiome 1 — Le cycle de publication mène d’un changement à sa mise en ligne."], ["Phrase", "Son rôle : publier."]], "71": [["Axiome", "Axiome 5 — Construire : une exécution « pages build and deployment » se lance dans « Actions ».\nAxiome 6 — Afficher : quand elle a sa coche verte, la nouvelle version est en ligne."], ["Phrase", "Il fournit des signes pour suivre son changement."]], "72": [["Axiome", "Axiome 3 — Modifier : je change un fichier du dépôt.\nAxiome 4 — Enregistrer : je fais un commit sur la branche publiée."], ["Phrase", "Opérations : modifier, enregistrer, puis attendre et vérifier."]], "73": [["Axiome", "Axiome 6 — Afficher : quand elle a sa coche verte, la nouvelle version est en ligne."], ["Phrase", "Dans l’action : on sait quand c’est en ligne."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il contribue à un site à jour."]], "75": [["Axiome", "Axiome 1 — Le cycle de publication mène d’un changement à sa mise en ligne."], ["Phrase", "Utile pour savoir où en est un changement."]], "76": [["Axiome", "Axiome 4 — Enregistrer : je fais un commit sur la branche publiée."], ["Phrase", "Le commit lance le cycle."]], "77": [["Axiome", "Axiome 3 — Modifier : je change un fichier du dépôt.\nAxiome 4 — Enregistrer : je fais un commit sur la branche publiée.\nAxiome 5 — Construire : une exécution « pages build and deployment » se lance dans « Actions ».\nAxiome 6 — Afficher : quand elle a sa coche verte, la nouvelle version est en ligne.\nAxiome 8 — Si le site ne change pas, je recharge sa page, car le navigateur peut garder l’ancienne version."], ["Phrase", "Étape par étape : crayon, commit, onglet « Actions », coche verte, site rechargé."]], "78": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Chaque cycle change le site."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le cycle reste le même ; c’est le site qui évolue."]], "80": [["Axiome", "Axiome 1 — Le cycle de publication mène d’un changement à sa mise en ligne."], ["Phrase", "Il transforme un changement en site en ligne."]], "81": [["Axiome", "Axiome 3 — Modifier : je change un fichier du dépôt."], ["Phrase", "Il commence par une modification."]], "82": [["Axiome", "Axiome 2 — Il a quatre étapes : modifier, enregistrer, construire, afficher."], ["Phrase", "Processus : modifier, enregistrer, construire, afficher."]], "83": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il s’adapte : commit direct, ou passage par une branche et une pull request."]], "84": [["Axiome", "Axiome 3 — Modifier : je change un fichier du dépôt.\nAxiome 4 — Enregistrer : je fais un commit sur la branche publiée.\nAxiome 5 — Construire : une exécution « pages build and deployment » se lance dans « Actions ».\nAxiome 6 — Afficher : quand elle a sa coche verte, la nouvelle version est en ligne."], ["Phrase", "États successifs : modifié, enregistré, construit, affiché."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Appréciation : court et sûr."]], "86": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Norme : attendre la coche verte avant de juger le résultat."]], "87": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Valeur : la maîtrise de ce qu’on publie."]], "88": [["Axiome", "Axiome 6 — Afficher : quand elle a sa coche verte, la nouvelle version est en ligne.\nAxiome 7 — La mise en ligne prend en général une à deux minutes."], ["Phrase", "Critères : la coche verte en une à deux minutes."]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un bon cycle est court et sans croix rouge."]], "90": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Pertinent à chaque publication."]], "91": [["Axiome", "Axiome 8 — Si le site ne change pas, je recharge sa page, car le navigateur peut garder l’ancienne version."], ["Phrase", "On l’améliore en rechargeant la page du site, ou en vidant le cache, quand rien ne change."]]}};

function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function code(e,s){s.split("`").forEach(function(p,i){if(i%2)e.appendChild(el("code",null,p));else if(p)e.appendChild(document.createTextNode(p.replace(/« /g,"«\u00a0").replace(/ ([»?!:;])/g,"\u00a0$1")))})}

/* lecture du plan Mermaid */
var N={},IDS=[];
PLAN.split("\n").forEach(function(l){var m=l.match(/^\s*([A-Za-z_]\w*)\s*\["(.*)"\]\s*$/);
  if(m){N[m[1]]={id:m[1],t:m[2],p:[],k:[]};IDS.push(m[1])}});
PLAN.split("\n").forEach(function(l){var m=l.match(/^\s*([A-Za-z_]\w*)\s*-->\s*([A-Za-z_]\w*)\s*$/);
  if(m&&N[m[1]]&&N[m[2]]){N[m[1]].k.push(m[2]);N[m[2]].p.push(m[1])}});
function depth(i){var n=N[i];if(n.d!=null)return n.d;n.d=0;n.p.forEach(function(p){n.d=Math.max(n.d,depth(p)+1)});return n.d}
IDS.forEach(depth);

/* état : compétences acquises, et type de contenu choisi pour chaque boîte
   ("p" principes, "r" pratique, ou n° de dimension) */
var KEY="plan-"+SUJET.nom,ACQ={},MODES={},DIM={};
G.forEach(function(g){g.i.forEach(function(d){DIM[d[0]]=d})});
try{var sv=JSON.parse(localStorage.getItem(KEY)||"null");if(sv){ACQ=sv.a||{};MODES=sv.ms||{}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({a:ACQ,ms:MODES}))}catch(e){}push()}
/* au départ, une boîte montre ses principes */
function mode(i){var m=MODES[i];if(m==="r"||m==="l"||DIM[m]||(m==="i"&&IMG[COMP[i].notion]))return m;return "p"}
/* notes : une par boîte, gardées à part (Recommencer ne les efface pas) */
var NKEY="notes-"+SUJET.nom,NOTES={};
try{NOTES=JSON.parse(localStorage.getItem(NKEY)||"{}")||{}}catch(e){}
function saveNotes(){try{localStorage.setItem(NKEY,JSON.stringify(NOTES))}catch(e){}push()}

/* page publiée : notes et compétences acquises sont aussi gardées en ligne, dans la base
   de la page (document etat/<sujet>, lisible et modifiable par le propriétaire seulement).
   Sans base (fichier ouvert seul), tout reste sur cet appareil. */
var DOC=null,LAST=null,WB=false,WN=false,ONL=false;
var DOCP="etat/"+(SUJET.nom.toLowerCase().replace(/[^a-z0-9]+/g,"-")||"sujet");
function snapshot(){return JSON.stringify({notes:NOTES,acq:ACQ})}
function push(){
  if(!DOC)return;
  if(WB){WN=true;return}
  var body=snapshot();if(body===LAST)return;
  WB=true;var tries=0;
  (function go(){DOC.set(JSON.parse(body)).then(function(){LAST=body;done()},function(e){
    if(e&&e.code==="unavailable"&&!tries++)return setTimeout(go,800+Math.random()*700);
    online(false,"L’enregistrement en ligne a échoué. Tes notes restent sur cet appareil : copie-les par sécurité.");done()})})();
  function done(){WB=false;if(WN){WN=false;push()}}
}
function online(ok,msg){
  ONL=ok;var p=document.getElementById("mp");if(!p)return;
  p.textContent=msg||(ok?"Tes notes sont enregistrées en ligne avec la page : elles restent d’une version à l’autre et d’un appareil à l’autre.":
    "Tes notes restent sur cet appareil. Copie-les de temps en temps : une nouvelle version du fichier peut repartir sans elles.");
}
function connect(){
  if(connect.done||!(window.claude&&typeof window.claude.use==="function"))return;connect.done=true;
  var timer=setTimeout(function(){online(false,"Enregistrement en ligne pas encore joignable. Tes notes restent sur cet appareil.")},10000);
  window.claude.use("db").then(function(db){
    if(!db){clearTimeout(timer);return online(false)}
    var ref=db.doc(DOCP);
    ref.get().then(function(sn){
      clearTimeout(timer);DOC=ref;
      var d=sn&&sn.exists?(sn.data()||{}):{},dn=d.notes||{},da=d.acq||{},changed=false;
      var mn={},ma={};Object.keys(dn).forEach(function(k){mn[k]=dn[k]});Object.keys(da).forEach(function(k){ma[k]=da[k]});
      Object.keys(NOTES).forEach(function(k){if(!(k in mn))mn[k]=NOTES[k]});   /* notes écrites ici avant la connexion */
      Object.keys(ACQ).forEach(function(k){if(!(k in ma))ma[k]=ACQ[k]});
      if(JSON.stringify(mn)!==JSON.stringify(NOTES)||JSON.stringify(ma)!==JSON.stringify(ACQ))changed=true;
      LAST=sn&&sn.exists?JSON.stringify({notes:dn,acq:da}):null;
      NOTES=mn;ACQ=ma;
      try{localStorage.setItem(NKEY,JSON.stringify(NOTES))}catch(e){}
      online(true);
      if(changed&&!(document.activeElement&&document.activeElement.classList.contains("nx")))sync();
      push();
    },function(){clearTimeout(timer);online(false)});
  },function(){clearTimeout(timer);online(false)});
}

/* le menu d'une boîte : un seul type de contenu affiché à la fois dans cette boîte */
function menu(i,onpick){
  var m=el("select");m.setAttribute("aria-label","Contenu affiché");
  var g0=document.createElement("optgroup");g0.label="Axiomes";
  [["p","Principes"],["r","Pratique"],["l","Liaisons"]].forEach(function(x){var o=el("option",null,x[1]);o.value=x[0];g0.appendChild(o)});m.appendChild(g0);
  if(IMG[COMP[i].notion]){var oi=el("option",null,"En image");oi.value="i";m.appendChild(oi)}
  G.forEach(function(g){var og=document.createElement("optgroup");og.label=g.t;
    g.i.forEach(function(d){var o=el("option",null,d[0]+" · "+d[1]+" — "+d[2]);o.value=d[0];og.appendChild(o)});m.appendChild(og)});
  m.value=mode(i);m.onchange=function(){MODES[i]=m.value;save();onpick()};
  return m;
}

/* contenu d'une boîte selon le type choisi */
function picture(nid){var d=el("div");d.innerHTML=IMG[nid].svg;return d.firstChild}
function unnum(t){return t.replace(/\s*\(axiomes? [\d ,et]+\)/g,"").replace(/Axiomes? [\d ,et]+ — /g,"")}
function legend(b,nid){IMG[nid].leg.forEach(function(l){var p=el("div","lg");p.appendChild(el("b",null,l[0]));p.appendChild(document.createTextNode(" — "+unnum(l[1])));b.appendChild(p)})}
function zoom(nid){
  var Z=document.getElementById("zo"),B=document.getElementById("zb");
  document.getElementById("zn").textContent=NOTIONS[nid].t;B.innerHTML="";
  var w=el("div","im");w.appendChild(picture(nid));B.appendChild(w);legend(B,nid);
  Z.hidden=false;Z.scrollTop=0;
}
document.getElementById("zc").onclick=function(){document.getElementById("zo").hidden=true};
function body(nid,MODE){
  var no=NOTIONS[nid],b=el("div","bd");
  if(MODE==="i"){
    b.appendChild(picture(nid));
    var z=el("button","im");z.setAttribute("aria-label","Agrandir l’image");
    while(b.firstChild)z.appendChild(b.firstChild);
    z.onclick=function(){zoom(nid)};b.appendChild(z);
    b.appendChild(el("div","zh","Toucher l’image pour l’agrandir"));
    legend(b,nid);
  }else if(MODE==="l"){
    var ls=linksOf(SHI||Object.keys(COMP).filter(function(k){return COMP[k].notion===nid})[0]);
    if(!ls.length)b.appendChild(el("div","no","Pas de liaison pour cette notion."));
    else{var r0=el("div","axr");ls.forEach(function(x){var d=el("div","ax");code(d,x[1]);d.appendChild(el("small","with","avec "+short(NOTIONS[COMP[x[0]].notion].t)));r0.appendChild(d)});b.appendChild(r0)}
  }else if(MODE==="p"||MODE==="r"){
    var pa=no.pratique||[],l=no.ax.map(function(a,i){return [i+1,a]}).filter(function(x){return (pa.indexOf(x[0])>=0)===(MODE==="r")});
    if(!l.length)b.appendChild(el("div","no",MODE==="r"?"Pas de pratique pour cette notion.":"Pas de principe pour cette notion."));
    if(l.length){var r=el("div","axr");l.forEach(function(x){var d=el("div","ax");code(d,x[1]);r.appendChild(d)});b.appendChild(r)}
  }else{
    var v=(C[nid]||{})[MODE];
    if(!v)b.appendChild(el("div","no","Pas encore rempli."));
    else v.forEach(function(x){b.appendChild(el("div","vl",x[0]));
      x[1].split("\n").forEach(function(t){var li=t.indexOf("- ")===0,c=el("div","ct"+(li?" li":"")+(t.indexOf("Non couvert")===0?" nc":""));code(c,unnum(li?t.slice(2):t));b.appendChild(c)})});
  }
  return b;
}
var RAF=0;function redraw(){cancelAnimationFrame(RAF);RAF=requestAnimationFrame(draw)}
function grow(t){t.style.height="auto";t.style.height=t.scrollHeight+2+"px"}
function note(i){
  var w=el("div","nb");
  function closed(){w.innerHTML="";var a=el("button","na","✎ Ajouter une note");a.onclick=function(){opened(true)};w.appendChild(a)}
  function opened(focus){
    w.innerHTML="";w.appendChild(el("div","nl","Ma note"));
    var t=el("textarea","nx");t.value=NOTES[i]||"";t.setAttribute("aria-label","Ma note");t.rows=3;
    var tm=0;t.oninput=function(){grow(t);redraw();clearTimeout(tm);tm=setTimeout(function(){
      if(t.value.trim())NOTES[i]=t.value;else delete NOTES[i];saveNotes()},300)};
    t.onblur=function(){if(t.value.trim())NOTES[i]=t.value;else{delete NOTES[i];closed();redraw()}saveNotes()};
    w.appendChild(t);requestAnimationFrame(function(){grow(t);redraw()});if(focus)t.focus();
  }
  if(NOTES[i])opened(false);else closed();
  return w;
}
/* ordre des lignes, de bas en haut : celui du plan (ordre de lecture) */
var ORDER=IDS.slice();
function jx(c,p){var j=LIENS[c];return j&&j[p]?j[p]:null}
/* les axiomes de liaison d'une notion : vers celles du dessous, puis vers celles du dessus */
function linksOf(i){var o=[];N[i].p.forEach(function(p){var a=jx(i,p);if(a)o.push([p,a])});
  N[i].k.forEach(function(k){var a=jx(k,i);if(a)o.push([k,a])});return o}
/* un triangle : le nom sur le côté ; au sommet, les axiomes de liaison vers les notions qui en découlent ; en base, les axiomes */
function triangle(i){
  var nid=COMP[i].notion,no=NOTIONS[nid],pa=no.pratique||[],tr=el("div","tri");tr.dataset.id=i;
  var sd=el("button","side");sd.appendChild(el("b",null,no.t));sd.onclick=function(){sheet(i)};tr.appendChild(sd);
  var bd=el("div","tbd");tr.appendChild(bd);
  var up=N[i].k.filter(function(k){return jx(k,i)}),tp=el("div","tp"+(up.length>1?" many":"")+(up.length===4?" n4":""));
  up.forEach(function(k){var d=el("div","lk"),q=el("q");d.dataset.to=k;code(q,"«\u00a0"+jx(k,i).replace(/\.$/,"")+"\u00a0»");d.appendChild(q);
    var a=el("small",null,"vers "+short(NOTIONS[COMP[k].notion].t));
    a.onclick=function(){var t=document.querySelector('.tri[data-id="'+k+'"]');if(t)t.scrollIntoView({behavior:"smooth",block:"center"})};
    d.appendChild(a);tp.appendChild(d)});
  bd.appendChild(tp);
  var b=el("div","base");
  no.ax.forEach(function(a,k){var st=el("div","st");st.appendChild(el("i","dt"+(pa.indexOf(k+1)>=0?" pr":"")));
    var t=el("span");code(t,a);[].forEach.call(t.querySelectorAll("code"),function(c){if(c.textContent.length>14)c.className="w"});st.appendChild(t);b.appendChild(st)});
  bd.appendChild(b);
  if(SHOWN&&NOTES[i])bd.appendChild(el("div","lnn",NOTES[i]));
  return tr;
}
function short(t){return t.replace(/\s*\(.*\)$/,"")}
/* les traits : la base converge vers le milieu du sommet ; une liaison se démultiplie vers les axiomes de la notion juste au-dessus */
var TRAITS=false; /* les traits sont retirés (15/11) ; remettre true pour les retrouver */
function draw(){
  var M=document.getElementById("map");if(!M)return;
  if(!TRAITS){var o0=M.querySelector("svg.tl");if(o0)o0.remove();return}
  var old=M.querySelector("svg.tl");if(old)old.remove();
  var NS="http://www.w3.org/2000/svg",s=document.createElementNS(NS,"svg"),o=M.getBoundingClientRect(),m=4;s.setAttribute("class","tl");
  function c(e){var r=e.getBoundingClientRect();return [r.left+r.width/2-o.left,r.top+r.height/2-o.top]}
  function bxo(e){var r=e.getBoundingClientRect();return [r.left-o.left-m,r.top-o.top-m,r.right-o.left+m,r.bottom-o.top+m]}
  function ln(a,b,col,w){var p=document.createElementNS(NS,"path");p.setAttribute("d","M"+a[0]+" "+a[1]+"L"+b[0]+" "+b[1]);
    p.setAttribute("stroke",col);p.setAttribute("stroke-width",w||1.5);p.setAttribute("fill","none");s.appendChild(p)}
  function toward(D,bx,below){var C=[(bx[0]+bx[2])/2,(bx[1]+bx[3])/2],dx=C[0]-D[0],dy=C[1]-D[1],t=0;
    if(dy)t=Math.max(t,((below?bx[1]:bx[3])-D[1])/dy);
    if(dx>0&&D[0]<bx[0])t=Math.max(t,(bx[0]-D[0])/dx);
    if(dx<0&&D[0]>bx[2])t=Math.max(t,(bx[2]-D[0])/dx);
    return [D[0]+dx*t,D[1]+dy*t]}
  var tris=[].slice.call(M.querySelectorAll(".tri"));
  tris.forEach(function(tr,k){
    var tp=tr.querySelector(".tp"),sts=tr.querySelectorAll(".base .st");
    if(tp.children.length&&sts.length){var bx=bxo(tp),y0=sts[0].getBoundingClientRect().top;
      [].forEach.call(sts,function(st){if(Math.abs(st.getBoundingClientRect().top-y0)<2){var D=c(st.querySelector(".dt"));ln(toward(D,bx),D,"#5a5a63")}})}
    /* toutes les rangées de la base sont reliées entre elles, par un trait vertical à gauche */
    if(sts.length>3){var bl=tr.querySelector(".base").getBoundingClientRect().left-o.left,xs=bl-5,ys=[];
      [].forEach.call(sts,function(st,j){if(j%3===0)ys.push(c(st.querySelector(".dt"))[1])});
      ln([xs,ys[0]],[xs,ys[ys.length-1]],"#4a4a52",2);ys.forEach(function(y){ln([xs-1,y],[bl+1,y],"#4a4a52",2)})}
    var below=tris[k+1];if(!below||!sts.length)return;
    var lk=below.querySelector('.lk[data-to="'+tr.dataset.id+'"]');if(!lk)return;
    /* un trait par colonne, jusque sous la base */
    var lb=bxo(lk),n=sts.length,yb=tr.querySelector(".base").getBoundingClientRect().bottom-o.top+3;
    for(var col=0;col<Math.min(3,n);col++){var A=[c(sts[col].querySelector(".dt"))[0],yb];ln(toward(A,lb,true),A,"#8ab4ff",1.5)}
  });
  M.insertBefore(s,M.firstChild);
}
/* la fiche d'une notion : ✓, menu, contenu choisi, note */
/* la fiche d'une notion : la boîte d'origine (ligne « découle de », nom, menu, contenu, note), sans case à cocher */
function box(i){
  var n=N[i],nid=COMP[i].notion,b=el("div","bx");b.dataset.id=i;
  var h=el("div","bh"),t=el("span","bt");t.appendChild(el("span","cp",n.t));t.appendChild(el("span","nt",NOTIONS[nid].t));
  h.appendChild(t);b.appendChild(h);
  var bd=body(nid,mode(i));
  b.appendChild(menu(i,function(){var nb=body(nid,mode(i));b.replaceChild(nb,bd);bd=nb}));
  b.appendChild(bd);b.appendChild(note(i));return b;
}
var SHI=null;
function sheet(i){
  SHI=i;var B=document.getElementById("sb");B.innerHTML="";B.appendChild(box(i));
  var S=document.getElementById("sh");if(S.hidden){S.hidden=false;S.scrollTop=0}
}
document.getElementById("scl").onclick=function(){document.getElementById("sh").hidden=true;SHI=null;sync()};
function sync(){
  document.getElementById("sj").textContent=SUJET.nom;
  var M=document.getElementById("map");M.innerHTML="";
  ORDER.slice().reverse().forEach(function(c,k){if(k)M.appendChild(el("div","gap"));M.appendChild(triangle(c))});
  draw();
}
/* afficher ou masquer mes notes sur le plan, sous chaque notion */
var SHOWN=false;try{SHOWN=localStorage.getItem("voir-notes-"+SUJET.nom)==="1"}catch(e){}
var TG=document.getElementById("tgn");
function tgLabel(){TG.textContent=SHOWN?"Masquer mes notes":"Afficher mes notes"}
TG.onclick=function(){SHOWN=!SHOWN;try{localStorage.setItem("voir-notes-"+SUJET.nom,SHOWN?"1":"0")}catch(e){}tgLabel();sync()};
tgLabel();
document.title="Support d’autoformation — "+SUJET.nom;
window.addEventListener("resize",draw);
/* visite guidée : les axiomes apparaissent un par un, notion après notion ; l'avancée est sauvegardée */
var VKEY="visite-"+SUJET.nom,VIS={p:0,all:false},VDIR=1;
try{var vs=JSON.parse(localStorage.getItem(VKEY)||"null");if(vs)VIS=vs}catch(e){}
function vSave(){try{localStorage.setItem(VKEY,JSON.stringify(VIS))}catch(e){}}
/* le parcours : pour chaque notion, ses axiomes de gauche à droite, puis ses axiomes de liaison */
var STEPS=[],NSTART={};
ORDER.forEach(function(i){var no=NOTIONS[COMP[i].notion];NSTART[i]=STEPS.length;
  no.ax.forEach(function(a,k){STEPS.push({i:i,t:"a",k:k})});
  N[i].k.filter(function(k){return jx(k,i)}).forEach(function(k,j){STEPS.push({i:i,t:"l",k:j})})});
function nEnd(i){var o=ORDER.indexOf(i);return o+1<ORDER.length?NSTART[ORDER[o+1]]:STEPS.length}
function vCur(){var p=Math.min(VIS.p,STEPS.length);if(p>=STEPS.length)return null;return STEPS[p]}
function vApply(){
  var p=VIS.all?STEPS.length:VIS.p,cur=vCur(),last=p>0?STEPS[p-1]:null;
  [].forEach.call(document.querySelectorAll(".tri"),function(tr){
    var i=tr.dataset.id,s0=NSTART[i],e=nEnd(i);
    tr.classList.toggle("todo",!VIS.all&&p<=s0);
    tr.classList.toggle("cur",!VIS.all&&p>s0&&p<e);
    [].forEach.call(tr.querySelectorAll(".base .st"),function(st,k){var n=s0+k;st.classList.toggle("vh",n>=p);st.classList.toggle("now",VDIR>0&&!VIS.all&&n===p-1)});
    var na=NOTIONS[COMP[i].notion].ax.length;
    [].forEach.call(tr.querySelectorAll(".lk"),function(lk,j){var n=s0+na+j;lk.classList.toggle("vh",n>=p);lk.classList.toggle("now",VDIR>0&&!VIS.all&&n===p-1)});
  });
  vBar();
}
var VB=document.createElement("div");VB.className="vb";VB.innerHTML='<div class="vi"><div class="vt"><div class="vo"></div><div class="vp"></div><div class="vr"><i></i></div></div><button id="vall"></button><button id="vre">Recommencer</button></div>';
document.body.appendChild(VB);document.body.classList.add("vis");
function vBar(){
  var p=VIS.p,o=VB.querySelector(".vo"),q=VB.querySelector(".vp");
  VB.querySelector("#vall").textContent=VIS.all?"Reprendre la visite":"Tout afficher";
  VB.querySelector(".vr i").style.width=(100*Math.min(p,STEPS.length)/STEPS.length)+"%";
  if(VIS.all){o.textContent="Tout est affiché";q.textContent="Ta visite reste où tu l’avais laissée.";return}
  if(p>=STEPS.length){o.textContent="Visite terminée : les "+ORDER.length+" notions sont vues";q.textContent="Touche un nom pour ouvrir sa fiche.";return}
  var s=STEPS[p],i=s.i,t=NOTIONS[COMP[i].notion].t,n=ORDER.indexOf(i)+1,done=p-NSTART[i],tot=nEnd(i)-NSTART[i];
  if(done===0&&p>0){var pi=STEPS[p-1].i;o.innerHTML="";o.appendChild(document.createTextNode("Notion comprise : "));o.appendChild(el("b",null,NOTIONS[COMP[pi].notion].t));
    q.textContent="Touche l’écran pour passer à "+t+" ("+n+" / "+ORDER.length+")";return}
  o.innerHTML="";o.appendChild(document.createTextNode("Objectif : comprendre "));o.appendChild(el("b",null,t));
  q.textContent="Notion "+n+" / "+ORDER.length+" · "+done+" / "+tot+(p===0?" · touche à droite pour avancer, à gauche pour reculer":"");
}
/* l'élément à suivre : en avançant, celui qui apparaît ; en reculant, le dernier encore affiché */
function vEl(n){var s=STEPS[n],tr=s&&document.querySelector('.tri[data-id="'+s.i+'"]');if(!tr)return null;
  return s.t==="a"?tr.querySelectorAll(".base .st")[s.k]:tr.querySelectorAll(".lk")[s.k]}
function vCenter(e){var r=e.getBoundingClientRect(),h=window.innerHeight-VB.offsetHeight;window.scrollBy({top:r.top-(h*0.45),behavior:"smooth"})}
function vShow(){var n=VIS.p-1;if(n<0)return;var e=vEl(n);if(!e)return;
  /* en reculant, quand on change de partie (liaisons → axiomes, ou d'une notion à l'autre), l'élément se place au centre,
     comme le premier axiome d'une nouvelle notion en avançant */
  if(VDIR<0&&VIS.p<STEPS.length){var L=STEPS[n],E=STEPS[VIS.p];if(L.t!==E.t||L.i!==E.i){vCenter(e);return}}
  var r=e.getBoundingClientRect(),h=window.innerHeight-VB.offsetHeight;if(r.top<70||r.bottom>h-20)vCenter(e)}
function vNext(){if(VIS.all||VIS.p>=STEPS.length)return;VDIR=1;VIS.p++;vSave();vApply();vShow()}
function vBack(){if(VIS.all||VIS.p<=0)return;VDIR=-1;VIS.p--;vSave();vApply();vShow()}
document.addEventListener("click",function(ev){
  if(!document.getElementById("sh").hidden)return;
  if(ev.target.closest("button,a,textarea,input,select,small,.vb,.mn,.side"))return;
  /* toucher le tiers gauche de l'écran recule, le reste avance */
  if(ev.clientX<window.innerWidth/3)vBack();else vNext()});
VB.querySelector("#vall").onclick=function(){VIS.all=!VIS.all;VDIR=1;vSave();vApply();if(!VIS.all)vShow()};
VB.querySelector("#vre").onclick=function(){VIS={p:0,all:false};vSave();vApply();window.scrollTo(0,document.body.scrollHeight)};
var _sync=sync;sync=function(){_sync();vApply()};

sync();
requestAnimationFrame(function(){window.scrollTo(0,document.body.scrollHeight);vShow()});
try{connect()}catch(e){}
window.addEventListener("load",function(){try{connect()}catch(e){}});
