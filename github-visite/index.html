<style>
:root{--bg:#0e0e10;--fg:#e8e8ea;--m:#7c7c84;--f:#232326;--l:#34343a;--card:#16161a;--c:#7ee0a1;--up:#8ab4ff}

.lgd{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--m);margin:8px 0 26px}

.gap{height:50px}

#sh{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch;

#zo{z-index:30}

#sh .axr{display:block;overflow:visible;margin:0;padding:0}

/* notes */
.nb{margin-top:8px;border-top:1px solid var(--f);padding-top:6px}
.na{font-size:12.5px;color:var(--m);padding:6px 0}
.nl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#6a6a72;margin:2px 0 4px}

.mb{display:flex;gap:8px;flex-wrap:wrap}

.tg{font-size:13px;padding:7px 12px;border:1px solid var(--l);margin-top:9px}

.lnn{margin:8px 0 4px 30px;padding:6px 0 0 10px;border-left:2px solid var(--up);font-size:13px;line-height:1.45;color:#c4c4cc;white-space:pre-wrap}
.mf{font-size:12.5px;color:var(--c);margin-top:8px;min-height:18px}
.mi{margin-top:10px}
.mi .nx{min-height:120px}
.mi button{margin-top:8px}
/* visite guidée : un axiome à la fois, notion après notion */
.st span,.lk{transition:opacity .3s ease-in,visibility 0s linear 0s}
.st.vh span,.lk.vh{visibility:hidden;opacity:0;transition:opacity .3s ease-in,visibility 0s linear .3s}
.st.vh .dt{background:var(--bg);border:2px solid #34343a}
.st.now span,.lk.now{animation:vin .45s ease-out}

.tri.todo .side b{color:#4a4a52}
.tri.cur .side b{color:var(--up)}
body.vis{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.vb{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(14,14,16,.96);border-top:1px solid #26262c;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.vb .vi{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px}
.vb .vt{flex:1;min-width:0}
.vb .vo{font-size:13.5px;color:var(--fg)}

.vb .vr i{display:block;height:100%;background:var(--up);border-radius:2px}
.vb button{flex:none;font-size:11.5px;color:var(--m);background:none;border:1px solid #34343a;border-radius:7px;padding:6px 8px}

<script>

var SUJET={"nom": "GitHub", "projet": "Enregistreur vocal de notes"};

var COMP={"ver": {"notion": "ver"}, "git": {"notion": "git"}, "gh": {"notion": "gh"}, "cpt": {"notion": "cpt"}, "dep": {"notion": "dep"}, "par": {"notion": "par"}, "vis": {"notion": "vis"}, "fic": {"notion": "fic"}, "com": {"notion": "com"}, "his": {"notion": "his"}, "bra": {"notion": "bra"}, "pr": {"notion": "pr"}, "fus": {"notion": "fus"}, "iss": {"notion": "iss"}, "rdm": {"notion": "rdm"}, "act": {"notion": "act"}, "pag": {"notion": "pag"}, "cyc": {"notion": "cyc"}};
var NOTIONS={"ver": {"t": "Gestion de versions", "ax": ["Une version est l’état d’un projet à un moment donné.", "La gestion de versions garde chaque version d’un projet.", "Elle montre ce qui a changé d’une version à l’autre.", "Elle permet de revenir à une version précédente."], "pratique": []}, "git": {"t": "Git", "ax": ["Git est un logiciel de gestion de versions.", "Il garde les versions d’un dossier et de tous ses fichiers.", "Il est gratuit et libre.", "Il fonctionne aussi sans internet, sur un ordinateur."], "pratique": []}, "gh": {"t": "GitHub", "ax": ["GitHub est un site web.", "Il héberge sur internet des projets gérés avec Git.", "Il ajoute des outils autour de Git : discussion, publication, automatisation.", "Son interface est en anglais.", "Son usage de base est gratuit.", "Pour l’ouvrir, je tape `github.com` dans le navigateur."], "pratique": [6]}, "cpt": {"t": "Compte", "ax": ["Un compte identifie une personne sur GitHub.", "Chaque compte a un nom d’utilisateur unique.", "Ce nom apparaît dans l’adresse de ses pages : `github.com/nom`.", "Lire un projet public ne demande pas de compte ; le modifier en demande un.", "Pour me connecter, je clique sur « Sign in ».", "Le menu de mon compte s’ouvre en cliquant sur ma photo de profil, en haut à droite."], "pratique": [5, 6]}, "dep": {"t": "Dépôt", "ax": ["Un dépôt est un projet hébergé sur GitHub.", "Il contient les fichiers du projet et toutes leurs versions.", "Il appartient à un compte.", "Son adresse est `github.com/compte/dépôt`.", "En anglais, un dépôt se dit « repository », souvent abrégé « repo ».", "Sa page est découpée en onglets ; l’onglet « Code » montre ses fichiers.", "Pour créer un dépôt, je clique sur « + » en haut à droite, puis sur « New repository ».", "Je retrouve mes dépôts sur ma page de profil, onglet « Repositories »."], "pratique": [7, 8]}, "par": {"t": "Paramètres", "ax": ["Les paramètres sont les réglages d’un dépôt.", "Ils se trouvent dans l’onglet « Settings » du dépôt.", "Seuls le propriétaire du dépôt et ses administrateurs y ont accès.", "Ils sont rangés en sections, dans une colonne à gauche.", "La « Danger Zone », tout en bas, regroupe les réglages risqués.", "Si l’onglet « Settings » n’apparaît pas, je l’ouvre par le menu « … » des onglets.", "Pour renommer le dépôt, je change « Repository name », puis je clique sur « Rename »."], "pratique": [6, 7]}, "vis": {"t": "Visibilité", "ax": ["Un dépôt est public ou privé.", "Un dépôt public peut être lu par tout le monde.", "Un dépôt privé ne peut être lu que par son propriétaire et les personnes qu’il invite.", "Une étiquette « Public » ou « Private » est affichée à côté du nom du dépôt.", "La visibilité se choisit à la création du dépôt et peut changer ensuite.", "Pour la changer, j’ouvre les paramètres, puis « Change visibility » dans la « Danger Zone ».", "GitHub me demande de confirmer avant de changer la visibilité."], "pratique": [6, 7]}, "fic": {"t": "Fichier", "ax": ["Un dépôt contient des fichiers, rangés dans des dossiers.", "L’onglet « Code » affiche la liste des fichiers.", "Cliquer sur un fichier affiche son contenu.", "La fin du nom d’un fichier, l’extension, dit son type : `.html`, `.md`, `.png`.", "Pour modifier un fichier, je clique sur le crayon, en haut à droite du fichier.", "Pour créer un fichier, je clique sur « Add file », puis sur « Create new file ».", "Pour importer un fichier de mon appareil, je clique sur « Add file », puis sur « Upload files »."], "pratique": [5, 6, 7]}, "com": {"t": "Commit", "ax": ["Un commit enregistre un ou plusieurs changements dans le dépôt.", "Chaque commit crée une nouvelle version du dépôt.", "Un commit porte un message qui décrit le changement.", "Il garde son auteur et sa date.", "Il a un identifiant unique, souvent abrégé à sept caractères, comme `bd46bc0`.", "Après avoir modifié un fichier, je clique sur « Commit changes… ».", "J’écris le message dans « Commit message », puis je clique sur « Commit changes »."], "pratique": [6, 7]}, "his": {"t": "Historique", "ax": ["L’historique est la liste des commits d’un dépôt.", "Il va du commit le plus récent au plus ancien.", "Chaque ligne montre le message, l’auteur et la date d’un commit.", "Ouvrir un commit montre ses changements : en rouge ce qui est retiré, en vert ce qui est ajouté.", "Pour ouvrir l’historique, je clique sur le nombre de commits, à côté de l’horloge, au-dessus des fichiers.", "Pour voir les commits d’un seul fichier, j’ouvre ce fichier et je clique sur « History »."], "pratique": [5, 6]}, "bra": {"t": "Branche", "ax": ["Une branche est une suite de commits.", "Chaque dépôt a une branche principale, en général nommée `main`.", "Une nouvelle branche part d’une branche existante, comme une copie.", "Les commits faits sur une branche ne touchent pas les autres branches.", "Une branche sert à essayer un changement sans toucher à la branche principale.", "Le menu des branches, en haut à gauche des fichiers, montre la branche affichée.", "Pour créer une branche, j’ouvre ce menu, je tape un nom, puis je clique sur « Create branch »."], "pratique": [6, 7]}, "pr": {"t": "Pull request", "ax": ["Une pull request propose d’intégrer les commits d’une branche dans une autre.", "Elle compare deux branches : celle qui propose et celle qui reçoit.", "Elle montre les changements proposés avant toute intégration.", "On peut en discuter par des commentaires.", "Elle a un numéro, précédé de `#`.", "Elle reste ouverte jusqu’à ce qu’elle soit fusionnée ou fermée.", "Après un commit sur une branche, je clique sur « Compare & pull request ».", "Sinon, j’ouvre l’onglet « Pull requests », puis je clique sur « New pull request ».", "Je donne un titre, puis je clique sur « Create pull request »."], "pratique": [7, 8, 9]}, "fus": {"t": "Fusion", "ax": ["La fusion intègre les commits d’une branche dans une autre.", "Après la fusion, la branche qui reçoit contient les changements.", "Fusionner une pull request la ferme.", "Un conflit survient quand deux branches changent la même ligne différemment.", "Un conflit doit être résolu avant la fusion.", "Pour fusionner, je clique sur « Merge pull request », puis sur « Confirm merge ».", "Après la fusion, je peux supprimer la branche avec « Delete branch »."], "pratique": [6, 7]}, "iss": {"t": "Issue", "ax": ["Une issue note un problème, une question ou une tâche dans un dépôt.", "Elle a un titre, une description et un numéro précédé de `#`.", "Elle est ouverte ou fermée.", "On peut en discuter par des commentaires.", "Pour créer une issue, j’ouvre l’onglet « Issues », puis je clique sur « New issue ».", "Pour la fermer, je clique sur « Close issue »."], "pratique": [5, 6]}, "rdm": {"t": "README", "ax": ["Le README est le fichier qui présente un dépôt.", "Il est placé à la racine du dépôt, hors des dossiers.", "Son contenu s’affiche sous la liste des fichiers, sur la page du dépôt.", "Il s’appelle en général `README.md`.", "L’extension `.md` signale du Markdown : du texte avec des marques de mise en forme.", "En Markdown, je mets `#` en début de ligne pour faire un titre.", "En Markdown, j’entoure un mot de `**` pour le mettre en gras.", "Pour ajouter un README, je crée un fichier nommé `README.md`."], "pratique": [6, 7, 8]}, "act": {"t": "Actions", "ax": ["GitHub Actions lance des tâches automatiquement, sur les serveurs de GitHub.", "Une tâche se lance à la suite d’un événement, par exemple un commit.", "Un ensemble de tâches s’appelle un workflow.", "Chaque lancement d’un workflow s’appelle une exécution, « run » en anglais.", "Une exécution réussie a une coche verte, une exécution échouée une croix rouge, une exécution en cours un rond jaune.", "Pour suivre les exécutions, j’ouvre l’onglet « Actions ».", "Pour relancer une exécution échouée, je l’ouvre, puis je clique sur « Re-run jobs »."], "pratique": [6, 7]}, "pag": {"t": "GitHub Pages", "ax": ["GitHub Pages publie un site web à partir des fichiers d’un dépôt.", "L’adresse du site est `compte.github.io/dépôt`.", "Le fichier `index.html` est la page d’accueil du site.", "Sur un compte gratuit, le dépôt doit être public.", "Le site se met à jour après chaque commit sur la branche publiée.", "Pour activer GitHub Pages, j’ouvre les paramètres, section « Pages ».", "Sous « Source », je choisis « Deploy from a branch », puis la branche et le dossier, puis « Save »."], "pratique": [6, 7]}, "cyc": {"t": "Cycle de publication", "ax": ["Le cycle de publication mène d’un changement à sa mise en ligne.", "Il a quatre étapes : modifier, enregistrer, construire, afficher.", "Modifier : je change un fichier du dépôt.", "Enregistrer : je fais un commit sur la branche publiée.", "Construire : une exécution « pages build and deployment » se lance dans « Actions ».", "Afficher : quand elle a sa coche verte, la nouvelle version est en ligne.", "La mise en ligne prend en général une à deux minutes.", "Si le site ne change pas, je recharge sa page, car le navigateur peut garder l’ancienne version."], "pratique": [3, 4, 5, 6, 8]}};

var C={"ver": {"1": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné.\nAxiome 2 — La gestion de versions garde chaque version d’un projet."], ["Phrase", "La gestion de versions se compose de versions, c’est-à-dire d’états du projet, et de l’ensemble qui les garde."]], "2": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné."], ["Phrase", "Son élément fondamental est la version : l’état du projet à un moment donné."]], "3": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné.\nAxiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 3 — Elle montre ce qui a changé d’une version à l’autre.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Les versions gardées s’enchaînent ; en les comparant on voit ce qui a changé, et on peut revenir à l’une d’elles."]], "4": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné.\nAxiome 2 — La gestion de versions garde chaque version d’un projet."], ["Phrase", "Elle se décompose en versions successives ; chaque version se décompose à son tour en fichiers."]], "5": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet."], ["Phrase", "Aucune limite n’est fixée : elle garde autant de versions qu’il y a eu d’enregistrements."]], "6": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné."], ["Phrase", "Une version n’est pas un fichier : c’est une photographie de tout le projet à un instant."]], "7": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné.\nAxiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 3 — Elle montre ce qui a changé d’une version à l’autre.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Gérer des versions, c’est garder chaque état d’un projet pour voir ce qui change et pouvoir revenir en arrière."]], "8": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné.\nAxiome 2 — La gestion de versions garde chaque version d’un projet."], ["Phrase", "La gestion de versions garde chaque version d’un projet, une version étant son état à un moment donné."]], "9": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 3 — Elle montre ce qui a changé d’une version à l’autre.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Garder, comparer, revenir : ces trois propriétés la constituent."]], "10": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle s’applique à tout projet fait de fichiers : site web, programme, livre, mémoire, notes de cours."]], "11": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On dit aussi « versionnage », « contrôle de version » ou « suivi de versions » ; en anglais, version control."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Version » vient du latin versio, « action de tourner » : chaque version est un tour de plus du projet."]], "13": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On peut la voir comme une sauvegarde améliorée, ou comme un journal de bord du projet."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Version » désigne aussi une traduction, ou un numéro de logiciel (version 2.0) ; ici, c’est un état enregistré."]], "15": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné.\nAxiome 2 — La gestion de versions garde chaque version d’un projet."], ["Phrase", "Les versions sont rangées dans l’ordre où elles ont été gardées."]], "16": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Toutes les versions sont au même rang ; seule la dernière sert de version courante."]], "17": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné.\nAxiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 3 — Elle montre ce qui a changé d’une version à l’autre.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Vue d’ensemble : une suite de versions, des différences entre elles, et des retours possibles."]], "18": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les versions se lisent souvent comme une ligne du temps, de la plus ancienne à la plus récente."]], "19": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle appartient aux outils de travail sur les fichiers, à côté de la sauvegarde et de la synchronisation."]], "20": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Deux grands types : centralisée (un serveur unique garde tout) et distribuée (chaque copie garde tout)."]], "21": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Chaque version forme une unité complète, qu’on peut consulter seule."]], "22": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné.\nAxiome 3 — Elle montre ce qui a changé d’une version à l’autre."], ["Phrase", "Deux versions sont liées par ce qui a changé de l’une à l’autre."]], "23": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Pour revenir à une version, il faut qu’elle ait été gardée : l’axiome 4 découle de l’axiome 2."]], "24": [["Axiome", "Axiome 3 — Elle montre ce qui a changé d’une version à l’autre."], ["Phrase", "Chaque changement fait du projet est la cause d’une nouvelle différence entre deux versions."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Plus un projet change souvent, plus ses versions sont nombreuses."]], "26": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Garder les versions sert à pouvoir y revenir."]], "27": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné.\nAxiome 2 — La gestion de versions garde chaque version d’un projet."], ["Phrase", "Elle dépend du projet : sans projet qui change, il n’y a rien à garder."]], "28": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet."], ["Phrase", "Elle s’oppose au simple enregistrement, qui remplace l’ancien fichier par le nouveau."]], "29": [["Axiome", "Axiome 3 — Elle montre ce qui a changé d’une version à l’autre.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Voir ce qui a changé et revenir en arrière se complètent : on repère l’erreur, puis on l’annule."]], "30": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "On ne peut revenir à une version que si elle a été gardée."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Comme l’historique d’un traitement de texte, mais pour tout un projet et sans limite de retours."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Chaque nouvelle version s’appuie sur la précédente, et la suivante s’appuiera sur elle."]], "33": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné."], ["Phrase", "Les versions se succèdent : chacune correspond à un moment donné."]], "34": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les versions ne prennent pas de place sur la page : elles restent cachées tant qu’on ne les consulte pas."]], "35": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné.\nAxiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 3 — Elle montre ce qui a changé d’une version à l’autre.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Quatre propositions : une version est un état daté ; on les garde toutes ; on voit ce qui change ; on peut revenir."]], "36": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 3 — Elle montre ce qui a changé d’une version à l’autre.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "On lui attribue trois pouvoirs : garder, montrer les changements, revenir en arrière."]], "37": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Si chaque version est gardée, alors aucun changement n’est définitif."]], "38": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Conséquence nécessaire : on peut toujours retrouver un état passé du projet."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ceux qui ont perdu un travail par erreur en tirent la règle : garder chaque version."]], "40": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Si un projet peut revenir en arrière après une erreur, la meilleure explication est qu’il gère ses versions."]], "41": [["Axiome", "Axiome 3 — Elle montre ce qui a changé d’une version à l’autre.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Argument principal : on peut tout essayer, puisqu’on sait voir et annuler ce qu’on a changé."]], "42": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les axiomes s’admettent ; on vérifie un outil en lui faisant garder deux versions puis revenir à la première."]], "43": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné.\nAxiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 3 — Elle montre ce qui a changé d’une version à l’autre.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Quatre principes fondent la notion : la version, la conservation, la comparaison, le retour."]], "44": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Exclu : perdre une version gardée, ou ne pas pouvoir y revenir."]], "45": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné.\nAxiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 3 — Elle montre ce qui a changé d’une version à l’autre.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Les axiomes s’accordent : on garde des états, on les compare, on revient à l’un d’eux."]], "46": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "C’est une pratique établie de l’informatique, enseignée et utilisée partout."]], "47": [["Axiome", "Axiome 3 — Elle montre ce qui a changé d’une version à l’autre.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Sa justification : un projet sans retour possible rend chaque erreur coûteuse."]], "48": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La preuve qu’elle fonctionne : la liste des versions, qu’on peut ouvrir une à une."]], "49": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné.\nAxiome 2 — La gestion de versions garde chaque version d’un projet."], ["Phrase", "Il y a gestion de versions si chaque état du projet est gardé."]], "50": [["Axiome", "Axiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "On le vérifie en revenant à une version précédente et en retrouvant le projet tel qu’il était."]], "51": [["Axiome", "Axiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Elle serait réfutée si une version gardée ne pouvait plus être retrouvée."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Certitude élevée : les outils de gestion de versions sont conçus pour ne rien perdre de ce qui est gardé."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Aucune hypothèse : elle repose sur des enregistrements réels."]], "54": [["Axiome", "Axiome 3 — Elle montre ce qui a changé d’une version à l’autre."], ["Phrase", "Elle s’observe : on voit chaque version et ce qui la distingue de la précédente."]], "55": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le modèle derrière : un projet est une suite d’états, et chaque état peut être retrouvé."]], "56": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné."], ["Phrase", "C’est une pratique et un ensemble d’outils, pas un objet : ce qu’elle manipule, ce sont des versions."]], "57": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle n’existe que si on l’utilise : un projet peut très bien ne pas gérer ses versions."]], "58": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet."], ["Phrase", "Ce qui la définit : garder chaque version, et non la dernière seulement."]], "59": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Catégorie : les méthodes de travail sur les fichiers."]], "60": [["Axiome", "Axiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Revenir en arrière est possible, jamais obligatoire."]], "61": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet."], ["Phrase", "Son essence : la conservation des états successifs d’un projet."]], "62": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet."], ["Phrase", "Elle s’arrête aux versions gardées : ce qui n’a pas été gardé ne peut pas revenir."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle prend son sens dans les projets qui durent et qui changent souvent."]], "64": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle sert surtout après une erreur, ou quand on veut essayer une idée sans risque."]], "65": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les premiers outils datent des années 1970 ; Git, en 2005, est aujourd’hui le plus répandu."]], "66": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Née chez les programmeurs, elle gagne les rédacteurs, les chercheurs et les designers."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Domaine : l’informatique, plus précisément le génie logiciel."]], "68": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle permet à plusieurs personnes de travailler sur un même projet en sachant qui a changé quoi."]], "69": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné."], ["Phrase", "Chaque version est située dans le temps : à un moment donné."]], "70": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet."], ["Phrase", "Son rôle : être la mémoire d’un projet."]], "71": [["Axiome", "Axiome 3 — Elle montre ce qui a changé d’une version à l’autre.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Elle fournit deux moyens : la comparaison entre versions et le retour en arrière."]], "72": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 3 — Elle montre ce qui a changé d’une version à l’autre.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Opérations permises : garder une version, comparer deux versions, revenir à une version."]], "73": [["Axiome", "Axiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Dans l’action, elle rend les erreurs réparables : on ose changer."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle contribue à un projet fiable, qu’on peut faire évoluer sans peur."]], "75": [["Axiome", "Axiome 3 — Elle montre ce qui a changé d’une version à l’autre.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Utile pour comprendre ce qui a changé et pour annuler une mauvaise modification."]], "76": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dire « j’enregistre une version » fixe un point de retour dans la vie du projet."]], "77": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Étape par étape : changer le projet, garder la version, recommencer ; en cas d’erreur, comparer puis revenir."]], "78": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné."], ["Phrase", "Ce qui change, c’est le projet ; chaque changement produit une nouvelle version."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle évolue avec le projet : la liste des versions ne fait que s’allonger."]], "80": [["Axiome", "Axiome 3 — Elle montre ce qui a changé d’une version à l’autre."], ["Phrase", "Chaque passage d’une version à l’autre est une transformation, que l’outil montre."]], "81": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle naît dès le premier enregistrement : la première version est le point de départ."]], "82": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet."], ["Phrase", "Son processus : à chaque changement retenu, une version de plus est gardée."]], "83": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle s’adapte à tout type de fichiers, même si elle compare mieux le texte que les images."]], "84": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné.\nAxiome 2 — La gestion de versions garde chaque version d’un projet."], ["Phrase", "Ses états successifs sont justement les versions, gardées l’une après l’autre."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Appréciation : indispensable dès qu’un projet dépasse quelques fichiers."]], "86": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Norme habituelle : garder une version à chaque changement qui a un sens, avec une description claire."]], "87": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Sa valeur : la sécurité du travail et la transparence sur ce qui a été fait."]], "88": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 3 — Elle montre ce qui a changé d’une version à l’autre.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Critères : toutes les versions sont gardées, les différences se voient, le retour fonctionne."]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une bonne gestion de versions a des versions ni trop rares, ni trop nombreuses, chacune avec un sens."]], "90": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Pertinente pour tout projet qui change ; inutile pour un fichier écrit une fois et jamais modifié."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’améliore en décrivant mieux chaque version, pour retrouver vite celle qu’on cherche."]]}, "git": {"1": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions.\nAxiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Git se compose d’un logiciel et des versions qu’il garde pour un dossier et ses fichiers."]], "2": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Ses éléments fondamentaux : un dossier, les fichiers qu’il contient, et leurs versions."]], "3": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions.\nAxiome 2 — Il garde les versions d’un dossier et de tous ses fichiers.\nAxiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "Sur un ordinateur, le logiciel surveille un dossier et garde les versions de tous ses fichiers."]], "4": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Ce qu’il garde se décompose en dossier, puis en fichiers, puis en versions de chaque fichier."]], "5": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un seul logiciel suffit pour autant de dossiers qu’on veut, chacun avec son propre suivi."]], "6": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions.\nAxiome 3 — Il est gratuit et libre."], ["Phrase", "Sa nature : un logiciel, gratuit et libre."]], "7": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions.\nAxiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Git, c’est l’outil qui garde les versions d’un dossier."]], "8": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions.\nAxiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Git est un logiciel de gestion de versions qui garde les versions d’un dossier et de tous ses fichiers."]], "9": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions.\nAxiome 2 — Il garde les versions d’un dossier et de tous ses fichiers.\nAxiome 3 — Il est gratuit et libre.\nAxiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "Gérer des versions, suivre un dossier entier, être gratuit et libre, fonctionner hors ligne : ses propriétés."]], "10": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il sert à des millions de projets, du noyau Linux aux sites personnels."]], "11": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On écrit « Git » ; la commande se tape en minuscules, `git`."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En argot anglais, « git » signifie « crétin » : son créateur, Linus Torvalds, a choisi ce nom par autodérision."]], "13": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Pour certains, c’est un outil de programmeur ; pour d’autres, un simple coffre à versions pour tout projet."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Git » désigne à la fois le logiciel et la façon de travailler qu’il impose."]], "15": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Il s’organise autour d’un dossier : tout ce qui est dedans est suivi."]], "16": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le dossier suivi contient un dossier caché, `.git`, où Git range toutes les versions."]], "17": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers.\nAxiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "Vue d’ensemble : un dossier sur l’ordinateur, et derrière lui la mémoire de toutes ses versions."]], "18": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les versions sont rangées en une chaîne, chacune pointant vers la précédente."]], "19": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions."], ["Phrase", "Il se classe parmi les logiciels de gestion de versions."]], "20": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "C’est un système distribué : chaque copie du dossier contient tout l’historique."]], "21": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Chaque dossier suivi par Git est autonome : on peut le copier ailleurs avec toutes ses versions."]], "22": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions.\nAxiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Le logiciel et le dossier sont liés : Git ne garde que ce qui est dans le dossier suivi."]], "23": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions.\nAxiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Puisque c’est un logiciel de gestion de versions, ce qu’il garde, ce sont des versions."]], "24": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Chaque enregistrement demandé à Git crée une version de plus."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les projets qui utilisent Git sont souvent ceux qui travaillent à plusieurs."]], "26": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions.\nAxiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Sa fonction : garder les versions du dossier qu’on lui confie."]], "27": [["Axiome", "Axiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "Il dépend de l’ordinateur où il est installé, pas d’internet."]], "28": [["Axiome", "Axiome 3 — Il est gratuit et libre."], ["Phrase", "Il s’oppose aux logiciels payants et fermés."]], "29": [["Axiome", "Axiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "Git travaille sur l’ordinateur ; un site comme GitHub le complète en ligne."]], "30": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Un fichier n’est suivi que s’il se trouve dans le dossier suivi."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Comme une sauvegarde, il garde des copies ; contrairement à elle, il garde chaque étape et ce qui a changé."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ce qu’on fait dans le dossier change ce que Git aura à garder, et ce que Git garde permet de revenir sur le dossier."]], "33": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Les versions d’un dossier se succèdent ; Git les garde dans cet ordre."]], "34": [["Axiome", "Axiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "Il est installé sur l’ordinateur, au même endroit que le dossier qu’il suit."]], "35": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions.\nAxiome 2 — Il garde les versions d’un dossier et de tous ses fichiers.\nAxiome 3 — Il est gratuit et libre.\nAxiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "Quatre propositions : c’est un logiciel de versions ; il suit un dossier ; il est libre ; il marche hors ligne."]], "36": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions.\nAxiome 3 — Il est gratuit et libre.\nAxiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "On dit de Git qu’il est un logiciel, gratuit, libre, et utilisable sans internet."]], "37": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Si un fichier est dans le dossier suivi, alors ses versions sont gardées."]], "38": [["Axiome", "Axiome 3 — Il est gratuit et libre."], ["Phrase", "Conséquence nécessaire : on peut l’installer sans payer."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La plupart des projets de code l’utilisent ; on en déduit qu’il est devenu la norme."]], "40": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Si un dossier contient un dossier caché `.git`, la meilleure explication est qu’il est suivi par Git."]], "41": [["Axiome", "Axiome 3 — Il est gratuit et libre.\nAxiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "Arguments en sa faveur : gratuit, libre, et utilisable partout, même sans connexion."]], "42": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On montre qu’un dossier est suivi en demandant à Git la liste de ses versions."]], "43": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions.\nAxiome 2 — Il garde les versions d’un dossier et de tous ses fichiers.\nAxiome 3 — Il est gratuit et libre.\nAxiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "Quatre principes le fondent : la gestion de versions, le dossier suivi, la gratuité et la liberté, le hors-ligne."]], "44": [["Axiome", "Axiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "Exclu : un Git qui ne marcherait qu’en ligne."]], "45": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions.\nAxiome 2 — Il garde les versions d’un dossier et de tous ses fichiers.\nAxiome 3 — Il est gratuit et libre.\nAxiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "Les axiomes s’accordent : un logiciel libre, installé localement, qui garde les versions d’un dossier."]], "46": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Connaissance sûre et documentée : Git a une documentation officielle complète, en anglais."]], "47": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions."], ["Phrase", "Il est justifié par le besoin de gérer les versions d’un projet."]], "48": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Preuve de son usage : GitHub et ses concurrents reposent tous sur lui."]], "49": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Un dossier est suivi par Git si ses versions sont gardées."]], "50": [["Axiome", "Axiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "On le vérifie en coupant internet : Git continue de garder les versions."]], "51": [["Axiome", "Axiome 3 — Il est gratuit et libre."], ["Phrase", "Il serait réfuté s’il devenait payant ou fermé."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Certitude élevée : Git est stable et utilisé depuis 2005."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Aucune hypothèse : son fonctionnement est entièrement documenté."]], "54": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "On observe son travail dans la liste des versions du dossier."]], "55": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le modèle : chaque version est une photographie du dossier entier, reliée à la précédente."]], "56": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions."], ["Phrase", "C’est un logiciel."]], "57": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il existe depuis 2005 et s’installe sur Windows, macOS et Linux."]], "58": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Ce qui l’identifie : il garde les versions d’un dossier entier, pas d’un fichier isolé."]], "59": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions."], ["Phrase", "Catégorie : les logiciels de gestion de versions."]], "60": [["Axiome", "Axiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "Internet est possible, jamais nécessaire."]], "61": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions.\nAxiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Son essence : garder les versions d’un dossier."]], "62": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Il s’arrête au bord du dossier suivi : ce qui est en dehors ne le concerne pas."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il prend son sens dans les projets faits de nombreux fichiers texte : code, pages web, notes."]], "64": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il s’utilise surtout dans un terminal, par des commandes ; des applications l’habillent d’une interface."]], "65": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Créé en 2005 par Linus Torvalds pour le noyau Linux, il est devenu l’outil le plus utilisé au monde."]], "66": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il appartient à la culture du logiciel libre."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Domaine : le génie logiciel."]], "68": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il permet à des milliers de personnes de travailler sur un même projet."]], "69": [["Axiome", "Axiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "Il vit sur un ordinateur précis, dans un dossier précis."]], "70": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions."], ["Phrase", "Son rôle : faire la gestion de versions."]], "71": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Il fournit la mémoire de toutes les versions d’un dossier."]], "72": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Opérations : enregistrer une version, voir les différences, revenir en arrière, créer des branches."]], "73": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans l’action, on change ses fichiers sans crainte : Git garde de quoi revenir."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il contribue à des projets fiables et partagés."]], "75": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers.\nAxiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "Utile pour garder chaque version de son dossier, même sans connexion."]], "76": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Écrire `git commit` enregistre une version : la phrase tapée fait l’action."]], "77": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Sur un ordinateur : installer Git, l’activer dans un dossier, puis enregistrer une version à chaque changement."]], "78": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ce qui change, ce sont les fichiers du dossier ; Git, lui, enregistre ces changements."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Git évolue lui-même : de nouvelles versions du logiciel sortent régulièrement."]], "80": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il transforme une suite d’enregistrements en un historique qu’on peut parcourir."]], "81": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il naît dans un dossier quand on l’y active : à partir de là, il suit tout."]], "82": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Son processus : surveiller le dossier, et garder une version quand on le lui demande."]], "83": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il s’adapte à tout projet : code, texte, images, même si le texte se compare mieux."]], "84": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Ses états successifs sont ceux du dossier, gardés un à un."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Appréciation : puissant mais austère ; on l’apprivoise mieux par GitHub."]], "86": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Norme : c’est le standard de fait de la gestion de versions."]], "87": [["Axiome", "Axiome 3 — Il est gratuit et libre."], ["Phrase", "Valeurs engagées : la liberté du logiciel et le partage."]], "88": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers.\nAxiome 3 — Il est gratuit et libre.\nAxiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "Critères : il garde tout le dossier, il est libre, il marche sans internet."]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Qualité reconnue : rapide et fiable, même sur de très gros projets."]], "90": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Pertinent dès qu’un projet a plusieurs fichiers qui changent ; superflu pour un document unique."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’améliore en passant par une interface graphique, ou par un site comme GitHub."]]}, "gh": {"1": [["Axiome", "Axiome 1 — GitHub est un site web.\nAxiome 2 — Il héberge sur internet des projets gérés avec Git.\nAxiome 3 — Il ajoute des outils autour de Git : discussion, publication, automatisation."], ["Phrase", "GitHub se compose d’un site web, des projets Git qu’il héberge et des outils qu’il ajoute autour."]], "2": [["Axiome", "Axiome 2 — Il héberge sur internet des projets gérés avec Git."], ["Phrase", "Son élément fondamental : un projet géré avec Git, hébergé sur internet."]], "3": [["Axiome", "Axiome 2 — Il héberge sur internet des projets gérés avec Git.\nAxiome 3 — Il ajoute des outils autour de Git : discussion, publication, automatisation."], ["Phrase", "Les projets Git y sont hébergés, et les outils de discussion, de publication et d’automatisation s’y greffent."]], "4": [["Axiome", "Axiome 3 — Il ajoute des outils autour de Git : discussion, publication, automatisation."], ["Phrase", "Ses outils se décomposent en trois familles : discuter, publier, automatiser."]], "5": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il héberge des centaines de millions de projets, pour plus de cent millions de comptes."]], "6": [["Axiome", "Axiome 1 — GitHub est un site web.\nAxiome 2 — Il héberge sur internet des projets gérés avec Git."], ["Phrase", "Sa nature : un site, c’est-à-dire un service en ligne, pas un logiciel à installer."]], "7": [["Axiome", "Axiome 1 — GitHub est un site web.\nAxiome 2 — Il héberge sur internet des projets gérés avec Git."], ["Phrase", "GitHub, c’est l’endroit sur internet où vivent des projets Git."]], "8": [["Axiome", "Axiome 1 — GitHub est un site web.\nAxiome 2 — Il héberge sur internet des projets gérés avec Git."], ["Phrase", "GitHub est un site web qui héberge sur internet des projets gérés avec Git."]], "9": [["Axiome", "Axiome 1 — GitHub est un site web.\nAxiome 2 — Il héberge sur internet des projets gérés avec Git.\nAxiome 3 — Il ajoute des outils autour de Git : discussion, publication, automatisation.\nAxiome 4 — Son interface est en anglais.\nAxiome 5 — Son usage de base est gratuit.\nAxiome 6 — Pour l’ouvrir, je tape `github.com` dans le navigateur."], ["Phrase", "Être un site, héberger des projets Git, ajouter des outils, parler anglais, être gratuit à la base."]], "10": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il héberge du code, des sites, de la documentation, des notes, même des livres."]], "11": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On écrit « GitHub », avec un H majuscule ; « Hub » veut dire « plateforme centrale »."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le nom associe Git, l’outil, et hub, « carrefour » : le carrefour des projets Git."]], "13": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Pour certains, c’est un simple hébergement ; pour d’autres, un réseau social de développeurs."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« GitHub » désigne le site, mais aussi l’entreprise qui le gère et ses applications."]], "15": [["Axiome", "Axiome 2 — Il héberge sur internet des projets gérés avec Git.\nAxiome 3 — Il ajoute des outils autour de Git : discussion, publication, automatisation."], ["Phrase", "Il s’organise autour des projets hébergés ; les outils sont rattachés à chaque projet."]], "16": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Niveaux : le site, puis les comptes, puis les projets de chaque compte."]], "17": [["Axiome", "Axiome 2 — Il héberge sur internet des projets gérés avec Git.\nAxiome 3 — Il ajoute des outils autour de Git : discussion, publication, automatisation."], ["Phrase", "Vue d’ensemble : des projets Git sur internet, entourés d’outils pour travailler ensemble."]], "18": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En haut de chaque page : le logo, la recherche, le bouton « + » et la photo de profil."]], "19": [["Axiome", "Axiome 1 — GitHub est un site web."], ["Phrase", "Il se classe parmi les sites d’hébergement de code."]], "20": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il existe des comptes gratuits et payants, personnels ou d’organisation."]], "21": [["Axiome", "Axiome 3 — Il ajoute des outils autour de Git : discussion, publication, automatisation."], ["Phrase", "Chaque outil fonctionne à part : on peut publier sans discuter, discuter sans automatiser."]], "22": [["Axiome", "Axiome 2 — Il héberge sur internet des projets gérés avec Git."], ["Phrase", "GitHub et Git sont liés : le site héberge ce que Git enregistre."]], "23": [["Axiome", "Axiome 2 — Il héberge sur internet des projets gérés avec Git.\nAxiome 3 — Il ajoute des outils autour de Git : discussion, publication, automatisation."], ["Phrase", "Puisqu’il héberge des projets Git, ses outils portent sur ces projets."]], "24": [["Axiome", "Axiome 2 — Il héberge sur internet des projets gérés avec Git."], ["Phrase", "Mettre un projet Git sur GitHub le rend accessible depuis n’importe quel appareil connecté."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les projets les plus suivis sur GitHub sont souvent les plus utilisés dans le monde."]], "26": [["Axiome", "Axiome 2 — Il héberge sur internet des projets gérés avec Git."], ["Phrase", "Sa fonction : héberger les projets Git sur internet."]], "27": [["Axiome", "Axiome 1 — GitHub est un site web."], ["Phrase", "Il dépend d’internet : sans connexion, pas de GitHub."]], "28": [["Axiome", "Axiome 1 — GitHub est un site web.\nAxiome 2 — Il héberge sur internet des projets gérés avec Git."], ["Phrase", "Il s’oppose à Git sur un point : Git est un logiciel sur l’ordinateur, GitHub un site sur internet."]], "29": [["Axiome", "Axiome 2 — Il héberge sur internet des projets gérés avec Git.\nAxiome 3 — Il ajoute des outils autour de Git : discussion, publication, automatisation."], ["Phrase", "Git garde les versions ; GitHub les met en ligne et ajoute le reste."]], "30": [["Axiome", "Axiome 1 — GitHub est un site web.\nAxiome 6 — Pour l’ouvrir, je tape `github.com` dans le navigateur."], ["Phrase", "Pour s’en servir, il faut un navigateur et l’adresse `github.com`."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ses concurrents, GitLab et Bitbucket, font la même chose avec d’autres outils autour."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ce que chacun publie sur GitHub peut être lu, copié et amélioré par d’autres."]], "33": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un changement fait sur le site est visible aussitôt, partout."]], "34": [["Axiome", "Axiome 1 — GitHub est un site web."], ["Phrase", "Il se trouve sur internet, et non sur un ordinateur précis."]], "35": [["Axiome", "Axiome 1 — GitHub est un site web.\nAxiome 2 — Il héberge sur internet des projets gérés avec Git.\nAxiome 3 — Il ajoute des outils autour de Git : discussion, publication, automatisation.\nAxiome 4 — Son interface est en anglais.\nAxiome 5 — Son usage de base est gratuit.\nAxiome 6 — Pour l’ouvrir, je tape `github.com` dans le navigateur."], ["Phrase", "Six propositions : c’est un site ; il héberge des projets Git ; il ajoute des outils ; il est en anglais ; il est gratuit à la base ; on l’ouvre par son adresse."]], "36": [["Axiome", "Axiome 1 — GitHub est un site web.\nAxiome 4 — Son interface est en anglais.\nAxiome 5 — Son usage de base est gratuit."], ["Phrase", "On dit de GitHub qu’il est un site, en anglais, gratuit dans son usage de base."]], "37": [["Axiome", "Axiome 2 — Il héberge sur internet des projets gérés avec Git."], ["Phrase", "Si un projet est sur GitHub, alors il est géré avec Git."]], "38": [["Axiome", "Axiome 1 — GitHub est un site web.\nAxiome 6 — Pour l’ouvrir, je tape `github.com` dans le navigateur."], ["Phrase", "Conséquence nécessaire : on y accède avec un navigateur."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Presque tous les outils libres connus y sont : on en conclut que c’est le lieu de référence."]], "40": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Si une adresse commence par `github.com/`, la meilleure explication est qu’il s’agit d’un projet ou d’un compte GitHub."]], "41": [["Axiome", "Axiome 2 — Il héberge sur internet des projets gérés avec Git.\nAxiome 5 — Son usage de base est gratuit."], ["Phrase", "Arguments : gratuit, accessible partout, et fondé sur Git, l’outil le plus répandu."]], "42": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On le montre en ouvrant `github.com` : le site s’affiche, avec ses projets."]], "43": [["Axiome", "Axiome 1 — GitHub est un site web.\nAxiome 2 — Il héberge sur internet des projets gérés avec Git.\nAxiome 3 — Il ajoute des outils autour de Git : discussion, publication, automatisation.\nAxiome 4 — Son interface est en anglais.\nAxiome 5 — Son usage de base est gratuit.\nAxiome 6 — Pour l’ouvrir, je tape `github.com` dans le navigateur."], ["Phrase", "Six principes : un site, des projets Git, des outils, l’anglais, la gratuité de base, une adresse."]], "44": [["Axiome", "Axiome 1 — GitHub est un site web."], ["Phrase", "Exclu : installer GitHub comme un logiciel ; c’est un site, il s’ouvre."]], "45": [["Axiome", "Axiome 1 — GitHub est un site web.\nAxiome 2 — Il héberge sur internet des projets gérés avec Git.\nAxiome 3 — Il ajoute des outils autour de Git : discussion, publication, automatisation.\nAxiome 4 — Son interface est en anglais.\nAxiome 5 — Son usage de base est gratuit.\nAxiome 6 — Pour l’ouvrir, je tape `github.com` dans le navigateur."], ["Phrase", "Les axiomes s’accordent : un site en anglais, gratuit, qui héberge des projets Git et leurs outils."]], "46": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Connaissance stable : le site existe depuis 2008 et sa documentation officielle est en ligne."]], "47": [["Axiome", "Axiome 2 — Il héberge sur internet des projets gérés avec Git."], ["Phrase", "Justification : un projet Git en ligne se partage et se sauvegarde mieux qu’un dossier sur un seul ordinateur."]], "48": [["Axiome", "Axiome 6 — Pour l’ouvrir, je tape `github.com` dans le navigateur."], ["Phrase", "Preuve : taper `github.com` ouvre le site."]], "49": [["Axiome", "Axiome 2 — Il héberge sur internet des projets gérés avec Git."], ["Phrase", "Un projet est sur GitHub s’il y est hébergé et géré avec Git."]], "50": [["Axiome", "Axiome 6 — Pour l’ouvrir, je tape `github.com` dans le navigateur."], ["Phrase", "On le vérifie en tapant l’adresse dans le navigateur."]], "51": [["Axiome", "Axiome 5 — Son usage de base est gratuit."], ["Phrase", "Il serait réfuté sur la gratuité si l’usage de base devenait payant."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Certitude élevée sur l’essentiel ; l’interface, elle, change souvent dans le détail."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Aucune hypothèse : c’est un service réel, qu’on peut consulter."]], "54": [["Axiome", "Axiome 1 — GitHub est un site web."], ["Phrase", "Il s’observe directement : on ouvre le site et on regarde."]], "55": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le modèle : un serveur central qui garde une copie de chaque projet Git, avec des pages pour les consulter."]], "56": [["Axiome", "Axiome 1 — GitHub est un site web."], ["Phrase", "C’est un site web, un service en ligne."]], "57": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il existe depuis 2008 ; Microsoft l’a racheté en 2018."]], "58": [["Axiome", "Axiome 2 — Il héberge sur internet des projets gérés avec Git."], ["Phrase", "Ce qui l’identifie : l’hébergement de projets odifier en demande un."], ["Phrase", "Pertinent dès qu’on veut modifier ; superflu pour seulement lire un projet public."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’améliore en ajoutant une photo, une courte présentation et la double authentification."]]}, "dep": {"1": [["Axiome", "Axiome 2 — Il contient les fichiers du projet et toutes leurs versions."], ["Phrase", "Un dépôt se compose des fichiers du projet et de toutes leurs versions."]], "2": [["Axiome", "Axiome 2 — Il contient les fichiers du projet et toutes leurs versions."], ["Phrase", "Ses éléments fondamentaux : les fichiers et leurs versions."]], "3": [["Axiome", "Axiome 2 — Il contient les fichiers du projet et toutes leurs versions.\nAxiome 3 — Il appartient à un compte."], ["Phrase", "Fichiers et versions, réunis sous un nom, rattachés à un compte."]], "4": [["Axiome", "Axiome 2 — Il contient les fichiers du projet et toutes leurs versions."], ["Phrase", "Il se décompose en fichiers, eux-mêmes rangés en dossiers, et en versions."]], "5": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un compte peut avoir autant de dépôts qu’il veut ; un dépôt, autant de fichiers qu’il faut."]], "6": [["Axiome", "Axiome 1 — Un dépôt est un projet hébergé sur GitHub."], ["Phrase", "Sa nature : un projet, hébergé en ligne."]], "7": [["Axiome", "Axiome 1 — Un dépôt est un projet hébergé sur GitHub."], ["Phrase", "Un dépôt, c’est un projet sur GitHub."]], "8": [["Axiome", "Axiome 1 — Un dépôt est un projet hébergé sur GitHub.\nAxiome 2 — Il contient les fichiers du projet et toutes leurs versions."], ["Phrase", "Un dépôt est un projet hébergé sur GitHub, avec ses fichiers et toutes leurs versions."]], "9": [["Axiome", "Axiome 1 — Un dépôt est un projet hébergé sur GitHub.\nAxiome 2 — Il contient les fichiers du projet et toutes leurs versions.\nAxiome 3 — Il appartient à un compte.\nAxiome 4 — Son adresse est `github.com/compte/dépôt`."], ["Phrase", "Être un projet, contenir fichiers et versions, appartenir à un compte, avoir une adresse."]], "10": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Exemples : support-autoformation, un site, un programme, un recueil de notes."]], "11": [["Axiome", "Axiome 5 — En anglais, un dépôt se dit « repository », souvent abrégé « repo »."], ["Phrase", "En anglais « repository », abrégé « repo » ; en français, « dépôt »."]], "12": [["Axiome", "Axiome 5 — En anglais, un dépôt se dit « repository », souvent abrégé « repo »."], ["Phrase", "« Repository » signifie « entrepôt » : l’endroit où l’on dépose et garde."]], "13": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On peut le voir comme un dossier en ligne, ou comme l’archive complète d’un projet."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Dépôt » désigne aussi un lieu de stockage ou un versement ; ici, c’est un projet GitHub."]], "15": [["Axiome", "Axiome 3 — Il appartient à un compte.\nAxiome 6 — Sa page est découpée en onglets ; l’onglet « Code » montre ses fichiers."], ["Phrase", "Le compte en haut, puis les onglets, puis les fichiers."]], "16": [["Axiome", "Axiome 3 — Il appartient à un compte.\nAxiome 4 — Son adresse est `github.com/compte/dépôt`."], ["Phrase", "Hiérarchie : le compte, puis le dépôt, puis ses dossiers et fichiers."]], "17": [["Axiome", "Axiome 2 — Il contient les fichiers du projet et toutes leurs versions.\nAxiome 6 — Sa page est découpée en onglets ; l’onglet « Code » montre ses fichiers."], ["Phrase", "Vue d’ensemble : une page à onglets, dont « Code » qui montre les fichiers."]], "18": [["Axiome", "Axiome 6 — Sa page est découpée en onglets ; l’onglet « Code » montre ses fichiers."], ["Phrase", "Sa page : le nom en haut, les onglets dessous, la liste des fichiers au centre."]], "19": [["Axiome", "Axiome 1 — Un dépôt est un projet hébergé sur GitHub."], ["Phrase", "Il se range parmi les projets hébergés."]], "20": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Types : public ou privé ; personnel ou d’organisation ; original ou copie (fork)."]], "21": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Chaque dépôt est autonome : ses fichiers, ses versions, ses réglages."]], "22": [["Axiome", "Axiome 2 — Il contient les fichiers du projet et toutes leurs versions.\nAxiome 3 — Il appartient à un compte."], ["Phrase", "Le dépôt relie un compte à des fichiers et à leurs versions."]], "23": [["Axiome", "Axiome 3 — Il appartient à un compte.\nAxiome 4 — Son adresse est `github.com/compte/dépôt`."], ["Phrase", "Puisqu’il appartient à un compte, le nom du compte entre dans son adresse."]], "24": [["Axiome", "Axiome 7 — Pour créer un dépôt, je clique sur « + » en haut à droite, puis sur « New repository »."], ["Phrase", "Créer un dépôt fait naître une nouvelle adresse et une page vide."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un dépôt actif a beaucoup de versions récentes."]], "26": [["Axiome", "Axiome 1 — Un dépôt est un projet hébergé sur GitHub.\nAxiome 2 — Il contient les fichiers du projet et toutes leurs versions."], ["Phrase", "Sa fonction : contenir un projet et sa mémoire."]], "27": [["Axiome", "Axiome 3 — Il appartient à un compte."], ["Phrase", "Il dépend d’un compte, son propriétaire."]], "28": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il s’oppose au dossier ordinaire, qui ne garde que la dernière version."]], "29": [["Axiome", "Axiome 2 — Il contient les fichiers du projet et toutes leurs versions.\nAxiome 6 — Sa page est découpée en onglets ; l’onglet « Code » montre ses fichiers."], ["Phrase", "Les fichiers et les onglets se complètent : on voit le contenu et on accède aux outils."]], "30": [["Axiome", "Axiome 7 — Pour créer un dépôt, je clique sur « + » en haut à droite, puis sur « New repository »."], ["Phrase · hors axiomes", "Il faut être connecté pour créer un dépôt."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Comme un dossier, il contient des fichiers ; contrairement à lui, il garde leur passé."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ce qu’on change dans un fichier change le dépôt, et le dépôt garde la trace du changement."]], "33": [["Axiome", "Axiome 2 — Il contient les fichiers du projet et toutes leurs versions."], ["Phrase", "Les versions du dépôt se succèdent dans le temps."]], "34": [["Axiome", "Axiome 4 — Son adresse est `github.com/compte/dépôt`."], ["Phrase", "Il a une place précise : `github.com/compte/dépôt`."]], "35": [["Axiome", "Axiome 1 — Un dépôt est un projet hébergé sur GitHub.\nAxiome 2 — Il contient les fichiers du projet et toutes leurs versions.\nAxiome 3 — Il appartient à un compte.\nAxiome 4 — Son adresse est `github.com/compte/dépôt`.\nAxiome 5 — En anglais, un dépôt se dit « repository », souvent abrégé « repo ».\nAxiome 6 — Sa page est découpée en onglets ; l’onglet « Code » montre ses fichiers.\nAxiome 7 — Pour créer un dépôt, je clique sur « + » en haut à droite, puis sur « New repository ».\nAxiome 8 — Je retrouve mes dépôts sur ma page de profil, onglet « Repositories »."], ["Phrase", "Huit propositions : projet hébergé ; fichiers et versions ; appartient à un compte ; adresse ; « repo » ; onglets ; création par « + » ; liste sur le profil."]], "36": [["Axiome", "Axiome 1 — Un dépôt est un projet hébergé sur GitHub.\nAxiome 3 — Il appartient à un compte."], ["Phrase", "On dit d’un dépôt qu’il est hébergé et qu’il appartient à un compte."]], "37": [["Axiome", "Axiome 3 — Il appartient à un compte.\nAxiome 4 — Son adresse est `github.com/compte/dépôt`."], ["Phrase", "Si l’adresse commence par `github.com/payetemmy/`, le dépôt appartient au compte payetemmy."]], "38": [["Axiome", "Axiome 2 — Il contient les fichiers du projet et toutes leurs versions."], ["Phrase", "Conséquence nécessaire : chaque version d’un fichier du dépôt reste disponible."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Tous les projets de GitHub sont des dépôts : c’est l’unité de base du site."]], "40": [["Axiome", "Axiome 4 — Son adresse est `github.com/compte/dépôt`."], ["Phrase", "Devant une adresse `github.com/a/b`, la meilleure explication : le dépôt b du compte a."]], "41": [["Axiome", "Axiome 2 — Il contient les fichiers du projet et toutes leurs versions."], ["Phrase", "Argument : un dépôt garde tout, on ne perd rien."]], "42": [["Axiome", "Axiome 4 — Son adresse est `github.com/compte/dépôt`."], ["Phrase", "On montre qu’un dépôt existe en ouvrant son adresse."]], "43": [["Axiome", "Axiome 1 — Un dépôt est un projet hébergé sur GitHub.\nAxiome 2 — Il contient les fichiers du projet et toutes leurs versions.\nAxiome 3 — Il appartient à un compte.\nAxiome 4 — Son adresse est `github.com/compte/dépôt`.\nAxiome 5 — En anglais, un dépôt se dit « repository », souvent abrégé « repo ».\nAxiome 6 — Sa page est découpée en onglets ; l’onglet « Code » montre ses fichiers.\nAxiome 7 — Pour créer un dépôt, je clique sur « + » en haut à droite, puis sur « New repository ».\nAxiome 8 — Je retrouve mes dépôts sur ma page de profil, onglet « Repositories »."], ["Phrase", "Huit principes le fondent, du projet hébergé à la liste des dépôts sur le profil."]], "44": [["Axiome", "Axiome 3 — Il appartient à un compte."], ["Phrase", "Exclu : un dépôt sans propriétaire."]], "45": [["Axiome", "Axiome 1 — Un dépôt est un projet hébergé sur GitHub.\nAxiome 2 — Il contient les fichiers du projet et toutes leurs versions.\nAxiome 3 — Il appartient à un compte.\nAxiome 4 — Son adresse est `github.com/compte/dépôt`.\nAxiome 5 — En anglais, un dépôt se dit « repository », souvent abrégé « repo ».\nAxiome 6 — Sa page est découpée en onglets ; l’onglet « Code » montre ses fichiers.\nAxiome 7 — Pour créer un dépôt, je clique sur « + » en haut à droite, puis sur « New repository ».\nAxiome 8 — Je retrouve mes dépôts sur ma page de profil, onglet « Repositories »."], ["Phrase", "Les axiomes s’accordent : un projet, à un compte, à une adresse, avec ses onglets."]], "46": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Connaissance sûre : c’est la notion centrale du site."]], "47": [["Axiome", "Axiome 2 — Il contient les fichiers du projet et toutes leurs versions."], ["Phrase", "Justification : un projet a besoin d’un lieu qui garde ses fichiers et leur passé."]], "48": [["Axiome", "Axiome 6 — Sa page est découpée en onglets ; l’onglet « Code » montre ses fichiers."], ["Phrase", "Preuve : l’onglet « Code » montre ses fichiers."]], "49": [["Axiome", "Axiome 1 — Un dépôt est un projet hébergé sur GitHub."], ["Phrase", "C’est un dépôt s’il est hébergé sur GitHub comme projet."]], "50": [["Axiome", "Axiome 8 — Je retrouve mes dépôts sur ma page de profil, onglet « Repositories »."], ["Phrase", "On le vérifie dans l’onglet « Repositories » du profil."]], "51": [["Axiome", "Axiome 4 — Son adresse est `github.com/compte/dépôt`."], ["Phrase", "Réfuté si son adresse ne mène à rien : il a été supprimé ou renommé."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Certitude élevée."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Aucune hypothèse."]], "54": [["Axiome", "Axiome 6 — Sa page est découpée en onglets ; l’onglet « Code » montre ses fichiers."], ["Phrase", "On l’observe en ouvrant sa page et ses onglets."]], "55": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Modèle : un projet Git, copié sur le serveur de GitHub."]], "56": [["Axiome", "Axiome 1 — Un dépôt est un projet hébergé sur GitHub."], ["Phrase", "C’est un projet."]], "57": [["Axiome", "Axiome 7 — Pour créer un dépôt, je clique sur « + » en haut à droite, puis sur « New repository »."], ["Phrase", "Il existe dès qu’on le crée par « New repository »."]], "58": [["Axiome", "Axiome 4 — Son adresse est `github.com/compte/dépôt`."], ["Phrase", "Son identité : le couple compte et nom, visible dans l’adresse."]], "59": [["Axiome", "Axiome 1 — Un dépôt est un projet hébergé sur GitHub."], ["Phrase", "Catégorie : les projets hébergés."]], "60": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un dépôt peut être vide, jamais sans nom."]], "61": [["Axiome", "Axiome 2 — Il contient les fichiers du projet et toutes leurs versions."], ["Phrase", "Son essence : les fichiers d’un projet et leurs versions."]], "62": [["Axiome", "Axiome 2 — Il contient les fichiers du projet et toutes leurs versions."], ["Phrase", "Il s’arrête à ses propres fichiers."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il prend son sens comme lieu de travail d’un projet."]], "64": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On le crée au début d’un projet, avant le premier fichier."]], "65": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il garde tout son passé depuis sa création."]], "66": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le mot « repo » est devenu courant chez les développeurs, même en français."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Domaine : la gestion de projets en ligne."]], "68": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un dépôt peut être partagé avec des collaborateurs invités."]], "69": [["Axiome", "Axiome 4 — Son adresse est `github.com/compte/dépôt`."], ["Phrase", "Il est situé : un compte, un nom, une adresse."]], "70": [["Axiome", "Axiome 1 — Un dépôt est un projet hébergé sur GitHub."], ["Phrase", "Son rôle : héberger un projet."]], "71": [["Axiome", "Axiome 2 — Il contient les fichiers du projet et toutes leurs versions.\nAxiome 6 — Sa page est découpée en onglets ; l’onglet « Code » montre ses fichiers."], ["Phrase", "Il fournit ses fichiers, leurs versions et des onglets d’outils."]], "72": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Opérations : créer, renommer, rendre public ou privé, supprimer."]], "73": [["Axiome", "Axiome 2 — Il contient les fichiers du projet et toutes leurs versions."], ["Phrase", "Dans l’action : on travaille dans un dépôt, on ne perd aucune version."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il contribue à organiser un projet en un lieu unique."]], "75": [["Axiome", "Axiome 1 — Un dépôt est un projet hébergé sur GitHub."], ["Phrase", "Utile pour tout projet qu’on veut garder en ligne."]], "76": [["Axiome", "Axiome 7 — Pour créer un dépôt, je clique sur « + » en haut à droite, puis sur « New repository »."], ["Phrase · hors axiomes", "Cliquer sur « Create repository » crée le dépôt."]], "77": [["Axiome", "Axiome 7 — Pour créer un dépôt, je clique sur « + » en haut à droite, puis sur « New repository »."], ["Phrase", "Étape par étape : « + », « New repository », un nom, puis « Create repository »."]], "78": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il change à chaque modification de ses fichiers."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il grandit : fichiers ajoutés, versions accumulées."]], "80": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il peut être renommé, transféré à un autre compte, archivé."]], "81": [["Axiome", "Axiome 7 — Pour créer un dépôt, je clique sur « + » en haut à droite, puis sur « New repository »."], ["Phrase", "Il naît du bouton « + » puis « New repository »."]], "82": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Processus : on ajoute ou modifie des fichiers, le dépôt garde chaque version."]], "83": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il accepte tout type de fichiers : texte, images, sons."]], "84": [["Axiome", "Axiome 2 — Il contient les fichiers du projet et toutes leurs versions."], ["Phrase", "Ses états successifs sont ses versions."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Appréciation : la brique de base, simple à créer."]], "86": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Norme : un nom court, en minuscules, avec des tirets, comme support-autoformation."]], "87": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Valeur : un projet rangé et durable."]], "88": [["Axiome", "Axiome 1 — Un dépôt est un projet hébergé sur GitHub.\nAxiome 2 — Il contient les fichiers du projet et toutes leurs versions."], ["Phrase", "Critères : un projet clair, des fichiers rangés, des versions gardées."]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un bon dépôt a un nom parlant et une présentation."]], "90": [["Axiome", "Axiome 1 — Un dépôt est un projet hébergé sur GitHub."], ["Phrase", "Pertinent pour tout projet en ligne ; un dépôt par projet."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’améliore avec une description et un fichier de présentation."]]}, "par": {"1": [["Axiome", "Axiome 1 — Les paramètres sont les réglages d’un dépôt.\nAxiome 4 — Ils sont rangés en sections, dans une colonne à gauche.\nAxiome 5 — La « Danger Zone », tout en bas, regroupe les réglages risqués."], ["Phrase", "Les paramètres se composent de réglages, rangés en sections, avec la « Danger Zone » en bas."]], "2": [["Axiome", "Axiome 1 — Les paramètres sont les réglages d’un dépôt."], ["Phrase", "Leur élément fondamental : le réglage."]], "3": [["Axiome", "Axiome 4 — Ils sont rangés en sections, dans une colonne à gauche.\nAxiome 5 — La « Danger Zone », tout en bas, regroupe les réglages risqués."], ["Phrase", "Les réglages se regroupent en sections ; les plus risqués sont réunis dans la « Danger Zone »."]], "4": [["Axiome", "Axiome 4 — Ils sont rangés en sections, dans une colonne à gauche."], ["Phrase", "Ils se décomposent en sections : General, Branches, Actions, Pages, et d’autres."]], "5": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une vingtaine de sections ; la plupart des débutants n’en utilisent que deux ou trois."]], "6": [["Axiome", "Axiome 1 — Les paramètres sont les réglages d’un dépôt.\nAxiome 5 — La « Danger Zone », tout en bas, regroupe les réglages risqués."], ["Phrase", "Des réglages de nature différente : ordinaires ou risqués."]], "7": [["Axiome", "Axiome 1 — Les paramètres sont les réglages d’un dépôt."], ["Phrase", "Les paramètres, c’est l’endroit où l’on règle son dépôt."]], "8": [["Axiome", "Axiome 1 — Les paramètres sont les réglages d’un dépôt.\nAxiome 2 — Ils se trouvent dans l’onglet « Settings » du dépôt."], ["Phrase", "Les paramètres sont les réglages d’un dépôt, dans son onglet « Settings »."]], "9": [["Axiome", "Axiome 1 — Les paramètres sont les réglages d’un dépôt.\nAxiome 2 — Ils se trouvent dans l’onglet « Settings » du dépôt.\nAxiome 3 — Seuls le propriétaire du dépôt et ses administrateurs y ont accès."], ["Phrase", "Régler, se trouver dans « Settings », être réservés au propriétaire et aux administrateurs."]], "10": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ils couvrent le nom, la visibilité, les branches, Actions, Pages, les collaborateurs."]], "11": [["Axiome", "Axiome 2 — Ils se trouvent dans l’onglet « Settings » du dépôt."], ["Phrase", "En anglais : Settings ; on dit aussi « réglages »."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Paramètre » vient du grec : ce qui mesure à côté, ce qui fixe les conditions."]], "13": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ils peuvent être vus comme le tableau de bord du dépôt."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il y a les paramètres du dépôt et ceux du compte ; ici, ceux du dépôt."]], "
