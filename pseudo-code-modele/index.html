<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Support</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e0e10">
<meta name="apple-mobile-web-app-title" content="Moyenne">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="color-scheme" content="dark">
<style>
:root{--bg:#0e0e10;--fg:#e8e8ea;--muted:#7c7c84;--faint:#232326;--line:#3a3a40;--accent:#8ab4ff;--code-bg:#1a1a1f;--ok:#7fd1a3;--warn:#e6b86a;--bad:#ef8a8a}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body,code,pre,textarea{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:40px 22px 60px;padding-top:max(40px,env(safe-area-inset-top))}
.wrap{max-width:640px;margin:0 auto}
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:28px;font-weight:600;line-height:1.2;margin:6px 0 14px}
.meta{display:grid;grid-template-columns:84px minmax(0,1fr);gap:4px 12px;font-size:15px}
.meta .k{color:var(--muted)}
.tools{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.b{background:none;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;cursor:pointer}
.b.on{background:#1d2433;border-color:#2c3a55}
.hint{font-size:13px;color:var(--muted)}
nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:18px;overflow-x:auto;margin:22px -22px 0;padding:12px 22px;border-bottom:1px solid var(--faint);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{color:var(--muted);text-decoration:none;font-size:14px;white-space:nowrap}
nav a.on{color:var(--fg)}
nav a span{color:var(--line);margin-right:4px;font-variant-numeric:tabular-nums}
section{scroll-margin-top:50px}
h2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:42px 0 2px}
.q{font-size:20px;font-weight:600;margin-bottom:6px}
.el{padding:16px 0;border-top:1px solid var(--faint);scroll-margin-top:56px;border-radius:6px}
.hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.id{color:var(--accent);font-size:13px;font-variant-numeric:tabular-nums}
.ty{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.nm{font-weight:600}
.tx{margin-top:4px}
.f{display:grid;grid-template-columns:84px minmax(0,1fr);gap:5px 12px;margin-top:8px}
.f .k{color:var(--muted);font-size:14px;padding-top:1px}
code{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--code-bg);padding:1px 6px;border-radius:6px;white-space:nowrap}
pre{font:14px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--code-bg);padding:10px 12px;border-radius:8px;margin:0;overflow-x:auto}
.ch{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.c{color:var(--accent);background:none;border:1px solid var(--line);border-radius:999px;padding:1px 10px;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;cursor:pointer}
.sub{margin-top:12px;padding-left:12px;border-left:2px solid var(--line)}
.sub .lb{font-size:11px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.sub.ex .lb{color:var(--ok)}
.sub.ce .lb{color:var(--bad)}
.fd{display:none;margin-top:8px;font-size:13px;color:var(--muted)}
body.fond .fd{display:block}
.fd b{font-weight:600}
.s-etabli{color:var(--ok)}.s-admis{color:var(--fg)}.s-averifier{color:var(--warn)}.s-refute{color:var(--bad)}
.flash{animation:fl 1.4s ease-out}
@keyframes fl{0%{background:#1d2433}100%{background:transparent}}
textarea{display:block;width:100%;min-height:190px;margin-top:10px;background:var(--code-bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:16px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical;tab-size:4}
textarea:focus{outline:none;border-color:#2c3a55}
.sol{display:none;margin-top:14px}
.sol.on{display:block;animation:in .3s ease-out}
@keyframes in{from{opacity:0}to{opacity:1}}
.test{margin-top:14px}
@media (max-width:480px){nav{gap:14px}nav a span{display:none}pre{font-size:13px}}
.ar{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:1.05em}
footer{margin-top:48px;padding-top:14px;border-top:1px solid var(--faint);font-size:13px;color:var(--muted)}
footer a{color:var(--accent)}
footer p{margin:4px 0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
var PAGE={
 kicker:"Pseudo-code · modèle v1",
 titre:"Écrire la moyenne en pseudo-code",
 objectif:"À la fin, tu écris seul la procédure qui calcule la moyenne de N notes.",
 domaine:"Le pseudo-code de ce support, d'après Éduscol et le lycée Lafayette (pas de norme unique, voir P4).",
 aide:"Pastilles bleues : aller à l'élément cité.",
 sources:[
  {t:"Éduscol, Algorithmique, ressource pour la classe de seconde (2009)"},
  {t:"Lycée Lafayette (Brioude), page Pseudo-code",url:"https://sites.google.com/view/lycee-lafayette-brioude/ressources_1/pseudo-code"}
 ],
 pied:"Construit avec le modèle de représentation d'une connaissance, version 1."
};
var EL=[
/* ---------- Concepts ---------- */
{id:"Variable",type:"concept",nom:"Variable",t:"Emplacement de mémoire désigné par un nom, qui contient une valeur à la fois.",par:["P1"],f:["établi","Éduscol (image du tiroir)","reformulée"]},
{type:"exemple",cible:"Variable",t:"`age` : un nom qui désigne un emplacement contenant une valeur, par exemple 17.",f:["établi","convention","ajout"]},
{type:"contre",cible:"Variable",label:"Contre-exemple (définition trop large)",t:"\"Une variable est un nom dans un algorithme\" est trop large : le nom de l'algorithme, écrit après ALGORITHME, est un nom mais pas une variable.",f:["établi","lycée Lafayette (structure ALGORITHME / DEBUT / FIN)","ajout"]},
{id:"Affectation",type:"concept",nom:"Affectation",t:"Instruction qui range une valeur dans une variable. Elle se lit \"prend la valeur\".",f:["établi","Éduscol (\"prend la valeur\")","reformulée"]},
{id:"Condition",type:"concept",nom:"Condition",t:"Expression qui vaut vrai ou faux.",f:["établi","Éduscol","reformulée"]},
{type:"exemple",cible:"Condition",t:"`note > 20` vaut vrai si note vaut 25, faux si note vaut 14.",f:["établi","démonstration","ajout"]},
{id:"Boucle",type:"concept",nom:"Boucle",t:"Structure qui répète un traitement.",f:["établi","lycée Lafayette (\"structures de répétition\")","reformulée"]},

/* ---------- Propriétés ---------- */
{id:"P1",type:"propriete",nom:"une valeur à la fois",t:"Une variable ne contient qu'une valeur à la fois.",porte:["Variable"],f:["établi","Éduscol","reformulée"]},
{id:"P2",type:"propriete",nom:"écriture de l'affectation",t:"Dans ce support, l'affectation s'écrit `←` : `x ← 5` se lit \"x prend la valeur 5\".",porte:["Affectation"],f:["admis","convention (le lycée Lafayette accepte aussi `:=`)","ajout"]},
{id:"P3",type:"propriete",nom:"types",t:"Dans la convention du lycée Lafayette, une variable a un type : entier, réel, booléen, caractère ou chaîne.",porte:["Variable"],f:["établi","lycée Lafayette","reformulée"]},
{id:"P4",type:"propriete",nom:"pas de norme",t:"Il n'existe pas de norme unique du pseudo-code : chaque support fixe ses conventions (ici P2, P5, P6).",porte:["le pseudo-code"],f:["établi","lycée Lafayette (\"Il n'y a pas de norme qui régisse ce langage\")","reformulée"]},
{id:"P5",type:"propriete",nom:"lire / afficher",t:"Dans ce support, `lire x` range dans x la valeur tapée par l'utilisateur ; `afficher x` montre la valeur de x.",porte:["Variable"],f:["admis","convention (Éduscol écrit \"Saisir\" et \"Afficher\")","ajout"]},
{id:"P6",type:"propriete",nom:"écriture des boucles",t:"Dans ce support, une boucle s'écrit `pour i de 1 jusqu'à N`, `tant que condition` ou `répéter … jusqu'à condition`. Les lignes répétées sont décalées vers la droite.",porte:["Boucle","Condition"],f:["admis","convention, d'après les boucles d'Éduscol (Pour, Tant que, Répète…jusqu'à)","ajout"]},

/* ---------- Règles ---------- */
{id:"R1",type:"regle",nom:"Affectation",ctx:"exécution d'un pseudo-code",si:"`x ← e` s'exécute",alors:"e est calculée avec les valeurs actuelles, puis x prend ce résultat ; l'ancienne valeur de x est perdue",sauf:"aucune exception identifiée dans ce domaine",porte:["Affectation","Variable"],f:["établi","Éduscol","reformulée"]},
{type:"exemple",cible:"R1",t:"`x ← 5` : après, x vaut 5, quelle que soit sa valeur avant.",f:["établi","démonstration à partir de R1","ajout"]},
{type:"exemple",cible:"R1",t:"x vaut 3, puis `x ← x + 1` : x vaut 4, car x + 1 est calculé avec l'ancienne valeur, avant le remplacement.",f:["établi","démonstration à partir de R1","ajout"]},
{id:"R2",type:"regle",nom:"Boucle Pour",ctx:"une boucle `pour i de 1 jusqu'à N`",si:"elle s'exécute",alors:"les lignes décalées s'exécutent N fois : i vaut 1, puis 2, …, puis N",sauf:"aucune exception identifiée dans ce domaine",porte:["Boucle"],f:["établi","Éduscol (boucle Pour)","reformulée"]},
{type:"exemple",cible:"R2",t:"`pour i de 1 jusqu'à 3` puis, décalé, `afficher i` : affiche 1, 2, 3.",f:["établi","démonstration à partir de R2","ajout"]},
{id:"R3",type:"regle",nom:"Boucle Tant que",ctx:"une boucle `tant que condition`",si:"la condition est fausse au départ",alors:"les lignes décalées ne s'exécutent jamais",sauf:"aucune exception identifiée dans ce domaine",porte:["Boucle","Condition"],f:["établi","Éduscol","reformulée"]},
{type:"exemple",cible:"R3",t:"n vaut 3 et `tant que n < 0` : la condition est fausse dès le départ, rien ne s'exécute.",f:["établi","démonstration à partir de R3","ajout"]},
{id:"R4",type:"regle",nom:"Boucle Répéter",ctx:"une boucle `répéter … jusqu'à condition`",si:"la condition est déjà vraie au départ",alors:"les lignes s'exécutent quand même une fois : la condition n'est testée qu'après",sauf:"aucune exception identifiée dans ce domaine",porte:["Boucle","Condition"],f:["établi","Éduscol","reformulée"]},
{id:"R5",type:"action",nom:"Choisir la boucle",ctx:"écriture d'un pseudo-code",si:"il faut répéter un traitement",alors:"utiliser une boucle `pour`",sauf:"le nombre de tours n'est pas connu à l'avance : alors utiliser `tant que`",porte:["Boucle"],f:["établi","Éduscol","reformulée"]},
{type:"contre",cible:"R5",label:"Contre-exemple apparent",t:"Lire des notes jusqu'à ce que l'utilisateur tape −1 semble contredire R5 : on répète, mais `pour` ne convient pas. Ce cas relève de l'exception prévue : le nombre de tours n'est pas connu à l'avance.",f:["établi","démonstration à partir de R5","ajout"]},

/* ---------- Procédures ---------- */
{id:"Pr1",type:"procedure",nom:"Échange",ctx:"pseudo-code de ce support",pour:"échanger les valeurs de deux variables a et b",depart:"a et b contiennent chacune une valeur",etapes:["t ← a","a ← b","b ← t"],produit:"a contient l'ancienne valeur de b, et b l'ancienne valeur de a",si:"aucune condition particulière",mob:["R1"],f:["établi","démonstration à partir de R1","ajout"]},
{type:"exemple",cible:"Pr1",entrees:"a = 1, b = 2",resultat:"a = 2, b = 1",f:["établi","démonstration à partir de R1","ajout"]},
{type:"contre",cible:"Pr1",label:"Contre-exemple (sans t)",t:"`a ← b` puis `b ← a` n'échange pas : avec a = 1 et b = 2, on obtient a = 2 et b = 2. R1 l'explique : après `a ← b`, l'ancienne valeur de a est perdue.",f:["établi","démonstration à partir de R1","ajout"]},
{id:"Pr2",type:"procedure",nom:"Saisie d'une note",ctx:"pseudo-code de ce support",pour:"obtenir une note entre 0 et 20",depart:"l'utilisateur tape des valeurs",etapes:["lire note","tant que note < 0 ou note > 20","    lire note"],produit:"note contient une valeur entre 0 et 20",si:"l'utilisateur finit par taper une note valide",mob:["P5","R3","R5","Condition"],f:["à vérifier","test sur trois cas : 15 ; −2 puis 15 ; 25 puis 30 puis 8","ajout"]},
{type:"exemple",cible:"Pr2",entrees:"25, puis 14",resultat:"note = 14 (25 est refusé, 14 est gardé)",f:["établi","test","ajout"]},

/* ---------- À toi ---------- */
{id:"Pr3",type:"exercice",nom:"Moyenne",ctx:"pseudo-code de ce support",pour:"calculer et afficher la moyenne de N notes",depart:"N, le nombre de notes, avec N ≥ 1 ; l'utilisateur tape les notes une par une",produit:"la moyenne affichée",si:"les notes tapées sont des nombres",mob:["R1","R2","R5","P5","P6"],consigne:"Écris ici, une instruction par ligne. La solution est cachée.",etapes:["somme ← 0","pour i de 1 jusqu'à N","    lire note","    somme ← somme + note","moyenne ← somme / N","afficher moyenne"],f:["à vérifier","test sur un cas (celui ci-dessus)","ajout"]},
{type:"exemple",cible:"Pr3",avant:1,entrees:"N = 5 ; notes 12, 14, 9, 16, 11",resultat:"12,4 (62 / 5)"},
{type:"contre",cible:"Pr3",label:"Contre-exemple (N = 0)",t:"Avec N = 0, la boucle ne tourne pas et `somme / N` divise par zéro. D'où la condition N ≥ 1 dans \"À partir de\" : on a précisé la condition au lieu de réviser la procédure.",f:["établi","démonstration","ajout"]}
];
(function(){
var SECTIONS=[
 {k:"concept",h:"Concepts",q:"De quoi parle-t-on ?"},
 {k:"propriete",h:"Propriétés",q:"Qu'est-ce qui est vrai ?"},
 {k:"regle",h:"Règles",q:"Que se passe-t-il ? Que faut-il faire ?"},
 {k:"procedure",h:"Procédures",q:"Comment organise-t-on une action ?"},
 {k:"exercice",h:"À toi",q:"Écris la procédure."}
];
var TY={concept:"Concept",propriete:"Propriété",regle:"Règle descriptive",action:"Règle d'action",procedure:"Procédure",exercice:"Procédure à écrire"};
var BY={};EL.forEach(function(e){if(e.id)BY[e.id]=e});
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function nb(s){return s.replace(/ ([;:?!])/g,"\u00a0$1").replace(/ (=|≥|≤) /g,"\u00a0$1\u00a0")}
function ar(s){return s.replace(/←/g,'<span class="ar">←</span>')}
function fm(s){return ar(nb(esc(s)).replace(/`([^`]+)`/g,"<code>$1</code>"))}
function sec(e){return e.type==="action"?"regle":e.type}
function lab(id){var e=BY[id];if(!e)return null;return e.type==="concept"?e.nom:id+(e.nom?" "+e.nom:"")}
function chips(t,ids){if(!ids||!ids.length)return "";return '<div class="ch">'+t+" "+ids.map(function(i){var l=lab(i);return l?'<button class="c" data-go="'+esc(i)+'">'+esc(l)+"</button>":"<span>"+fm(i)+"</span>"}).join("")+"</div>"}
function sKey(s){return "s-"+s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z]/g,"")}
function fond(f){if(!f)return "";return '<div class="fd"><b class="'+sKey(f[0])+'">'+esc(f[0])+"</b> · "+fm(f[1])+" · "+esc(f[2])+"</div>"}
function fields(rows){var h='<div class="f">';rows.forEach(function(r){if(r[1]==null)return;h+='<div class="k">'+r[0]+"</div><div>"+(r[2]?r[1]:fm(r[1]))+"</div>"});return h+"</div>"}
function steps(a){return "<pre>"+ar(esc(a.join("\n")))+"</pre>"}
function subs(id){var h="";EL.forEach(function(x){if(x.cible!==id)return;
 var ce=x.type==="contre";
 h+='<div class="sub '+(ce?"ce":"ex")+'"><div class="lb">'+(x.label||(ce?"Contre-exemple":"Exemple"))+"</div>";
 if(x.entrees)h+=fields([["Entrées",x.entrees],["Résultat",x.resultat]]);else h+="<div>"+fm(x.t)+"</div>";
 h+=fond(x.f)+"</div>"});return h}
function head(e){return '<div class="hd">'+(e.type!=="concept"?'<span class="id">'+e.id+"</span>":"")+'<span class="nm">'+fm(e.nom||"")+'</span><span class="ty">'+TY[e.type]+"</span></div>"}
function body(e){var h="";
 if(e.type==="concept"){h+='<div class="tx">'+fm(e.t)+"</div>"+chips("défini par",e.par)}
 else if(e.type==="propriete"){h+='<div class="tx">'+fm(e.t)+"</div>"+chips("porte sur",e.porte)}
 else if(e.type==="regle"||e.type==="action"){h+=fields([["Contexte",e.ctx],["Si",e.si],["Alors",e.alors],["Sauf si",e.sauf]])+chips("porte sur",e.porte)}
 else if(e.type==="procedure"){h+=fields([["Contexte",e.ctx],["Pour",e.pour],["À partir de",e.depart],["Étapes",steps(e.etapes),1],["Produit",e.produit],["Réussit si",e.si]])+chips("mobilise",e.mob)}
 return h+fond(e.f)+subs(e.id)}
function exo(e){var h=fields([["Contexte",e.ctx],["Pour",e.pour],["À partir de",e.depart],["Produit",e.produit],["Réussit si",e.si]])+chips("mobilise",e.mob);
 h+='<textarea id="ta" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="'+esc(e.consigne)+'"></textarea>';
 h+='<div class="tools"><button class="b" id="fl">Insérer ←</button><span class="hint">ou tape <code>&lt;-</code></span></div>';
 var t=EL.filter(function(x){return x.cible===e.id&&x.avant})[0];
 if(t)h+='<div class="sub ex test"><div class="lb">Teste à la main</div>'+fields([["Entrées",t.entrees],["Résultat",t.resultat]])+"</div>";
 h+='<div class="tools"><button class="b" id="vs">Voir la solution</button></div>';
 h+='<div class="sol" id="sol">'+fields([["Étapes",steps(e.etapes),1]])+fond(e.f);
 EL.forEach(function(x){if(x.cible===e.id&&!x.avant)h+='<div class="sub '+(x.type==="contre"?"ce":"ex")+'"><div class="lb">'+(x.label||(x.type==="contre"?"Contre-exemple":"Exemple"))+"</div><div>"+fm(x.t)+"</div>"+fond(x.f)+"</div>"});
 return h+"</div>"}
var h='<div class="kicker">'+fm(PAGE.kicker)+"</div><h1>"+fm(PAGE.titre)+"</h1>";
h+=fields([["Objectif",PAGE.objectif],["Domaine",PAGE.domaine]]).replace('class="f"','class="meta"');
h+='<div class="tools"><button class="b" id="tf">Fondements</button><span class="hint">'+fm(PAGE.aide)+"</span></div>";
h+="<nav>"+SECTIONS.map(function(s,i){return '<a href="#'+s.k+'"><span>0'+(i+1)+"</span>"+s.h+"</a>"}).join("")+"</nav>";
SECTIONS.forEach(function(s,i){
 h+='<section id="'+s.k+'"><h2>0'+(i+1)+" · "+s.h+'</h2><div class="q">'+fm(s.q)+"</div>";
 EL.forEach(function(e){if(sec(e)!==s.k)return;h+='<div class="el" id="el-'+esc(e.id)+'">'+head(e)+(e.type==="exercice"?exo(e):body(e))+"</div>"});
 h+="</section>"});
h+="<footer>"+PAGE.sources.map(function(s){return "<p>"+(s.url?'<a href="'+esc(s.url)+'">'+esc(s.t)+"</a>":esc(s.t))+"</p>"}).join("")+"<p>"+fm(PAGE.pied)+"</p></footer>";
var app=document.getElementById("app");app.innerHTML=h;
document.title=PAGE.titre;
app.addEventListener("click",function(ev){var g=ev.target.closest("[data-go]");if(!g)return;var t=document.getElementById("el-"+g.getAttribute("data-go"));if(!t)return;
 t.scrollIntoView({behavior:"smooth",block:"start"});t.classList.remove("flash");void t.offsetWidth;t.classList.add("flash")});
var tf=document.getElementById("tf");tf.onclick=function(){var on=document.body.classList.toggle("fond");tf.classList.toggle("on",on);tf.textContent=on?"Masquer les fondements":"Fondements"};
var ta=document.getElementById("ta");
if(ta){document.getElementById("fl").onclick=function(){var a=ta.selectionStart,b=ta.selectionEnd;ta.value=ta.value.slice(0,a)+"← "+ta.value.slice(b);ta.focus();ta.selectionStart=ta.selectionEnd=a+2};
 ta.addEventListener("input",function(){var p=ta.selectionStart,v=ta.value,n=v.replace(/<-/g,"←");if(n!==v){ta.value=n;ta.selectionStart=ta.selectionEnd=p-(v.length-n.length)}});
 ta.addEventListener("keydown",function(ev){if(ev.key==="Tab"){ev.preventDefault();var a=ta.selectionStart;ta.value=ta.value.slice(0,a)+"    "+ta.value.slice(ta.selectionEnd);ta.selectionStart=ta.selectionEnd=a+4}});
 var vs=document.getElementById("vs"),sol=document.getElementById("sol");vs.onclick=function(){var on=sol.classList.toggle("on");vs.textContent=on?"Cacher la solution":"Voir la solution"}}
var links=[].slice.call(document.querySelectorAll("nav a")),secs=SECTIONS.map(function(s){return document.getElementById(s.k)});
function spy(){var k=0;secs.forEach(function(s,i){if(s.getBoundingClientRect().top<90)k=i});links.forEach(function(a,i){a.classList.toggle("on",i===k)})}
window.addEventListener("scroll",spy,{passive:true});spy();
})();
</script>
</body>
</html>
