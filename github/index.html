<style>

  background-image:linear-gradient(45deg,transparent 50%,var(--m) 50%),linear-gradient(135deg,var(--m) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}

  margin:4px 0 0;padding:2px 0 8px;scrollbar-width:none}

.jn code{white-space:normal;overflow-wrap:anywhere}
.jn{position:relative;margin-left:var(--gw);padding:12px 0 16px;font-size:13px;line-height:1.4;color:#c4c4cc}

.jn small{display:block;font-size:11px;color:var(--m);margin-top:2px}
.jn.no{color:#6a6a72;font-style:italic}
/* fiche d'une notion (plein écran) */
#sh{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch;
  padding:calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
#sh[hidden]{display:none}
#zo{z-index:30}
/* dans la fiche : les axiomes en liste, comme dans la boîte d'origine */
#sh .axr{display:block;overflow:visible;margin:0;padding:0}
#sh .ax{flex:none;border:0;background:none;font-size:14px;line-height:1.45;padding:6px 0;border-top:1px solid #1a1a1e}
#sh .ax:first-child{border-top:0}
#sh .ax:before{display:none}
#sh .ax .with{display:block;font-size:11.5px;color:var(--m);margin-top:1px}
/* notes */
.nb{margin-top:8px;border-top:1px solid var(--f);padding-top:6px}
.na{font-size:12.5px;color:var(--m);padding:6px 0}
.nl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#6a6a72;margin:2px 0 4px}
.nx{display:block;width:100%;min-height:64px;resize:none;overflow:hidden;font:inherit;font-size:16px;line-height:1.45;color:var(--fg);
  background:var(--bg);border:1px solid var(--l);border-radius:0;padding:8px;-webkit-appearance:none;appearance:none}
.nx:focus{outline:none;border-color:var(--up)}
.mn{margin-top:40px;border-top:1px solid var(--l);padding-top:16px}
.mn h2{font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--m);margin:0 0 6px}
.mn p{font-size:12.5px;color:var(--m);margin:0 0 10px;line-height:1.4}
.mb{display:flex;gap:8px;flex-wrap:wrap}
.mb button{font-size:13px;padding:7px 12px;border:1px solid var(--l)}
.tg{font-size:13px;padding:7px 12px;border:1px solid var(--l);margin-top:9px}

.lnn{margin:2px 0 4px;padding:6px 0 0 10px;border-left:2px solid var(--up);font-size:13px;line-height:1.45;color:#c4c4cc;white-space:pre-wrap}
.mf{font-size:12.5px;color:var(--c);margin-top:8px;min-height:18px}
.mi{margin-top:10px}

var COMP={"ver": {"notion": "ver"}, "git": {"notion": "git"}, "gh": {"notion": "gh"}, "cpt": {"notion": "cpt"}, "dep": {"notion": "dep"}, "par": {"notion": "par"}, "vis": {"notion": "vis"}, "fic": {"notion": "fic"}, "com": {"notion": "com"}, "his": {"notion": "his"}, "bra": {"notion": "bra"}, "pr": {"notion": "pr"}, "fus": {"notion": "fus"}, "iss": {"notion": "iss"}, "rdm": {"notion": "rdm"}, "act": {"notion": "act"}, "pag": {"notion": "pag"}, "cyc": {"notion": "cyc"}};
var NOTIONS={"ver": {"t": "Gestion de versions", "ax": ["Une version est l’état d’un projet à un moment donné.", "La gestion de versions garde chaque version d’un projet.", "Elle montre ce qui a changé d’une version à l’autre.", "Elle permet de revenir à une version précédente."], "pratique": []}, "git": {"t": "Git", "ax": ["Git est un logiciel de gestion de versions.", "Il garde les versions d’un dossier et de tous ses fichiers.", "Il est gratuit et libre.", "Il fonctionne aussi sans internet, sur un ordinateur."], "pratique": []}, "gh": {"t": "GitHub", "ax": ["GitHub est un site web.", "Il héberge sur internet des projets gérés avec Git.", "Il ajoute des outils autour de Git : discussion, publication, automatisation.", "Son interface est en anglais.", "Son usage de base est gratuit.", "Pour l’ouvrir, je tape `github.com` dans le navigateur."], "pratique": [6]}, "cpt": {"t": "Compte", "ax": ["Un compte identifie une personne sur GitHub.", "Chaque compte a un nom d’utilisateur unique.", "Ce nom apparaît dans l’adresse de ses pages : `github.com/nom`.", "Lire un projet public ne demande pas de compte ; le modifier en demande un.", "Pour me connecter, je clique sur « Sign in ».", "Le menu de mon compte s’ouvre en cliquant sur ma photo de profil, en haut à droite."], "pratique": [5, 6]}, "dep": {"t": "Dépôt", "ax": ["Un dépôt est un projet hébergé sur GitHub.", "Il contient les fichiers du projet et toutes leurs versions.", "Il appartient à un compte.", "Son adresse est `github.com/compte/dépôt`.", "En anglais, un dépôt se dit « repository », souvent abrégé « repo ».", "Sa page est découpée en onglets ; l’onglet « Code » montre ses fichiers.", "Pour créer un dépôt, je clique sur « + » en haut à droite, puis sur « New repository ».", "Je retrouve mes dépôts sur ma page de profil, onglet « Repositories »."], "pratique": [7, 8]}, "par": {"t": "Paramètres", "ax": ["Les paramètres sont les réglages d’un dépôt.", "Ils se trouvent dans l’onglet « Settings » du dépôt.", "Seuls , "his": {"t": "Historique", "ax": ["L’historique est la liste des commits d’un dépôt.", "Il va du commit le plus récent au plus ancien.", "Chaque ligne montre le message, l’auteur et la date d’un commit.", "Ouvrir un commit montre ses changements : en rouge ce qui est retiré, en vert ce qui est ajouté.", "Pour ouvrir l’historique, je clique sur le nombre de commits, à côté de l’horloge, au-dessus des fichiers.", "Pour voir les commits d’un seul fichier, j’ouvre ce fichier et je clique sur « History »."], "pratique": [5, 6]}, "bra": {"t": "Branche", "ax": ["Une branche est une suite de commits.", "Chaque dépôt a une branche principale, en général nommée `main`.", "Une nouvelle branche part d’une branche existante, comme une copie.", "Les commits faits sur une branche ne touchent pas les autres branches.", "Une branche sert à essayer un changement sans toucher à la branche principale.", "Le menu des branches, en haut à gauche des fichiers, montre la branche affichée.", "Pour créer une branche, j’ouvre ce menu, je tape un nom, puis je clique sur « Create branch »."], "pratique": [6, 7]}, "pr": {"t": "Pull request", "ax": ["Une pull request propose d’intégrer les commits d’une branche dans une autre.", "Elle compare deux branches : celle qui propose et celle qui reçoit.", "Elle montre les changements proposés avant toute intégration.", "On peut en discuter par des commentaires.", "Elle a un numéro, précédé de `#`.", "Elle reste ouverte jusqu’à ce qu’elle soit fusionnée ou fermée.", "Après un commit sur une branche, je clique sur « Compare & pull request ».", "Sinon, j’ouvre l’onglet « Pull requests », puis je clique sur « New pull request ».", "Je donne un titre, puis je clique sur « Create pull request »."], "pratique": [7, 8, 9]}, "fus": {"t": "Fusion", "ax": ["La fusion intègre les commits d’une branche dans une autre.", "Après la fusion, la branche qui reçoit contient les changements.", "Fusionner une pull request la ferme.", "Un conflit survient quand deux branches changent la même ligne différemment.", "Un conflit doit être résolu avant la fusion.", "Pour fusionner, je clique sur « Merge pull request », puis sur « Confirm merge ».", "Après la fusion, je peux supprimer la branche avec « Delete branch »."], "pratique": [6, 7]}, "iss": {"t": "Issue", "ax": ["Une issue note un problème, une question ou une tâche dans un dépôt.", "Elle a un titre, une description et un numéro précédé de `#`.", "Elle est ouverte ou fermée.", "On peut en discuter par des commentaires.", "Pour créer une issue, j’ouvre l’onglet « Issues », puis je clique sur « New issue ».", "Pour la fermer, je clique sur « Close issue »."], "pratique": [5, 6]}, "rdm": {"t": "README", "ax": ["Le README est le fichier qui présente un dépôt.", "Il est placé à la racine du dépôt, hors des dossiers.", "Son contenu s’affiche sous la liste des fichiers, sur la page du dépôt.", "Il s’appelle en général `README.md`.", "L’extension `.md` signale du Markdown : du texte avec des marques de mise en forme.", "En Markdown, je mets `#` en début de ligne pour faire un titre.", "En Markdown, j’entoure un mot de `**` pour le mettre en gras.", "Pour ajouter un README, je crée un fichier nommé `README.md`."], "pratique": [6, 7, 8]}, "act": {"t": "Actions", "ax": ["GitHub Actions lance des tâches automatiquement, sur les serveurs de GitHub.", "Une tâche se lance à la suite d’un événement, par exemple un commit.", "Un ensemble de tâches s’appelle un workflow.", "Chaque lancement d’un workflow s’appelle une exécution, « run » en anglais.", "Une exécution réussie a une coche verte, une exécution échouée une croix rouge, une exécution en cours un rond jaune.", "Pour suivre les exécutions, j’ouvre l’onglet « Actions ».", "Pour relancer une exécution échouée, je l’ouvre, puis je clique sur « Re-run jobs »."], "pratique": [6, 7]}, "pag": {"t": "GitHub Pages", "ax": ["GitHub Pages publie un site web à partir des fichiers d’un dépôt.", "L’adresse du site est `compte.github.io/dépôt`.", "Le fichier `index.html` est la page d’accueil du site.", "Sur un compte gratuit, le dépôt doit être public.", "Le site se met à jour après chaque commit sur la branche publiée.", "Pour activer GitHub Pages, j’ouvre les paramètres, section « Pages ».", "Sous « Source », je choisis « Deploy from a branch », puis la branche et le dossier, puis « Save »."], "pratique": [6, 7]}, "cyc": {"t": "Cycle de publication", "ax": ["Le cycle de publication mène d’un changement à sa mise en ligne.", "Il a quatre étapes : modifier, enregistrer, construire, afficher.", "Modifier : je change un fichier du dépôt.", "Enregistrer : je fais un commit sur la branche publiée.", "Construire : une exécution « pages build and deployment » se lance dans « Actions ».", "Afficher : quand elle a sa coche verte, la nouvelle version est en ligne.", "La mise en ligne prend en général une à deux minutes.", "Si le site ne change pas, je recharge sa page, car le navigateur peut garder l’ancienne version."], "pratique": [3, 4, 5, 6, 8]}};

, "ses frontières et limites"]]}, {"k": "H", "t": "Contextuelles", "d": "Étudient les conditions dans lesquelles la construction prend sens", "i": [[63, "Contextuelle", "son environnement de signification"], [64, "Situationnelle", "les circonstances particulières"], [65, "Historique", "son évolution dans le temps"], [66, "Culturelle", "son inscription culturelle"], [67, "Disciplinaire", "son domaine de connaissance"], [68, "Sociale", "son inscription dans les rapports sociaux"], [69, "Spatiotemporelle", "son inscription dans un espace et un temps"]]}, {"k": "I", "t": "Fonctionnelles et pragmatiques", "d": "Étudient son utilité et ses effets", "i": [[70, "Fonctionnelle", "son rôle"], [71, "Instrumentale", "les moyens qu’elle fournit"], [72, "Opératoire", "les opérations qu’elle permet"], [73, "Pragmatique", "ses effets dans l’action"], [74, "Finalitaire", "les objectifs auxquels elle contribue"], [75, "Utilitaire", "son utilité"], [76, "Performative", "ce que son énonciation accomplit"], [77, "Procédurale", "la manière de s’en servir, étape par étape"]]}, {"k": "J", "t": "Dynamiques et évolutives", "d": "Étudient ses transformations", "i": [[78, "Dynamique", "les changements qui l’affectent"], [79, "Évolutive", "son évolution"], [80, "Transformationnelle", "ses transformations"], [81, "Génétique", "son processus de formation"], [82, "Processuelle", "les processus qui la caractérisent"], [83, "Adaptative", "ses capacités d’adaptation"], [84, "Temporelle", "son évolution et ses états successifs"]]}, {"k": "K", "t": "Évaluatives", "d": "Étudient sa qualité et sa valeur", "i": [[85, "Évaluative", "son appréciation globale"], [86, "Normative", "sa conformité à des normes"], [87, "Axiologique", "sa valeur et les valeurs qu’elle engage"], [88, "Critérielle", "les critères d’appréciation"], [89, "Qualitative", "son degré de qualité"], [90, "Pertinentielle", "sa pertinence relativement à un objectif"], [91, "Optimisationnelle", "ses possibilités d’amélioration"]]}];
var C={"ver": {"1": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné.\nAxiome 2 — La gestion de versions garde chaque version d’un projet."], ["Phrase", "La gestion de versions se compose de versions, c’est-à-dire d’états du projet, et de l’ensemble qui les garde."]], "2": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné."], ["Phrase", "Son élément fondamental est la version : l’état du projet à un moment donné."]], "3": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné.\nAxiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 3 — Elle montre ce qui a changé d’une version à l’autre.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Les versions gardées s’enchaînent ; en les comparant on voit ce qui a changé, et on peut revenir à l’une d’elles."]], "4": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné.\nAxiome 2 — La gestion de versions garde chaque version d’un projet."], ["Phrase", "Elle se décompose en versions successives ; chaque version se décompose à son tour en fichiers."]], "5": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet."], ["Phrase", "Aucune limite n’est fixée : elle garde autant de versions qu’il y a eu d’enregistrements."]], "6": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné."], ["Phrase", "Une version n’est pas un fichier : c’est une photographie de tout le projet à un instant."]], "7": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné.\nAxiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 3 — Elle montre ce qui a changé d’une version à l’autre.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Gérer des versions, c’est garder chaque état d’un projet pour voir ce qui change et pouvoir revenir en arrière."]], "8": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné.\nAxiome 2 — La gestion de versions garde chaque version d’un projet."], ["Phrase", "La gestion de versions garde chaque version d’un projet, une version étant son état à un moment donné."]], "9": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 3 — Elle montre ce qui a changé d’une version à l’autre.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Garder, comparer, revenir : ces trois propriétés la constituent."]], "10": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle s’applique à tout projet fait de fichiers : site web, programme, livre, mémoire, notes de cours."]], "11": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On dit aussi « versionnage », « contrôle de version » ou « suivi de versions » ; en anglais, version control."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Version » vient du latin versio, « action de tourner » : chaque version est un tour de plus du projet."]], "13": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On peut la voir comme une sauvegarde améliorée, ou comme un journal de bord du projet."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Version » désigne aussi une traduction, ou un numéro de logiciel (version 2.0) ; ici, c’est un état enregistré."]], "15": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné.\nAxiome 2 — La gestion de versions garde chaque version d’un projet."], ["Phrase", "Les versions sont rangées dans l’ordre où elles ont été gardées."]], "16": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Toutes les versions sont au même rang ; seule la dernière sert de version courante."]], "17": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné.\nAxiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 3 — Elle montre ce qui a changé d’une version à l’autre.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Vue d’ensemble : une suite de versions, des différences entre elles, et des retours possibles."]], "18": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les versions se lisent souvent comme une ligne du temps, de la plus ancienne à la plus récente."]], "19": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle appartient aux outils de travail sur les fichiers, à côté de la sauvegarde et de la synchronisation."]], "20": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Deux grands types : centralisée (un serveur unique garde tout) et distribuée (chaque copie garde tout)."]], "21": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Chaque version forme une unité complète, qu’on peut consulter seule."]], "22": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné.\nAxiome 3 — Elle montre ce qui a changé d’une version à l’autre."], ["Phrase", "Deux versions sont liées par ce qui a changé de l’une à l’autre."]], "23": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Pour revenir à une version, il faut qu’elle ait été gardée : l’axiome 4 découle de l’axiome 2."]], "24": [["Axiome", "Axiome 3 — Elle montre ce qui a changé d’une version à l’autre."], ["Phrase", "Chaque changement fait du projet est la cause d’une nouvelle différence entre deux versions."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Plus un projet change souvent, plus ses versions sont nombreuses."]], "26": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Garder les versions sert à pouvoir y revenir."]], "27": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné.\nAxiome 2 — La gestion de versions garde chaque version d’un projet."], ["Phrase", "Elle dépend du projet : sans projet qui change, il n’y a rien à garder."]], "28": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet."], ["Phrase", "Elle s’oppose au simple enregistrement, qui remplace l’ancien fichier par le nouveau."]], "29": [["Axiome", "Axiome 3 — Elle montre ce qui a changé d’une version à l’autre.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Voir ce qui a changé et revenir en arrière se complètent : on repère l’erreur, puis on l’annule."]], "30": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "On ne peut revenir à une version que si elle a été gardée."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Comme l’historique d’un traitement de texte, mais pour tout un projet et sans limite de retours."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Chaque nouvelle version s’appuie sur la précédente, et la suivante s’appuiera sur elle."]], "33": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné."], ["Phrase", "Les versions se succèdent : chacune correspond à un moment donné."]], "34": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les versions ne prennent pas de place sur la page : elles restent cachées tant qu’on ne les consulte pas."]], "35": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné.\nAxiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 3 — Elle montre ce qui a changé d’une version à l’autre.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Quatre propositions : une version est un état daté ; on les garde toutes ; on voit ce qui change ; on peut revenir."]], "36": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 3 — Elle montre ce qui a changé d’une version à l’autre.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "On lui attribue trois pouvoirs : garder, montrer les changements, revenir en arrière."]], "37": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Si chaque version est gardée, alors aucun changement n’est définitif."]], "38": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Conséquence nécessaire : on peut toujours retrouver un état passé du projet."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ceux qui ont perdu un travail par erreur en tirent la règle : garder chaque version."]], "40": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Si un projet peut revenir en arrière après une erreur, la meilleure explication est qu’il gère ses versions."]], "41": [["Axiome", "Axiome 3 — Elle montre ce qui a changé d’une version à l’autre.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Argument principal : on peut tout essayer, puisqu’on sait voir et annuler ce qu’on a changé."]], "42": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les axiomes s’admettent ; on vérifie un outil en lui faisant garder deux versions puis revenir à la première."]], "43": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné.\nAxiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 3 — Elle montre ce qui a changé d’une version à l’autre.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Quatre principes fondent la notion : la version, la conservation, la comparaison, le retour."]], "44": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Exclu : perdre une version gardée, ou ne pas pouvoir y revenir."]], "45": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné.\nAxiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 3 — Elle montre ce qui a changé d’une version à l’autre.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Les axiomes s’accordent : on garde des états, on les compare, on revient à l’un d’eux."]], "46": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "C’est une pratique établie de l’informatique, enseignée et utilisée partout."]], "47": [["Axiome", "Axiome 3 — Elle montre ce qui a changé d’une version à l’autre.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Sa justification : un projet sans retour possible rend chaque erreur coûteuse."]], "48": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La preuve qu’elle fonctionne : la liste des versions, qu’on peut ouvrir une à une."]], "49": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné.\nAxiome 2 — La gestion de versions garde chaque version d’un projet."], ["Phrase", "Il y a gestion de versions si chaque état du projet est gardé."]], "50": [["Axiome", "Axiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "On le vérifie en revenant à une version précédente et en retrouvant le projet tel qu’il était."]], "51": [["Axiome", "Axiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Elle serait réfutée si une version gardée ne pouvait plus être retrouvée."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Certitude élevée : les outils de gestion de versions sont conçus pour ne rien perdre de ce qui est gardé."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Aucune hypothèse : elle repose sur des enregistrements réels."]], "54": [["Axiome", "Axiome 3 — Elle montre ce qui a changé d’une version à l’autre."], ["Phrase", "Elle s’observe : on voit chaque version et ce qui la distingue de la précédente."]], "55": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le modèle derrière : un projet est une suite d’états, et chaque état peut être retrouvé."]], "56": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné."], ["Phrase", "C’est une pratique et un ensemble d’outils, pas un objet : ce qu’elle manipule, ce sont des versions."]], "57": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle n’existe que si on l’utilise : un projet peut très bien ne pas gérer ses versions."]], "58": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet."], ["Phrase", "Ce qui la définit : garder chaque version, et non la dernière seulement."]], "59": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Catégorie : les méthodes de travail sur les fichiers."]], "60": [["Axiome", "Axiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Revenir en arrière est possible, jamais obligatoire."]], "61": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet."], ["Phrase", "Son essence : la conservation des états successifs d’un projet."]], "62": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet."], ["Phrase", "Elle s’arrête aux versions gardées : ce qui n’a pas été gardé ne peut pas revenir."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle prend son sens dans les projets qui durent et qui changent souvent."]], "64": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle sert surtout après une erreur, ou quand on veut essayer une idée sans risque."]], "65": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les premiers outils datent des années 1970 ; Git, en 2005, est aujourd’hui le plus répandu."]], "66": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Née chez les programmeurs, elle gagne les rédacteurs, les chercheurs et les designers."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Domaine : l’informatique, plus précisément le génie logiciel."]], "68": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle permet à plusieurs personnes de travailler sur un même projet en sachant qui a changé quoi."]], "69": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné."], ["Phrase", "Chaque version est située dans le temps : à un moment donné."]], "70": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet."], ["Phrase", "Son rôle : être la mémoire d’un projet."]], "71": [["Axiome", "Axiome 3 — Elle montre ce qui a changé d’une version à l’autre.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Elle fournit deux moyens : la comparaison entre versions et le retour en arrière."]], "72": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 3 — Elle montre ce qui a changé d’une version à l’autre.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Opérations permises : garder une version, comparer deux versions, revenir à une version."]], "73": [["Axiome", "Axiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Dans l’action, elle rend les erreurs réparables : on ose changer."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle contribue à un projet fiable, qu’on peut faire évoluer sans peur."]], "75": [["Axiome", "Axiome 3 — Elle montre ce qui a changé d’une version à l’autre.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Utile pour comprendre ce qui a changé et pour annuler une mauvaise modification."]], "76": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dire « j’enregistre une version » fixe un point de retour dans la vie du projet."]], "77": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Étape par étape : changer le projet, garder la version, recommencer ; en cas d’erreur, comparer puis revenir."]], "78": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné."], ["Phrase", "Ce qui change, c’est le projet ; chaque changement produit une nouvelle version."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle évolue avec le projet : la liste des versions ne fait que s’allonger."]], "80": [["Axiome", "Axiome 3 — Elle montre ce qui a changé d’une version à l’autre."], ["Phrase", "Chaque passage d’une version à l’autre est une transformation, que l’outil montre."]], "81": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle naît dès le premier enregistrement : la première version est le point de départ."]], "82": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet."], ["Phrase", "Son processus : à chaque changement retenu, une version de plus est gardée."]], "83": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Elle s’adapte à tout type de fichiers, même si elle compare mieux le texte que les images."]], "84": [["Axiome", "Axiome 1 — Une version est l’état d’un projet à un moment donné.\nAxiome 2 — La gestion de versions garde chaque version d’un projet."], ["Phrase", "Ses états successifs sont justement les versions, gardées l’une après l’autre."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Appréciation : indispensable dès qu’un projet dépasse quelques fichiers."]], "86": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Norme habituelle : garder une version à chaque changement qui a un sens, avec une description claire."]], "87": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Sa valeur : la sécurité du travail et la transparence sur ce qui a été fait."]], "88": [["Axiome", "Axiome 2 — La gestion de versions garde chaque version d’un projet.\nAxiome 3 — Elle montre ce qui a changé d’une version à l’autre.\nAxiome 4 — Elle permet de revenir à une version précédente."], ["Phrase", "Critères : toutes les versions sont gardées, les différences se voient, le retour fonctionne."]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Une bonne gestion de versions a des versions ni trop rares, ni trop nombreuses, chacune avec un sens."]], "90": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Pertinente pour tout projet qui change ; inutile pour un fichier écrit une fois et jamais modifié."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’améliore en décrivant mieux chaque version, pour retrouver vite celle qu’on cherche."]]}, "git": {"1": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions.\nAxiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Git se compose d’un logiciel et des versions qu’il garde pour un dossier et ses fichiers."]], "2": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Ses éléments fondamentaux : un dossier, les fichiers qu’il contient, et leurs versions."]], "3": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions.\nAxiome 2 — Il garde les versions d’un dossier et de tous ses fichiers.\nAxiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "Sur un ordinateur, le logiciel surveille un dossier et garde les versions de tous ses fichiers."]], "4": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Ce qu’il garde se décompose en dossier, puis en fichiers, puis en versions de chaque fichier."]], "5": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Un seul logiciel suffit pour autant de dossiers qu’on veut, chacun avec son propre suivi."]], "6": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions.\nAxiome 3 — Il est gratuit et libre."], ["Phrase", "Sa nature : un logiciel, gratuit et libre."]], "7": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions.\nAxiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Git, c’est l’outil qui garde les versions d’un dossier."]], "8": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions.\nAxiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Git est un logiciel de gestion de versions qui garde les versions d’un dossier et de tous ses fichiers."]], "9": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions.\nAxiome 2 — Il garde les versions d’un dossier et de tous ses fichiers.\nAxiome 3 — Il est gratuit et libre.\nAxiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "Gérer des versions, suivre un dossier entier, être gratuit et libre, fonctionner hors ligne : ses propriétés."]], "10": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il sert à des millions de projets, du noyau Linux aux sites personnels."]], "11": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On écrit « Git » ; la commande se tape en minuscules, `git`."]], "12": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "En argot anglais, « git » signifie « crétin » : son créateur, Linus Torvalds, a choisi ce nom par autodérision."]], "13": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Pour certains, c’est un outil de programmeur ; pour d’autres, un simple coffre à versions pour tout projet."]], "14": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "« Git » désigne à la fois le logiciel et la façon de travailler qu’il impose."]], "15": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Il s’organise autour d’un dossier : tout ce qui est dedans est suivi."]], "16": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le dossier suivi contient un dossier caché, `.git`, où Git range toutes les versions."]], "17": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers.\nAxiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "Vue d’ensemble : un dossier sur l’ordinateur, et derrière lui la mémoire de toutes ses versions."]], "18": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les versions sont rangées en une chaîne, chacune pointant vers la précédente."]], "19": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions."], ["Phrase", "Il se classe parmi les logiciels de gestion de versions."]], "20": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "C’est un système distribué : chaque copie du dossier contient tout l’historique."]], "21": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Chaque dossier suivi par Git est autonome : on peut le copier ailleurs avec toutes ses versions."]], "22": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions.\nAxiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Le logiciel et le dossier sont liés : Git ne garde que ce qui est dans le dossier suivi."]], "23": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions.\nAxiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Puisque c’est un logiciel de gestion de versions, ce qu’il garde, ce sont des versions."]], "24": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Chaque enregistrement demandé à Git crée une version de plus."]], "25": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Les projets qui utilisent Git sont souvent ceux qui travaillent à plusieurs."]], "26": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions.\nAxiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Sa fonction : garder les versions du dossier qu’on lui confie."]], "27": [["Axiome", "Axiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "Il dépend de l’ordinateur où il est installé, pas d’internet."]], "28": [["Axiome", "Axiome 3 — Il est gratuit et libre."], ["Phrase", "Il s’oppose aux logiciels payants et fermés."]], "29": [["Axiome", "Axiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "Git travaille sur l’ordinateur ; un site comme GitHub le complète en ligne."]], "30": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Un fichier n’est suivi que s’il se trouve dans le dossier suivi."]], "31": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Comme une sauvegarde, il garde des copies ; contrairement à elle, il garde chaque étape et ce qui a changé."]], "32": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ce qu’on fait dans le dossier change ce que Git aura à garder, et ce que Git garde permet de revenir sur le dossier."]], "33": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Les versions d’un dossier se succèdent ; Git les garde dans cet ordre."]], "34": [["Axiome", "Axiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "Il est installé sur l’ordinateur, au même endroit que le dossier qu’il suit."]], "35": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions.\nAxiome 2 — Il garde les versions d’un dossier et de tous ses fichiers.\nAxiome 3 — Il est gratuit et libre.\nAxiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "Quatre propositions : c’est un logiciel de versions ; il suit un dossier ; il est libre ; il marche hors ligne."]], "36": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions.\nAxiome 3 — Il est gratuit et libre.\nAxiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "On dit de Git qu’il est un logiciel, gratuit, libre, et utilisable sans internet."]], "37": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Si un fichier est dans le dossier suivi, alors ses versions sont gardées."]], "38": [["Axiome", "Axiome 3 — Il est gratuit et libre."], ["Phrase", "Conséquence nécessaire : on peut l’installer sans payer."]], "39": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "La plupart des projets de code l’utilisent ; on en déduit qu’il est devenu la norme."]], "40": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Si un dossier contient un dossier caché `.git`, la meilleure explication est qu’il est suivi par Git."]], "41": [["Axiome", "Axiome 3 — Il est gratuit et libre.\nAxiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "Arguments en sa faveur : gratuit, libre, et utilisable partout, même sans connexion."]], "42": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On montre qu’un dossier est suivi en demandant à Git la liste de ses versions."]], "43": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions.\nAxiome 2 — Il garde les versions d’un dossier et de tous ses fichiers.\nAxiome 3 — Il est gratuit et libre.\nAxiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "Quatre principes le fondent : la gestion de versions, le dossier suivi, la gratuité et la liberté, le hors-ligne."]], "44": [["Axiome", "Axiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "Exclu : un Git qui ne marcherait qu’en ligne."]], "45": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions.\nAxiome 2 — Il garde les versions d’un dossier et de tous ses fichiers.\nAxiome 3 — Il est gratuit et libre.\nAxiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "Les axiomes s’accordent : un logiciel libre, installé localement, qui garde les versions d’un dossier."]], "46": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Connaissance sûre et documentée : Git a une documentation officielle complète, en anglais."]], "47": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions."], ["Phrase", "Il est justifié par le besoin de gérer les versions d’un projet."]], "48": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Preuve de son usage : GitHub et ses concurrents reposent tous sur lui."]], "49": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Un dossier est suivi par Git si ses versions sont gardées."]], "50": [["Axiome", "Axiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "On le vérifie en coupant internet : Git continue de garder les versions."]], "51": [["Axiome", "Axiome 3 — Il est gratuit et libre."], ["Phrase", "Il serait réfuté s’il devenait payant ou fermé."]], "52": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Certitude élevée : Git est stable et utilisé depuis 2005."]], "53": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Aucune hypothèse : son fonctionnement est entièrement documenté."]], "54": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "On observe son travail dans la liste des versions du dossier."]], "55": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Le modèle : chaque version est une photographie du dossier entier, reliée à la précédente."]], "56": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions."], ["Phrase", "C’est un logiciel."]], "57": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il existe depuis 2005 et s’installe sur Windows, macOS et Linux."]], "58": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Ce qui l’identifie : il garde les versions d’un dossier entier, pas d’un fichier isolé."]], "59": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions."], ["Phrase", "Catégorie : les logiciels de gestion de versions."]], "60": [["Axiome", "Axiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "Internet est possible, jamais nécessaire."]], "61": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions.\nAxiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Son essence : garder les versions d’un dossier."]], "62": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Il s’arrête au bord du dossier suivi : ce qui est en dehors ne le concerne pas."]], "63": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il prend son sens dans les projets faits de nombreux fichiers texte : code, pages web, notes."]], "64": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il s’utilise surtout dans un terminal, par des commandes ; des applications l’habillent d’une interface."]], "65": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Créé en 2005 par Linus Torvalds pour le noyau Linux, il est devenu l’outil le plus utilisé au monde."]], "66": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il appartient à la culture du logiciel libre."]], "67": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Domaine : le génie logiciel."]], "68": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il permet à des milliers de personnes de travailler sur un même projet."]], "69": [["Axiome", "Axiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "Il vit sur un ordinateur précis, dans un dossier précis."]], "70": [["Axiome", "Axiome 1 — Git est un logiciel de gestion de versions."], ["Phrase", "Son rôle : faire la gestion de versions."]], "71": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Il fournit la mémoire de toutes les versions d’un dossier."]], "72": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Opérations : enregistrer une version, voir les différences, revenir en arrière, créer des branches."]], "73": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Dans l’action, on change ses fichiers sans crainte : Git garde de quoi revenir."]], "74": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il contribue à des projets fiables et partagés."]], "75": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers.\nAxiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "Utile pour garder chaque version de son dossier, même sans connexion."]], "76": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Écrire `git commit` enregistre une version : la phrase tapée fait l’action."]], "77": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Sur un ordinateur : installer Git, l’activer dans un dossier, puis enregistrer une version à chaque changement."]], "78": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Ce qui change, ce sont les fichiers du dossier ; Git, lui, enregistre ces changements."]], "79": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Git évolue lui-même : de nouvelles versions du logiciel sortent régulièrement."]], "80": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il transforme une suite d’enregistrements en un historique qu’on peut parcourir."]], "81": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il naît dans un dossier quand on l’y active : à partir de là, il suit tout."]], "82": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Son processus : surveiller le dossier, et garder une version quand on le lui demande."]], "83": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Il s’adapte à tout projet : code, texte, images, même si le texte se compare mieux."]], "84": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers."], ["Phrase", "Ses états successifs sont ceux du dossier, gardés un à un."]], "85": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Appréciation : puissant mais austère ; on l’apprivoise mieux par GitHub."]], "86": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Norme : c’est le standard de fait de la gestion de versions."]], "87": [["Axiome", "Axiome 3 — Il est gratuit et libre."], ["Phrase", "Valeurs engagées : la liberté du logiciel et le partage."]], "88": [["Axiome", "Axiome 2 — Il garde les versions d’un dossier et de tous ses fichiers.\nAxiome 3 — Il est gratuit et libre.\nAxiome 4 — Il fonctionne aussi sans internet, sur un ordinateur."], ["Phrase", "Critères : il garde tout le dossier, il est libre, il marche sans internet."]], "89": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Qualité reconnue : rapide et fiable, même sur de très gros projets."]], "90": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "Pertinent dès qu’un projet a plusieurs fichiers qui changent ; superflu pour un document unique."]], "91": [["Axiome", "Non couvert par les axiomes."], ["Phrase · hors axiomes", "On l’améliore en passant par une interface graphique, ou par un site comme GitHub."]]}};

  if(m){N[m[1]]={id:m[1],t:m[2],p:[],k:[]};IDS.push(m[1])}});

  if(m&&N[m[1]]&&N[m[2]]){N[m[1]].k.push(m[2]);N[m[2]].p.push(m[1])}});
function depth(i){var n=N[i];if(n.d!=null)return n.d;n.d=0;n.p.forEach(function(p){n.d=Math.max(n.d,depth(p)+1)});return n.d}
IDS.forEach(depth);

/* état : compétences acquises, et type de contenu choisi pour chaque boîte
   ("p" principes, "r" pratique, ou n° de dimension) */
var KEY="plan-"+SUJET.nom,ACQ={},MODES={},DIM={};
G.forEach(function(g){g.i.forEach(function(d){DIM[d[0]]=d})});
try{var sv=JSON.parse(localStorage.getItem(KEY)||"null");if(sv){ACQ=sv.a||{};MODES=sv.ms||{}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({a:ACQ,ms:MODES}))}catch(e){}push()}
/* au départ, une boîte montre ses principes */
function mode(i){var m=MODES[i];if(m==="r"||m==="l"||DIM[m]||(m==="i"&&IMG[COMP[i].notion]))return m;return "p"}
/* notes : une par boîte, gardées à part (Recommencer ne les efface pas) */
var NKEY="notes-"+SUJET.nom,NOTES={};
try{NOTES=JSON.parse(localStorage.getItem(NKEY)||"{}")||{}}catch(e){}
function saveNotes(){try{localStorage.setItem(NKEY,JSON.stringify(NOTES))}catch(e){}push()}

/* page publiée : notes et compétences acquises sont aussi gardées en ligne, dans la base
   de la page (document etat/<sujet>, lisible et modifiable par le propriétaire seulement).
   Sans base (fichier ouvert seul), tout reste sur cet appareil. */
var DOC=null,LAST=null,WB=false,WN=false,ONL=false;
var DOCP="etat/"+(SUJET.nom.toLowerCase().replace(/[^a-z0-9]+/g,"-")||"sujet");
function snapshot(){return JSON.stringify({notes:NOTES,acq:ACQ})}
function push(){
  if(!DOC)return;
  if(WB){WN=true;return}
  var body=snapshot();if(body===LAST)return;
  WB=true;var tries=0;
  (function go(){DOC.set(JSON.parse(body)).then(function(){LAST=body;done()},function(e){
    if(e&&e.code==="unavailable"&&!tries++)return setTimeout(go,800+Math.random()*700);
    online(false,"L’enregistrement en ligne a échoué. Tes notes restent sur cet appareil : copie-les par sécurité.");done()})})();
  function done(){WB=false;if(WN){WN=false;push()}}
}
function online(ok,msg){
  ONL=ok;var p=document.getElementById("mp");if(!p)return;
  p.textContent=msg||(ok?"Tes notes sont enregistrées en ligne avec la page : elles restent d’une version à l’autre et d’un appareil à l’autre.":
    "Tes notes restent sur cet appareil. Copie-les de temps en temps : une nouvelle version du fichier peut repartir sans elles.");
}
function connect(){
  if(connect.done||!(window.claude&&typeof window.claude.use==="function"))return;connect.done=true;
  var timer=setTimeout(function(){online(false,"Enregistrement en ligne pas encore joignable. Tes notes restent sur cet appareil.")},10000);
  window.claude.use("db").then(function(db){
    if(!db){clearTimeout(timer);return online(false)}
    var ref=db.doc(DOCP);
    ref.get().then(function(sn){
      clearTimeout(timer);DOC=ref;
      var d=sn&&sn.exists?(sn.data()||{}):{},dn=d.notes||{},da=d.acq||{},changed=false;
      var mn={},ma={};Object.keys(dn).forEach(function(k){mn[k]=dn[k]});Object.keys(da).forEach(function(k){ma[k]=da[k]});
      Object.keys(NOTES).forEach(function(k){if(!(k in mn))mn[k]=NOTES[k]});   /* notes écrites ici avant la connexion */
      Object.keys(ACQ).forEach(function(k){if(!(k in ma))ma[k]=ACQ[k]});
      if(JSON.stringify(mn)!==JSON.stringify(NOTES)||JSON.stringify(ma)!==JSON.stringify(ACQ))changed=true;
      LAST=sn&&sn.exists?JSON.stringify({notes:dn,acq:da}):null;
      NOTES=mn;ACQ=ma;
      try{localStorage.setItem(NKEY,JSON.stringify(NOTES))}catch(e){}
      online(true);
      if(changed&&!(document.activeElement&&document.activeElement.classList.contains("nx")))sync();
      push();
    },function(){clearTimeout(timer);online(false)});
  },function(){clearTimeout(timer);online(false)});
}

/* le menu d'une boîte : un seul type de contenu affiché à la fois dans cette boîte */
function menu(i,onpick){
  var m=el("select");m.setAttribute("aria-label","Contenu affiché");
  var g0=document.createElement("optgroup");g0.label="Axiomes";
  [["p","Principes"],["r","Pratique"],["l","Liaisons"]].forEach(function(x){var o=el("option",null,x[1]);o.value=x[0];g0.appendChild(o)});m.appendChild(g0);
  if(IMG[COMP[i].notion]){var oi=el("option",null,"En image");oi.value="i";m.appendChild(oi)}
  G.forEach(function(g){var og=document.createElement("optgroup");og.label=g.t;
    g.i.forEach(function(d){var o=el("option",null,d[0]+" · "+d[1]+" — "+d[2]);o.value=d[0];og.appendChild(o)});m.appendChild(og)});
  m.value=mode(i);m.onchange=function(){MODES[i]=m.value;save();onpick()};
  return m;
}

/* contenu d'une boîte selon le type choisi */
function picture(nid){var d=el("div");d.innerHTML=IMG[nid].svg;return d.firstChild}
function unnum(t){return t.replace(/\s*\(axiomes? [\d ,et]+\)/g,"").replace(/Axiomes? [\d ,et]+ — /g,"")}
function legend(b,nid){IMG[nid].leg.forEach(function(l){var p=el("div","lg");p.appendChild(el("b",null,l[0]));p.appendChild(document.createTextNode(" — "+unnum(l[1])));b.appendChild(p)})}
function zoom(nid){
  var Z=document.getElementById("zo"),B=document.getElementById("zb");
  document.getElementById("zn").textContent=NOTIONS[nid].t;B.innerHTML="";
  var w=el("div","im");w.appendChild(picture(nid));B.appendChild(w);legend(B,nid);
  Z.hidden=false;Z.scrollTop=0;
}
document.getElementById("zc").onclick=function(){document.getElementById("zo").hidden=true};
function body(nid,MODE){
  var no=NOTIONS[nid],b=el("div","bd");
  if(MODE==="i"){
    b.appendChild(picture(nid));
    var z=el("button","im");z.setAttribute("aria-label","Agrandir l’image");
    while(b.firstChild)z.appendChild(b.firstChild);
    z.onclick=function(){zoom(nid)};b.appendChild(z);
    b.appendChild(el("div","zh","Toucher l’image pour l’agrandir"));
    legend(b,nid);
  }else if(MODE==="l"){
    var ls=linksOf(SHI||Object.keys(COMP).filter(function(k){return COMP[k].notion===nid})[0]);
    if(!ls.length)b.appendChild(el("div","no","Pas de liaison pour cette notion."));
    else{var r0=el("div","axr");ls.forEach(function(x){var d=el("div","ax");code(d,x[1]);d.appendChild(el("small","with","avec "+short(NOTIONS[COMP[x[0]].notion].t)));r0.appendChild(d)});b.appendChild(r0)}
  }else if(MODE==="p"||MODE==="r"){
    var pa=no.pratique||[],l=no.ax.map(function(a,i){return [i+1,a]}).filter(function(x){return (pa.indexOf(x[0])>=0)===(MODE==="r")});
    if(!l.length)b.appendChild(el("div","no",MODE==="r"?"Pas de pratique pour cette notion.":"Pas de principe pour cette notion."));
    if(l.length){var r=el("div","axr");l.forEach(function(x){var d=el("div","ax");code(d,x[1]);r.appendChild(d)});b.appendChild(r)}
  }else{
    var v=(C[nid]||{})[MODE];
    if(!v)b.appendChild(el("div","no","Pas encore rempli."));
    else v.forEach(function(x){b.appendChild(el("div","vl",x[0]));
      x[1].split("\n").forEach(function(t){var li=t.indexOf("- ")===0,c=el("div","ct"+(li?" li":"")+(t.indexOf("Non couvert")===0?" nc":""));code(c,unnum(li?t.slice(2):t));b.appendChild(c)})});
  }
  return b;
}
var RAF=0;function redraw(){cancelAnimationFrame(RAF);RAF=requestAnimationFrame(rails)}
function grow(t){t.style.height="auto";t.style.height=t.scrollHeight+2+"px"}
function note(i){
  var w=el("div","nb");
  function closed(){w.innerHTML="";var a=el("button","na","✎ Ajouter une note");a.onclick=function(){opened(true)};w.appendChild(a)}
  function opened(focus){
    w.innerHTML="";w.appendChild(el("div","nl","Ma note"));
    var t=el("textarea","nx");t.value=NOTES[i]||"";t.setAttribute("aria-label","Ma note");t.rows=3;
    var tm=0;t.oninput=function(){grow(t);redraw();clearTimeout(tm);tm=setTimeout(function(){
      if(t.value.trim())NOTES[i]=t.value;else delete NOTES[i];saveNotes()},300)};
    t.onblur=function(){if(t.value.trim())NOTES[i]=t.value;else{delete NOTES[i];closed();redraw()}saveNotes()};
    w.appendChild(t);requestAnimationFrame(function(){grow(t);redraw()});if(focus)t.focus();
  }
  if(NOTES[i])opened(false);else closed();
  return w;
}
/* ordre des lignes, de bas en haut : celui du plan (ordre de lecture) */
var ORDER=IDS.slice();
function jx(c,p){var j=LIENS[c];return j&&j[p]?j[p]:null}
/* les axiomes de liaison d'une notion : vers celles du dessous, puis vers celles du dessus */
function linksOf(i){var o=[];N[i].p.forEach(function(p){var a=jx(i,p);if(a)o.push([p,a])});
  N[i].k.forEach(function(k){var a=jx(k,i);if(a)o.push([k,a])});return o}
/* une ligne : le nom de la notion, puis ses axiomes en stations */
function line(i){
  var nid=COMP[i].notion,no=NOTIONS[nid],pa=no.pratique||[],L=el("div","ln"+(ACQ[i]?" acq":""));L.dataset.id=i;
  var h=el("button","lh");h.appendChild(el("b",null,no.t));if(ACQ[i])h.appendChild(el("span","ok","✓"));
  h.onclick=function(){sheet(i)};L.appendChild(h);
  var tk=el("div","tk");
  function station(a,cls){var st=el("div","st"),d=el("i","dt"+cls);
    st.appendChild(d);var t=el("span");code(t,a);[].forEach.call(t.querySelectorAll("code"),function(c){if(c.textContent.length>14)c.className="w"});st.appendChild(t);tk.appendChild(st)}
  no.ax.forEach(function(a,k){station(a,pa.indexOf(k+1)>=0?" pr":"")});
  linksOf(i).forEach(function(x){station(x[1]," jx")});
  L.appendChild(tk);
  if(SHOWN&&NOTES[i])L.appendChild(el("div","lnn",NOTES[i]));
  return L;
}
function short(t){return t.replace(/\s*\(.*\)$/,"")}
/* une correspondance : l'axiome de liaison entre la notion du dessous et celle du dessus */
function junction(p,c){
  var a=jx(c,p),nc=NOTIONS[COMP[c].notion],np=NOTIONS[COMP[p].notion],J=el("div","jn"+(a==null?" no":""));J.dataset.e=p+">"+c;
  if(a==null){J.textContent="Aucun axiome ne relie encore "+short(np.t)+" et "+short(nc.t)+".";return J}
  var q=el("q");code(q,a.replace(/\.$/,""));J.appendChild(q);
  J.appendChild(el("small",null,short(np.t)+" → "+short(nc.t)));return J;
}
/* les rails : de la ligne du dessous à celle du dessus, en passant par la correspondance */
function rails(){
  var M=document.getElementById("map");if(!M)return;
  var old=M.querySelector("svg.rl");if(old)old.remove();
  var gw=parseFloat(getComputedStyle(M).getPropertyValue("--gw"))||40,o=M.getBoundingClientRect();
  var NS="http://www.w3.org/2000/svg",s=document.createElementNS(NS,"svg");s.setAttribute("class","rl");
  function yLine(i){var t=M.querySelector('.ln[data-id="'+i+'"] .tk');if(!t)return null;return t.getBoundingClientRect().top-o.top+12}
  E.forEach(function(e){
    var x=gw-13-e.lane*10,yp=yLine(e.p),yc=yLine(e.c),jb=M.querySelector('.jn[data-e="'+e.p+'>'+e.c+'"]');if(yp==null||yc==null)return;
    var r=jb.getBoundingClientRect(),yj=r.top-o.top+Math.min(r.height/2,22),col=ACQ[e.p]?"#2f6a48":"#4a4a52";
    var path=document.createElementNS(NS,"path");
    path.setAttribute("d","M"+gw+" "+yp+"H"+x+"V"+yc+"H"+gw);
    path.setAttribute("fill","none");path.setAttribute("stroke",col);path.setAttribute("stroke-width","2");s.appendChild(path);
    var c=document.createElementNS(NS,"circle");c.setAttribute("cx",x);c.setAttribute("cy",yj);c.setAttribute("r","6");
    c.setAttribute("fill","#0e0e10");c.setAttribute("stroke",jx(e.c,e.p)==null?"#6a6a72":"#8ab4ff");c.setAttribute("stroke-width","3");
    if(jx(e.c,e.p)==null){c.setAttribute("stroke-width","2");c.setAttribute("stroke-dasharray","3 2.5")}
    s.appendChild(c)});
  M.insertBefore(s,M.firstChild);
}
/* les liens et leurs voies (deux rails qui se chevauchent prennent deux voies) */
var E=[];
function lanes(){
  var pos={};ORDER.slice().reverse().forEach(function(i,k){pos[i]=k});
  E=[];var T={};
  ORDER.forEach(function(c){N[c].p.forEach(function(p){E.push({p:p,c:c});
    var t=T[p]||(T[p]={lo:pos[c],hi:pos[p]});t.lo=Math.min(t.lo,pos[c])})});
  var L=Object.keys(T).map(function(k){return T[k]}).sort(function(a,b){return (a.hi-a.lo)-(b.hi-b.lo)||a.hi-b.hi});
  var max=0;L.forEach(function(t){var l=0;while(L.some(function(f){return f!==t&&f.lane===l&&f.lo<t.hi&&t.lo<f.hi}))l++;t.lane=l;max=Math.max(max,l)});
  E.forEach(function(e){e.lane=T[e.p].lane});
  return max+1;
}
/* la fiche d'une notion : ✓, menu, contenu choisi, note */
/* la fiche d'une notion : la boîte d'origine (ligne « découle de », nom, menu, contenu, note), sans case à cocher */
function box(i){
  var n=N[i],nid=COMP[i].notion,b=el("div","bx");b.dataset.id=i;
  var h=el("div","bh"),t=el("span","bt");t.appendChild(el("span","cp",n.t));t.appendChild(el("span","nt",NOTIONS[nid].t));
  h.appendChild(t);b.appendChild(h);
  var bd=body(nid,mode(i));
  b.appendChild(menu(i,function(){var nb=body(nid,mode(i));b.replaceChild(nb,bd);bd=nb}));
  b.appendChild(bd);b.appendChild(note(i));return b;
}
var SHI=null;
function sheet(i){
  SHI=i;var B=document.getElementById("sb");B.innerHTML="";B.appendChild(box(i));
  var S=document.getElementById("sh");if(S.hidden){S.hidden=false;S.scrollTop=0}
}
document.getElementById("scl").onclick=function(){document.getElementById("sh").hidden=true;SHI=null;sync()};
function sync(){
  document.getElementById("sj").textContent=SUJET.nom;
  var M=document.getElementById("map");M.innerHTML="";
  var nl=lanes();M.style.setProperty("--gw",(18+nl*10)+"px");
  ORDER.slice().reverse().forEach(function(c){
    M.appendChild(line(c));
    N[c].p.forEach(function(p){M.appendChild(junction(p,c))});
  });
  rails();
}
/* afficher ou masquer mes notes sur le plan, sous chaque notion */
var SHOWN=false;try{SHOWN=localStorage.getItem("voir-notes-"+SUJET.nom)==="1"}catch(e){}
var TG=document.getElementById("tgn");
function tgLabel(){TG.textContent=SHOWN?"Masquer mes notes":"Afficher mes notes"}
TG.onclick=function(){SHOWN=!SHOWN;try{localStorage.setItem("voir-notes-"+SUJET.nom,SHOWN?"1":"0")}catch(e){}tgLabel();sync()};
tgLabel();
document.title="Support d’autoformation — "+SUJET.nom;
window.addEventListener("resize",rails);
sync();
(function(){var r=document.querySelector('.ln[data-id="'+IDS.filter(function(i){return !N[i].p.length})[0]+'"]');
  if(r)requestAnimationFrame(function(){r.scrollIntoView({block:"end"});window.scrollBy(0,16)})})();
try{connect()}catch(e){}
window.addEventListener("load",function(){try{connect()}catch(e){}});
</script>
